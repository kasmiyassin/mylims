<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampling Events - TIFI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { z-index: 50; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .table-row-selected { background-color: #eef2ff !important; }
        .sortable-header { cursor: pointer; position: relative; display: flex; align-items: center; justify-content: space-between; }
        .sortable-header .sort-icon { margin-left: 4px; vertical-align: middle; font-size: 0.8em; }
        .filter-input {
            width: calc(100% - 10px);
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        /* Accordion styles for details panel */
        .accordion-item {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
        }
        .accordion-header:hover {
            background-color: #e2e8f0;
        }
        .accordion-header .lucide {
            transition: transform 0.3s ease;
        }
        .accordion-header.active .lucide {
            transform: rotate(180deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 1rem; /* Initial padding, will expand */
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        .accordion-content.open {
            max-height: 500px; /* Adjust as needed for content height */
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div id="main-app">
        <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-white w-64 p-4 flex flex-col">
            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI</span></div>
            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md active"><i data-lucide="map-pin" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="book-text" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>
                <a href="labeling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="Printer" class="w-5 h-5 mr-3"></i><span>Labeling</span></a>
                <a href="workflow.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="workflow" class="w-5 h-5 mr-3"></i><span>Workflow</span></a>
                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
            </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>
            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Sampling Events</h1>
                <div class="flex space-x-2">
                    <button id="bulk-update-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="edit" class="w-5 h-5 mr-2"></i>Bulk Update</button>
                    <button id="bulk-import-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Bulk Import</button>
                    <button id="new-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Sampling Event</button>
                </div>
            </div>
            
            <div id="page-container">
                </div>
        </div>
        <div id="modal-container"></div>
    </div>

<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
    
    const API_BASE_URL = '/mymglab/api';
    let currentViewData = []; // Stores the raw data for the currently displayed table
    let referenceDataCache = {}; // Cache for all fetched reference data
    const currentTableName = 'sampling'; // Table name for this page
    const currentSchema = 'Lab'; // Schema for this page
    let parsedUploadData = []; // Data parsed from bulk upload file
    let currentSortColumn = 'sampling_date';
    let currentSortDirection = 'desc';
    let columnFilters = {};

    // Primary Key mapping for Lab.sampling (consistent with app.py)
    const primaryKeyMap = {
        'sampling': ['sampling_id', 'sampling_date'] // Composite PK
    };

    // Comprehensive Foreign Key Mapping for dynamic form generation
    const foreignKeyMap = {
        'experiment_id': { schema: 'Lab', table: 'experiments', valueCol: 'experiment_id', displayCol: 'experiment_title' },
        'project_id': { schema: 'Lims', table: 'projects', valueCol: 'project_id', displayCol: 'title' },
        'cruise_id': { schema: 'Lims', table: 'cruises', valueCol: 'cruise_id', displayCol: 'cruise_id' },
        'region_id': { schema: 'Reference', table: 'region', valueCol: 'region_id', displayCol: 'region_abrv' },
        'ecosystem_id': { schema: 'Reference', table: 'ecosystem', valueCol: 'ecosystem_id', displayCol: 'ecosystem_abrv' },
        'vessel_id': { schema: 'Reference', table: 'vessel', valueCol: 'vessel_id', displayCol: 'vessel_name' },
        'customer_id': { schema: 'Lims', table: 'customers', valueCol: 'customer_id', displayCol: 'customer_name' },
        'wind_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'salinity_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'pressure_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'oxygen_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'conductivity_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'sample_type_id': { schema: 'Reference', table: 'samples_type', valueCol: 'sample_type_id', displayCol: 'sample_type_id' },
        'soak_time_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'trawl_speed_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
        'together_with_contact_id': { schema: 'Lims', table: 'external_contacts', valueCol: 'contact_id', displayCol: 'full_name' },
        'status_id': { schema: 'Reference', table: 'status', valueCol: 'status_id', displayCol: 'status_id' },
        // Special handling for geometry fields
        'geom': { type: 'geometry' },
        'fishing_start_geom': { type: 'geometry' },
        'fishing_end_geom': { type: 'geometry' },
        'attachment': { type: 'file' }, // Attachment field
    };


    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        const user = JSON.parse(sessionStorage.getItem('user'));
        if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.full_name || user.person_id}</p>`;
        document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
        initializePage();
    });

    async function apiFetch(endpoint, options = {}) {
        try {
            const isFormData = options.body instanceof FormData;
            if (!isFormData && options.body !== undefined) {
                options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                options.body = JSON.stringify(options.body);
            }
            const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
            if (!response.ok) { 
                const errText = await response.text();
                try { 
                    const errJson = JSON.parse(errText); 
                    throw new Error(errJson.error || `Server Error: ${response.status}`);
                } catch { 
                    throw new Error(errText || `Server Error: ${response.status}`);
                }
            }
            if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
            return await response.json();
        } catch (error) { 
            console.error("API Error:", error); 
            return { error: error.message }; 
        }
    }

    async function getReferenceData(tableName, schema='Reference') {
        const cacheKey = `${schema}.${tableName}`;
        if (referenceDataCache[cacheKey]) return referenceDataCache[cacheKey];
        const data = await apiFetch(`table/${schema}/${tableName}`);
        if(data && !data.error) referenceDataCache[cacheKey] = data;
        return data;
    }

    function getPkColumnName(tableName) {
        return primaryKeyMap[tableName] || 'id';
    }

    function showModal(content) {
        const container = document.getElementById('modal-container');
        container.innerHTML = content;
        const modal = container.querySelector('.modal-overlay');
        const modalContent = container.querySelector('.modal-content');
        setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
        const closeModal = () => {
            modalContent.classList.add('opacity-0', '-translate-y-10');
            setTimeout(() => { container.innerHTML = ''; parsedUploadData = []; }, 300);
        };
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
        return { closeModal };
    }

    async function loadView() {
        const container = document.getElementById('page-container');
        container.innerHTML = `
            <div class="mb-4 flex items-center space-x-4">
                <input type="text" id="search-input" placeholder="Search by Sampling ID, Location, or Project..." class="w-full p-2 border rounded-md shadow-sm">
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                <div class="lg:col-span-3">
                    <div class="card p-4">
                        <div class="overflow-y-auto h-[70vh]">
                            <div id="table-content"><p class="p-4 text-gray-500">Loading sampling events...</p></div>
                        </div>
                    </div>
                </div>
                <div id="details-container" class="lg:col-span-2">
                    <div class="card p-6 h-full flex items-center justify-center text-gray-500">
                        <div class="text-center"><i data-lucide="map" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an event to view details</p></div>
                    </div>
                </div>
            </div>`;
        lucide.createIcons();
        document.getElementById('search-input').addEventListener('input', renderTable);
        await renderTable();
    }

    async function renderTable() {
        const tableContainer = document.getElementById('table-content');
        if(currentViewData.length === 0) {
            const result = await apiFetch(`table/${currentSchema}/${currentTableName}`);
            if (result.error || !Array.isArray(result)) {
                tableContainer.innerHTML = `<p class="p-4 text-red-500">Error loading data: ${result.error}</p>`;
                return;
            }
            currentViewData = result;
        }
        
        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
        let filteredData = currentViewData.filter(row => 
            (row.sampling_id && row.sampling_id.toLowerCase().includes(searchTerm)) ||
            (row.location_name && row.location_name.toLowerCase().includes(searchTerm)) ||
            (row.project_id && row.project_id.toLowerCase().includes(searchTerm))
        );

        if (currentSortColumn) {
            filteredData.sort((a, b) => {
                const valA = a[currentSortColumn];
                const valB = b[currentSortColumn];

                let comparison = 0;
                if ((currentSortColumn.toLowerCase().includes('date') || currentSortColumn.toLowerCase().includes('time')) && valA && valB) {
                    comparison = new Date(valA) - new Date(valB);
                } else if (typeof valA === 'number' && typeof valB === 'number') {
                    comparison = valA - valB;
                } else {
                    const stringA = String(valA || '').toLowerCase();
                    const stringB = String(valB || '').toLowerCase();
                    comparison = stringA.localeCompare(stringB, undefined, { sensitivity: 'base' });
                }
                return currentSortDirection === 'asc' ? comparison : -comparison;
            });
        }

        if (filteredData.length === 0) {
            tableContainer.innerHTML = `<p class="p-4 text-gray-500">No sampling events found.</p>`;
            document.getElementById('details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="map" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an event to view details</p></div></div>`;
            lucide.createIcons();
            return;
        }

        // Define summary headers for the main table view
        const summaryHeaders = [
            'sampling_id', 'sampling_date', 'location_name', 'project_id', 'cruise_id', 
            'region_id', 'ecosystem_id', 'depth_m', 'status_id'
        ];
        
        const tableHtml = `<table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0"><tr>
                ${summaryHeaders.map(h => {
                    const isCurrentSort = h === currentSortColumn;
                    let sortIcon = '<i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>';
                    if (isCurrentSort) {
                        sortIcon = currentSortDirection === 'asc' ? '<i data-lucide="chevron-up" class="sort-icon"></i>' : '<i data-lucide="chevron-down" class="sort-icon"></i>';
                    }
                    return `<th class="px-4 py-2 text-left font-medium text-gray-500 uppercase sortable-header" data-column="${h}">
                        <div class="flex items-center">
                            <span>${h.replace(/_/g, ' ')}</span>
                            ${sortIcon}
                        </div>
                        <input type="text" placeholder="Filter..." class="filter-input" data-column="${h}" value="${columnFilters[h] || ''}">
                    </th>`;
                }).join('')}
                <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
            </tr></thead>
            <tbody class="divide-y divide-gray-200">${filteredData.map(row => {
                // For composite PK (sampling_id, sampling_date), concatenate with '|'
                const pk = `${row.sampling_id}|${row.sampling_date}`;
                return `
                <tr class="table-row hover:bg-gray-50 cursor-pointer" data-pk="${pk}">
                    ${summaryHeaders.map(h => {
                        let cellValue = row[h] || '';
                        if ((h.toLowerCase().includes('date') || h.toLowerCase().includes('time')) && cellValue) {
                            try { cellValue = new Date(cellValue).toLocaleDateString(); } catch (e) {}
                        }
                        return `<td class="px-4 py-3 whitespace-nowrap">${cellValue}</td>`;
                    }).join('')}
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-pk="${pk}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-pk="${pk}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`;
            }).join('')}
            </tbody></table>`;
        
        tableContainer.innerHTML = tableHtml;
        lucide.createIcons();
        addActionListeners();
        addSortAndFilterListeners();
    }
    
    function addSortAndFilterListeners() {
        document.querySelectorAll('.sortable-header').forEach(header => {
            header.addEventListener('click', (e) => {
                const column = e.currentTarget.dataset.column;
                if (currentSortColumn === column) {
                    currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortColumn = column;
                    currentSortDirection = 'asc';
                }
                renderTable();
            });
        });

        document.querySelectorAll('.filter-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const column = e.target.dataset.column;
                columnFilters[column] = e.target.value.toLowerCase();
                renderTable();
            });
        });
    }

    async function renderDetails(primaryKey) {
        const container = document.getElementById('details-container');
        container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><div class="loading-spinner"></div> Loading details...</div></div>`;
        lucide.createIcons();

        // Split composite PK to find the item
        const [samplingId, samplingDate] = primaryKey.split('|');
        const item = currentViewData.find(i => i.sampling_id === samplingId && i.sampling_date === samplingDate);

        if (!item) { container.innerHTML = `<p class="p-4 text-red-500">Could not find details for sampling event ${samplingId} on ${samplingDate}.</p>`; return; }

        // Fetch related data for details panel
        const [
            project, cruise, region, ecosystem, vessel, customer, externalContact, status,
            windUnit, salinityUnit, pressureUnit, oxygenUnit, conductivityUnit, soakTimeUnit, trawlSpeedUnit,
            samplesAssociated
        ] = await Promise.all([
            item.project_id ? getReferenceData('projects', 'Lims').then(data => data.find(p => p.project_id === item.project_id)) : Promise.resolve(null),
            item.cruise_id ? getReferenceData('cruises', 'Lims').then(data => data.find(c => c.cruise_id === item.cruise_id)) : Promise.resolve(null),
            item.region_id ? getReferenceData('region', 'Reference').then(data => data.find(r => r.region_id === item.region_id)) : Promise.resolve(null),
            item.ecosystem_id ? getReferenceData('ecosystem', 'Reference').then(data => data.find(e => e.ecosystem_id === item.ecosystem_id)) : Promise.resolve(null),
            item.vessel_id ? getReferenceData('vessel', 'Reference').then(data => data.find(v => v.vessel_id === item.vessel_id)) : Promise.resolve(null),
            item.customer_id ? getReferenceData('customers', 'Lims').then(data => data.find(c => c.customer_id === item.customer_id)) : Promise.resolve(null),
            item.together_with_contact_id ? getReferenceData('external_contacts', 'Lims').then(data => data.find(ec => ec.contact_id === item.together_with_contact_id)) : Promise.resolve(null),
            item.status_id ? getReferenceData('status', 'Reference').then(data => data.find(s => s.status_id === item.status_id)) : Promise.resolve(null),
            item.wind_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.wind_unit_id)) : Promise.resolve(null),
            item.salinity_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.salinity_unit_id)) : Promise.resolve(null),
            item.pressure_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.pressure_unit_id)) : Promise.resolve(null),
            item.oxygen_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.oxygen_unit_id)) : Promise.resolve(null),
            item.conductivity_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.conductivity_unit_id)) : Promise.resolve(null),
            item.soak_time_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.soak_time_unit_id)) : Promise.resolve(null),
            item.trawl_speed_unit_id ? getReferenceData('units', 'Reference').then(data => data.find(u => u.unit_id === item.trawl_speed_unit_id)) : Promise.resolve(null),
            apiFetch(`table/Lab/samples?filter_sampling_id=${samplingId}&filter_sampling_date=${samplingDate}`)
        ]);

        // Helper to render a detail row if value exists
        const renderDetailRow = (label, value) => {
            if (value === null || value === undefined || String(value).trim() === '' || value === 'N/A') {
                return '';
            }
            return `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${label}</dt><dd class="text-gray-900 break-all">${value}</dd></div>`;
        };

        // Helper to format date strings
        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return isNaN(date.getTime()) ? 'N/A' : date.toLocaleDateString();
            } catch (e) {
                return 'N/A';
            }
        };

        let detailsHtml = `<div class="space-y-2 text-sm">`;
        
        // Core Information Accordion
        detailsHtml += `
            <div class="accordion-item">
                <button class="accordion-header" data-accordion="core-info">
                    <span class="flex items-center"><i data-lucide="info" class="w-5 h-5 mr-2"></i> Core Information</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                </button>
                <div class="accordion-content open">
                    <dl class="space-y-2 py-2">
                        ${renderDetailRow('Sampling ID', item.sampling_id)}
                        ${renderDetailRow('Sampling Date', formatDate(item.sampling_date))}
                        ${renderDetailRow('Location Name', item.location_name)}
                        ${renderDetailRow('Depth (m)', item.depth_m)}
                        ${renderDetailRow('Project', project ? `${project.title} (${project.project_id})` : item.project_id || 'N/A')}
                        ${renderDetailRow('Cruise', cruise ? `${cruise.cruise_id}` : item.cruise_id || 'N/A')}
                        ${renderDetailRow('Region', region ? `${region.region_abrv}` : item.region_id || 'N/A')}

    function addActionListeners() {
        document.querySelectorAll('.table-row').forEach(row => {
            row.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                document.querySelectorAll('.table-row').forEach(r => r.classList.remove('table-row-selected'));
                row.classList.add('table-row-selected');
                renderDetails(row.dataset.pk);
            });
        });

        document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const pk = e.currentTarget.dataset.pk;
            // For composite PK, split the concatenated string
            const [samplingId, samplingDate] = pk.split('|');
            const itemToEdit = currentViewData.find(i => i.sampling_id === samplingId && i.sampling_date === samplingDate);
            
            if (itemToEdit) showNewItemModal(itemToEdit);
        }));

        document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const pk = e.currentTarget.dataset.pk;
            const [samplingId, samplingDate] = pk.split('|');
            
            if (confirm(`Are you sure you want to delete sampling event ${samplingId} on ${samplingDate}? This cannot be undone.`)) {
                // For partitioned tables, sampling_date must be passed as a query parameter for DELETE
                const endpoint = `table/${currentSchema}/${currentTableName}/${samplingId}?sampling_date=${samplingDate}`;
                const result = await apiFetch(endpoint, { method: 'DELETE' });
                if (result && result.success) {
                    alert('Sampling event deleted successfully!');
                    currentViewData = []; // Clear cache to force re-fetch
                    loadView(); // Reload the page
                } else {
                    alert('Failed to delete item: ' + (result.error || 'Unknown error'));
                }
            }
        }));
    }

    async function showNewItemModal(itemToEdit = null) {
        const isEditing = itemToEdit !== null;
        
        const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl transform transition-all -translate-y-10 opacity-0">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">${isEditing ? `Edit Sampling Event: ${itemToEdit.sampling_id}` : `New Sampling Event`}</h2>
                    <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">&times;</button>
                </div>
                <form id="item-form" class="space-y-4">
                    <div id="dynamic-fields-container" class="max-h-[60vh] overflow-y-auto p-4 rounded-md bg-gray-50 border"></div>
                </form>
                <div class="pt-6 flex justify-end border-t mt-6">
                    <button id="save-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create Entry'}</button>
                </div>
            </div>
        </div>`;
        const { closeModal } = showModal(modalHTML);
        
        await renderFormFields(itemToEdit);

        document.getElementById('save-item-btn').onclick = async () => {
            const form = document.getElementById('item-form');
            if (!form.reportValidity()) return;
            
            const formData = new FormData(form);
            const data = {};
            for (const [key, value] of formData.entries()) {
                if (key === 'attachment') {
                    data[key] = value.size > 0 ? value : null; // Keep File object if not empty
                } else if (key.endsWith('_jsonb')) {
                    try {
                        data[key] = value ? JSON.parse(value) : null;
                    } catch (e) {
                        alert(`Invalid JSON for ${key.replace(/_/g, ' ')}. Please correct it.`);
                        return;
                    }
                } else if (key.endsWith('_geom')) { // Handle geometry fields
                    // Convert POINT(lon lat) string to expected format if needed by backend, or just pass as string
                    // For now, pass as string, backend should handle PostGIS conversion
                    data[key] = value === '' ? null : value; 
                } else {
                    data[key] = value === '' ? null : value; // Convert empty strings to null
                }
            }

            const user = JSON.parse(sessionStorage.getItem('user')) || {};
            data.modified_by = user.person_id; 
            if (!isEditing) {
                data.created_by = user.person_id; 
            }

            let endpoint = `table/${currentSchema}/${currentTableName}`;
            const method = isEditing ? 'PUT' : 'POST';
            let pk = null;

            if (isEditing) {
                // For partitioned table (sampling), both sampling_id and sampling_date are needed for PUT
                const [samplingId, samplingDate] = itemToEdit.sampling_id.split('|').length > 1 ? itemToEdit.sampling_id.split('|') : [itemToEdit.sampling_id, itemToEdit.sampling_date]; // Handle case where PK might be just ID from URL
                pk = samplingId; // The ID part for the URL
                data.sampling_date = samplingDate; // Add sampling_date to the body for PUT
                endpoint = `table/${currentSchema}/${currentTableName}/${pk}?sampling_date=${samplingDate}`; // Add sampling_date to query param for PUT
            }

            let result;
            if (data.attachment instanceof File) {
                const formDataWithFile = new FormData();
                for (const key in data) {
                    if (data[key] !== null) { 
                        formDataWithFile.append(key, data[key]);
                    }
                }
                result = await apiFetch(endpoint, { method, body: formDataWithFile });
            } else {
                result = await apiFetch(endpoint, { method, body: data });
            }

            if(result && !result.error) {
                closeModal();
                currentViewData = []; // Clear cache to force re-fetch
                loadView(); // Reload the page
            } else {
                alert('Failed to save item: ' + (result ? result.error : 'Unknown error'));
            }
        };
    }

    async function renderFormFields(dataToPreload = null) {
        const container = document.getElementById('dynamic-fields-container');
        container.innerHTML = `<p class="text-center text-gray-500 p-4">Loading form fields...</p>`;
        
        const schemaInfo = await apiFetch(`table/${currentSchema}/${currentTableName}/info`);
        if (schemaInfo.error || !schemaInfo.columns) {
            container.innerHTML = `<p class="text-red-500 p-4">Could not load form schema. Table may be empty.</p>`; 
            return;
        }

        const columns = schemaInfo.columns;
        
        let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">';
        // Columns to ignore in the form (auto-generated, internal, or handled separately)
        const ignoredFormCols = ['nr', 'id', 'modified_by', 'time_modification', 'password_hash', 'search_vector', 'created_at', 'attachment'];
        const pkColumn = getPkColumnName(currentTableName);

        for (const col of columns) {
            const colName = col.name;
            if (ignoredFormCols.includes(colName) || colName.endsWith('_search_vector')) continue;
            
            // Skip auto-generated PK for new entries (sampling_id is auto-generated by DB trigger)
            const isAutoGeneratedPk = (colName === 'sampling_id' && !dataToPreload);
            if (isAutoGeneratedPk) continue;

            const value = dataToPreload ? (dataToPreload[colName] === null ? '' : dataToPreload[colName]) : '';
            const formattedLabel = colName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            let field = '';
            // PKs are readonly on edit, also specific generated fields like total_dna_ug
            const isReadOnly = (dataToPreload && (Array.isArray(pkColumn) ? pkColumn.includes(colName) : colName === pkColumn)) || colName.toLowerCase().includes('total_dna_ug'); 

            const fkConfig = foreignKeyMap[colName];

            if (fkConfig) {
                if (fkConfig.type === 'geometry') { // PostGIS geometry fields
                    // Display as text input, expecting POINT(lon lat) format
                    field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" placeholder="e.g., POINT(lon lat)" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                } else if (fkConfig.type === 'file') { // Attachment
                    field = `<input type="file" name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''}>`;
                } else { // Standard FK dropdown
                    const refData = await getReferenceData(fkConfig.table, fkConfig.schema);
                    if (refData && !refData.error) {
                        field = `<select name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>
                                    <option value="">-- Select --</option>
                                    ${refData.map(r => `<option value="${r[fkConfig.valueCol]}" ${value == r[fkConfig.valueCol] ? 'selected' : ''}>${r[fkConfig.displayCol] || r[fkConfig.valueCol]}</option>`).join('')}
                                </select>`;
                    } else {
                        field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm bg-red-100" placeholder="Error loading options" ${isReadOnly ? 'readonly' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                    }
                }
            } else if (col.type === 'date' || col.type === 'timestamp without time zone' || col.type === 'timestamptz') {
                field = `<input type="date" name="${colName}" value="${value ? String(value).split('T')[0] : ''}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
            } else if (col.type === 'time without time zone') { // Specific for time fields
                field = `<input type="time" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
            } else if (col.type === 'text' && (colName.toLowerCase().includes('notes') || colName.toLowerCase().includes('description') || colName.toLowerCase().includes('weather') || colName.toLowerCase().includes('catch_notes') || colName.toLowerCase().includes('sea_state') || colName.toLowerCase().includes('tide_stage') || colName.toLowerCase().includes('fishing_method') || colName.toLowerCase().includes('gear_type') || colName.toLowerCase().includes('preservative') || colName.toLowerCase().includes('instrument_id'))) {
                field = `<textarea name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>${value}</textarea>`;
            } else if (col.type === 'integer' || col.type === 'numeric' || col.type === 'bigint') {
                field = `<input type="number" step="any" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
            } else if (col.type === 'boolean') {
                field = `<input type="checkbox" name="${colName}" class="mt-1 h-4 w-4 rounded" ${value ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}>`;
            }
            else { // Default to text input
                field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
            }
            fieldsHtml += `<div><label class="font-medium text-sm text-gray-700">${formattedLabel}</label>${field}</div>`;
        }
        fieldsHtml += '</div>';
        container.innerHTML = fieldsHtml;
    }

    async function generateAndDownloadTemplate(isUpdate) {
        const schemaInfo = await apiFetch(`table/${currentSchema}/${currentTableName}/info`);
        if (schemaInfo.error || !schemaInfo.columns) {
            alert('Could not determine table schema to generate template. The table may be empty.');
            return;
        }
        
        let headers = schemaInfo.columns.map(col => col.name);
        // For sampling table, PK is composite: (sampling_id, sampling_date)
        const pkColumns = getPkColumnName(currentTableName); 

        // Filter out internal/calculated fields for the template
        headers = headers.filter(key => 
            !['attachment', 'notes', 'time_modification', 'modified_by', 'password_hash', 'search_vector', 'created_at', 'geom', 'fishing_start_geom', 'fishing_end_geom', 'stomach_contents_jsonb'].includes(key) && 
            !key.endsWith('_ug') // Exclude generated columns
        );
        
        if (isUpdate) {
            // Ensure all composite PK parts are at the beginning in order
            headers = headers.filter(h => !pkColumns.includes(h));
            headers = [...pkColumns, ...headers];
        } else {
            // For new import, sampling_id is auto-generated by DB trigger, so exclude it.
            // sampling_date is required for partitioning, so keep it.
            headers = headers.filter(h => h !== 'sampling_id');
        }

        const csvContent = headers.join(';'); // Use semicolon for CSV
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' }); // Add BOM for Excel compatibility
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `${currentTableName}_${isUpdate ? 'update' : 'import'}_template.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function handleFileSelect(event, isUpdate) {
        const file = event.target.files[0];
        if (!file) return;

        const modalContent = event.target.closest('.modal-content');
        const previewContainer = modalContent.querySelector('#preview-container');
        const actionButton = modalContent.querySelector('button[id$="-data-btn"]');

        previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
        if (actionButton) actionButton.disabled = true;

        const onParseComplete = (results) => {
            if (results.errors && results.errors.length > 0) {
                previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                return;
            }
            if (!results.data || results.data.length === 0) {
                 previewContainer.innerHTML = `<p class="text-red-500 p-4">No data found in the file.</p>`;
                 return;
            }
            // For update, check if all PK columns are present
            const pkColumns = getPkColumnName(currentTableName);
            if (isUpdate && (Array.isArray(pkColumns) ? !pkColumns.every(col => results.data[0].hasOwnProperty(col)) : !results.data[0].hasOwnProperty(pkColumns))) {
                 previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: Update file must contain primary key column(s): ${Array.isArray(pkColumns) ? pkColumns.join(', ') : pkColumns}.</p>`;
                 return;
            }
            
            displayPreview(results.data, isUpdate, previewContainer, actionButton);
        };

        if (file.name.endsWith('.csv')) {
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
        } else { 
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    onParseComplete({ data: jsonData, errors: [] });
                } catch (err) {
                    onParseComplete({ data: [], errors: [{ message: err.message }] });
                }
            };
            reader.onerror = () => {
                onParseComplete({ data: [], errors: [{ message: 'Could not read the file.' }] });
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function displayPreview(data, isUpdate, previewContainer, actionButton) {
        parsedUploadData = data;
        const headers = Object.keys(data[0]);
        const previewHtml = `
            <p class="text-sm font-medium p-2">Found ${parsedUploadData.length} records. Showing preview:</p>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100"><tr>${headers.map(h => `<th class="px-2 py-1 text-left font-medium text-gray-600">${h}</th>`).join('')}</tr></thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    ${parsedUploadData.slice(0, 5).map(row => `<tr>${headers.map(h => `<td class="px-2 py-1 whitespace-nowrap truncate max-w-[100px]">${row[h] || ''}</td>`).join('')}</tr>`).join('')}
                </tbody>
            </table>`;
        previewContainer.innerHTML = previewHtml;
        if (actionButton) actionButton.disabled = false;
    }

    // Bulk Import (Create New)
    async function handleBulkImport(closeModal) {
        if (parsedUploadData.length === 0) { alert('No data to upload.'); return; }
        
        const uploadBtn = document.getElementById('upload-data-btn');
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Uploading...';
        lucide.createIcons();
        
        document.getElementById('bulk-operation-progress').classList.remove('hidden');
        const logContainer = document.getElementById('progress-log');
        logContainer.innerHTML = '';
        
        let successCount = 0;
        let failCount = 0;
        const failedRecords = [];
        const user = JSON.parse(sessionStorage.getItem('user')) || {};

        const logMessage = (msg, color = 'text-gray-300') => {
            logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        logMessage(`Starting bulk import for ${parsedUploadData.length} records into ${currentSchema}.${currentTableName}...`);

        for (const row of parsedUploadData) {
            // Add created_by to each row before sending
            const dataToInsert = { ...row, created_by: user.person_id };
            logMessage(`Inserting record...`);
            const result = await apiFetch(`table/${currentSchema}/${currentTableName}`, { method: 'POST', body: dataToInsert });
            
            if (!result.error) {
                successCount++;
                logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
            } else {
                failCount++;
                failedRecords.push(JSON.stringify(row));
                logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
            }
        }

        logMessage('------------------------------------', 'text-blue-400');
        logMessage(`Bulk import complete.`, 'text-blue-400 font-bold');
        logMessage(`Successful: ${successCount}`, 'text-green-400');
        logMessage(`Failed: ${failCount}`, 'text-red-400');
        if(failedRecords.length > 0) {
             logMessage(`Failed rows (first 5): ${failedRecords.slice(0,5).join('; ')}`);
        }

        currentViewData = []; // Clear cache to force re-fetch
        loadView(); // Reload the page
        
        uploadBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mr-2"></i>Finished';
        uploadBtn.onclick = closeModal; // Change button to close modal
        uploadBtn.disabled = false;
        lucide.createIcons();
    }
    
    // Bulk Update (Modify Existing)
    async function handleBulkUpdate(closeModal) {
        if (parsedUploadData.length === 0) { alert('No data to update.'); return; }
        
        const updateBtn = document.getElementById('update-data-btn');
        updateBtn.disabled = true;
        updateBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Updating...';
        lucide.createIcons();

        document.getElementById('bulk-operation-progress').classList.remove('hidden');
        const logContainer = document.getElementById('progress-log');
        logContainer.innerHTML = '';
        
        let successCount = 0;
        let failCount = 0;
        const failedRecords = [];
        const user = JSON.parse(sessionStorage.getItem('user')) || {};

        const logMessage = (msg, color = 'text-gray-300') => {
            logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        logMessage(`Starting bulk update for ${parsedUploadData.length} records in ${currentSchema}.${currentTableName}...`);

        const pkColumns = getPkColumnName(currentTableName); // This will be ['sampling_id', 'sampling_date']

        for (const row of parsedUploadData) {
            let pkIdentifier = ''; // For logging purposes
            let endpoint = `table/${currentSchema}/${currentTableName}/`;
            const payload = { ...row };
            
            if (Array.isArray(pkColumns)) {
                // Construct PK for URL and remove from payload
                const pkValues = pkColumns.map(col => row[col]);
                if (!pkValues.every(val => val !== undefined && val !== null)) {
                    logMessage(`Skipping row: Missing one or more primary key columns (${pkColumns.join(', ')}): ${JSON.stringify(row)}`, 'text-yellow-400');
                    failCount++;
                    continue;
                }
                pkIdentifier = pkValues.join('|'); // For URL and logging
                endpoint += pkValues[0]; // First part of composite PK for URL path

                // Add remaining PK parts as query parameters for PUT
                for (let i = 1; i < pkColumns.length; i++) {
                    endpoint += `${i === 1 ? '?' : '&'}${pkColumns[i]}=${pkValues[i]}`;
                }
                pkColumns.forEach(col => delete payload[col]); // Remove PKs from payload
            } else { // Single PK
                pkIdentifier = row[pkColumns];
                if (!pkIdentifier) {
                    logMessage(`Skipping row: Missing primary key column '${pkColumns}': ${JSON.stringify(row)}`, 'text-yellow-400');
                    failCount++;
                    continue;
                }
                endpoint += pkIdentifier;
                delete payload[pkColumns]; // Remove PK from payload
            }
            
            payload.modified_by = user.person_id; // Add modified_by

            logMessage(`Updating ${pkIdentifier}...`);
            const result = await apiFetch(endpoint, { method: 'PUT', body: payload });
            
            if (!result.error) {
                successCount++;
                logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
            } else {
                failCount++;
                failedRecords.push(`${pkIdentifier}: ${result.error}`);
                logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
            }
        }

        logMessage('------------------------------------', 'text-blue-400');
        logMessage(`Bulk update complete.`, 'text-blue-400 font-bold');
        logMessage(`Successful: ${successCount}`, 'text-green-400');
        logMessage(`Failed: ${failCount}`, 'text-red-400');
        if (failedRecords.length > 0) {
             logMessage(`Failed IDs: ${failedRecords.join(', ')}`);
        }

        currentViewData = []; // Clear cache to force re-fetch
        await loadView(); // Reload the page
        
        updateBtn.innerHTML = '<i data-lucide="x" class="w-5 h-5 mr-2"></i>Close';
        updateBtn.onclick = closeModal;
        updateBtn.disabled = false;
        lucide.createIcons();
    }


    function initializePage() {
        loadView();
        document.getElementById('new-item-btn').addEventListener('click', () => showNewItemModal());
        document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkImportModal());
        document.getElementById('bulk-update-btn').addEventListener('click', () => showBulkUpdateModal());
    }
</script>
