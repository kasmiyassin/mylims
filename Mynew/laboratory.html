        // --- API & DATA HANDLING ---
        async function apiFetch(endpoint, options = {}) { 
            try {
                const isFormData = options.body instanceof FormData;
                if (!isFormData && options.body !== undefined) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const errText = await response.text();
                    try { const errJson = JSON.parse(errText); throw new Error(errJson.error || 'API request failed'); }
                    catch { throw new Error(errText); }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey]) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        // Function to determine the primary key column name(s) for a given table

            return primaryKeyMap[tableName] || 'id'; // Default to 'id' if not explicitly mapped

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => { container.innerHTML = ''; parsedUploadData = []; }, 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        // --- UI RENDERING ---
        function renderDashboard() {
            const container = document.getElementById('page-container');
            let html = `<h1 class="text-3xl font-bold text-gray-800 mb-6">Database Management</h1>`;
            
            for (const [schema, config] of Object.entries(labManagementConfig)) {
                html += `<div class="mb-8"><h2 class="text-2xl font-semibold mb-4 flex items-center ${config.color}"><i data-lucide="${config.icon}" class="w-6 h-6 mr-3"></i>${schema} Tables</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">`;
                config.tables.forEach(table => {
                    html += `<div class="management-card card p-6 text-center cursor-pointer flex flex-col items-center justify-center" onclick="loadView('${table.name}', '${schema}')">
                                 <i data-lucide="${table.icon}" class="h-12 w-12 text-gray-400 mb-2"></i>
                                 <p class="font-semibold text-lg">${table.name.replace(/_/g, ' ')}</p>
                               </div>`;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
            lucide.createIcons();
        }

        async function renderTableForType() {
            const tableContainer = document.getElementById('table-content');
            const result = await apiFetch(`table/${currentSchema}/${currentTableName}`);
            
            if (result.error || !Array.isArray(result)) {
                tableContainer.innerHTML = `<p class="p-4 text-red-500">Error loading data: ${result.error}</p>`;
                return;
            }
            
            currentTableData = result; // Store the raw data
            
            if (currentTableData.length === 0) {
                tableContainer.innerHTML = `<p class="p-4 text-gray-500">No entries found for ${currentTableName}.</p>`;
                return;
            }

            const headers = Object.keys(currentTableData[0]);
            
            const tableHtml = `<table class="min-w-full text-sm">
                <thead class="bg-gray-50 sticky top-0"><tr>
                    ${headers.map(h => `
                        <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">
                            <div class="flex items-center justify-between">
                                <span class="sortable-header" data-column="${h}">${h.replace(/_/g, ' ')}
                                    <i data-lucide="${sortColumn === h ? (sortDirection === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down'}" class="sort-icon w-4 h-4 text-gray-400"></i>
                                </span>
                            </div>
                            <input type="text" placeholder="Filter..." class="filter-input" data-column="${h}" value="${columnFilters[h] || ''}">
                        </th>
                    `).join('')}
                    <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
                </tr></thead>
                <tbody class="divide-y divide-gray-200" id="table-body">
                </tbody></table>`;
            
            tableContainer.innerHTML = tableHtml;
            lucide.createIcons();

            // Add event listeners for sorting and filtering
            document.querySelectorAll('.sortable-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const column = e.currentTarget.dataset.column;
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }
                    applyFiltersAndSort();
                });
            });

            document.querySelectorAll('.filter-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const column = e.target.dataset.column;
                    columnFilters[column] = e.target.value.toLowerCase();
                    applyFiltersAndSort();
                });
            });
            
            applyFiltersAndSort(); // Initial render with default sort/filters
            addActionListeners();
        }

        function applyFiltersAndSort() {
            let tempArray = [...currentTableData]; // Start with the raw data

            // Apply filters
            for (const column in columnFilters) {
                const filterText = columnFilters[column];
                if (filterText) {
                    tempArray = tempArray.filter(row => 
                        String(row[column] || '').toLowerCase().includes(filterText)
                    );
                }
            }

            // Apply sorting
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();

                    // Handle numerical sorting if applicable (for 'nr', 'volume', 'concentration', etc.)
                    if (!isNaN(parseFloat(valA)) && !isNaN(parseFloat(valB))) {
                        return sortDirection === 'asc' ? parseFloat(valA) - parseFloat(valB) : parseFloat(valB) - parseFloat(valA);
                    }
                    // Handle date/timestamp sorting if applicable
                    if (sortColumn.toLowerCase().includes('date') || sortColumn.toLowerCase().includes('timestamp')) {
                        const dateA = new Date(valA);
                        const dateB = new Date(valB);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; // Don't sort invalid dates
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    // Default to string comparison
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            filteredAndSortedData = tempArray;
            renderTableRows(filteredAndSortedData, Object.keys(currentTableData.length > 0 ? currentTableData[0] : {}));
            updateSortIcons();
        }

        function renderTableRows(dataToRender, headers) {
            const tableBody = document.getElementById('table-body');
            const pkColumn = getPkColumnName(currentTableName); // Dynamically get PK column

            tableBody.innerHTML = dataToRender.map(row => {
                // Handle composite primary keys for data-pk attribute
                const pk = Array.isArray(pkColumn) ? pkColumn.map(col => row[col]).join('|') : row[pkColumn]; 
                
                return `<tr class="table-row hover:bg-gray-50 cursor-pointer" data-pk="${pk}" data-table-name="${currentTableName}">
                    ${headers.map(h => {
                        let val = row[h];
                        // Special formatting for dates and timestamps
                        if ((h.toLowerCase().includes('date') || h.toLowerCase().includes('timestamp')) && val) {
                            try {
                                const dateObj = new Date(val);
                                val = isNaN(dateObj.getTime()) ? val : dateObj.toLocaleDateString();
                            } catch (e) {
                                val = val;
                            }
                        } else if (typeof val === 'object' && val !== null) {
                            // Stringify JSONB objects for display
                            val = JSON.stringify(val);
                        }
                        return `<td class="px-4 py-3 whitespace-nowrap">${val === null || val === undefined ? '' : val}</td>`;
                    }).join('')}
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-pk="${pk}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-pk="${pk}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`;
            }).join('');
            lucide.createIcons();
            addActionListeners();
        }

        function addActionListeners() {
            document.querySelectorAll('.table-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    document.querySelectorAll('.table-row').forEach(r => r.classList.remove('table-row-selected'));
                    row.classList.add('table-row-selected');
                    const pk = row.dataset.pk;
                    renderDetails(pk);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const pk = e.currentTarget.dataset.pk;
                const pkColumn = getPkColumnName(currentTableName);
                let itemToEdit;
                if (Array.isArray(pkColumn)) {
                    const pkValues = pk.split('|');
                    itemToEdit = currentTableData.find(d => pkColumn.every((col, index) => String(d[col]) === pkValues[index]));
                } else {
                    itemToEdit = currentTableData.find(i => String(i[pkColumn]) === pk);
                }
                
                if (itemToEdit) showNewItemModal(itemToEdit);
            }));

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const pk = e.currentTarget.dataset.pk;
                const pkColumn = getPkColumnName(currentTableName);
                
                let confirmationMessage = `Are you sure you want to delete this item?`;
                if (Array.isArray(pkColumn)) {
                    confirmationMessage = `Are you sure you want to delete this item (PK: ${pk}) from ${currentSchema}.${currentTableName}?`;
                } else {
                    confirmationMessage = `Are you sure you want to delete this item (ID: ${pk}) from ${currentSchema}.${currentTableName}?`;
                }

                if (confirm(confirmationMessage)) {
                    let endpoint = `table/${currentSchema}/${currentTableName}/${pk}`;
                    
                    // For partitioned tables, add sampling_date to query params for DELETE
                    if (currentTableName === 'samples' || currentTableName === 'sampling') {
                        const itemToDelete = currentTableData.find(d => String(d[pkColumn[0]]) === pk.split('|')[0] && String(d[pkColumn[1]]) === pk.split('|')[1]);
                        if (itemToDelete && itemToDelete.sampling_date) {
                            endpoint += `?sampling_date=${itemToDelete.sampling_date}`;
                        } else {
                            alert('Cannot delete: Missing sampling_date for partitioned table.');
                            return;
                        }
                    } else if (Array.isArray(pkColumn)) { // For other composite keys, pass components as query params
                         const pkValues = pk.split('|');
                         for(let i = 1; i < pkColumn.length; i++) { // Start from second PK part
                             endpoint += `&${pkColumn[i]}=${pkValues[i]}`;
                         }
                    }

                    const result = await apiFetch(endpoint, { method: 'DELETE' });
                    if (result && result.success) {
                        alert('Item deleted successfully!');
                        // Invalidate cache for the current table to force re-fetch
                        referenceDataCache[`${currentSchema}.${currentTableName}`] = null;
                        loadView(currentTableName, currentSchema); // Reload the entire view to refresh data
                    } else {
                        alert('Failed to delete item: ' + (result.error || 'Unknown error'));
                    }
                }
            }));
        }

        async function showNewItemModal(itemToEdit = null) {
            const isEditing = itemToEdit !== null;
            const tableName = currentTableName;
            const schema = currentSchema;
            
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl transform transition-all -translate-y-10 opacity-0">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">${isEditing ? `Edit Entry in ${schema}.${tableName}` : `New Entry for ${schema}.${tableName}`}</h2>
                        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">&times;</button>
                    </div>
                    <form id="item-form" class="space-y-4">
                        <div id="dynamic-fields-container" class="max-h-[60vh] overflow-y-auto p-4 rounded-md bg-gray-50 border"></div>
                    </form>
                    <div class="pt-6 flex justify-end border-t mt-6">
                        <button id="save-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create Entry'}</button>
                    </div>
                </div>
            </div>`;
            const { closeModal } = showModal(modalHTML);
            
            await renderFormFields(tableName, schema, itemToEdit);

            document.getElementById('save-item-btn').onclick = async () => {
                const form = document.getElementById('item-form');
                if (!form.reportValidity()) return;
                
                const formData = new FormData(form);
                const data = {};
                for (const [key, value] of formData.entries()) {
                    if (key === 'attachment') {
                        data[key] = value.size > 0 ? value : null; // Keep File object if not empty
                    } else if (key.endsWith('_jsonb')) {
                        try {
                            data[key] = value ? JSON.parse(value) : null;
                        } catch (e) {
                            alert(`Invalid JSON for ${key.replace(/_/g, ' ')}. Please correct it.`);
                            return;
                        }
                    } else {
                        data[key] = value === '' ? null : value; // Convert empty strings to null
                    }
                }

                const user = JSON.parse(sessionStorage.getItem('user')) || {};
                data.modified_by = user.person_id; // Add modified_by for updates
                if (!isEditing) {
                    data.created_by = user.person_id; // Add created_by for new entries
                }

                const pkColumn = getPkColumnName(tableName);
                let pk = null;
                if (isEditing) {
                    if (Array.isArray(pkColumn)) { // Composite PK
                        // For partitioned tables, `sampling_date` must be in data for PUT
                        if (tableName === 'samples' || tableName === 'sampling') {
                            pk = itemToEdit[pkColumn[0]]; // Main ID from original item
                            data.sampling_date = itemToEdit.sampling_date; // Add partition key to body
                        } else { // Other composite PKs, all parts are in data and concatenated for URL
                            pk = pkColumn.map(col => itemToEdit[col]).join('|'); 
                        }
                    } else { // Single PK
                        pk = itemToEdit[pkColumn];
                    }
                }
                
                let endpoint = isEditing ? `table/${schema}/${tableName}/${pk}` : `table/${schema}/${tableName}`;
                const method = isEditing ? 'PUT' : 'POST';

                // For composite PKs (not partitioned), add components to query params for PUT
                if (isEditing && Array.isArray(pkColumn) && tableName !== 'samples' && tableName !== 'sampling') {
                    const pkValues = pk.split('|');
                    for(let i = 1; i < pkColumn.length; i++) {
                        endpoint += `&${pkColumn[i]}=${pkValues[i]}`; // Add to URL for PUT
                    }
                }

                const result = await apiFetch(endpoint, { method, body: data });

                if(result && !result.error) {
                    closeModal();
                    // Invalidate cache for the current table to force re-fetch
                    referenceDataCache[`${currentSchema}.${currentTableName}`] = null;
                    loadView(currentTableName, currentSchema); // Reload the entire view to reflect changes
                } else {
                    alert('Failed to save item: ' + (result ? result.error : 'Unknown error'));
                }
            };
        }

        async function renderFormFields(tableName, schema, dataToPreload = null) {

            const schemaInfo = await apiFetch(`table/${schema}/${tableName}/info`);
            
            if (schemaInfo.error || !schemaInfo.columns) {
                container.innerHTML = `<p class="text-red-500 p-4">Error loading schema for ${tableName}: ${schemaInfo.error}</p>`;
                return;
            }

            const columns = schemaInfo.columns;
            
            let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">';
            
            for (const col of columns) {
                const colName = col.name;
                // Skip auto-generated, internal, or calculated fields
                const ignoredFormCols = ['nr', 'id', 'modified_by', 'time_modification', 'password_hash', 'search_vector', 'created_at', 'qubit_total_dna_ug', 'nanodrop_total_dna_ug'];
                if (ignoredFormCols.includes(colName) || colName.endsWith('_search_vector')) {
                    continue;
                }
                
                // If adding new, and this is a primary key that's auto-generated by DB triggers, skip it.
                const pkColumn = getPkColumnName(tableName);
                const isAutoGeneratedPk = !Array.isArray(pkColumn) && ['experiment_id', 'extraction_id', 'library_id', 'sequencing_id', 'dissection_id', 'run_id', 'protocol_run_id', 'nanodrop_id', 'qubit_id', 'tapestation_id', 'pcr_id', 'qpcr_id', 'gelelectrophoresis_id', 'customer_id', 'fi_order_nr', 'reagent_id', 'publication_id', 'fishing_id', 'otolith_id', 'dataset_id', 'pipeline_id', 'assignment_id'].includes(colName);
                if (!dataToPreload && isAutoGeneratedPk) {
                    continue;
                }

                const value = dataToPreload ? (dataToPreload[colName] === null ? '' : dataToPreload[colName]) : '';
                const formattedLabel = colName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let field = '';
                const isReadOnly = (dataToPreload && (Array.isArray(pkColumn) ? pkColumn.includes(colName) : colName === pkColumn)) || colName.toLowerCase().includes('total_dna_ug'); // PKs are readonly on edit

                const fkConfig = foreignKeyMap[colName];

                if (fkConfig) {
                    if (fkConfig.data === null) { // Special handling for JSONB, Geometry etc.
                        field = `<textarea name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" placeholder="Enter JSON (e.g., {'key': 'value'})" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>${value ? JSON.stringify(value, null, 2) : ''}</textarea>`;
                    } else {
                        const refData = await getReferenceData(fkConfig.table, fkConfig.schema);
                        if (refData && !refData.error) {
                            field = `<select name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>
                                        <option value="">-- Select --</option>
                                        ${refData.map(r => `<option value="${r[fkConfig.valueCol]}" ${value == r[fkConfig.valueCol] ? 'selected' : ''}>${r[fkConfig.displayCol] || r[fkConfig.valueCol]}</option>`).join('')}
                                    </select>`;
                        } else {
                            field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm bg-red-100" placeholder="Error loading options" ${isReadOnly ? 'readonly' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                        }
                    }
                } else if (col.type === 'date' || col.type === 'timestamp without time zone' || col.type === 'timestamptz') {
                    field = `<input type="date" name="${colName}" value="${value ? String(value).split('T')[0] : ''}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                } else if (col.type === 'text' && (colName.toLowerCase().includes('description') || colName.toLowerCase().includes('notes') || colName.toLowerCase().includes('protocol') || colName.toLowerCase().includes('path') || colName.toLowerCase().includes('aim') || colName.toLowerCase().includes('method') || colName.toLowerCase().includes('lab_book') || colName.toLowerCase().includes('contents'))) {
                    field = `<textarea name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>${value}</textarea>`;
                } else if (col.type === 'jsonb') { // Explicitly handle jsonb if not covered by fkConfig
                    field = `<textarea name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" placeholder="Enter JSON (e.g., {'key': 'value'})" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>${value ? JSON.stringify(value, null, 2) : ''}</textarea>`;
                } else if (col.type === 'integer' || col.type === 'numeric' || col.type === 'bigint') {
                    field = `<input type="number" step="any" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                } else if (col.type === 'boolean') {
                    field = `<input type="checkbox" name="${colName}" class="mt-1 h-4 w-4 rounded" ${value ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}>`;
                } else if (colName === 'attachment') { // Special handling for attachment field
                    field = `<input type="file" name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''}>`;
                }
                else { // Default to text input
                    field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                }
                fieldsHtml += `<div><label class="font-medium text-sm text-gray-700">${formattedLabel}</label>${field}</div>`;
            }
            fieldsHtml += '</div>';
            container.innerHTML = fieldsHtml;
        }

        async function showBulkUploadModal(isUpdate = false) {
            parsedUploadData = [];
            const modalTitle = isUpdate ? `Bulk Update for ${currentTableName}` : `Bulk Import for ${currentTableName}`;
            const actionButtonText = isUpdate ? 'Run Updates' : 'Upload to Database';
            const actionButtonIcon = isUpdate ? 'edit' : 'upload-cloud';
            const templateButtonText = isUpdate ? 'Download Update Template' : 'Download Template (.csv)';
            const templateButtonIcon = 'download';
            const fileInputAccept = ".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel";
            const fileInputClass = isUpdate ? "file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100" : "file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100";

            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-2xl font-bold">${modalTitle}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">&times;</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h3 class="font-semibold text-lg mb-2">1. Get Your Template</h3>
                                <p class="text-sm text-gray-600 mb-3">${isUpdate ? 'Include primary key(s) to match existing records.' : 'Ensure your column headers match the database.'}</p>
                                <button id="download-template-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow-sm">
                                    <i data-lucide="${templateButtonIcon}" class="w-4 h-4 mr-2"></i>${templateButtonText}
                                </button>
                            </div>
                            <div>
                                <h3 class="font-semibold text-lg mb-2">2. Upload Your File</h3>
                                <p class="text-sm text-gray-600 mb-3">Select a .csv or .xlsx file to upload.</p>
                                <input type="file" id="file-input" accept="${fileInputAccept}" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold ${fileInputClass}">
                            </div>
                        </div>
                        <div class="mt-6">
                            <h3 class="font-semibold text-lg mb-2">3. Preview Data</h3>
                            <div id="preview-container" class="border rounded-lg p-2 bg-gray-50 h-64 overflow-auto text-xs">
                                <p class="text-gray-500 text-center p-4">Select a file to see a preview of the data.</p>
                            </div>
                        </div>
                        <div id="bulk-operation-progress" class="hidden mt-4">
                            <h3 class="font-semibold text-lg mb-2">Operation Progress</h3>
                            <div id="progress-log" class="w-full bg-gray-800 text-white font-mono text-xs rounded-md p-4 h-48 overflow-y-auto"></div>
                        </div>
                        <div class="pt-6 flex justify-end border-t mt-6">
                            <button id="action-data-btn" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg flex items-center" disabled>
                                <i data-lucide="${actionButtonIcon}" class="w-5 h-5 mr-2"></i>${actionButtonText}
                            </button>
                        </div>
                    </div>
                </div>`;
            const { closeModal } = showModal(modalHTML);
            lucide.createIcons();

            document.getElementById('download-template-btn').addEventListener('click', () => generateAndDownloadTemplate(isUpdate));
            document.getElementById('file-input').addEventListener('change', (e) => handleFileSelect(e, isUpdate));
            document.getElementById('action-data-btn').addEventListener('click', () => {
                if (isUpdate) handleBulkUpdate(closeModal);
                else handleBulkImport(closeModal);
            });
        }

        async function generateAndDownloadTemplate(isUpdate) {
            const schemaToFetch = currentSchema; // Use currentSchema
            const schemaInfo = await apiFetch(`table/${schemaToFetch}/${currentTableName}/info`);
            
            if (schemaInfo.error || !schemaInfo.columns) {
                alert('Could not determine table schema to generate template.');
                return;
            }
            
            let headers = schemaInfo.columns.map(col => col.name);
            const pkColumn = getPkColumnName(currentTableName);

            // Filter out internal/calculated fields for the template
            headers = headers.filter(key => 
                !['nr', 'attachment', 'password_hash', 'search_vector', 'created_at', 'modified_by', 'time_modification'].includes(key) && 
                !key.endsWith('_ug') // Exclude generated columns like total_dna_ug
            );

            if (isUpdate) {
                // For update template, primary key(s) are essential and should be first
                if (Array.isArray(pkColumn)) {
                    // Ensure all composite PK parts are at the beginning
                    headers = headers.filter(h => !pkColumn.includes(h));
                    headers = [...pkColumn, ...headers];
                } else {
                    headers = headers.filter(h => h !== pkColumn);
                    headers.unshift(pkColumn);
                }
            } else {
                // For new import, auto-generated PKs should be excluded from template
                if (Array.isArray(pkColumn)) {
                    // If composite PK contains an auto-generated part, handle it.
                    // For now, assume auto-generated PKs are single and named like 'id', 'nr'
                    // or specific IDs like 'experiment_id' which are generated by DB triggers.
                    // If a composite PK is entirely auto-generated (e.g., serial + serial), this logic needs adjustment.
                    headers = headers.filter(h => !pkColumn.includes(h)); // Exclude all PK parts for new if they are auto-generated
                } else {
                    const isAutoGeneratedPk = ['experiment_id', 'extraction_id', 'library_id', 'sequencing_id', 'dissection_id', 'run_id', 'protocol_run_id', 'nanodrop_id', 'qubit_id', 'tapestation_id', 'pcr_id', 'qpcr_id', 'gelelectrophoresis_id', 'customer_id', 'fi_order_nr', 'reagent_id', 'publication_id', 'fishing_id', 'otolith_id', 'dataset_id', 'pipeline_id', 'assignment_id'].includes(pkColumn);
                    if (isAutoGeneratedPk) {
                        headers = headers.filter(h => h !== pkColumn);
                    }
                }
            }

            const csvContent = headers.join(';'); // Use semicolon for CSV
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `${currentTableName}_${isUpdate ? 'update' : 'import'}_template.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleFileSelect(event, isUpdate) {
            const file = event.target.files[0];
            if (!file) return;
            const previewContainer = document.getElementById('preview-container');
            const actionButton = document.getElementById('action-data-btn');
            previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
            actionButton.disabled = true;
            
            const onParseComplete = (results) => {
                if(results.errors.length > 0) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                    return;
                }
                parsedUploadData = results.data;
                if (isUpdate && (parsedUploadData.length === 0 || !parsedUploadData[0].hasOwnProperty(Array.isArray(getPkColumnName(currentTableName)) ? getPkColumnName(currentTableName)[0] : getPkColumnName(currentTableName)))) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: For bulk update, the file must contain data and include the primary key column(s) (e.g., '${Array.isArray(getPkColumnName(currentTableName)) ? getPkColumnName(currentTableName).join(', ') : getPkColumnName(currentTableName)}').</p>`;
                    return;
                }
                displayPreview(parsedUploadData);
                actionButton.disabled = false;
            };

            if (file.name.endsWith('.csv')) {
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        onParseComplete({ data: jsonData, errors: [] });
                    } catch (err) {
                        previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Error processing Excel file: ${err.message}</p>`;
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Unsupported file type. Please upload .csv or .xlsx.</p>`;
            }
        }

        function displayPreview(data) {
            if (!data || data.length === 0) {
                document.getElementById('preview-container').innerHTML = '<p class="text-red-500 text-center p-4">No data found in file.</p>';
                return;
            }
            const headers = Object.keys(data[0]);
            const previewHtml = `
                <p class="text-sm font-medium p-2">Found ${data.length} records. Showing preview:</p>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100"><tr>${headers.map(h => `<th class="px-2 py-1 text-left font-medium text-gray-600">${h}</th>`).join('')}</tr></thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${data.slice(0, 5).map(row => `<tr>${headers.map(h => `<td class="px-2 py-1 whitespace-nowrap truncate max-w-[100px]">${row[h] || ''}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                </table>`;
            document.getElementById('preview-container').innerHTML = previewHtml;
        }

        async function handleBulkImport(closeModal) {
            if (parsedUploadData.length === 0) { alert('No data to upload.'); return; }
            const actionBtn = document.getElementById('action-data-btn');
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Uploading...';
            lucide.createIcons();
            
            document.getElementById('bulk-operation-progress').classList.remove('hidden');
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedRecords = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};

            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            logMessage(`Starting bulk import for ${parsedUploadData.length} records into ${currentSchema}.${currentTableName}...`);

            for (const row of parsedUploadData) {
                // Add created_by to each row before sending
                const dataToInsert = { ...row, created_by: user.person_id };
                logMessage(`Inserting record...`);
                const result = await apiFetch(`table/${currentSchema}/${currentTableName}`, { method: 'POST', body: dataToInsert });
                
                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedRecords.push(JSON.stringify(row));
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }

            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Bulk import complete.`, 'text-blue-400 font-bold');
            logMessage(`Successful: ${successCount}`, 'text-green-400');
            logMessage(`Failed: ${failCount}`, 'text-red-400');
            if(failedRecords.length > 0) {
                 logMessage(`Failed rows (first 5): ${failedRecords.slice(0,5).join('; ')}`);
            }

            referenceDataCache[`${currentSchema}.${currentTableName}`] = null; // Invalidate cache
            await loadView(currentTableName, currentSchema); // Reload the current view to reflect changes
            
            actionBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mr-2"></i>Finished';
            actionBtn.onclick = closeModal; // Change button to close modal
            actionBtn.disabled = false;
            lucide.createIcons();
        }

        async function handleBulkUpdate(closeModal) {
            if (parsedUploadData.length === 0) { alert('No data to update.'); return; }
            
            const actionBtn = document.getElementById('action-data-btn');
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Updating...';
            lucide.createIcons();

            document.getElementById('bulk-operation-progress').classList.remove('hidden');
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedRecords = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};

            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            logMessage(`Starting bulk update for ${parsedUploadData.length} records in ${currentSchema}.${currentTableName}...`);

            const pkColumn = getPkColumnName(currentTableName);

            for (const row of parsedUploadData) {
                let pkValue;
                if (Array.isArray(pkColumn)) {
                    // For composite PK, ensure all parts are present in the row
                    if (!pkColumn.every(col => row.hasOwnProperty(col))) {
                        logMessage(`Skipping row: Missing one or more primary key columns (${pkColumn.join(', ')})`, 'text-yellow-400');
                        failCount++;
                        continue;
                    }
                    pkValue = pkColumn.map(col => row[col]).join('|'); // Concatenate for URL
                } else {
                    if (!row.hasOwnProperty(pkColumn)) {
                        logMessage(`Skipping row: Missing primary key column '${pkColumn}'`, 'text-yellow-400');
                        failCount++;
                        continue;
                    }
                    pkValue = row[pkColumn];
                }

                const payload = { ...row };
                // Remove PK columns from payload as they go in URL/query params
                if (Array.isArray(pkColumn)) {
                    pkColumn.forEach(col => delete payload[col]);
                } else {
                    delete payload[pkColumn];
                }
                payload.modified_by = user.person_id; // Add modified_by

                let endpoint = `table/${currentSchema}/${currentTableName}/${pkValue}`;
                // For partitioned tables, add sampling_date to query params for PUT
                if (currentTableName === 'samples' || currentTableName === 'sampling') {
                    if (row.sampling_date) {
                        endpoint += `?sampling_date=${row.sampling_date}`;
                    } else {
                        logMessage(`Skipping ${pkValue}: Missing sampling_date for partitioned table update.`, 'text-yellow-400');
                        failCount++;
                        continue;
                    }
                } else if (Array.isArray(pkColumn)) { // For other composite keys, add to query params
                    for(let i = 1; i < pkColumn.length; i++) {
                        endpoint += `&${pkColumn[i]}=${row[pkColumn[i]]}`;
                    }
                }

                logMessage(`Updating ${pkValue}...`);
                const result = await apiFetch(endpoint, { method: 'PUT', body: payload });
                
                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedRecords.push(`${pkValue}: ${result.error}`);
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }

            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Bulk update complete.`, 'text-blue-400 font-bold');
            logMessage(`Successful: ${successCount}`, 'text-green-400');
            logMessage(`Failed: ${failCount}`, 'text-red-400');
            if(failedRecords.length > 0) {
                 logMessage(`Failed records (first 5): ${failedRecords.slice(0,5).join('; ')}`);
            }

            referenceDataCache[`${currentSchema}.${currentTableName}`] = null; // Invalidate cache
            await loadView(currentTableName, currentSchema); // Reload the current view to reflect changes
            
            actionBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mr-2"></i>Finished';
            actionBtn.onclick = closeModal; // Change button to close modal
            actionBtn.disabled = false;
            lucide.createIcons();
        }

        function initializePage() {
            // The initial render is the schema-based dashboard
            renderDashboard();
            // No sub-nav links to initialize directly on this page
        }
    </script>
