<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - TIFI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 50; }
        .table-row-selected { background-color: #eef2ff !important; }

        /* New styles for filter/sort */
        .sortable-header { 
            cursor: pointer; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 8px; 
        }
        .sortable-header:hover { background-color: #e2e8f0; }
        .sort-icon { display: inline-block; width: 16px; height: 16px; vertical-align: middle; margin-left: 4px; flex-shrink: 0; }
        .filter-input {
            width: calc(100% - 10px);
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        /* Accordion styles for details panel */
        .accordion-item {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
        }
        .accordion-header:hover {
            background-color: #e2e8f0;
        }
        .accordion-header .lucide {
            transition: transform 0.3s ease;
        }
        .accordion-header.active .lucide {
            transform: rotate(180deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 1rem; /* Initial padding, will expand */
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        .accordion-content.open {
            max-height: 500px; /* Adjust as needed for content height */
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div id="main-app">
        <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-white w-64 p-4 flex flex-col">
            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI </span></div>
            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md active"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="map-pin" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="book-text" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>
                <a href="labeling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="Printer" class="w-5 h-5 mr-3"></i><span>Labeling</span></a>
                <a href="workflow.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="workflow" class="w-5 h-5 mr-3"></i><span>Workflow</span></a>
                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
           </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>
            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Projects Management</h1>
                <button id="new-project-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow hover:shadow-lg transition-all"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Project</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                <div class="lg:col-span-2">
                    <div class="card p-4">
                        <div class="overflow-y-auto h-[65vh]">
                            <table class="min-w-full">
                                <thead class="bg-gray-50 sticky top-0">
                                    <tr>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                            <div class="sortable-header" data-column="Title">
                                                <span>Project</span>
                                                <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                            </div>
                                            <input type="text" placeholder="Filter Title..." class="filter-input" data-column="Title">
                                        </th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                            <div class="sortable-header" data-column="status_id">
                                                <span>Status</span>
                                                <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                            </div>
                                            <input type="text" placeholder="Filter Status..." class="filter-input" data-column="status_id">
                                        </th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                            <div class="sortable-header" data-column="customer_id">
                                                <span>Customer</span>
                                                <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                            </div>
                                            <input type="text" placeholder="Filter Customer..." class="filter-input" data-column="customer_id">
                                        </th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="projects-table" class="divide-y divide-gray-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="project-details-container" class="lg:col-span-3">
                    <div class="card p-6 h-full flex items-center justify-center text-gray-500">
                        <div class="text-center">
                            <i data-lucide="folder-search" class="mx-auto h-12 w-12"></i>
                            <p class="mt-2">Select a project to view its details</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="modal-container"></div>
    </div>

    <script>
        // --- AUTH & SETUP ---
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api'; // const API_BASE_URL = `http://${window.location.hostname}:5200/api`;
        let masterCache = {}; // Cache for all fetched reference data
        let currentProjectsData = []; // Stores the raw projects data from the API
        let filteredAndSortedProjects = []; // Stores projects after applying filters and sorts
        
        // State for sorting and filtering projects
        let sortColumn = 'Title'; // Default sort column
        let sortDirection = 'asc'; // Default sort direction
        let columnFilters = {}; // { 'columnName': 'filterText' }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializeProjectsPage();
        });

        // --- API & DATA HANDLING ---
        async function apiFetch(endpoint, options = {}) {
            try {
                if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const errText = await response.text();
                    try { const errJson = JSON.parse(errText); throw new Error(errJson.error || 'API request failed'); }
                    catch { throw new Error(errText); }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema = 'Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey]) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        // --- UI RENDERING ---
        function renderProjects(projectsToDisplay) {
            const tableBody = document.getElementById('projects-table');
            if (!projectsToDisplay || !tableBody) return;
            tableBody.innerHTML = projectsToDisplay.map(p => `
                <tr class="hover:bg-gray-50 cursor-pointer project-row" data-project-id="${p.project_id}">
                    <td class="px-4 py-3"><p class="font-medium text-gray-900">${p.Title || 'No Title'}</p><p class="text-sm text-gray-500">${p.project_id}</p></td>
                    <td class="px-4 py-3"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${p.status_id === 'Active' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${p.status_id}</span></td>
                    <td class="px-4 py-3">${p.customer_name || 'N/A'}</td>
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-project-id="${p.project_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-project-id="${p.project_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('');
            
            lucide.createIcons();
            addProjectListActionListeners(projectsToDisplay); // Pass the currently displayed data for listeners
        }
        
        async function renderProjectDetails(projectId) {
            const container = document.getElementById('project-details-container');
            container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="loader-2" class="animate-spin mx-auto h-12 w-12 text-blue-600"></i><p class="mt-2">Loading project details...</p></div></div>`;
            lucide.createIcons();

            const project = currentProjectsData.find(p => p.project_id === projectId); // Find from raw data

            if (!project) { 
                container.innerHTML = `<div class="card p-6 text-red-500">Error: Project details not found.</div>`; 
                return; 
            }

            // Fetch related data
            const [
                piPerson, 
                customer, 
                samples, 
                experiments, 
                cruises, 
                orders
            ] = await Promise.all([
                project.PI ? getReferenceData('personal').then(data => data.find(p => p.person_id === project.PI)) : Promise.resolve(null),
                project.customer_id ? getReferenceData('customers', 'Lims').then(data => data.find(c => c.customer_id === project.customer_id)) : Promise.resolve(null),
                apiFetch(`table/Lab/samples?filter_project_id=${projectId}`),
                apiFetch(`table/Lab/Experiments?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/cruises?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/orders?filter_project_id=${projectId}`)
            ]);

            let detailsHtml = `<div class="space-y-3 text-sm">`;
            const coreDetails = [
                { key: 'project_id', label: 'Project ID' },
                { key: 'Title', label: 'Title' },
                { key: 'PI', label: 'Principal Investigator', value: piPerson ? piPerson['Full Name'] : 'N/A' },
                { key: 'Funder', label: 'Funder' },
                { key: 'customer_id', label: 'Customer', value: customer ? customer.customer_name : 'N/A' },
                { key: 'status_id', label: 'Status' },
                { key: 'Start_date', label: 'Start Date', type: 'date' },
                { key: 'End_date', label: 'End Date', type: 'date' },
                { key: 'Report_date', label: 'Report Date', type: 'date' },
                { key: 'description', label: 'Description' },
                { key: 'attachment', label: 'Attachment', type: 'file' }
            ];
            
            coreDetails.forEach(field => {
                let value = field.value !== undefined ? field.value : project[field.key];
                
                if (value !== null && value !== undefined && String(value).trim() !== '') {
                    if (field.type === 'file') {
                        value = 'File Available'; // Placeholder for attachment
                    } else if (field.type === 'date') {
                        try {
                            const dateObj = new Date(value);
                            value = isNaN(dateObj.getTime()) ? value : dateObj.toLocaleDateString();
                        } catch (e) { /* keep original value */ }
                    } else if (field.key === 'description' && String(value).length > 200) {
                        value = String(value).substring(0, 200) + '...'; // Truncate long descriptions
                    }

                    detailsHtml += `
                        <div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100">
                            <dt class="font-medium text-gray-500">${field.label}</dt>
                            <dd class="text-gray-900">${value}</dd>
                        </div>`;
                }
            });
            detailsHtml += `</div>`; // Close core details div

            // Related Samples
            if (samples && samples.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-4">
                        <button class="accordion-header" data-accordion="samples">
                            <span class="flex items-center"><i data-lucide="beaker" class="w-5 h-5 mr-2"></i> Samples (${samples.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${samples.map(s => `<li>${s.sample_id} (${s.sample_type})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Experiments
            if (experiments && experiments.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="experiments">
                            <span class="flex items-center"><i data-lucide="flask-round" class="w-5 h-5 mr-2"></i> Experiments (${experiments.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${experiments.map(e => `<li>${e.Experiment_title} (${e.Experiment_id})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Cruises
            if (cruises && cruises.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="cruises">
                            <span class="flex items-center"><i data-lucide="ship" class="w-5 h-5 mr-2"></i> Cruises (${cruises.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${cruises.map(c => `<li>${c.cruise_id} (${c.start_date ? new Date(c.start_date).toLocaleDateString() : 'N/A'})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Orders
            if (orders && orders.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="orders">
                            <span class="flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Orders (${orders.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${orders.map(o => `<li>${o.item} (Order: ${o.FI_Order_Nr})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="card p-6 h-full flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${project.Title}</h2>
                            <p class="text-sm text-gray-500">${project.project_id}</p>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto pr-2">
                        ${detailsHtml}
                    </div>
                </div>`;
            lucide.createIcons(); // Re-render icons for new content
            // Add event listeners for accordions
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    header.classList.toggle('active');
                    content.classList.toggle('open');
                    lucide.createIcons();
                });
            });
        }

        // --- NEW: Function to apply filters and sorting ---
        function applyFiltersAndSortProjects() {
            let tempArray = [...currentProjectsData]; // Start with the raw data

            // Apply filters
            for (const column in columnFilters) {
                const filterText = columnFilters[column];
                if (filterText) {
                    tempArray = tempArray.filter(project => 
                        String(project[column] || '').toLowerCase().includes(filterText)
                    );
                }
            }

            // Apply sorting
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();

                    // Handle date sorting if applicable
                    if (sortColumn.toLowerCase().includes('date')) {
                        const dateA = new Date(valA);
                        const dateB = new Date(valB);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; // Don't sort invalid dates
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    // Default to string comparison
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            filteredAndSortedProjects = tempArray;
            renderProjects(filteredAndSortedProjects);
            updateSortIcons(); // Update the visual sort indicators
        }

        // --- NEW: Function to update sort icons ---
        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => {
                const column = icon.closest('.sortable-header').dataset.column;
                icon.setAttribute('data-lucide', 'chevrons-up-down'); // Reset all to default icon
            });
            if (sortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${sortColumn}"] i`);
                if (currentSortIcon) {
                    currentSortIcon.setAttribute('data-lucide', sortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
                }
            }
            lucide.createIcons(); // Re-render icons after changing attributes
        }


        // --- MODAL LOGIC ---
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }
        
        async function showProjectModal(project = null) {
            const isEditing = project !== null;
            const [persons, statuses, customers] = await Promise.all([
                getReferenceData('personal'), 
                getReferenceData('status'),
                getReferenceData('customers', 'Lims')
            ]);

            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl transform transition-all -translate-y-10 opacity-0"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">${isEditing ? 'Edit' : 'Create'} Project</h2><button id="close-modal-btn">&times;</button></div><form id="project-form" class="space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-gray-700 text-sm font-bold mb-1">Project ID</label><input type="text" name="project_id" required class="w-full mt-1 p-2 border rounded" ${isEditing ? 'readonly class="bg-gray-100"' : ''} value="${project ? project.project_id : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Title</label><input type="text" name="Title" required class="w-full mt-1 p-2 border rounded" value="${project ? project.Title : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">PI</label><select name="PI" class="w-full mt-1 p-2 border rounded"><option value="">-- Select PI --</option>${persons ? persons.map(p => `<option value="${p.person_id}" ${project && project.PI === p.person_id ? 'selected' : ''}>${p['Full Name']}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Funder</label><input type="text" name="Funder" class="w-full mt-1 p-2 border rounded" value="${project ? project.Funder : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Customer</label><select name="customer_id" class="w-full mt-1 p-2 border rounded"><option value="">-- Select Customer --</option>${customers ? customers.map(c => `<option value="${c.customer_id}" ${project && project.customer_id === c.customer_id ? 'selected' : ''}>${c.customer_name}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Status</label><select name="status_id" class="w-full mt-1 p-2 border rounded">${statuses ? statuses.map(s => `<option value="${s.status_id}" ${project && project.status_id === s.status_id ? 'selected' : ''}>${s.description}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Attachment</label><input type="file" name="attachment" class="w-full mt-1 p-2 border rounded file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Start Date</label><input type="date" name="Start_date" class="w-full mt-1 p-2 border rounded" value="${project && project.Start_date ? project.Start_date.split('T')[0] : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">End Date</label><input type="date" name="End_date" class="w-full mt-1 p-2 border rounded" value="${project && project.End_date ? project.End_date.split('T')[0] : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Report Date</label><input type="date" name="Report_date" class="w-full mt-1 p-2 border rounded" value="${project && project.Report_date ? project.Report_date.split('T')[0] : ''}"></div><div class="md:col-span-2"><label class="block text-gray-700 text-sm font-bold mb-1">Description</label><textarea name="description" class="w-full mt-1 p-2 border rounded h-24">${project ? project.description : ''}</textarea></div></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div></form></div></div>`;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('project-form').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const isEditing = project !== null;
                const method = isEditing ? 'PUT' : 'POST';
                const endpoint = isEditing ? `table/Lims/projects/${project.project_id}` : 'table/Lims/projects';
                
                let body;
                if (isEditing) {
                    // For PUT, convert FormData to a plain object. Exclude attachment if not changed.
                    body = {};
                    formData.forEach((value, key) => {
                        if (key !== 'attachment') { // Always add non-attachment fields
                            body[key] = value;
                        }
                    });
                    const attachmentInput = e.target.querySelector('input[name="attachment"]');
                    if (attachmentInput && attachmentInput.files.length > 0) {
                        // If a new file is selected, inform the user about the limitation
                        alert("File uploads on existing projects are not directly supported via PUT in this generic form. Please create a new entry if the attachment must be changed or contact support.");
                        // Do NOT include attachment in the PUT body for this simple setup
                    }
                } else {
                    // For POST (new project), send FormData directly to handle file upload
                    body = formData;
                }

                const result = await apiFetch(endpoint, { method, body });
                if (result && !result.error) { 
                    closeModal(); 
                    // Re-initialize the page, passing the selected project ID to re-select it if editing
                    initializeProjectsPage(isEditing ? project.project_id : null); 
                } else { 
                    alert('Failed to save project: ' + (result ? result.error : 'Unknown error')); 
                }
            };
        }
        
        // --- INITIALIZATION ---
        function addProjectListActionListeners(projects) {
            document.querySelectorAll('.project-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return; 
                    document.querySelectorAll('.project-row').forEach(r => r.classList.remove('table-row-selected'));
                    row.classList.add('table-row-selected');
                    renderProjectDetails(row.dataset.projectId);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation();
                const projectId = e.currentTarget.dataset.projectId;
                const project = currentProjectsData.find(p => p.project_id == projectId); // Find from raw data
                if (project) {
                    showProjectModal(project);
                }
            }));

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async e => {
                e.stopPropagation();
                const projectId = e.currentTarget.dataset.projectId;
                const project = currentProjectsData.find(p => p.project_id == projectId); // Find from raw data
                if(project && confirm(`Are you sure you want to delete project: ${project.Title}? This cannot be undone.`)){
                    const result = await apiFetch(`table/Lims/projects/${project.project_id}`, { method: 'DELETE' });
                    if(result.success) {
                        // Clear the cache for projects, so it re-fetches the updated list
                        masterCache['Lims.projects'] = null; 
                        initializeProjectsPage(); // Reload the page
                        document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                        lucide.createIcons();
                    } else alert('Failed to delete project: ' + (result ? result.error : 'Unknown error'));
                }
            }));
        }

        async function initializeProjectsPage(selectedProjectId = null) {
            // Clear existing filter/sort state
            sortColumn = 'Title';
            sortDirection = 'asc';
            columnFilters = {};
            
            const projects = await getReferenceData('projects', 'Lims'); // Corrected to 'projects'
            if(projects && !projects.error) {
                currentProjectsData = projects; // Store the raw data
                // Populate filter inputs if there are any persisted values (though we reset them on page load for now)
                document.querySelectorAll('.filter-input').forEach(input => {
                    input.value = columnFilters[input.dataset.column] || '';
                });

                // Add event listeners for sorting and filtering headers
                document.querySelectorAll('.sortable-header').forEach(header => {
                    header.addEventListener('click', (e) => {
                        const column = e.currentTarget.dataset.column;
                        if (sortColumn === column) {
                            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                        } else {
                            sortColumn = column;
                            sortDirection = 'asc';
                        }
                        applyFiltersAndSortProjects();
                    });
                });

                document.querySelectorAll('.filter-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const column = e.target.dataset.column;
                        columnFilters[column] = e.target.value.toLowerCase();
                        applyFiltersAndSortProjects();
                    });
                });

                applyFiltersAndSortProjects(); // Apply initial sort and filters

                if (selectedProjectId) {
                    // Give a small delay to ensure rows are rendered before trying to select
                    setTimeout(() => {
                        const row = document.querySelector(`.project-row[data-project-id="${selectedProjectId}"]`);
                        if (row) {
                            row.classList.add('table-row-selected');
                            renderProjectDetails(selectedProjectId);
                        }
                    }, 50);
                } else {
                     // If no specific project is selected, clear details panel
                     document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                     lucide.createIcons();
                }

            } else {
                document.getElementById('projects-table').innerHTML = `<tr><td colspan="4" class="text-center text-red-500 p-4">Error loading projects: ${projects ? projects.error : 'Unknown API error'}</td></tr>`;
            }
            document.getElementById('new-project-btn').addEventListener('click', () => showProjectModal());
        }
    </script>
</body>
</html>
