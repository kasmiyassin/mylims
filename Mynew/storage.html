<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { z-index: 50; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .table-row-selected { background-color: #eef2ff !important; }
        .sortable-header { cursor: pointer; position: relative; display: flex; align-items: center; justify-content: space-between; }
        .sortable-header .sort-icon { margin-left: 4px; vertical-align: middle; font-size: 0.8em; }
        .filter-input {
            width: calc(100% - 10px);
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        /* Accordion styles for details panel */
        .accordion-item {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
        }
        .accordion-header:hover {
            background-color: #e2e8f0;
        }
        .accordion-header .lucide {
            transition: transform 0.3s ease;
        }
        .accordion-header.active .lucide {
            transform: rotate(180deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 1rem; /* Initial padding, will expand */
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        .accordion-content.open {
            max-height: 500px; /* Adjust as needed for content height */
            padding: 1rem;
        }
    </style>
</head>
<body>

            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI</span></div>
            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="map-pin" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="book-text" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md active"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>

            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Storage Inventory</h1>
                <div class="flex space-x-2">
                    <button id="bulk-update-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="edit" class="w-5 h-5 mr-2"></i>Bulk Update</button>
                    <button id="bulk-import-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Bulk Import</button>
                    <button id="new-storage-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Storage Unit</button>
                </div>
            </div>

            <div class="card p-4">
                    <div class="overflow-y-auto h-[75vh]"> <table class="min-w-full text-sm">
                            <thead class="bg-gray-50 sticky top-0">
                                <tr>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="storage_id">
                                            <span>Storage ID</span>

                                        </div>

                                    </th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="room_id">
                                            <span>Room</span>
                                            <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                        </div>
                                        <input type="text" placeholder="Filter Room..." class="filter-input" data-column="room_id">
                                    </th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="freezer">
                                            <span>Freezer</span>
                                            <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                        </div>
                                        <input type="text" placeholder="Filter Freezer..." class="filter-input" data-column="freezer">
                                    </th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="box">
                                            <span>Box</span>
                                            <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                        </div>
                                        <input type="text" placeholder="Filter Box..." class="filter-input" data-column="box">
                                    </th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="temperature_c">
                                            <span>Temp (°C)</span>
                                            <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                        </div>
                                        <input type="text" placeholder="Filter Temp..." class="filter-input" data-column="temperature_c">
                                    </th>

                                        </div>
                                        <input type="text" placeholder="Filter %..." class="filter-input" data-column="occupancy_percent">

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api';
        let currentViewData = []; // Stores the raw data for the currently displayed table (Storage_Occupancy_View)
        let referenceDataCache = {}; // Cache for all fetched reference data (e.g., rooms, projects)
        const currentTableName = 'storage'; // Base table for CRUD
        const currentSchema = 'Lab'; // Schema for base table
        let parsedUploadData = []; // Data parsed from bulk upload file
        let currentSortColumn = 'storage_id';
        let currentSortDirection = 'asc';
        let columnFilters = {};

        // Primary Key mapping for Lab.storage (consistent with app.py)
        const primaryKeyMap = {
            'storage': 'storage_id'
        };

        // Comprehensive Foreign Key Mapping for dynamic form generation
        const foreignKeyMap = {
            'room_id': { schema: 'Reference', table: 'room', valueCol: 'room_id', displayCol: 'room_id' },
            'project_id': { schema: 'Lims', table: 'projects', valueCol: 'project_id', displayCol: 'title' },
            'status_id': { schema: 'Reference', table: 'status', valueCol: 'status_id', displayCol: 'status_id' },
            'temperature_unit_id': { schema: 'Reference', table: 'units', valueCol: 'unit_id', displayCol: 'unit_abbreviation' },
            'notes': { type: 'textarea' }, // Explicitly define notes as textarea
            'attachment': { type: 'file' }, // Attachment field
        };

        // Storable item types for listing contents in details panel
        const storableItemTables = [
            { schema: 'Lab', table: 'samples', idColumn: 'sample_id', pk: ['sample_id', 'sampling_date'] }, // Samples is partitioned
            { schema: 'Lab', table: 'reagents', idColumn: 'reagent_id', pk: 'reagent_id' },
            // Add other tables that can be stored and have storage_id and storage_position
            { schema: 'Lab', table: 'fish', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'tissue', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'water', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'sediments', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'dna', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'rna', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'library', idColumn: 'library_id', pk: 'library_id' },
            { schema: 'Lab', table: 'pcr', idColumn: 'pcr_id', pk: 'pcr_id' },
            { schema: 'Lab', table: 'qpcr', idColumn: 'qpcr_id', pk: 'qpcr_id' },
            { schema: 'Lab', table: 'gelelectrophoresis', idColumn: 'gelelectrophoresis_id', pk: 'gelelectrophoresis_id' },
            { schema: 'Lab', table: 'extraction', idColumn: 'extraction_id', pk: 'extraction_id' },
            { schema: 'Lab', table: 'nanodrop', idColumn: 'nanodrop_id', pk: 'nanodrop_id' },
            { schema: 'Lab', table: 'qubit', idColumn: 'qubit_id', pk: 'qubit_id' },
            { schema: 'Lab', table: 'tapestation', idColumn: 'tapestation_id', pk: 'tapestation_id' },
            { schema: 'Lab', table: 'sequencing', idColumn: 'sequencing_id', pk: 'sequencing_id' },
            { schema: 'Bioinformatics', table: 'analysis_runs', idColumn: 'run_id', pk: 'run_id' },
        ];


        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.full_name || user.person_id}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializePage();
        });

        async function apiFetch(endpoint, options = {}) {
            try {
                const isFormData = options.body instanceof FormData;
                if (!isFormData && options.body !== undefined) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const errText = await response.text();
                    try { 
                        const errJson = JSON.parse(errText); 
                        throw new Error(errJson.error || `Server Error: ${response.status}`);
                    } catch { 
                        throw new Error(errText || `Server Error: ${response.status}`);
                    }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return await response.json();
            } catch (error) { 
                console.error("API Error:", error); 
                return { error: error.message }; 
            }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (referenceDataCache[cacheKey]) return referenceDataCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) referenceDataCache[cacheKey] = data;
            return data;
        }

        function getPkColumnName(tableName) {
            return primaryKeyMap[tableName] || 'id';
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => { container.innerHTML = ''; parsedUploadData = []; }, 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        async function loadView() {
            const tableBody = document.getElementById('storage-table-body');
            tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 py-8">Loading storage units...</td></tr>`;

            const result = await apiFetch(`table/Lab/Storage_Occupancy_View`);
            if (result.error || !Array.isArray(result)) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-red-500 py-8">Error loading data: ${result.error}</td></tr>`;
                return;
            }
            currentViewData = result;
            
            // Initial render with default sort and filters
            applyFiltersAndSort();
        }

        function renderTable(dataToDisplay) {
            const tableBody = document.getElementById('storage-table-body');
            if (!dataToDisplay || dataToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 py-8">No storage units found matching filters.</td></tr>`;
                return;
            }

            tableBody.innerHTML = dataToDisplay.map(row => `
                <tr class="hover:bg-gray-50 cursor-pointer storage-row" data-pk="${row.storage_id}">
                    <td class="px-4 py-3 font-medium text-gray-900">${row.storage_id}</td>
                    <td class="px-4 py-3">${row.room_id || 'N/A'}</td>
                    <td class="px-4 py-3">${row.freezer || 'N/A'}</td>
                    <td class="px-4 py-3">${row.box || 'N/A'}</td>
                    <td class="px-4 py-3">${row.temperature_c !== null ? `${row.temperature_c}°C` : 'N/A'}</td>
                    <td class="px-4 py-3">${row.occupancy_percent !== null ? `${row.occupancy_percent}%` : 'N/A'}</td>
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-pk="${row.storage_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-pk="${row.storage_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('');
            
            lucide.createIcons();
            addActionListeners();
        }

        function applyFiltersAndSort() {
            let tempArray = [...currentViewData]; // Start with the raw data

            // Apply filters
            document.querySelectorAll('.filter-input').forEach(input => {
                const column = input.dataset.column;
                const filterText = input.value.toLowerCase();
                columnFilters[column] = filterText; // Store current filter value

                if (filterText) {
                    tempArray = tempArray.filter(item => 
                        String(item[column] || '').toLowerCase().includes(filterText)
                    );
                }
            });

            // Apply sorting
            if (currentSortColumn) {
                tempArray.sort((a, b) => {
                    const valA = a[currentSortColumn];
                    const valB = b[currentSortColumn];

                    let comparison = 0;
                    if (typeof valA === 'number' && typeof valB === 'number') {
                        comparison = valA - valB;
                    } else {
                        const stringA = String(valA || '').toLowerCase();
                        const stringB = String(valB || '').toLowerCase();
                        comparison = stringA.localeCompare(stringB, undefined, { sensitivity: 'base' });
                    }
                    return currentSortDirection === 'asc' ? comparison : -comparison;
                });
            }

            filteredAndSortedData = tempArray;
            renderTable(filteredAndSortedData);
            updateSortIcons();
        }

        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => {
                const column = icon.closest('.sortable-header').dataset.column;
                icon.setAttribute('data-lucide', 'chevrons-up-down');
            });
            if (currentSortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${currentSortColumn}"] i`);
                if (currentSortIcon) {
                    currentSortIcon.setAttribute('data-lucide', currentSortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
                }
            }
            lucide.createIcons();
        }
        
        async function renderDetails(storageId) {
            const container = document.getElementById('project-details-container'); // Reusing this ID from projects.html
            container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><div class="loading-spinner"></div> Loading storage details...</div></div>`;
            lucide.createIcons();

            const storageUnit = currentViewData.find(s => s.storage_id === storageId);
            if (!storageUnit) { 
                container.innerHTML = `<div class="card p-6 text-red-500">Error: Storage unit details not found.</div>`; 
                return; 
            }

            // Fetch related data for details panel
            const [
                room, project, status, temperatureUnit,
                allStoredItems // All items that have a storage_id
            ] = await Promise.all([
                storageUnit.room_id ? getReferenceData('room').then(data => data.find(r => r.room_id === storageUnit.room_id)) : Promise.resolve(null),
                storageUnit.project_id ? getReferenceData('projects', 'Lims').then(data => data.find(p => p.project_id === storageUnit.project_id)) : Promise.resolve(null),
                storageUnit.status_id ? getReferenceData('status').then(data => data.find(s => s.status_id === storageUnit.status_id)) : Promise.resolve(null),
                storageUnit.temperature_unit_id ? getReferenceData('units').then(data => data.find(u => u.unit_id === storageUnit.temperature_unit_id)) : Promise.resolve(null),
                // Fetch all storable items and filter by this storage_id
                (async () => {
                    const allItemsPromises = storableItemTables.map(async itemType => {
                        const items = await apiFetch(`table/${itemType.schema}/${itemType.table}?filter_storage_id=${storageId}`);
                        if (items.error || !Array.isArray(items)) {
                            console.error(`Failed to load stored items from ${itemType.table}:`, items?.error);
                            return [];
                        }
                        return items.map(item => ({
                            ...item,
                            item_type: itemType.table, // Store original table name as item_type
                            display_id: item[itemType.idColumn] || item.sample_id || item.reagent_id || 'N/A', // Prioritize sample_id/reagent_id
                            pk_value: Array.isArray(itemType.pk) ? itemType.pk.map(col => item[col]).join('|') : item[itemType.pk],
                            pk_columns: itemType.pk,
                            item_schema: itemType.schema
                        }));
                    });
                    const results = await Promise.all(allItemsPromises);
                    return results.flat().filter(item => item.storage_id === storageId); // Final filter for exact match
                })()
            ]);

            // Helper to render a detail row if value exists
            const renderDetailRow = (label, value) => {
                if (value === null || value === undefined || String(value).trim() === '' || value === 'N/A') {
                    return '';
                }
                return `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${label}</dt><dd class="text-gray-900 break-all">${value}</dd></div>`;
            };

            // Helper to format date strings
            const formatDate = (dateString) => {
                if (!dateString) return 'N/A';
                try {
                    const date = new Date(dateString);
                    return isNaN(date.getTime()) ? 'N/A' : date.toLocaleDateString();
                } catch (e) {
                    return 'N/A';
                }
            };

            let detailsHtml = `<div class="space-y-3 text-sm">`;
            
            // Core Information Accordion
            detailsHtml += `
                <div class="accordion-item">
                    <button class="accordion-header" data-accordion="core-info">
                        <span class="flex items-center"><i data-lucide="info" class="w-5 h-5 mr-2"></i> Core Information</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                    </button>
                    <div class="accordion-content open">
                        <dl class="space-y-2 py-2">
                            ${renderDetailRow('Storage ID', storageUnit.storage_id)}
                            ${renderDetailRow('Room', room ? `${room.description} (${room.room_id})` : storageUnit.room_id || 'N/A')}
                            ${renderDetailRow('Freezer', storageUnit.freezer)}
                            ${renderDetailRow('Etage', storageUnit.etage)}
                            ${renderDetailRow('Temperature', storageUnit.temperature_c ? `${storageUnit.temperature_c}°C` : 'N/A')}
                            ${renderDetailRow('Box Name', storageUnit.box)}
                            ${renderDetailRow('Box Size X', storageUnit.box_size_x)}
                            ${renderDetailRow('Box Size Y', storageUnit.box_size_y)}
                            ${renderDetailRow('Position Format', storageUnit.storage_position_format)}
                            ${renderDetailRow('Project', project ? `${project.title} (${project.project_id})` : storageUnit.project_id || 'N/A')}
                            ${renderDetailRow('Status', status ? `${status.status_id}` : storageUnit.status_id || 'N/A')}

        function addActionListeners() {
            document.querySelectorAll('.storage-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return; 
                    document.querySelectorAll('.storage-row').forEach(r => r.classList.remove('table-row-selected'));

                    renderDetails(row.dataset.pk);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation();
                const storageId = e.currentTarget.dataset.pk;
                const storageUnit = currentViewData.find(s => s.storage_id === storageId);
                if (storageUnit) {
                    showStorageModal(storageUnit);
                }
            }));

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async e => {
                e.stopPropagation();
                const storageId = e.currentTarget.dataset.pk;
                const storageUnit = currentViewData.find(s => s.storage_id === storageId);
                
                if(storageUnit && confirm(`Are you sure you want to delete storage unit: ${storageUnit.storage_id} (${storageUnit.box})? This cannot be undone.`)){
                    // Check if there are any items in this storage unit before deleting
                    const storedItems = await Promise.all(storableItemTables.map(async itemType => {
                        const items = await apiFetch(`table/${itemType.schema}/${itemType.table}?filter_storage_id=${storageId}`);
                        return items.error ? [] : items;
                    })).then(results => results.flat());

                    if (storedItems.length > 0) {
                        alert(`Cannot delete storage unit ${storageId} because it still contains ${storedItems.length} items. Please unassign all items first.`);
                        return;
                    }

                    const result = await apiFetch(`table/${currentSchema}/${currentTableName}/${storageId}`, { method: 'DELETE' });
                    if(result.success) {
                        alert('Storage unit deleted successfully!');
                        currentViewData = []; // Clear cache to force refresh

        async function showStorageModal(storageUnit = null) {
            const isEditing = storageUnit !== null;
            const [rooms, projects, statuses, units] = await Promise.all([
                getReferenceData('room'), 
                getReferenceData('projects', 'Lims'), 
                getReferenceData('status'),
                getReferenceData('units')
            ]);

            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-lg transform transition-all -translate-y-10 opacity-0"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">${isEditing ? 'Edit' : 'New'} Storage Unit</h2><button id="close-modal-btn">&times;</button></div><form id="storage-form" class="space-y-4"><div id="dynamic-fields-container" class="max-h-[60vh] overflow-y-auto p-4 rounded-md bg-gray-50 border"></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div></form></div></div>`;
            const { closeModal } = showModal(modalHTML);

            await renderFormFields(storageUnit, rooms, projects, statuses, units);

            document.getElementById('storage-form').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = {};
                for (const [key, value] of formData.entries()) {
                    if (key === 'attachment') {
                        data[key] = value.size > 0 ? value : null;
                    } else {
                        data[key] = value === '' ? null : value;
                    }
                }

                const user = JSON.parse(sessionStorage.getItem('user')) || {};
                data.modified_by = user.person_id;
                if (!isEditing) {
                    data.created_by = user.person_id;
                }

                // Handle new room creation if selected
                if (data.room_id === '__NEW_ROOM__') {
                    if (!data.new_room_id) {
                        alert('Please provide a New Room ID.');
                        return;
                    }
                    const newRoomData = {
                        room_id: data.new_room_id,
                        description: data.new_room_description || null
                    };
                    const roomCreateResult = await apiFetch('create_if_not_exists/Reference/room', {
                        method: 'POST',
                        body: newRoomData
                    });

                    if (roomCreateResult.error) {
                        alert('Failed to create new room: ' + roomCreateResult.error);
                        return;
                    }
                    data.room_id = data.new_room_id; // Use the newly created room ID
                }

                let result;
                if (data.attachment instanceof File) {
                    const formDataWithFile = new FormData();
                    for (const key in data) {
                        if (data[key] !== null) {
                            formDataWithFile.append(key, data[key]);
                        }
                    }
                    result = await apiFetch(isEditing ? `table/Lab/storage/${storageUnit.storage_id}` : `table/Lab/storage`, { method: isEditing ? 'PUT' : 'POST', body: formDataWithFile });
                } else {
                    result = await apiFetch(isEditing ? `table/Lab/storage/${storageUnit.storage_id}` : `table/Lab/storage`, { method: isEditing ? 'PUT' : 'POST', body: data });
                }

                if (result && !result.error) {
                    closeModal();
                    masterCache['Lab.storage'] = null; // Invalidate cache
                    loadView(); // Reload the page
                } else {
                    alert('Failed to save storage unit: ' + (result ? result.error : 'Unknown error'));
                }
            };
        }

            const container = document.getElementById('dynamic-fields-container');

            const schemaInfo = await apiFetch(`table/Lab/storage/info`);

                container.innerHTML = `<p class="text-red-500 p-4">Error loading schema for storage: ${schemaInfo.error}</p>`;
                return;
            }

            const columns = schemaInfo.columns;
            
            let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">';
            const ignoredFormCols = ['nr', 'id', 'modified_by', 'time_modification', 'attachment'];
            const isEditing = storageUnit !== null;

            for (const col of columns) {
                const colName = col.name;
                if (ignoredFormCols.includes(colName)) continue;
                
                const value = storageUnit ? (storageUnit[colName] === null ? '' : storageUnit[colName]) : '';
                const formattedLabel = colName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let field = '';
                const isReadOnly = isEditing && colName === 'storage_id'; // storage_id is PK, make readonly on edit

                const fkConfig = foreignKeyMap[colName];

                if (fkConfig) {
                    if (colName === 'room_id') { // Special handling for room_id to allow new room creation
                        field = `<select name="${colName}" id="${colName}" class="w-full mt-1 p-2 border rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>
                                    <option value="">-- Select Room --</option>
                                    ${rooms.map(r => `<option value="${r.room_id}" ${value == r.room_id ? 'selected' : ''}>${r.description || r.room_id}</option>`).join('')}
                                    <option value="__NEW_ROOM__">-- Create New Room --</option>

                                    <input type="text" id="new_room_id" name="new_room_id" placeholder="New Room ID (e.g., Lab01)" class="block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${value === '__NEW_ROOM__' ? 'required' : ''}>
                                    <input type="text" id="new_room_description" name="new_room_description" placeholder="New Room Description (optional)" class="block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                                </div>`;
                    } else if (fkConfig.type === 'file') { // Attachment
                        field = `<input type="file" name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''}>`;
                    } else { // Standard FK dropdowns
                        const refData = await getReferenceData(fkConfig.table, fkConfig.schema);
                        if (refData && !refData.error) {
                            field = `<select name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'disabled' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>
                                        <option value="">-- Select --</option>
                                        ${refData.map(r => `<option value="${r[fkConfig.valueCol]}" ${value == r[fkConfig.valueCol] ? 'selected' : ''}>${r[fkConfig.displayCol] || r[fkConfig.valueCol]}</option>`).join('')}
                                    </select>`;
                        } else {
                            field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm bg-red-100" placeholder="Error loading options" ${isReadOnly ? 'readonly' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                        }
                    }
                } else if (col.type === 'date' || col.type === 'timestamp without time zone' || col.type === 'timestamptz') {
                    field = `<input type="date" name="${colName}" value="${value ? String(value).split('T')[0] : ''}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                } else if (col.type === 'text' && (colName.toLowerCase().includes('notes') || colName.toLowerCase().includes('description'))) {
                    field = `<textarea name="${colName}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>${value}</textarea>`;
                } else if (col.type === 'integer' || col.type === 'numeric' || col.type === 'bigint') {
                    field = `<input type="number" step="any" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                } else if (col.type === 'boolean') {
                    field = `<input type="checkbox" name="${colName}" class="mt-1 h-4 w-4 rounded" ${value ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}>`;
                }
                else { // Default to text input
                    field = `<input type="text" name="${colName}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''} ${col.is_nullable === 'NO' ? 'required' : ''}>`;
                }
                fieldsHtml += `<div><label class="font-medium text-sm text-gray-700">${formattedLabel}</label>${field}</div>`;
            }
            fieldsHtml += '</div>';
            container.innerHTML = fieldsHtml;

            // Add event listener for the new room selection
            const roomSelect = document.getElementById('room_id');
            if (roomSelect) {
                roomSelect.addEventListener('change', () => {
                    const newRoomFieldsDiv = document.getElementById('new-room-fields');
                    const newRoomIdInput = document.getElementById('new_room_id');
                    if (roomSelect.value === '__NEW_ROOM__') {
                        newRoomFieldsDiv.classList.remove('hidden');

                        newRoomIdInput.removeAttribute('required');

            }

        async function generateAndDownloadTemplate(isUpdate) {
            const schemaInfo = await apiFetch(`table/${currentSchema}/${currentTableName}/info`);
            
            if (schemaInfo.error || !schemaInfo.columns) {
                alert('Could not determine table schema to generate template.');
                return;
            }
            
            let headers = schemaInfo.columns.map(col => col.name);
            const pkColumn = getPkColumnName(currentTableName);

            // Filter out internal/calculated fields for the template
            headers = headers.filter(key => 
                !['nr', 'id', 'attachment', 'password_hash', 'search_vector', 'created_at', 'modified_by', 'time_modification'].includes(key) && 
                !key.endsWith('_ug') // Exclude generated columns like total_dna_ug
            );

            if (isUpdate) {
                // For update template, primary key(s) are essential and should be first
                if (Array.isArray(pkColumn)) {
                    headers = headers.filter(h => !pkColumn.includes(h));
                    headers = [...pkColumn, ...headers];
                } else {
                    headers = headers.filter(h => h !== pkColumn);
                    headers.unshift(pkColumn);
                }
            } else {
                // For new import, auto-generated PKs should be excluded from template
                if (Array.isArray(pkColumn)) {
                    headers = headers.filter(h => !pkColumn.includes(h));
                } else {
                    const isAutoGeneratedPk = ['storage_id'].includes(pkColumn); // storage_id is NOT auto-generated, but user-defined PK
                    if (isAutoGeneratedPk) { // If it were auto-generated, we'd filter it out. But for storage_id, keep it for user input.
                        // headers = headers.filter(h => h !== pkColumn); // This line is commented out as storage_id is user-defined
                    }
                }
            }
            
            const csvContent = headers.join(';'); // Use semicolon for CSV
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' }); // Add BOM for Excel compatibility
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `${currentTableName}_${isUpdate ? 'update' : 'import'}_template.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleFileSelect(event, isUpdate) {
            const file = event.target.files[0];
            if (!file) return;
            const previewContainer = document.getElementById('preview-container');
            const actionButton = document.getElementById('action-data-btn');
            previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
            actionButton.disabled = true;
            
            const onParseComplete = (results) => {
                if(results.errors.length > 0) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                    return;
                }
                parsedUploadData = results.data;
                const pkCol = getPkColumnName(currentTableName);
                if (isUpdate && (parsedUploadData.length === 0 || !parsedUploadData[0].hasOwnProperty(Array.isArray(pkCol) ? pkCol[0] : pkCol))) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: For bulk update, the file must contain data and include the primary key column(s) (e.g., '${Array.isArray(pkCol) ? pkCol.join(', ') : pkCol}').</p>`;
                    return;
                }
                displayPreview(parsedUploadData);
                actionButton.disabled = false;
            };

            if (file.name.endsWith('.csv')) {
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        onParseComplete({ data: jsonData, errors: [] });
                    } catch (err) {
                        previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Error processing Excel file: ${err.message}</p>`;
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Unsupported file type. Please upload .csv or .xlsx.</p>`;
            }
        }

        function displayPreview(data) {
            if (!data || data.length === 0) {
                document.getElementById('preview-container').innerHTML = '<p class="text-red-500 text-center p-4">No data found in file.</p>';
                return;
            }
            const headers = Object.keys(data[0]);
            const previewHtml = `
                <p class="text-sm font-medium p-2">Found ${parsedUploadData.length} records. Showing preview:</p>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100"><tr>${headers.map(h => `<th class="px-2 py-1 text-left font-medium text-gray-600">${h}</th>`).join('')}</tr></thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${data.slice(0, 5).map(row => `<tr>${headers.map(h => `<td class="px-2 py-1 whitespace-nowrap truncate max-w-[100px]">${row[h] || ''}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                </table>`;
            document.getElementById('preview-container').innerHTML = previewHtml;
        }

        async function handleBulkImport(closeModal) {
            if (parsedUploadData.length === 0) { alert('No data to upload.'); return; }
            
            const uploadBtn = document.getElementById('action-data-btn');
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Uploading...';
            lucide.createIcons();
            
            document.getElementById('bulk-operation-progress').classList.remove('hidden');
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedRecords = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};

            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            logMessage(`Starting bulk import for ${parsedUploadData.length} records into ${currentSchema}.${currentTableName}...`);

            for (const row of parsedUploadData) {
                // Add created_by to each row before sending
                const dataToInsert = { ...row, created_by: user.person_id };
                logMessage(`Inserting record...`);
                const result = await apiFetch(`table/${currentSchema}/${currentTableName}`, { method: 'POST', body: dataToInsert });
                
                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedRecords.push(JSON.stringify(row));
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }

            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Bulk import complete.`, 'text-blue-400 font-bold');
            logMessage(`Successful: ${successCount}`, 'text-green-400');
            logMessage(`Failed: ${failCount}`, 'text-red-400');
            if(failedRecords.length > 0) {
                 logMessage(`Failed rows (first 5): ${failedRecords.slice(0,5).join('; ')}`);
            }

            currentViewData = []; // Clear cache to force re-fetch
            loadView(); // Reload the page
            
            uploadBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mr-2"></i>Finished';
            uploadBtn.onclick = closeModal; // Change button to close modal
            uploadBtn.disabled = false;
            lucide.createIcons();
        }

        async function handleBulkUpdate(closeModal) {
            if (parsedUploadData.length === 0) { alert('No data to update.'); return; }
            
            const updateBtn = document.getElementById('action-data-btn');
            updateBtn.disabled = true;
            updateBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Updating...';
            lucide.createIcons();

            document.getElementById('bulk-operation-progress').classList.remove('hidden');
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedRecords = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};

            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            logMessage(`Starting bulk update for ${parsedUploadData.length} records in ${currentSchema}.${currentTableName}...`);

            const pkColumn = getPkColumnName(currentTableName);

            for (const row of parsedUploadData) {
                let pkIdentifier = ''; // For logging purposes
                let endpoint = `table/${currentSchema}/${currentTableName}/`;
                const payload = { ...row };
                
                if (Array.isArray(pkColumn)) {
                    // Construct PK for URL and remove from payload
                    const pkValues = pkColumn.map(col => row[col]);
                    if (!pkValues.every(val => val !== undefined && val !== null)) {
                        logMessage(`Skipping row: Missing one or more primary key columns (${pkColumn.join(', ')}): ${JSON.stringify(row)}`, 'text-yellow-400');
                        failCount++;
                        continue;
                    }
                    pkIdentifier = pkValues.join('|'); // For URL and logging
                    endpoint += pkValues[0]; // First part of composite PK for URL path

                    // Add remaining PK parts as query parameters for PUT
                    for (let i = 1; i < pkColumn.length; i++) {
                        endpoint += `${i === 1 ? '?' : '&'}${pkColumn[i]}=${pkValues[i]}`;
                    }
                    pkColumn.forEach(col => delete payload[col]); // Remove PKs from payload
                } else { // Single PK
                    pkIdentifier = row[pkColumn];
                    if (!pkIdentifier) {
                        logMessage(`Skipping row: Missing primary key column '${pkColumn}': ${JSON.stringify(row)}`, 'text-yellow-400');
                        failCount++;
                        continue;
                    }
                    endpoint += pkIdentifier;
                    delete payload[pkColumn]; // Remove PK from payload
                }
                
                payload.modified_by = user.person_id; // Add modified_by

                logMessage(`Updating ${pkIdentifier}...`);
                const result = await apiFetch(endpoint, { method: 'PUT', body: payload });
                
                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedRecords.push(`${pkIdentifier}: ${result.error}`);
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }

            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Bulk update complete.`, 'text-blue-400 font-bold');
            logMessage(`Successful: ${successCount}`, 'text-green-400');
            logMessage(`Failed: ${failCount}`, 'text-red-400');
            if(failedRecords.length > 0) {
                 logMessage(`Failed IDs: ${failedRecords.join(', ')}`);
            }

            currentViewData = []; // Clear cache to force re-fetch
            await loadView(); // Reload the page
            
            updateBtn.innerHTML = '<i data-lucide="x" class="w-5 h-5 mr-2"></i>Close';
            updateBtn.onclick = closeModal;
            updateBtn.disabled = false;
            lucide.createIcons();
        }


    function initializePage() {
        loadView();
        document.getElementById('new-item-btn').addEventListener('click', () => showNewItemModal());
        document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkImportModal());
        document.getElementById('bulk-update-btn').addEventListener('click', () => showBulkUpdateModal());
    }
</script>
</body>
