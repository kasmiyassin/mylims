    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 50; }
        .table-row-selected { background-color: #eef2ff !important; }

        /* New styles for filter/sort */
        .sortable-header { 
            cursor: pointer; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 8px; 
        }
        .sortable-header:hover { background-color: #e2e8f0; }
        .sort-icon { display: inline-block; width: 16px; height: 16px; vertical-align: middle; margin-left: 4px; flex-shrink: 0; }
        .filter-input {
            width: calc(100% - 10px);
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        /* Accordion styles for details panel */
        .accordion-item {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
        }
        .accordion-header:hover {
            background-color: #e2e8f0;
        }
        .accordion-header .lucide {
            transition: transform 0.3s ease;
        }
        .accordion-header.active .lucide {
            transform: rotate(180deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 1rem; /* Initial padding, will expand */
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        .accordion-content.open {
            max-height: 500px; /* Adjust as needed for content height */
            padding: 1rem;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // --- AUTH & SETUP ---
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api'; 
        let masterCache = {}; // Cache for all fetched reference data
        let currentProjectsData = []; // Stores the raw projects data from the API
        let filteredAndSortedProjects = []; // Stores projects after applying filters and sorts
        
        // State for sorting and filtering projects
        let sortColumn = 'project_id'; // Default sort column
        let sortDirection = 'asc'; // Default sort direction
        let columnFilters = {}; // { 'columnName': 'filterText' }

        // Primary Key mapping for Lims.projects (consistent with app.py)
        const primaryKeyMap = {
            'projects': 'project_id'
        };

        // Comprehensive Foreign Key Mapping for dynamic form generation
        // Maps a column name to its reference table, value column, and display column.
        const foreignKeyMap = {
            'pi_person_id': { schema: 'Reference', table: 'personal', valueCol: 'person_id', displayCol: 'full_name' },
            'status_id': { schema: 'Reference', table: 'status', valueCol: 'status_id', displayCol: 'status_id' },
            'customer_id': { schema: 'Lims', table: 'customers', valueCol: 'customer_id', displayCol: 'customer_name' },
            // For project_persons table (if editing/adding via project form)
            'person_id': { schema: 'Reference', table: 'personal', valueCol: 'person_id', displayCol: 'full_name' },
            // For other related tables, their FKs are handled when fetching their specific data
        };

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.full_name || user.person_id}</p>`; 
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializeProjectsPage();
        });

        // --- API & DATA HANDLING ---
        async function apiFetch(endpoint, options = {}) {
            try {
                const isFormData = options.body instanceof FormData;
                if (!isFormData && options.body !== undefined) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const errText = await response.text();
                    try { const errJson = JSON.parse(errText); throw new Error(errJson.error || 'API request failed'); }
                    catch { throw new Error(errText); }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema = 'Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey]) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        // Function to determine the primary key column name(s) for a given table
        function getPkColumnName(tableName) {
            return primaryKeyMap[tableName] || 'id'; // Default to 'id' if not explicitly mapped
        }

        // --- UI RENDERING ---
        function renderProjects(projectsToDisplay) {
            const tableBody = document.getElementById('projects-table-body'); // Changed ID to match HTML
            if (!projectsToDisplay || !tableBody) return;
            if (projectsToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-gray-500 py-8">No projects match the current filters.</td></tr>`;
                return;
            }

            tableBody.innerHTML = projectsToDisplay.map(p => `
                <tr class="hover:bg-gray-50 cursor-pointer project-row" data-project-id="${p.project_id}">
                    <td class="px-4 py-3"><p class="font-medium text-gray-900">${p.project_id}</p></td>
                    <td class="px-4 py-3"><p class="font-medium text-gray-900">${p.title || 'No Title'}</p></td>
                    <td class="px-4 py-3"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${p.status_id === 'Active' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${p.status_id}</span></td>
                    <td class="px-4 py-3">${p.pi_full_name || 'N/A'}</td>
                    <td class="px-4 py-3">${p.customer_name || 'N/A'}</td>
                    <td class="px-4 py-3">${p.funder || 'N/A'}</td>
                    <td class="px-4 py-3">${p.start_date ? new Date(p.start_date).toLocaleDateString() : 'N/A'}</td>
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-project-id="${p.project_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-project-id="${p.project_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('');
            
            lucide.createIcons();
            addProjectListActionListeners();
        }
        
        async function renderProjectDetails(projectId) {
            const container = document.getElementById('project-details-container');
            container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="loader-2" class="animate-spin mx-auto h-12 w-12 text-blue-600"></i><p class="mt-2">Loading project details...</p></div></div>`;
            lucide.createIcons();

            const project = currentProjectsData.find(p => p.project_id === projectId); 

            if (!project) { 
                container.innerHTML = `<div class="card p-6 text-red-500">Error: Project details not found.</div>`; 
                return; 
            }

            // Fetch related data
            const [
                projectPersons, 
                samples, 
                experiments, 
                cruises, 
                orders,
                publications
            ] = await Promise.all([
                apiFetch(`table/Lims/project_persons?filter_project_id=${projectId}`),
                apiFetch(`table/Lab/samples?filter_project_id=${projectId}`),
                apiFetch(`table/Lab/experiments?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/cruises?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/orders?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/publications?filter_project_id=${projectId}`)
            ]);

            // Helper to render a detail row if value exists
            const renderDetailRow = (label, value) => {
                if (value === null || value === undefined || String(value).trim() === '' || value === 'N/A') {
                    return '';
                }
                return `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${label}</dt><dd class="text-gray-900 break-all">${value}</dd></div>`;
            };

            // Helper to format date strings
            const formatDate = (dateString) => {
                if (!dateString) return 'N/A';
                try {
                    const date = new Date(dateString);
                    return isNaN(date.getTime()) ? 'N/A' : date.toLocaleDateString();
                } catch (e) {
                    return 'N/A';
                }
            };

            let detailsHtml = `<div class="space-y-3 text-sm">`;
            
            // Core Information Accordion
            detailsHtml += `
                <div class="accordion-item">
                    <button class="accordion-header" data-accordion="core-info">
                        <span class="flex items-center"><i data-lucide="info" class="w-5 h-5 mr-2"></i> Core Information</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                    </button>
                    <div class="accordion-content open">
                        <dl class="space-y-2 py-2">
                            ${renderDetailRow('Project ID', project.project_id)}
                            ${renderDetailRow('Title', project.title)}
                            ${renderDetailRow('Principal Investigator', project.pi_full_name || 'N/A')}
                            ${renderDetailRow('Funder', project.funder)}
                            ${renderDetailRow('Customer', project.customer_name || 'N/A')}
                            ${renderDetailRow('Status', project.status_id)}
                            ${renderDetailRow('Start Date', formatDate(project.start_date))}
                            ${renderDetailRow('End Date', formatDate(project.end_date))}
                            ${renderDetailRow('Report Date', formatDate(project.report_date))}
                            ${renderDetailRow('Notes', project.notes)}
                            ${project.attachment ? renderDetailRow('Attachment', '<a href="#" class="text-blue-500 hover:underline">View Attachment</a>') : ''}
                        </dl>
                    </div>
                </div>`;

            // Project Personnel
            if (projectPersons && !projectPersons.error && projectPersons.length > 0) {
                const allPersons = await getReferenceData('personal');
                detailsHtml += `
                    <div class="accordion-item mt-4">
                        <button class="accordion-header" data-accordion="personnel">
                            <span class="flex items-center"><i data-lucide="users" class="w-5 h-5 mr-2"></i> Project Personnel (${projectPersons.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${projectPersons.map(pp => {
                                    const person = allPersons.find(p => p.person_id === pp.person_id);
                                    return `<li>${person ? person.full_name : pp.person_id} (${pp.role || 'N/A'})</li>`;
                                }).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Samples
            if (samples && !samples.error && samples.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="samples">
                            <span class="flex items-center"><i data-lucide="beaker" class="w-5 h-5 mr-2"></i> Samples (${samples.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${samples.map(s => `<li><a href="samples.html?sample_id=${s.sample_id}" class="text-blue-500 hover:underline">${s.sample_id}</a> (${s.sample_type_id})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Experiments
            if (experiments && !experiments.error && experiments.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="experiments">
                            <span class="flex items-center"><i data-lucide="flask-round" class="w-5 h-5 mr-2"></i> Experiments (${experiments.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${experiments.map(e => `<li><a href="experiments.html?experiment_id=${e.experiment_id}" class="text-blue-500 hover:underline">${e.experiment_title || e.experiment_id}</a></li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Cruises
            if (cruises && !cruises.error && cruises.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="cruises">
                            <span class="flex items-center"><i data-lucide="ship" class="w-5 h-5 mr-2"></i> Cruises (${cruises.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${cruises.map(c => `<li>${c.cruise_id} (${c.start_date ? formatDate(c.start_date) : 'N/A'})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Orders
            if (orders && !orders.error && orders.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="orders">
                            <span class="flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Orders (${orders.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">

        // --- NEW: Function to apply filters and sorting ---
        function applyFiltersAndSortProjects() {
            let tempArray = [...currentProjectsData]; // Start with the raw data

            // Apply filters
            document.querySelectorAll('.filter-input').forEach(input => {
                const column = input.dataset.column;
                const filterText = input.value.toLowerCase();
                columnFilters[column] = filterText; // Store current filter value

                if (filterText) {
                    tempArray = tempArray.filter(project => 
                        String(project[column] || '').toLowerCase().includes(filterText)
                    );
                }
            });

            // Apply sorting
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();

                    // Handle date sorting if applicable
                    if (sortColumn.toLowerCase().includes('date')) {
                        const dateA = new Date(valA);
                        const dateB = new Date(valB);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; // Don't sort invalid dates
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    // Default to string comparison
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            filteredAndSortedProjects = tempArray;
            renderProjects(filteredAndSortedProjects);
            updateSortIcons(); // Update the visual sort indicators
        }

        // --- NEW: Function to update sort icons ---
        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => {
                const column = icon.closest('.sortable-header').dataset.column;
                icon.setAttribute('data-lucide', 'chevrons-up-down'); // Reset all to default icon
            });
            if (sortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${sortColumn}"] i`);
                if (currentSortIcon) {
                    currentSortIcon.setAttribute('data-lucide', sortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
                }
            }
            lucide.createIcons(); // Re-render icons after changing attributes
        }

            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);

tatus</label><select name="status_id" class="w-full mt-1 p-2 border rounded">${statuses ? statuses.map(s => `<option value="${s.status_id}" ${project && project.status_id === s.status_id ? 'selected' : ''}>${s.status_id}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Start Date</label><input type="date" name="start_date" class="w-full mt-1 p-2 border rounded" value="${project && project.start_date ? project.start_date.split('T')[0] : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">End Date</label><input type="date" name="end_date" class="w-full mt-1 p-2 border rounded" value="${project && project.end_date ? project.end_date.split('T')[0] : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Report Date</label><input type="date" name="report_date" class="w-full mt-1 p-2 border rounded" value="${project && project.report_date ? project.report_date.split('T')[0] : ''}"></div><div class="md:col-span-2"><label class="block text-gray-700 text-sm font-bold mb-1">Notes</label><textarea name="notes" class="w-full mt-1 p-2 border rounded h-24">${project ? project.notes : ''}</textarea></div><div class="md:col-span-2"><label class="block text-gray-700 text-sm font-bold mb-1">Attachment</label><input type="file" name="attachment" class="w-full mt-1 p-2 border rounded file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100"></div></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div></form></div></div>`;

                const method = isEditing ? 'PUT' : 'POST';
                const endpoint = isEditing ? `table/Lims/projects/${project.project_id}` : 'table/Lims/projects';
                
                // Convert FormData to a plain object for JSON body, handle file separately
                const body = {};
                for (const [key, value] of formData.entries()) {
                    if (key === 'attachment') {
                        // For file inputs, if a file is selected, include it as is.
                        // If no file is selected (and it's an edit), don't send the key
                        // so the backend doesn't try to set it to null unless explicitly desired.
                        if (value instanceof File && value.size > 0) {
                            body[key] = value; // This will be a File object, needs special handling for fetch
                        } else if (isEditing && key === 'attachment' && !value.size) {
                            // If editing and attachment input is empty, explicitly set to null
                            body[key] = null;
                        }
                    } else {
                        body[key] = value === '' ? null : value; // Convert empty strings to null
                    }

                const user = JSON.parse(sessionStorage.getItem('user')) || {};
                body.modified_by = user.person_id; 
                if (!isEditing) {
                    body.created_by = user.person_id; 
                }

                let result;
                if (body.attachment instanceof File) {
                    // If there's a file, send as FormData
                    const formDataWithFile = new FormData();
                    for (const key in body) {
                        if (body[key] !== null) { // Append nulls as empty strings if needed by backend, or skip
                            formDataWithFile.append(key, body[key]);
                        }
                    }
                    result = await apiFetch(endpoint, { method, body: formDataWithFile });
                } else {
                    // No file, send as JSON
                    result = await apiFetch(endpoint, { method, body });
                }

                if (result && !result.error) { 
                    closeModal(); 
                    masterCache['Lims.projects'] = null; // Clear cache to force refresh
                    initializeProjectsPage(isEditing ? project.project_id : null); 
                } else { 
                    alert('Failed to save project: ' + (result ? result.error : 'Unknown error')); 
                }
            };
        }

        async function generateAndDownloadTemplateForBulk(isUpdate) {
            const schemaInfo = await apiFetch(`table/Lims/projects/info`);
            if (schemaInfo.error || !schemaInfo.columns) {
                alert('Could not determine table schema to generate template.');
                return;
            }
            
            let headers = schemaInfo.columns.map(col => col.name);
            const pkColumn = 'project_id'; // Primary key for projects table

            // Filter out internal/calculated fields for the template
            headers = headers.filter(key => 
                !['attachment', 'password_hash', 'search_vector', 'created_at', 'modified_by', 'time_modification'].includes(key) && 
                !key.endsWith('_ug') // Exclude generated columns
            );

            if (isUpdate) {
                headers = headers.filter(h => h !== pkColumn);
                headers.unshift(pkColumn); // Ensure project_id is first for updates
            } else {
                headers = headers.filter(h => h !== pkColumn); // Exclude project_id for new import as it's manually entered by user
            }

            const csvContent = headers.join(';'); // Use semicolon for CSV
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' }); // Add BOM for Excel compatibility
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `projects_${isUpdate ? 'update' : 'import'}_template.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleFileSelectForBulk(event, isUpdate) {
            const file = event.target.files[0];
            if (!file) return;
            const previewContainer = document.getElementById('preview-container');
            const actionButton = document.getElementById('action-data-btn');
            previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
            actionButton.disabled = true;
            
            const onParseComplete = (results) => {
                if(results.errors.length > 0) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                    return;
                }
                parsedUploadData = results.data;
                if (isUpdate && (parsedUploadData.length === 0 || !parsedUploadData[0].hasOwnProperty('project_id'))) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: For bulk update, the file must contain data and include the 'project_id' column.</p>`;
                    return;
                }
                displayPreviewForBulk(parsedUploadData);
                actionButton.disabled = false;
            };

            if (file.name.endsWith('.csv')) {
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        onParseComplete({ data: jsonData, errors: [] });
                    } catch (err) {
                        previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Error processing Excel file: ${err.message}</p>`;
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">Unsupported file type. Please upload .csv or .xlsx.</p>`;
            }
        }

            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Uploading...';

            document.getElementById('bulk-operation-progress').classList.remove('hidden');
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedRecords = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};

            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;

            for (const row of parsedUploadData) {
                // Add created_by to each row before sending
                const dataToInsert = { ...row, created_by: user.person_id };
                logMessage(`Inserting record: ${row.project_id || row.title || 'N/A'}...`);

                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedRecords.push(JSON.stringify(row));
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');

            logMessage('------------------------------------', 'text-blue-400');

            logMessage(`Failed: ${failCount}`, 'text-red-400');

            for (const row of parsedUploadData) {
                const projectId = row.project_id;

                    continue;

                    failCount++;
                    failedRecords.push(`${projectId}: ${result.error}`);
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }

            logMessage('------------------------------------', 'text-blue-400');

                const projectId = e.currentTarget.dataset.projectId;
                const project = currentProjectsData.find(p => p.project_id == projectId); // Find from raw data
                if(project && confirm(`Are you sure you want to delete project: ${project.title}? This cannot be undone.`)){
                    const result = await apiFetch(`table/Lims/projects/${project.project_id}`, { method: 'DELETE' });
                    if(result.success) {
                        // Clear the cache for projects, so it re-fetches the updated list
                        masterCache['Lims.projects'] = null; 
                        initializeProjectsPage(); // Reload the page
                        document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                        lucide.createIcons();
                    } else alert('Failed to delete project: ' + (result ? result.error : 'Unknown error'));
                }
            }));
        }

        async function initializeProjectsPage(selectedProjectId = null) {
            // Clear existing filter/sort state
            sortColumn = 'project_id';
            sortDirection = 'asc';
            columnFilters = {};
            
            const projects = await getReferenceData('projects', 'Lims'); 
            const persons = await getReferenceData('personal', 'Reference');
            const customers = await getReferenceData('customers', 'Lims');

            if(projects && !projects.error) {
                // Enrich projects data with PI full name and Customer name for display
                currentProjectsData = projects.map(p => ({
                    ...p,
                    pi_full_name: persons.find(person => person.person_id === p.pi_person_id)?.full_name || 'N/A',
                    customer_name: customers.find(customer => customer.customer_id === p.customer_id)?.customer_name || 'N/A'
                }));

                // Populate filter inputs if there are any persisted values (though we reset them on page load for now)
                document.querySelectorAll('.filter-input').forEach(input => {
                    input.value = columnFilters[input.dataset.column] || '';
                });

                // Add event listeners for sorting and filtering headers
                document.querySelectorAll('.sortable-header').forEach(header => {
                    header.addEventListener('click', (e) => {
                        const column = e.currentTarget.dataset.column;
                        if (sortColumn === column) {
                            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                        } else {
                            sortColumn = column;
                            sortDirection = 'asc';
                        }
                        applyFiltersAndSortProjects();
                    });
                });

                document.querySelectorAll('.filter-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const column = e.target.dataset.column;
                        columnFilters[column] = e.target.value.toLowerCase();
                        applyFiltersAndSortProjects();
                    });
                });

                applyFiltersAndSortProjects(); // Apply initial sort and filters

                if (selectedProjectId) {
                    // Give a small delay to ensure rows are rendered before trying to select
                    setTimeout(() => {
                        const row = document.querySelector(`.project-row[data-project-id="${selectedProjectId}"]`);
                        if (row) {
                            row.classList.add('table-row-selected');
                            renderProjectDetails(selectedProjectId);
                        }
                    }, 50);
                } else {
                     // If no specific project is selected, clear details panel
                     document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                     lucide.createIcons();
                }

            } else {
                document.getElementById('projects-table-body').innerHTML = `<tr><td colspan="8" class="text-center text-red-500 p-4">Error loading projects: ${projects ? projects.error : 'Unknown API error'}</td></tr>`;
            }
            document.getElementById('new-project-btn').addEventListener('click', () => showProjectModal());
            document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkOperationModal(false));
            document.getElementById('bulk-update-btn').addEventListener('click', () => showBulkOperationModal(true));
        }
    </script>
</body>
</html>
