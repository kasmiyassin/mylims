<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samples - TIFI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }

        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .table-row-selected { background-color: #eef2ff !important; }
        .sub-nav-link { color: #475569; padding: 8px 16px; border-radius: 0.5rem; transition: background-color: 0.2s; font-weight: 500;}
        .sub-nav-link:hover { background-color: #f1f5f9; }
        .sub-nav-link.active { background-color: #4f46e5; color: white; font-weight: 600; }
    </style>
</head>
<body>
    <div id="main-app">
        <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-white w-64 p-4 flex flex-col">
            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI</span></div>
            <nav class="flex-grow space-y-2">
                 <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md active"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="test-tubes" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>
                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-3" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
                <a href="workflow.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="workflow" class="w-5 h-5 mr-3"></i><span>Workflow</span></a>
            </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>
            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-3xl font-bold text-gray-800">Sample Management</h1>
                <div class="flex space-x-2">
                    <button id="bulk-import-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow hover:shadow-lg transition-all"><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Bulk Import</button>
                    <button id="new-sample-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow hover:shadow-lg transition-all"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Sample</button>
                </div>
            </div>

            <div id="sub-nav-menu" class="mb-6 flex items-center space-x-2 border-b pb-2">
                <a href="#" class="sub-nav-link" data-table="Samples">All Samples</a>
                <a href="#" class="sub-nav-link" data-table="Fish">Fish</a>
                <a href="#" class="sub-nav-link" data-table="Tissue">Tissue</a>
                <a href="#" class="sub-nav-link" data-table="Water">Water</a>
                <a href="#" class="sub-nav-link" data-table="Sediments">Sediments</a>
                <a href="#" class="sub-nav-link" data-table="DNA">DNA</a>
                <a href="#" class="sub-nav-link" data-table="RNA">RNA</a>
            </div>

            <div id="page-container">
                </div>
        </div>
        <div id="modal-container"></div>
    </div>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = `http://${window.location.hostname}:5200/api`;
        let currentViewCache = [];
        let referenceDataCache = {};
        let currentTableName = 'Samples';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializePage();
        });

        // --- API & UTILITIES ---
        async function apiFetch(endpoint, options = {}) {
            try {
                const isJson = !(options.body instanceof FormData);
                if (isJson && options.body) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { const err = await response.json().catch(()=>({error: 'Server error'})); throw new Error(err.error); }
                return response.status === 204 ? { success: true } : response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (referenceDataCache[cacheKey]) return referenceDataCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) referenceDataCache[cacheKey] = data;
            return data;
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        // --- DYNAMIC VIEW LOADER ---
        async function loadView(tableName) {
            currentTableName = tableName;
            document.querySelectorAll('.sub-nav-link').forEach(link => link.classList.toggle('active', link.dataset.table === tableName));

            const container = document.getElementById('page-container');
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                    <div class="lg:col-span-3">
                        <div class="card p-4">
                            <div class="overflow-y-auto h-[60vh]">
                                <div id="table-content"><p class="p-4 text-gray-500">Loading data for ${tableName}...</p></div>
                            </div>
                        </div>
                    </div>
                    <div id="details-container" class="lg:col-span-2">
                        <div class="card p-6 h-full flex items-center justify-center text-gray-500">
                            <div class="text-center"><i data-lucide="mouse-pointer-square" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an item to view details</p></div>
                        </div>
                    </div>
                </div>`;
            lucide.createIcons();
            
            await renderTableForType(tableName);
        }

        async function renderTableForType(tableName) {
            const tableContainer = document.getElementById('table-content');
            const result = await apiFetch(`table/Lab/${tableName}`);
            
            if (result.error || !Array.isArray(result)) {
                tableContainer.innerHTML = `<p class="p-4 text-red-500">Error loading data: ${result.error || 'Invalid response'}</p>`;
                return;
            }
            
            currentViewCache = result;
            if (result.length === 0) {
                tableContainer.innerHTML = `<p class="p-4 text-gray-500">No entries found in the ${tableName} table.</p>`;
                return;
            }

            const summaryHeaders = ['sample_id', 'place', 'sampling_date', 'ParentSample_id'];
            
            const tableHtml = `<table class="min-w-full text-sm">
                <thead class="bg-gray-50 sticky top-0"><tr>
                    ${summaryHeaders.map(h => `<th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">${h.replace(/_/g, ' ')}</th>`).join('')}
                    <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
                </tr></thead>
                <tbody class="divide-y divide-gray-200">
                    ${currentViewCache.map(row => `<tr class="table-row hover:bg-gray-50 cursor-pointer" data-sample-id="${row.sample_id}">
                        ${summaryHeaders.map(h => `<td class="px-4 py-3 whitespace-nowrap">${row[h] || ''}</td>`).join('')}
                        <td class="px-4 py-3 flex space-x-2">
                            <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-sample-id="${row.sample_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-sample-id="${row.sample_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            
            tableContainer.innerHTML = tableHtml;
            lucide.createIcons();
            addActionListeners();
        }

        function renderDetails(sampleId) {
            const container = document.getElementById('details-container');
            const sample = currentViewCache.find(s => s.sample_id === sampleId);
            if (!sample) { container.innerHTML = `<p class="p-4 text-red-500">Could not find details.</p>`; return; }

            let detailsHtml = '<div class="space-y-2 text-sm">';
            for (const [key, value] of Object.entries(sample)) {
                if (value !== null && value !== '' && key !== 'nr') {
                    const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    let formattedValue = value;
                    if (key.toLowerCase().includes('date') && !isNaN(Date.parse(value))) {
                        formattedValue = new Date(value).toLocaleDateString();
                    }
                    detailsHtml += `<div><strong class="text-gray-500 w-40 inline-block">${formattedKey}</strong> <span class="text-gray-800">${formattedValue}</span></div>`;
                }
            }
            detailsHtml += '</div>';

            container.innerHTML = `<div class="card p-6 h-full flex flex-col"><div class="mb-4">
                <h2 class="text-xl font-bold text-gray-800">${sample.sample_id}</h2>
                <p class="text-sm text-gray-500">Table: ${currentTableName}</p>
            </div><div class="flex-grow overflow-y-auto pr-2">${detailsHtml}</div></div>`;
        }

        function addActionListeners() {
            document.querySelectorAll('.table-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    document.querySelectorAll('.table-row').forEach(r => r.classList.remove('table-row-selected'));
                    row.classList.add('table-row-selected');
                    renderDetails(row.dataset.sampleId);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const sampleId = e.currentTarget.dataset.sampleId;
                const sampleToEdit = currentViewCache.find(s => s.sample_id === sampleId);
                if (sampleToEdit) {
                    showNewSampleModal(sampleToEdit);
                }
            }));

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const sampleId = e.currentTarget.dataset.sampleId;
                if (confirm(`Are you sure you want to delete sample ${sampleId}?`)) {
                    const result = await apiFetch(`table/Lab/${currentTableName}/${sampleId}`, { method: 'DELETE' });
                    if (result.success) {
                        loadView(currentTableName);
                    } else {
                        alert('Failed to delete sample: ' + (result.error || 'Unknown error'));
                    }
                }
            }));
        }

        async function showNewSampleModal(sampleToEdit = null) {
            const isEditing = sampleToEdit !== null;
            const sampleType = isEditing ? (sampleToEdit.sample_type || currentTableName) : currentTableName;

            if (!sampleType || sampleType === 'Samples') {
                alert("Please select a specific sample table like 'Fish' or 'Water' from the menu before creating a new sample.");
                return;
            }
            
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl transform transition-all"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">${isEditing ? `Edit Sample: ${sampleToEdit.sample_id}` : `Create New ${sampleType} Sample`}</h2><button id="close-modal-btn">&times;</button></div>
            <form id="sample-form" class="space-y-4"><input type="hidden" name="sample_type" value="${sampleType}"><div id="dynamic-fields-container"></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div></form></div></div>`;
            const { closeModal } = showModal(modalHTML);
            
            await renderDynamicFields(sampleType, sampleToEdit);

            document.getElementById('sample-form').onsubmit = async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target).entries());
                const endpoint = isEditing ? `table/Lab/${sampleType}/${sampleToEdit.sample_id}` : `table/Lab/${sampleType}`;
                const method = isEditing ? 'PUT' : 'POST';

                const result = await apiFetch(endpoint, { method, body: data });
                if(result && !result.error) {
                    closeModal();
                    loadView(sampleType);
                } else {
                    alert('Failed to save sample: ' + (result ? result.error : 'Unknown error'));
                }
            };
        }

        async function renderDynamicFields(sampleType, dataToPreload = null) {
            const container = document.getElementById('dynamic-fields-container');
            container.innerHTML = `<p class="text-center text-gray-500">Loading fields...</p>`;

            const [schemaResult, locations, species, storage] = await Promise.all([
                apiFetch(`table/Lab/${sampleType}`), getReferenceData('Location'),
                getReferenceData('Species'), getReferenceData('Storage', 'Lab')
            ]);
            
            if (schemaResult.error) { container.innerHTML = `<p class="text-red-500">Could not load form.</p>`; return; }
            
            const columns = Object.keys(schemaResult[0] || {});
            const ignoredCols = ['nr', 'sample_id', 'sample_type', 'attachment'];
            let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
            
            for (const col of columns) {
                if (ignoredCols.includes(col)) continue;
                
                const value = dataToPreload ? (dataToPreload[col] || '') : '';
                const formattedLabel = col.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let field = '';

                if (col.toLowerCase().includes('date')) {
                    field = `<input type="date" name="${col}" value="${value ? value.split('T')[0] : ''}" class="w-full mt-1 p-2 border rounded">`;
                } else if (col === 'place') {
                    field = `<select name="${col}" class="w-full mt-1 p-2 border rounded"><option value="">-- Select --</option>${locations.map(loc => `<option value="${loc.place}" ${value === loc.place ? 'selected' : ''}>${loc.place}</option>`).join('')}</select>`;
                } else if (col === 'Species') {
                    field = `<select name="${col}" class="w-full mt-1 p-2 border rounded"><option value="">-- Select --</option>${species.map(sp => `<option value="${sp.Species}" ${value === sp.Species ? 'selected' : ''}>${sp.Species} (${sp.En_name})</option>`).join('')}</select>`;
                } else if (col === 'storage_id') {
                    field = `<select name="${col}" class="w-full mt-1 p-2 border rounded"><option value="">-- Select --</option>${storage.map(st => `<option value="${st.storage_id}" ${value === st.storage_id ? 'selected' : ''}>${st.storage_id}</option>`).join('')}</select>`;
                } else if (col === 'Notes') {
                    field = `<textarea name="${col}" class="w-full mt-1 p-2 border rounded">${value}</textarea>`;
                } else {
                    field = `<input type="text" name="${col}" value="${value}" class="w-full mt-1 p-2 border rounded">`;
                }
                fieldsHtml += `<div><label>${formattedLabel}</label>${field}</div>`;
            }
            fieldsHtml += '</div>';
            container.innerHTML = fieldsHtml;
        }

        async function showBulkUploadModal() {
            if (!currentTableName || currentTableName === 'Samples') {
                alert("Please select a specific sample table (e.g., 'Fish') from the menu before starting a bulk import.");
                return;
            }
            
            let fileData = { data: [], meta: { fields: [] } };
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl transform transition-all"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Bulk Import for: ${currentTableName}</h2><button id="close-modal-btn">&times;</button></div><div id="upload-step-1"></div><div id="upload-step-2" class="hidden"></div><div id="upload-step-3" class="hidden"></div></div></div>`;
            const { closeModal } = showModal(modalHTML);
            
            const renderStep1 = () => {
                document.getElementById('upload-step-1').innerHTML = `<h3 class="font-semibold text-lg mb-2">Step 1: Upload File</h3><p class="text-sm text-gray-600 mb-4">Select a CSV or Excel file to import into the <strong>${currentTableName}</strong> table.</p><div><label>File</label><input type="file" id="file-input" accept=".csv, .xlsx, .xls" class="w-full mt-1 border p-1.5 rounded-lg text-sm"></div><div class="mt-6 flex justify-end"><button id="next-step-1" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg" disabled>Next: Map Columns</button></div>`;
                
                const fileInput = document.getElementById('file-input');
                const nextBtn = document.getElementById('next-step-1');
                fileInput.onchange = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    nextBtn.disabled = true;
                    const reader = new FileReader();
                    if (file.name.endsWith('.csv')) {
                        reader.onload = (e) => { Papa.parse(e.target.result, { header: true, skipEmptyLines: true, complete: (results) => { fileData = results; nextBtn.disabled = false; } }); };
                        reader.readAsText(file);
                    } else {
                        reader.onload = (e) => {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, {type: 'array'});
                            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet);
                            fileData = { data: jsonData, meta: { fields: Object.keys(jsonData[0] || {}) } };
                            nextBtn.disabled = false;
                        };
                        reader.readAsArrayBuffer(file);
                    }
                };
                nextBtn.onclick = () => renderStep2();
            };
            
            const renderStep2 = async () => {
                document.getElementById('upload-step-1').classList.add('hidden');
                document.getElementById('upload-step-2').classList.remove('hidden');
                
                const result = await apiFetch(`table/Lab/${currentTableName}`);
                if (result.error || result.length === 0) {
                     document.getElementById('upload-step-2').innerHTML = `<p class="text-red-500">Could not fetch schema for table '${currentTableName}'.</p>`;
                     return;
                }
                const dbColumns = Object.keys(result[0]);
                const fileColumns = fileData.meta.fields;
                document.getElementById('upload-step-2').innerHTML = `<h3 class="font-semibold text-lg mb-2">Step 2: Map Columns</h3><p class="text-sm text-gray-600 mb-4">Match columns from your file to the database fields for the <strong>${currentTableName}</strong> table.</p><div class="grid grid-cols-2 gap-x-8 gap-y-2 max-h-[50vh] overflow-y-auto p-2 border rounded-lg bg-gray-50"><div class="font-semibold text-gray-500">Your File Column</div><div class="font-semibold text-gray-500">Database Field</div>${fileColumns.map(col => `<div class="grid grid-cols-2 items-center gap-2"><label class="font-mono text-sm p-2 bg-white border rounded-md truncate" title="${col}">${col}</label><select class="column-map p-2 border rounded-md" data-file-col="${col}"><option value="">-- Ignore --</option>${dbColumns.map(dbCol => `<option value="${dbCol}" ${dbCol.toLowerCase() === col.toLowerCase().replace(/ /g,'_') ? 'selected' : ''}>${dbCol}</option>`).join('')}</select></div>`).join('')}</div><div class="mt-4 flex justify-between"><button id="back-step-2" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg">Back</button><button id="next-step-2" class="bg-blue-600 text-white py-2 px-4 rounded-lg">Next: Review</button></div>`;
                document.getElementById('back-step-2').onclick = () => { document.getElementById('upload-step-2').classList.add('hidden'); document.getElementById('upload-step-1').classList.remove('hidden'); };
                document.getElementById('next-step-2').onclick = () => renderStep3();
            };

            const renderStep3 = () => {
                document.getElementById('upload-step-2').classList.add('hidden');
                document.getElementById('upload-step-3').classList.remove('hidden');
                const mapping = {};
                document.querySelectorAll('.column-map').forEach(select => { if(select.value) mapping[select.dataset.fileCol] = select.value; });
                
                const transformedData = fileData.data.map(row => {
                    const newRow = { sample_type: currentTableName };
                    for (const [fileCol, dbCol] of Object.entries(mapping)) {
                        if (row[fileCol] !== undefined && row[fileCol] !== null) newRow[dbCol] = row[fileCol];
                    }
                    return newRow;
                });
                
                const headers = Object.keys(transformedData[0]);
                document.getElementById('upload-step-3').innerHTML = `<h3 class="font-semibold text-lg mb-2">Step 3: Review and Import</h3><p class="text-sm text-gray-600 mb-4">Review the data below. If correct, click 'Import' to add ${transformedData.length} records.</p><div class="max-h-[40vh] overflow-auto border rounded-lg"><table class="min-w-full text-xs"><thead class="bg-gray-100 sticky top-0"><tr>${headers.map(h => `<th class="p-2 text-left font-semibold">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${transformedData.slice(0, 10).map(row => `<tr>${headers.map(h => `<td class="p-2 truncate" title="${row[h]}">${row[h] === undefined ? '' : row[h]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
                    ${transformedData.length > 10 ? `<p class="text-center text-xs text-gray-500 mt-1">... and ${transformedData.length - 10} more rows.</p>` : ''}
                    <div id="upload-status" class="mt-4"></div><div class="mt-4 flex justify-between"><button id="back-step-3" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg">Back</button><button id="import-btn" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg flex items-center"><i data-lucide="database" class="w-4 h-4 mr-2"></i>Import</button></div>`;
                lucide.createIcons();
                document.getElementById('back-step-3').onclick = () => { document.getElementById('upload-step-3').classList.add('hidden'); document.getElementById('upload-step-2').classList.remove('hidden'); };
                document.getElementById('import-btn').onclick = async () => {
                    document.getElementById('upload-status').innerHTML = `<p class="text-blue-600">Uploading...</p>`;
                    const result = await apiFetch(`table/Lab/${currentTableName}/batch_upload`, { method: 'POST', body: transformedData });
                    if(result && result.success) {
                        document.getElementById('upload-status').innerHTML = `<p class="text-green-600 font-semibold">Success! ${result.inserted_rows} records imported.</p>`;
                        setTimeout(() => { closeModal(); loadView(currentTableName); }, 2000);
                    } else { document.getElementById('upload-status').innerHTML = `<p class="text-red-600">Error: ${result ? result.error : 'Upload failed.'}</p>`; }
                };
            };
            
            renderStep1();
        }

        // --- PAGE INITIALIZATION ---
        function initializePage() {
            const menu = document.getElementById('sub-nav-menu');
            menu.querySelectorAll('.sub-nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadView(e.currentTarget.dataset.table);
                });
            });
            menu.querySelector('.sub-nav-link[data-table="Samples"]').click();
            document.getElementById('new-sample-btn').addEventListener('click', () => showNewSampleModal());
            document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkUploadModal());
        }
    </script>
</body>
</html>
