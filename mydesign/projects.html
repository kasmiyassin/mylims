<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 50; }
        .table-row-selected { background-color: #eef2ff !important; }

        /* New styles for filter/sort */
        .sortable-header { 
            cursor: pointer; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 8px; 
        }
        .sortable-header:hover { background-color: #e2e8f0; }
        .sort-icon { display: inline-block; width: 16px; height: 16px; vertical-align: middle; margin-left: 4px; flex-shrink: 0; }
        .filter-input {
            width: calc(100% - 10px);
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        /* Accordion styles for details panel */
        .accordion-item {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .accordion-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: #475569;
        }
        .accordion-header:hover {
            background-color: #e2e8f0;
        }
        .accordion-header .lucide {
            transition: transform 0.3s ease;
        }
        .accordion-header.active .lucide {
            transform: rotate(180deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 1rem; /* Initial padding, will expand */
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        .accordion-content.open {
            max-height: 500px; /* Adjust as needed for content height */
            padding: 1rem;
        }
    </style>
</head>
<body>

            <nav class="flex-grow space-y-2">

                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>

                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
           </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>

    <script>
        // --- AUTH & SETUP ---
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        // Ensure this matches your Flask app's API_PREFIX
        const API_BASE_URL = '/mymglab/api'; 
        let masterCache = {}; // Cache for all fetched reference data
        let currentProjectsData = []; // Stores the raw projects data from the API
        let filteredAndSortedProjects = []; // Stores projects after applying filters and sorts
        
        // State for sorting and filtering projects
        // These should match the column names returned by the API (usually lowercase from PostgreSQL)
        let sortColumn = 'title'; // Default sort column
        let sortDirection = 'asc'; // Default sort direction
        let columnFilters = {}; // { 'columnName': 'filterText' }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            // Display user info, handling different user types (personal, customer, contact)
            if (user) {
                let userName = 'User';
                if (user.full_name) {
                    userName = user.full_name;
                } else if (user.person_id) {
                    userName = user.person_id;
                } else if (user.customer_name) {
                    userName = user.customer_name;
                } else if (user.contact_id) {
                    userName = user.contact_id;
                }
                document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${userName}</p>`;
            }
            
            document.getElementById('logout-button').addEventListener('click', () => { 
                sessionStorage.clear(); 
                // Redirect to login page after successful logout (backend call might not be needed for simple session clear)
                window.location.href = './login.html'; 
            });
            initializeProjectsPage();
        });

        // --- API & DATA HANDLING ---
        async function apiFetch(endpoint, options = {}) {
            try {
                // For POST/PUT, if body is an object, stringify it
                if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                
                if (!response.ok) { 
                    const errText = await response.text();
                    try { 
                        const errJson = JSON.parse(errText); 
                        throw new Error(errJson.error || `API request failed with status ${response.status}`); 
                    } catch { 
                        throw new Error(`API request failed: ${errText} (Status: ${response.status})`); 
                    }
                }
                // Handle 204 No Content responses
                if (response.status === 204 || response.headers.get('content-length') === '0') {
                    return { success: true };
                }
                return response.json();
            } catch (error) { 
                console.error("API Error:", error); 
                return { error: error.message }; 
            }
        }

        async function getReferenceData(tableName, schema = 'reference') { // Default schema to 'reference'
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey]) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        // --- UI RENDERING ---
        function renderProjects(projectsToDisplay) {
            const tableBody = document.getElementById('projects-table');
            if (!projectsToDisplay || !tableBody) return;
            tableBody.innerHTML = projectsToDisplay.map(p => `
                <tr class="hover:bg-gray-50 cursor-pointer project-row" data-project-id="${p.project_id}">
                    <td class="px-4 py-3"><p class="font-medium text-gray-900">${p.title || 'No Title'}</p><p class="text-sm text-gray-500">${p.project_id}</p></td>
                    <td class="px-4 py-3"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${p.status_id === 'Active' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${p.status_id || 'N/A'}</span></td>
                    <td class="px-4 py-3">${p.customer_name || 'N/A'}</td>
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-project-id="${p.project_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-project-id="${p.project_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('');
            
            lucide.createIcons();
            addProjectListActionListeners(projectsToDisplay); 
        }
        
        async function renderProjectDetails(projectId) {
            const container = document.getElementById('project-details-container');
            container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="loader-2" class="animate-spin mx-auto h-12 w-12 text-blue-600"></i><p class="mt-2">Loading project details...</p></div></div>`;
            lucide.createIcons();

            // Find project from currentProjectsData, which is already mapped to consistent keys
            const project = currentProjectsData.find(p => p.project_id === projectId); 

            if (!project) { 
                container.innerHTML = `<div class="card p-6 text-red-500">Error: Project details not found.</div>`; 
                return; 
            }

            // Fetch related data
            // Assuming the `order_details_view` is created in your SQL for comprehensive order info
            const [
                samples, 
                experiments, 
                cruises, 
                orders
            ] = await Promise.all([
                apiFetch(`table/Lab/samples?filter_project_id=${projectId}`),
                apiFetch(`table/Lab/experiments?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/cruises?filter_project_id=${projectId}`),
                apiFetch(`table/Lims/order_details_view?filter_project_id=${projectId}`) 
            ]);

            let detailsHtml = `<div class="space-y-3 text-sm">`;
            const coreDetails = [
                { key: 'project_id', label: 'Project ID' },
                { key: 'title', label: 'Title' }, 
                { key: 'pi_full_name', label: 'Principal Investigator'}, 
                { key: 'funder', label: 'Funder' }, 
                { key: 'customer_name', label: 'Customer' }, 
                { key: 'status_id', label: 'Status' },
                { key: 'start_date', label: 'Start Date', type: 'date' }, 
                { key: 'end_date', label: 'End Date', type: 'date' }, 
                { key: 'report_date', label: 'Report Date', type: 'date' }, 
                { key: 'notes', label: 'Description' }, 
                { key: 'attachment_link', label: 'Attachment', type: 'link' } 
            ];
            
            coreDetails.forEach(field => {
                let value = project[field.key];
                
                if (value !== null && value !== undefined && String(value).trim() !== '') {
                    if (field.type === 'link') {
                        value = `<a href="${value}" target="_blank" class="text-blue-600 hover:underline">View Attachment</a>`;
                    } else if (field.type === 'date') {
                        try {
                            const dateObj = new Date(value);
                            value = isNaN(dateObj.getTime()) ? value : dateObj.toLocaleDateString('en-CA'); 
                        } catch (e) { /* keep original value */ }
                    } else if (field.key === 'notes' && String(value).length > 200) { 
                        value = String(value).substring(0, 200) + '...'; 
                    }

                    detailsHtml += `
                        <div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100">
                            <dt class="font-medium text-gray-500">${field.label}</dt>
                            <dd class="text-gray-900">${value}</dd>
                        </div>`;
                }
            });
            detailsHtml += `</div>`; 

            // Related Samples
            if (samples && samples.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-4">
                        <button class="accordion-header" data-accordion="samples">
                            <span class="flex items-center"><i data-lucide="beaker" class="w-5 h-5 mr-2"></i> Samples (${samples.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${samples.map(s => `<li>${s.sample_id} (${s.sample_type_id || 'N/A'})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Experiments
            if (experiments && experiments.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="experiments">
                            <span class="flex items-center"><i data-lucide="flask-round" class="w-5 h-5 mr-2"></i> Experiments (${experiments.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${experiments.map(e => `<li>${e.experiment_title || 'N/A'} (${e.experiment_id})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Cruises
            if (cruises && cruises.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="cruises">
                            <span class="flex items-center"><i data-lucide="ship" class="w-5 h-5 mr-2"></i> Cruises (${cruises.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${cruises.map(c => `<li>${c.cruise_id} (${c.start_date ? new Date(c.start_date).toLocaleDateString('en-CA') : 'N/A'})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            // Related Orders
            if (orders && orders.length > 0) {
                detailsHtml += `
                    <div class="accordion-item mt-2">
                        <button class="accordion-header" data-accordion="orders">
                            <span class="flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Orders (${orders.length})</span>
                            <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                        </button>
                        <div class="accordion-content">
                            <ul class="list-disc pl-5 py-2 space-y-1">
                                ${orders.map(o => `<li>${o.item_name || o.item_id || 'N/A'} (Order: ${o.fi_order_nr || 'N/A'})</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="card p-6 h-full flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${project.title || 'No Title'}</h2>
                            <p class="text-sm text-gray-500">${project.project_id}</p>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto pr-2">
                        ${detailsHtml}
                    </div>
                </div>`;
            lucide.createIcons(); 
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    header.classList.toggle('active');
                    content.classList.toggle('open');
                    lucide.createIcons();
                });
            });
        }

        // --- NEW: Function to apply filters and sorting ---
        function applyFiltersAndSortProjects() {
            let tempArray = [...currentProjectsData]; 

            // Apply filters
            for (const column in columnFilters) {
                const filterText = columnFilters[column];
                if (filterText) {
                    tempArray = tempArray.filter(project => 
                        String(project[column] || '').toLowerCase().includes(filterText)
                    );
                }
            }

            // Apply sorting
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();

                    // Handle date sorting if applicable
                    if (['start_date', 'end_date', 'report_date'].includes(sortColumn)) { 
                        const dateA = new Date(a[sortColumn]);
                        const dateB = new Date(b[sortColumn]);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; 
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    // Default to string comparison
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            filteredAndSortedProjects = tempArray;
            renderProjects(filteredAndSortedProjects);
            updateSortIcons(); 
        }

        // --- NEW: Function to update sort icons ---
        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => {
                const column = icon.closest('.sortable-header').dataset.column;
                icon.setAttribute('data-lucide', 'chevrons-up-down'); // Reset all to default icon
            });
            if (sortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${sortColumn}"] i`);
                if (currentSortIcon) {
                    currentSortIcon.setAttribute('data-lucide', sortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
                }
            }
            lucide.createIcons(); 
        }


        // --- MODAL LOGIC ---
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }
        
        async function showProjectModal(project = null) {
            const isEditing = project !== null;
            // Fetch reference data using lowercase schema names
            const [persons, statuses, customers] = await Promise.all([
                getReferenceData('personal', 'reference'), 
                getReferenceData('status', 'reference'),
                getReferenceData('customers', 'lims') 
            ]);

            // Format date strings for input fields to 'YYYY-MM-DD'
            const formatDateForInput = (dateString) => {
                if (!dateString) return '';
                try {
                    return new Date(dateString).toISOString().split('T')[0];
                } catch (e) {
                    return '';
                }
            };

            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl transform transition-all -translate-y-10 opacity-0"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">${isEditing ? 'Edit' : 'Create'} Project</h2><button id="close-modal-btn">&times;</button></div><form id="project-form" class="space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-gray-700 text-sm font-bold mb-1">Project ID</label><input type="text" name="project_id" required class="w-full mt-1 p-2 border rounded" ${isEditing ? 'readonly class="bg-gray-100"' : ''} value="${project ? project.project_id : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Title</label><input type="text" name="title" required class="w-full mt-1 p-2 border rounded" value="${project ? project.title || '' : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">PI</label><select name="pi_person_id" class="w-full mt-1 p-2 border rounded"><option value="">-- Select PI --</option>${persons ? persons.map(p => `<option value="${p.person_id}" ${project && project.pi_person_id === p.person_id ? 'selected' : ''}>${p.full_name || p.person_id}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Funder</label><input type="text" name="funder" class="w-full mt-1 p-2 border rounded" value="${project ? project.funder || '' : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Customer</label><select name="customer_id" class="w-full mt-1 p-2 border rounded"><option value="">-- Select Customer --</option>${customers ? customers.map(c => `<option value="${c.customer_id}" ${project && project.customer_id === c.customer_id ? 'selected' : ''}>${c.customer_name || c.customer_id}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Status</label><select name="status_id" class="w-full mt-1 p-2 border rounded">${statuses ? statuses.map(s => `<option value="${s.status_id}" ${project && project.status_id === s.status_id ? 'selected' : ''}>${s.status_id}</option>`).join('') : ''}</select></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Attachment Link</label><input type="text" name="attachment_link" class="w-full mt-1 p-2 border rounded" value="${project ? project.attachment_link || '' : ''}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Start Date</label><input type="date" name="start_date" class="w-full mt-1 p-2 border rounded" value="${formatDateForInput(project ? project.start_date : '')}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">End Date</label><input type="date" name="end_date" class="w-full mt-1 p-2 border rounded" value="${formatDateForInput(project ? project.end_date : '')}"></div><div><label class="block text-gray-700 text-sm font-bold mb-1">Report Date</label><input type="date" name="report_date" class="w-full mt-1 p-2 border rounded" value="${formatDateForInput(project ? project.report_date : '')}"></div><div class="md:col-span-2"><label class="block text-gray-700 text-sm font-bold mb-1">Notes</label><textarea name="notes" class="w-full mt-1 p-2 border rounded h-24">${project ? project.notes || '' : ''}</textarea></div></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div></form></div></div>`;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('project-form').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const method = isEditing ? 'PUT' : 'POST';
                const endpoint = isEditing ? `table/Lims/projects/${project.project_id}` : 'table/Lims/projects';
                
                let body = {};
                formData.forEach((value, key) => {
                    // Convert empty strings to null for database, especially for date fields and optional text fields
                    body[key] = value === '' ? null : value;
                });
                
                const result = await apiFetch(endpoint, { method, body });
                if (result && !result.error) { 
                    closeModal(); 
                    // Clear the cache for the view used in the main table to force re-fetch
                    masterCache['lims.project_overview_view'] = null; 
                    initializeProjectsPage(isEditing ? project.project_id : null); 
                } else { 
                    alert('Failed to save project: ' + (result ? result.error : 'Unknown error')); 
                }
            };
        }
        
        // --- INITIALIZATION ---
        function addProjectListActionListeners(projects) {
            document.querySelectorAll('.project-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    // Prevent clicks on action buttons from triggering detail view
                    if (e.target.closest('button')) return; 
                    document.querySelectorAll('.project-row').forEach(r => r.classList.remove('table-row-selected'));
                    row.classList.add('table-row-selected');
                    renderProjectDetails(row.dataset.projectId);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation(); // Stop event bubbling to row click listener
                const projectId = e.currentTarget.dataset.projectId;
                const project = currentProjectsData.find(p => p.project_id == projectId); 
                if (project) {
                    showProjectModal(project);
                }
            }));

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async e => {
                e.stopPropagation(); // Stop event bubbling to row click listener
                const projectId = e.currentTarget.dataset.projectId;
                const project = currentProjectsData.find(p => p.project_id == projectId); 
                if(project && confirm(`Are you sure you want to delete project: ${project.title || project.project_id}? This cannot be undone.`)){
                    const result = await apiFetch(`table/Lims/projects/${project.project_id}`, { method: 'DELETE' });
                    if(result.success) {
                        masterCache['lims.project_overview_view'] = null; 
                        initializeProjectsPage(); 
                        document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                        lucide.createIcons();
                    } else alert('Failed to delete project: ' + (result ? result.error : 'Unknown error'));
                }
            }));
        }

        async function initializeProjectsPage(selectedProjectId = null) {
            sortColumn = 'title'; 
            sortDirection = 'asc'; 
            columnFilters = {};
            
            // Fetch from the project_overview_view
            const projectsRaw = await apiFetch('table/Lims/project_overview_view'); 

            if(projectsRaw && !projectsRaw.error) {
                // Map raw data from view to consistent lowercase keys for frontend consumption
                currentProjectsData = projectsRaw.map(p => ({
                    project_id: p.project_id,
                    title: p.title, 
                    status_id: p.status_id,
                    pi_person_id: p.pi_person_id, 
                    pi_full_name: p.pi_full_name, 
                    funder: p.funder,
                    customer_id: p.customer_id,
                    customer_name: p.customer_name, 
                    start_date: p.start_date,
                    end_date: p.end_date,
                    report_date: p.report_date,
                    notes: p.notes, 
                    attachment: p.attachment, 
                    attachment_link: p.attachment_link 
                }));
                
                // Set up filter inputs
                document.querySelectorAll('.filter-input').forEach(input => {
                    input.value = columnFilters[input.dataset.column] || '';
                });

                // Set up sorting and filtering event listeners
                document.querySelectorAll('.sortable-header').forEach(header => {
                    header.addEventListener('click', (e) => {
                        const column = e.currentTarget.dataset.column;
                        if (sortColumn === column) {
                            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                        } else {
                            sortColumn = column;
                            sortDirection = 'asc';
                        }
                        applyFiltersAndSortProjects();
                    });
                });

                document.querySelectorAll('.filter-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const column = e.target.dataset.column;
                        columnFilters[column] = e.target.value.toLowerCase();
                        applyFiltersAndSortProjects();
                    });
                });

                applyFiltersAndSortProjects(); 

                if (selectedProjectId) {
                    setTimeout(() => {
                        const row = document.querySelector(`.project-row[data-project-id="${selectedProjectId}"]`);
                        if (row) {
                            row.classList.add('table-row-selected');
                            renderProjectDetails(selectedProjectId);
                        }
                    }, 50);
                } else {
                     document.getElementById('project-details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="folder-search" class="mx-auto h-12 w-12"></i><p class="mt-2">Select a project to view its details</p></div></div>`;
                     lucide.createIcons();
                }

            } else {
                document.getElementById('projects-table').innerHTML = `<tr><td colspan="4" class="text-center text-red-500 p-4">Error loading projects: ${projectsRaw ? projectsRaw.error : 'Unknown API error'}</td></tr>`;
            }
            document.getElementById('new-project-btn').addEventListener('click', () => showProjectModal());
        }
    </script>
</body>
</html>
