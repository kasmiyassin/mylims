<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMGLab LIMS Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 30px;
            color: #0056b3;
            font-size: 28px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group select {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus,
        .form-group select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .error-message {
            color: #dc3545;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px; /* Reserve space to prevent layout shift */
        }
        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        .register-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>MyMGLab LIMS Login</h2>
        <div class="form-group">
            <label for="userType">User Type:</label>
            <select id="userType" name="userType">
                <option value="personal">Personnel</option>
                <option value="customers">Customer</option>
                <option value="external_contacts">External Contact</option>
            </select>
        </div>
        <div class="form-group">
            <label id="idLabel" for="userId">Personnel ID:</label>
            <input type="text" id="userId" name="userId" placeholder="Enter your ID" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" onclick="handleLogin()">Login</button>
        <div id="errorMessage" class="error-message"></div>
        <div class="register-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        const userTypeSelect = document.getElementById('userType');
        const idLabel = document.getElementById('idLabel');
        const userIdInput = document.getElementById('userId');
        const passwordInput = document.getElementById('password');
        const errorMessageDiv = document.getElementById('errorMessage');

        // Function to update the ID label based on user type selection
        userTypeSelect.addEventListener('change', () => {
            const selectedType = userTypeSelect.value;
            if (selectedType === 'personal') {
                idLabel.textContent = 'Personnel ID:';
                userIdInput.placeholder = 'Enter your Personnel ID';
            } else if (selectedType === 'customers') {
                idLabel.textContent = 'Customer ID:';
                userIdInput.placeholder = 'Enter your Customer ID';
            } else if (selectedType === 'external_contacts') {
                idLabel.textContent = 'Contact ID:';
                userIdInput.placeholder = 'Enter your External Contact ID';
            }
        });

        async function handleLogin() {
            const userType = userTypeSelect.value;
            const userId = userIdInput.value;
            const password = passwordInput.value;
            errorMessageDiv.textContent = ''; // Clear previous errors

            if (!userId || !password) {
                errorMessageDiv.textContent = 'Please enter both ID and password.';
                return;
            }

            try {
                const response = await fetch('/mymglab/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_type: userType,
                        user_id: userId,
                        password: password
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store user info (e.g., in localStorage or sessionStorage)
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html'; // Redirect to dashboard
                } else {
                    errorMessageDiv.textContent = data.error || 'Login failed. Please try again.';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessageDiv.textContent = 'An error occurred. Please try again later.';
            }
        }
    </script>
</body>
</html>
