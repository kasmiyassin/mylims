        // --- MODAL LOGIC (reused from other pages) ---
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        async function showCreateEditModal(record = null, specificTable = null) {
            console.log("Showing create/edit modal. Record:", record, "Specific Table:", specificTable);
            // isEditing means we're modifying an existing record (so PKs are in `record`)
            // If specificTable is provided, it's always a "create" operation for that specific child table,
            // even if `record` contains pre-filled data for foreign keys.
            const isEditing = record !== null && !specificTable; 
            const targetTableName = specificTable || currentTableName; 
            const [schemaName, tableName] = targetTableName.split('.');

            const targetTableSchema = await getTableSchema(schemaName, tableName);
            if (!targetTableSchema || targetTableSchema.error) {
                showToast('Error fetching schema for form: ' + (targetTableSchema ? targetTableSchema.error : 'Unknown error'), "error");
                return;
            }
            
            const pkColumnsForTargetTable = await getPrimaryKeysForTable(schemaName, tableName);

            // Fetch all reference data for dropdowns
            const [persons, statuses, projects, samplesTypes, samplingEvents, cruises, species, units, genes, workflows, workflowSteps, equipment, suppliers, inventoryItems, publicationTypes, referenceDatabases, analysisPipelines] = await Promise.all([ 
                getReferenceData('personal', 'reference'), 
                getReferenceData('status', 'reference'),
                getReferenceData('projects', 'lims'),
                getReferenceData('samples_type', 'reference'),
                // For sampling events, fetch them with location_name for display
                apiFetch('table/lab/sampling?order_by=sampling_date&order_direction=desc&limit=100'), // Limit for performance
                getReferenceData('cruises', 'lims'),
                getReferenceData('species', 'reference'),
                getReferenceData('units', 'reference'),
                getReferenceData('gene', 'reference'),
                getReferenceData('workflows', 'lims'),
                getReferenceData('workflow_steps', 'lims'),
                getReferenceData('equipment', 'lims'),
                getReferenceData('suppliers', 'lims'),
                getReferenceData('inventory_items', 'lims'),
                getReferenceData('publication_type', 'lims'),
                getReferenceData('reference_databases', 'bioinformatics'),
                getReferenceData('analysis_pipelines', 'bioinformatics')
            ]);


            let formFieldsHtml = '';
            targetTableSchema.forEach(col => {
                const isAutoGenerated = col.column_name.includes('_id') && col.column_default && col.column_default.includes('nextval');
                
                // Determine if a field should be hidden (auto-generated on creation)
                const isHiddenField = (!isEditing && isAutoGenerated);
                // Determine if a field should be read-only (primary key when editing, but not auto-generated)
                const isReadOnlyField = (isEditing && pkColumnsForTargetTable.includes(col.column_name) && !isAutoGenerated);
                
                // Allow specific date PKs to be editable as they are part of form input (e.g., experiment_date, sampling_date)
                if (isReadOnlyField && col.data_type === 'date') {
                    isReadOnlyField = false; // Allow editing of date PKs for composite keys
                }

                if (col.column_name.includes('password_hash') || col.column_name.includes('search_vector')) {
                    return; // Always exclude these
                }

                let value = record ? (record[col.column_name] || '') : (col.column_default ? col.column_default.replace(/::[a-z_]+/g, '').replace(/'/g, '') : '');
                // If pre-filled data (from `record` param) is available, use it instead of default/existing value
                if (record && record[col.column_name] !== undefined) {
                    value = record[col.column_name];
                }

                let inputType = 'text'; 
                let extraAttrs = '';
                let label = formatColumnName(col.column_name);
                let optionsHtml = '';

                if (isHiddenField) {
                    // Hidden input for auto-generated fields, no label or display
                    formFieldsHtml += `<input type="hidden" name="${col.column_name}" value="${value}">`;
                    return;
                }

                if (isReadOnlyField) {
                    extraAttrs += ' readonly'; // Mark as read-only for editing PKs
                    // For display consistency, convert date/datetime values to readable format if read-only
                    if (col.data_type === 'date') value = formatDateForInput(value);
                    if (col.data_type === 'timestamp with time zone' || col.data_type === 'timestamp without time zone') value = formatDateTimeForInput(value);
                }

                if (col.column_name === 'attachment') {
                    formFieldsHtml += `
                        <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                            <label class="block text-gray-700 text-sm font-bold mb-1">${label} (File)</label>
                            <input type="file" name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>
                            ${record && record.attachment ? `<p class="text-xs text-gray-500 mt-1">Existing attachment present. Uploading new file will replace it.</p>` : ''}
                        </div>
                    `;
                    return;
                } else if (col.column_name === 'attachment_link') {
                    inputType = 'url';
                }

                switch (col.data_type) {
                    case 'integer':
                    case 'numeric':
                    case 'bigint':
                        inputType = 'text'; // Keep as text to allow flexible input (e.g., with commas/periods)
                        break;
                    case 'date':
                        inputType = 'date';
                        if (value) value = formatDateForInput(value);
                        break;
                    case 'timestamp with time zone':
                    case 'timestamp without time zone':
                        inputType = 'datetime-local';
                        if (value) value = formatDateTimeForInput(value);
                        break;
                    case 'boolean':
                        inputType = 'checkbox';
                        extraAttrs += value ? ' checked' : '';
                        value = ''; // Checkboxes don't use the 'value' attribute this way
                        break;
                    case 'text':
                    case 'character varying':
                        if (col.column_name.includes('notes') || col.column_name.includes('description') || col.column_name.includes('stomach_contents') || col.column_name.includes('weather_conditions') || col.column_name.includes('protocol_text')) {
                            formFieldsHtml += `
                                <div class="md:col-span-2 ${col.column_name === 'notes' || col.column_name === 'description' || col.column_name.includes('stomach_contents') || col.column_name.includes('weather_conditions') ? 'md:col-span-2' : ''} ${isReadOnlyField ? 'opacity-70' : ''}">
                                    <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                    <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value}</textarea>
                                </div>
                            `;
                            return;
                        }
                        break;
                    case 'jsonb':
                        formFieldsHtml += `
                            <div class="md:col-span-2 ${isReadOnlyField ? 'opacity-70' : ''}">
                                <label class="block text-gray-700 text-sm font-bold mb-1">${label} (JSON)</label>
                                <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value ? JSON.stringify(value, null, 2) : ''}</textarea>
                            </div>
                        `;
                        return;
                    case 'USER-DEFINED': // For geometry type from PostGIS
                        if (col.column_name.includes('geom')) {
                             formFieldsHtml += `
                                <div class="md:col-span-2 ${isReadOnlyField ? 'opacity-70' : ''}">
                                    <label class="block text-gray-700 text-sm font-bold mb-1">${label} (WKT/GeoJSON)</label>
                                    <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value ? (value.wkt || JSON.stringify(value)) : ''}</textarea>
                                    <p class="text-xs text-gray-500 mt-1">Enter as WKT (e.g., POINT(lon lat)) or GeoJSON string.</p>
                                </div>
                            `;
                            return;
                        }
                        break;
                }

                // Handle dropdowns for foreign keys
                if (col.column_name.endsWith('_id')) { // Check for _id for FKs
                    let refData = [];
                    let valueKey = col.column_name;
                    let displayKey = col.column_name; 

                    if (col.column_name.includes('person_id') && persons) {
                        refData = persons; displayKey = 'full_name';
                    } else if (col.column_name.includes('status_id') && statuses) {
                        refData = statuses; displayKey = 'status_id';
                    } else if (col.column_name.includes('project_id') && projects) {
                        refData = projects; displayKey = 'title';
                    } else if (col.column_name.includes('sample_type_id') && samplesTypes) {
                        refData = samplesTypes; displayKey = 'sample_type_abrv';
                    } else if (col.column_name.includes('sampling_id') && samplingEvents) {
                         refData = samplingEvents; 
                         displayKey = 'sampling_id'; // Display sampling ID, or location if preferred
                         optionsHtml = `<option value="">-- Select ${label} --</option>`;
                         optionsHtml += refData.map(item => `<option value="${item.sampling_id}" ${value == item.sampling_id ? 'selected' : ''}>${item.sampling_id} (${item.location_name || 'N/A'})</option>`).join('');
                         // Add sampling_date as a hidden field if sampling_id is selected and it's a composite PK
                         // This is crucial for tables that use (sampling_id, sampling_date) as a composite PK/FK
                         const samplingIdValue = record ? record.sampling_id : null;
                         const matchingSamplingEvent = samplingEvents.find(s => s.sampling_id === samplingIdValue);
                         if (matchingSamplingEvent && matchingSamplingEvent.sampling_date) {
                             formFieldsHtml += `<input type="hidden" name="sampling_date_from_sampling_id" value="${formatDateForInput(matchingSamplingEvent.sampling_date)}">`;
                         }
                         formFieldsHtml += `
                             <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                                 <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                 <select name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>${optionsHtml}</select>
                             </div>
                         `;
                         return; // Handled
                    } else if (col.column_name.includes('cruise_id') && cruises) {
                         refData = cruises; displayKey = 'cruise_id';
                    } else if (col.column_name.includes('species_id') && species) {
                         refData = species; displayKey = 'en_name';
                    } else if (col.column_name.includes('unit_id') && units) {
                         refData = units; displayKey = 'unit_abbreviation';
                    } else if (col.column_name.includes('gene_id') && genes) {
                         refData = genes; displayKey = 'gene_id';
                    } else if (col.column_name.includes('workflow_id') && workflows) {
                         refData = workflows; displayKey = 'workflow_name';
                    } else if (col.column_name.includes('step_id') && workflowSteps) {
                         refData = workflowSteps; displayKey = 'step_name'; 
                    } else if (col.column_name.includes('equipment_id') && equipment) {
                         refData = equipment; displayKey = 'equipment_name';
                    } else if (col.column_name.includes('supplier_id') && suppliers) {
                         refData = suppliers; displayKey = 'supplier_name';
                    } else if (col.column_name.includes('item_id') && inventoryItems) {
                         refData = inventoryItems; displayKey = 'item_name';
                    } else if (col.column_name.includes('publication_type_id') && publicationTypes) {
                         refData = publicationTypes; displayKey = 'publication_type_id';
                    } else if (col.column_name.includes('db_id') && referenceDatabases) {
                         refData = referenceDatabases; displayKey = 'db_name';
                    } else if (col.column_name.includes('pipeline_id') && analysisPipelines) {
                         refData = analysisPipelines; displayKey = 'pipeline_name';
                    } 
                    
                    if (refData.length > 0) {
                        optionsHtml = `<option value="">-- Select ${label} --</option>`;
                        optionsHtml += refData.map(item => `<option value="${item[valueKey]}" ${value == item[valueKey] ? 'selected' : ''}>${item[displayKey] || item[valueKey]}</option>`).join('');
                        formFieldsHtml += `
                            <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                                <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                <select name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>${optionsHtml}</select>
                            </div>
                        `;
                        return;
                    }
                }

                // Default input field for remaining columns
                formFieldsHtml += `
                    <div class="${isHiddenField ? 'hidden' : ''} ${isReadOnlyField ? 'opacity-70' : ''}">
                        <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                        <input type="${inputType}" name="${col.column_name}" ${col.is_nullable === 'NO' && !col.column_default && !isEditing && !isHiddenField ? 'required' : ''} class="w-full mt-1 p-2 border rounded" value="${value}" ${extraAttrs} ${isReadOnlyField ? 'readonly' : ''}>
                    </div>
                `;
            });

            const modalTitle = isEditing ? `Edit ${formatColumnName(tableName)} Record` : `Create New ${formatColumnName(tableName)} Record`;
            const submitButtonText = isEditing ? 'Save Changes' : 'Create Record';

            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl max-h-[90vh] overflow-y-auto transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">${modalTitle}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <form id="record-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${formFieldsHtml}
                            </div>
                            <div class="pt-4 flex justify-end">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                                    ${submitButtonText}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('record-form').onsubmit = async (e) => {
                e.preventDefault();
                
                const formElement = e.target;
                const attachmentInput = formElement.querySelector('input[name="attachment"]');
                const hasFileSelected = attachmentInput && attachmentInput.files && attachmentInput.files.length > 0;
                
                let body;
                if (hasFileSelected) {
                    console.log("File detected. Using FormData for submission.");
                    body = new FormData(formElement);
                } else {
                    console.log("No file selected. Using JSON for submission.");
                    body = {};
                    const formData = new FormData(formElement);
                    formData.forEach((value, key) => {
                        const colSchema = targetTableSchema.find(s => s.column_name === key);
                        if (colSchema && (colSchema.data_type === 'integer' || colSchema.data_type === 'numeric' || colSchema.data_type === 'bigint')) {
                            body[key] = value === '' ? null : Number(value.replace(',', '.'));
                        } else if (colSchema && colSchema.data_type === 'boolean') {
                            body[key] = formElement.querySelector(`[name="${key}"]`).checked; 
                        } else if (colSchema && colSchema.data_type === 'jsonb') {
                            try {
                                body[key] = value === '' ? null : JSON.parse(value);
                            } catch (jsonError) {
                                showToast(`Invalid JSON for ${formatColumnName(key)}: ${jsonError.message}`, "error");
                                throw new Error(`Invalid JSON for ${formatColumnName(key)}`);
                            }
                        } else if (colSchema && colSchema.data_type.startsWith('geometry')) {
                             try {
                                 if (value.toUpperCase().startsWith('POINT(') && value.toUpperCase().endsWith(')')) {
                                     body[key] = value; 
                                 } else if (value.trim().startsWith('{') && value.trim().endsWith('}')) {
                                     body[key] = JSON.parse(value);
                                 } else {
                                     body[key] = null; 
                                     showToast(`Invalid geometry format for ${formatColumnName(key)}. Please use WKT (e.g., POINT(lon lat)) or GeoJSON.`, "error");
                                     throw new Error("Invalid geometry format.");
                                 }
                             } catch (geomError) {
                                 body[key] = null;
                                 showToast(`Error parsing geometry for ${formatColumnName(key)}: ${geomError.message}`, "error");
                                 throw new Error(`Error parsing geometry for ${formatColumnName(key)}`);
                             }
                         } else if (key === 'sampling_date_from_sampling_id') {
                            // This is a helper field, not a direct column, so don't include in body for backend
                            return;
                         }
                        else {
                            body[key] = value === '' ? null : value;
                        }
                    });

                    // For composite PKs involving a date, ensure the date component is present if it's not auto-generated
                    // and might have been selected via an ID (e.g., sampling_id)
                    const datePkColumn = pkColumnsForTargetTable.find(pk => pk.includes('date'));
                    if (!isEditing && datePkColumn && !body[datePkColumn]) {
                        const associatedDate = formElement.querySelector('[name="sampling_date_from_sampling_id"]');
                        if (associatedDate && associatedDate.value) {
                            body[datePkColumn] = associatedDate.value;
                        }
                    }
                }

                const method = isEditing ? 'PUT' : 'POST';
                
                let endpoint = `table/${schemaName}/${tableName}`;
                let recordForDetailsUpdate = record; // Use current record for refreshing details after update/create

                if (isEditing) {
                    const pkValuesForApi = {};
                    const originalPkValues = getPkValues(record); // Get PKs from the original record
                    for (const key in originalPkValues) {
                        const colSchema = targetTableSchema.find(s => s.column_name === key);
                        if (colSchema && colSchema.data_type === 'date') {
                            pkValuesForApi[key] = formatDateForInput(originalPkValues[key]);
                        } else {
                            pkValuesForApi[key] = originalPkValues[key];
                        }
                    }
                    const pkQueryString = new URLSearchParams(pkValuesForApi).toString();
                    endpoint += `?${pkQueryString}`;
                    console.log("Edit endpoint with PKs:", endpoint);
                }
                
                console.log(`Submitting form: Method=${method}, Endpoint=${endpoint}, Body:`, body);
                const result = await apiFetch(endpoint, { method, body });
                if (result && !result.error) { 
                    console.log("API call successful:", result);
                    showToast(`${isEditing ? 'Updated' : 'Created'} record successfully!`, "success");
                    closeModal(); 
                    // Refresh the main table list
                    loadAndRenderTable(currentTableName); 

                    // After successful creation/update, refresh the sample details view
                    // (always refresh the main sample details if a child was added/edited, or if the main sample was edited)
                    if (recordForDetailsUpdate && recordForDetailsUpdate.sample_id) { // If there was a parent sample to refresh
                        const mainSamplePkValues = {
                            sample_id: recordForDetailsUpdate.sample_id,
                            sampling_date: recordForDetailsUpdate.sampling_date ? formatDateForInput(recordForDetailsUpdate.sampling_date) : undefined
                        };
                        setTimeout(() => {
                            renderSampleDetails(mainSamplePkValues);
                        }, 100);
                    } else if (result.sample_id && result.sampling_date) { // If a new main sample was just created
                        const newSamplePkValues = {
                            sample_id: result.sample_id,
                            sampling_date: formatDateForInput(result.sampling_date)
                        };
                        setTimeout(() => {
                            renderSampleDetails(newSamplePkValues);
                        }, 100);
                    }
                } else {
                    console.error("API call failed:", result);
                    showToast(`Failed to ${isEditing ? 'save' : 'create'} record: ` + (result ? result.error : 'Unknown error'), "error");
                }
            };
        }

        async function showBulkUploadModal() {
            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">Bulk CSV Upload for ${formatColumnName(currentTableName.split('.')[1])}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <p class="text-gray-700 mb-4">Upload a CSV file. The first row should contain column headers matching your database table.</p>
                        <input type="file" id="csv-file-input" accept=".csv" class="w-full p-2 border rounded mb-4">
                        <div class="flex justify-between space-x-2">
                            <button id="download-csv-template-btn-modal" class="w-1/2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="download" class="w-5 h-5 mr-2"></i>Download Template
                            </button>
                            <button id="upload-csv-btn" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="upload" class="w-5 h-5 mr-2"></i>Bulk CSV Upload
                            </button>
                        </div>
                        <div id="upload-status" class="mt-4 text-center text-sm"></div>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('download-csv-template-btn-modal').addEventListener('click', downloadCsvTemplate);

            document.getElementById('upload-csv-btn').addEventListener('click', () => {
                const fileInput = document.getElementById('csv-file-input');
                const statusDiv = document.getElementById('upload-status');
                const file = fileInput.files[0];

                if (!file) {
                    showToast("Please select a CSV file.", "error");
                    return;
                }

                statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Processing CSV...</p>`;
                lucide.createIcons();

                PapaParse.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        if (results.errors.length) {
                            showToast(`CSV parsing errors: ${results.errors.map(e => e.message).join(', ')}`, "error");
                            return;
                        }
                        if (!results.data.length) {
                            showToast("No data found in CSV.", "error");
                            return;
                        }

                        const recordsToUpload = results.data.map(row => {
                            const newRow = {};
                            for (const key in row) {
                                newRow[key] = row[key] === '' ? null : row[key];
                            }
                            return newRow;
                        });

                        statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Uploading ${recordsToUpload.length} records...</p>`;
                        lucide.createIcons();

                        const [schemaName, tableName] = currentTableName.split('.');
                        const result = await apiFetch(`table/${schemaName}/${tableName}/batch_upload`, {
                            method: 'POST',
                            body: recordsToUpload
                        });

                        if (result && result.success) {
                            showToast(`Successfully uploaded ${result.inserted_rows} records!`, "success");
                            loadAndRenderTable(currentTableName);
                            setTimeout(closeModal, 2000);
                        } else {
                            showToast(`Bulk upload failed: ${result ? result.error : 'Unknown error'}`, "error");
                        }
                        lucide.createIcons();
                    }
                });
            });
        }

        async function downloadCsvTemplate(fullTableName) {
            console.log("downloadCsvTemplate called for:", fullTableName);
            if (!fullTableName) {
                showToast("Please select a table to download its template.", "error"); // Changed alert to toast
                return;
            }

            const [schemaName, tableName] = fullTableName.split('.');
            const schema = await getTableSchema(schemaName, tableName);

            if (!schema || schema.error) {
                console.error("Failed to fetch table schema for template:", schema ? schema.error : 'Unknown error');
                showToast('Failed to fetch table schema for template: ' + (schema ? schema.error : 'Unknown error'), "error"); // Changed alert to toast
                return;
            }

            const headers = schema.filter(col => 
                !col.column_name.includes('attachment') && 
                !col.column_name.includes('password_hash') && 
                !col.column_name.includes('search_vector') &&
                !col.column_name.includes('geom') && // Exclude PostGIS geometry columns
                !(col.column_default && col.column_default.includes('nextval')) && // Exclude auto-generated default values
                !col.column_name.includes('created_at') && // Exclude audit columns
                !col.column_name.includes('last_modified_at') // Exclude audit columns
            ).map(col => col.column_name);

            // Add back primary key columns if they were filtered out by the above logic
            // For template, usually you want all columns for user to fill
            const pkCols = await getPrimaryKeysForTable(schemaName, tableName);
            pkCols.forEach(pkCol => {
                const pkColSchema = schema.find(c => c.column_name === pkCol);
                // Only prepend if it's a primary key not auto-generated
                if (pkColSchema && !(pkColSchema.column_default && pkColSchema.column_default.includes('nextval'))) {
                    if (!headers.includes(pkCol)) {
                        headers.unshift(pkCol);
                    }
                }
            });
            
            console.log("CSV Template Headers:", headers);
            const csv = unparseCSV([headers], { header: false }); //
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${tableName}_template.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            console.log("CSV template download initiated.");
            showToast("Template downloaded successfully!", "success");
        }

        async function showBulkModifyModal() {
            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">Bulk Modify for ${formatColumnName(currentTableName.split('.')[1])}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <p class="text-gray-700 mb-4">Upload a CSV or JSON file containing records to update. Each record must include all primary key column(s) for identification, and any fields you wish to modify.</p>
                        <input type="file" id="bulk-modify-file-input" accept=".csv,.json" class="w-full p-2 border rounded mb-4">
                        <div class="flex justify-between space-x-2">
                            <button id="download-bulk-modify-template-btn-modal" class="w-1/2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="download" class="w-5 h-5 mr-2"></i>Download Template
                            </button>
                            <button id="perform-bulk-modify-btn" class="w-1/2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="file-edit" class="w-5 h-5 mr-2"></i>Perform Bulk Modify
                            </button>
                        </div>
                        <div id="modify-status" class="mt-4 text-center text-sm"></div>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('download-bulk-modify-template-btn-modal').addEventListener('click', downloadBulkModifyTemplate);


            document.getElementById('perform-bulk-modify-btn').addEventListener('click', () => {
                const fileInput = document.getElementById('bulk-modify-file-input');
                const statusDiv = document.getElementById('modify-status');
                const file = fileInput.files[0];

                if (!file) {
                    showToast("Please select a file (CSV or JSON).", "error");
                    return;
                }

                statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Processing file...</p>`;
                lucide.createIcons();

                const reader = new FileReader();
                reader.onload = async (e) => {
                    let recordsToModify = [];
                    try {
                        if (file.type === 'application/json') {
                            recordsToModify = JSON.parse(e.target.result);
                            if (!Array.isArray(recordsToModify)) {
                                throw new Error("JSON file must contain an array of objects.");
                            }
                        } else if (file.type === 'text/csv') {
                            const parseResult = PapaParse.parse(e.target.result, { header: true, skipEmptyLines: true });
                            if (parseResult.errors.length) {
                                throw new Error(`CSV parsing errors: ${parseResult.errors.map(err => err.message).join(', ')}`);
                            }
                            recordsToModify = parseResult.data;
                        } else {
                            throw new Error("Unsupported file type. Please upload a CSV or JSON file.");
                        }

                        if (!recordsToModify.length) {
                            showToast("No records found in the file.", "error");
                            return;
                        }

                        const recordsToModifyCleaned = recordsToModify.map(row => {
                            const newRow = {};
                            for (const key in row) {
                                newRow[key] = row[key] === '' ? null : row[key];
                            }
                            return newRow;
                        });

                        statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Performing bulk update on ${recordsToModifyCleaned.length} records...</p>`;
                        lucide.createIcons();

                        const [schemaName, tableName] = currentTableName.split('.');
                        const result = await apiFetch(`table/${schemaName}/${tableName}/batch_update`, {
                            method: 'PUT',
                            body: recordsToModifyCleaned
                        });

                        if (result && result.success) {
                            showToast(`Successfully updated ${result.updated_rows} records!`, "success");
                            loadAndRenderTable(currentTableName);
                            setTimeout(closeModal, 2000);
                        } else {
                            showToast(`Bulk modify failed: ${result ? result.error : 'Unknown error'}`, "error");
                        }
                        lucide.createIcons();

                    } catch (error) {
                        console.error("Bulk modify file processing error:", error);
                        statusDiv.innerHTML = `<p class="text-red-500">Error processing file: ${error.message}</p>`;
                        lucide.createIcons();
                    }
                };
                reader.readAsText(file);
            });
        }

        async function downloadBulkModifyTemplate() {
            console.log("downloadBulkModifyTemplate called.");
            console.log("Attempting to download Bulk Modify template for:", currentTableName);
            const [schemaName, tableName] = currentTableName.split('.');
            const schema = await getTableSchema(schemaName, tableName);
            const pkColumns = await getPrimaryKeysForTable(schemaName, tableName);

            if (!schema || schema.error) {
                showToast('Failed to fetch table schema for template: ' + (schema ? schema.error : 'Unknown error'), "error");
                return;
            }

            let headers = pkColumns;
            
            const commonEditableColumns = schema.filter(col => 
                !pkColumns.includes(col.column_name) && 
                !col.column_name.includes('attachment') && 
                !col.column_name.includes('password_hash') && 
                !col.column_name.includes('search_vector') &&
                !col.column_name.includes('geom') && 
                !col.column_name.includes('created_at') &&
                !(col.column_default && col.column_default.includes('nextval'))
            ).map(col => col.column_name);

            headers = [...new Set([...headers, ...commonEditableColumns])];

            console.log("Bulk Modify Template Headers:", headers);
            const csv = PapaParse.unparse([headers], { header: false });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${tableName}_bulk_modify_template.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            console.log("Bulk modify template download initiated.");
            showToast("Bulk modify template downloaded successfully!", "success");
        }

        async function initializePage() {
            setupTabListeners();
            await populateDynamicTableSelect();
            await loadAndRenderTable(currentTableName); 

            document.getElementById('add-single-entry-btn').addEventListener('click', () => showCreateEditModal(null, 'lab.samples')); 
            document.getElementById('bulk-csv-upload-btn').addEventListener('click', showBulkUploadModal);
            document.getElementById('bulk-modify-btn').addEventListener('click', showBulkModifyModal);
            // This button now directly calls downloadCsvTemplate for the currently active table.
            document.getElementById('download-template-general-btn').addEventListener('click', () => downloadCsvTemplate(currentTableName));
        }

        function setupTabListeners() {
            const tabSamplesView = document.getElementById('tab-samples-view'); 
            const dynamicTableSelect = document.getElementById('dynamic-table-select');

            tabSamplesView.addEventListener('click', () => { 
                tabSamplesView.classList.add('active'); 
                dynamicTableSelect.classList.remove('active');
                dynamicTableSelect.value = 'lab.detailed_samples_view'; 
                currentTableName = 'lab.detailed_samples_view'; 
                loadAndRenderTable(currentTableName);
            });

            dynamicTableSelect.addEventListener('change', (e) => {
                tabSamplesView.classList.remove('active'); 
                dynamicTableSelect.classList.add('active');
                currentTableName = e.target.value;
                loadAndRenderTable(currentTableName);
            });
        }

        async function populateDynamicTableSelect() {
            const select = document.getElementById('dynamic-table-select');
            const sampleTables = await getAllSampleTables(); 
            
            select.innerHTML = '<option value="">-- Select Sample Sub-Table --</option>'; 
            select.innerHTML += `<option value="lab.detailed_samples_view">lab.detailed_samples_view (Overview)</option>`; 
            select.innerHTML += `<option value="lab.samples">lab.samples (Core Data)</option>`; 

            if (sampleTables && !sampleTables.error) {
                const otherSampleTables = sampleTables.filter(t => t !== 'lab.samples' && t !== 'lab.detailed_samples_view'); 
                otherSampleTables.forEach(table => {
                    select.innerHTML += `<option value="${table}">${table}</option>`;
                });
            }
            select.value = currentTableName;
        }

        async function loadAndRenderTable(fullTableName) {
            console.log(`loadAndRenderTable: Attempting to load data for ${fullTableName}`);
            currentTableName = fullTableName;
            const [schemaName, tableName] = fullTableName.split('.');
            
            sortColumn = null;
            sortDirection = 'asc';
            columnFilters = {};
            document.querySelectorAll('.filter-input').forEach(input => input.value = '');

            const tableBody = document.getElementById('dynamic-table-body');
            tableBody.innerHTML = `<tr><td colspan="100%" class="text-center p-4 text-gray-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Loading data...</td></tr>`;
            lucide.createIcons();

            const [data, schema, pkInfo] = await Promise.all([
                apiFetch(`table/${schemaName}/${tableName}`),
                getTableSchema(schemaName, tableName),
                getPrimaryKeysForTable(schemaName, tableName)
            ]);

            if (data && !data.error && schema && !schema.error && pkInfo && !pkInfo.error) {
                console.log(`Successfully loaded data for ${fullTableName}. Data count: ${data.length}`);
                currentTableData = data;
                currentTableSchema = schema;
                pkMappingCache[`pk.${fullTableName}`] = pkInfo; // Update PK cache
                applyFiltersAndSort();
                // Ensure the "Download Template" button is enabled if a table is successfully loaded
                const downloadButton = document.getElementById('download-template-general-btn');
                if (downloadButton) {
                    downloadButton.disabled = false;
                }
            } else {
                console.error(`Failed to load data for ${fullTableName}. Data error: ${data ? data.error : 'N/A'}, Schema error: ${schema ? schema.error : 'N/A'}`);
                tableBody.innerHTML = `<tr><td colspan="100%" class="text-center p-4 text-red-500">Error loading data for ${fullTableName}: ${data ? data.error : schema ? schema.error : 'Unknown error'}</td></tr>`;
                // Disable the "Download Template" button if table loading fails
                const downloadButton = document.getElementById('download-template-general-btn');
                if (downloadButton) {
                    downloadButton.disabled = true;
                }
            }
        }
