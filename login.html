<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TIFI LIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 mb-4">
                <i data-lucide="flask-conical" class="text-blue-600 w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">TIFI LIMS</h1>
            <p class="text-gray-500 text-sm mt-1">Sign in to access the system</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username / ID</label>
                <input type="text" id="username" name="username" required 
                    class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. kasmi">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
            </div>

            <div id="errorMessage" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded-md border border-red-200 text-center"></div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors duration-200 shadow-sm">
                Sign In
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // Dynamic API Path for Proxy support
        const getApiBase = () => {
            const path = window.location.pathname;
            // If path contains /mylims, assume we are behind proxy and prepend it to API calls
            if (path.includes('/mylims')) return '/mylims/api';
            return '/api';
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Authenticating...";
            errorMsg.classList.add('hidden');
            
            try {
                const API = getApiBase();
                // We use /login here, app.py handles both /api/login and /api/auth/login
                const response = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('token', data.access_token);
                    sessionStorage.setItem('user', JSON.stringify(data.user_info));
                    window.location.href = 'tables.html';
                } else {
                    const err = await response.json();
                    errorMsg.textContent = err.detail || "Login failed";
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Server connection failed. Is backend running?";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
