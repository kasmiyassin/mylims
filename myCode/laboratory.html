<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory - TIFI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .management-card { transition: all 0.2s ease-in-out; }
        .management-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

        /* New styles for filter/sort */
        .sortable-header { 
            cursor: pointer; 
            user-select: none; 
            display: flex; /* Use flex to align text and icon */
            align-items: center;
            justify-content: space-between; /* Space out title and icon */
            padding-right: 8px; /* Give some space for the icon */
        }
        .sortable-header:hover { background-color: #e2e8f0; }
        .sort-icon { display: inline-block; width: 16px; height: 16px; vertical-align: middle; margin-left: 4px; flex-shrink: 0; }
        .filter-input {
            width: calc(100% - 10px); /* Adjust width to fit within header */
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            font-size: 0.75rem; /* text-xs */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="main-app">
        <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-white w-64 p-4 flex flex-col">
            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI</span></div>
            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="map-pin" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="book-text" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md active"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>
                <a href="labeling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="Printer" class="w-5 h-5 mr-3"></i><span>Labeling</span></a>
                <a href="workflow.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="workflow" class="w-5 h-5 mr-3"></i><span>Workflow</span></a>
                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
            </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>
            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div id="page-container">
                </div>
        </div>
        <div id="modal-container"></div>
    </div>

    <script>
        // --- AUTH & SETUP ---
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api'; // const API_BASE_URL = `http://${window.location.hostname}:5200/api`;
        let masterCache = {}; // Stores raw data for each table
        let currentSchema = '';
        let currentTableName = '';
        let currentTableData = []; // The raw data for the currently displayed table
        let filteredAndSortedData = []; // The data after applying filters and sorts
        
        // State for sorting and filtering for the current table
        let sortColumn = null;
        let sortDirection = 'asc'; // 'asc' or 'desc'
        let columnFilters = {}; // { 'columnName': 'filterText' }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            renderDashboard();
        });

        // --- DATABASE & SCHEMA INFORMATION ---
        const labManagementConfig = {
            'Lims': {
                icon: 'sliders-horizontal', color: 'text-blue-500',
                tables: [
                    { name: 'Equipment', icon: 'server' }, 
                    { name: 'Reagents', icon: 'beaker' },
                    { name: 'SOP', icon: 'file-text' }, 
                    { name: 'orders', icon: 'shopping-cart' }
                ]
            },
            'Reference': {
                icon: 'book-marked', color: 'text-indigo-500',
                tables: [
                    { name: 'Personal', icon: 'users' },
                    { name: 'Species', icon: 'fish' },
                    { name: 'Genes', icon: 'dna' },
                    { name: 'Location', icon: 'map-pin' },
                    { name: 'Room', icon: 'building-2' },
                    { name: 'Status', icon: 'tags' },
                    { name: 'Category', icon: 'folder-open' },
                    { name: 'SamplesType', icon: 'shapes' },
                ]
            }
        };

        const foreignKeyMap = {
            'equipment': { 'room_id': { schema: 'Reference', table: 'Room', valueColumn: 'room_id', displayColumn: 'description' } },
            'reagents': { 'category': { schema: 'Reference', table: 'Category', valueColumn: 'category', displayColumn: 'category' }, 'storage_id': { schema: 'Lab', table: 'Storage', valueColumn: 'storage_id', displayColumn: 'storage_id'}, 'status_id': { schema: 'Reference', table: 'Status', valueColumn: 'status_id', displayColumn: 'status_id'}},
            'sop': { 'author': { schema: 'Reference', table: 'Personal', valueColumn: 'person_id', displayColumn: 'person' }},
            'orders': { 'category': { schema: 'Reference', table: 'Category', valueColumn: 'category', displayColumn: 'category'}, 'project_id': {schema: 'Lims', table: 'Projects', valueColumn: 'project_id', displayColumn: 'Title'}, 'status_id': {schema: 'Reference', table: 'Status', valueColumn: 'status_id', displayColumn: 'status_id'}}
        };

        // --- API & DATA HANDLING ---
        async function apiFetch(endpoint, options = {}) { 
            try {
                const isJson = !(options.body instanceof FormData);
                if (isJson && options.body) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const errText = await response.text();
                    try { const errJson = JSON.parse(errText); throw new Error(errJson.error || 'API request failed'); }
                    catch { throw new Error(errText); }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getTableData(schema, tableName) {
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey] && masterCache[cacheKey].length > 0) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if (data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        // --- UI RENDERING ---
        function renderDashboard() {
            const container = document.getElementById('page-container');
            let html = `<h1 class="text-3xl font-bold text-gray-800 mb-6">Laboratory & Reference Data</h1>`;
            
            for (const [schema, config] of Object.entries(labManagementConfig)) {
                html += `<div class="mb-8"><h2 class="text-2xl font-semibold mb-4 flex items-center ${config.color}"><i data-lucide="${config.icon}" class="w-6 h-6 mr-3"></i>${schema} Management</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">`;
                config.tables.forEach(table => {
                    html += `<div class="management-card card p-6 text-center cursor-pointer flex flex-col items-center justify-center" onclick="renderTableManager('${schema}', '${table.name}')">
                                 <i data-lucide="${table.icon}" class="h-12 w-12 text-gray-400 mb-2"></i>
                                 <p class="font-semibold text-lg">${table.name}</p>
                               </div>`;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
            lucide.createIcons();
        }

        async function renderTableManager(schema, tableName) {
            currentSchema = schema;
            currentTableName = tableName;
            // Reset filters and sort state when changing tables
            sortColumn = null;
            sortDirection = 'asc';
            columnFilters = {};

            const container = document.getElementById('page-container');
            container.innerHTML = `<div class="card p-6"><p class="text-gray-500">Loading ${tableName} data...</p></div>`;
            
            const data = await getTableData(schema, tableName);
            if (!data || data.error) {
                container.innerHTML = `<div class="card p-6 text-red-500">Error loading data for ${tableName}.</div>`;
                return;
            }
            
            currentTableData = data; // Store the raw data
            const headers = data.length > 0 ? Object.keys(data[0]) : [];
            
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <button id="back-to-dash" class="text-blue-600 hover:underline flex items-center mb-2"><i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back to Overview</button>
                        <h1 class="text-3xl font-bold text-gray-800">Manage ${tableName}</h1>
                    </div>
                    <div class="flex space-x-2">
                        <button id="bulk-upload-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center"><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Bulk Import</button>
                        <button id="add-new-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>Add New</button>
                    </div>
                </div>
                <div class="card p-4">
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-sm">
                            <thead class="bg-gray-50 sticky top-0"><tr>
                                ${headers.map(h => `
                                    <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">
                                        <div class="sortable-header" data-column="${h}">
                                            <span>${h.replace(/_/g, ' ')}</span>
                                            <i data-lucide="chevrons-up-down" class="sort-icon text-gray-400"></i>
                                        </div>
                                        <input type="text" placeholder="Filter..." class="filter-input" data-column="${h}" value="${columnFilters[h] || ''}">
                                    </th>
                                `).join('')}
                                <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
                            </tr></thead>
                            <tbody id="data-table-body" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>`;
            container.innerHTML = html;
            lucide.createIcons();

            document.getElementById('back-to-dash').addEventListener('click', renderDashboard);
            document.getElementById('add-new-btn').addEventListener('click', () => showItemModal(schema, tableName, null, headers));
            document.getElementById('bulk-upload-btn').addEventListener('click', () => showUploadModal(schema, tableName, headers));

            // Add event listeners for sorting and filtering
            document.querySelectorAll('.sortable-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const column = e.currentTarget.dataset.column;
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }
                    applyFiltersAndSort();
                });
            });

            document.querySelectorAll('.filter-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const column = e.target.dataset.column;
                    columnFilters[column] = e.target.value.toLowerCase();
                    applyFiltersAndSort();
                });
            });
            
            applyFiltersAndSort(); // Initial render with default sort/filters
            addTableActionListeners(schema, tableName); // Action listeners need to be attached after rows are rendered
        }

        // --- NEW: Function to apply filters and sorting ---
        function applyFiltersAndSort() {
            let tempArray = [...currentTableData]; // Start with the raw data

            // Apply filters
            for (const column in columnFilters) {
                const filterText = columnFilters[column];
                if (filterText) {
                    tempArray = tempArray.filter(row => 
                        String(row[column] || '').toLowerCase().includes(filterText)
                    );
                }
            }

            // Apply sorting
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();

                    // Handle numerical sorting if applicable (for 'nr', 'volume', 'concentration', etc.)
                    if (!isNaN(parseFloat(valA)) && !isNaN(parseFloat(valB)) && sortColumn !== 'nr') { // Exclude 'nr' from numerical sort as it's often an ID
                        return sortDirection === 'asc' ? parseFloat(valA) - parseFloat(valB) : parseFloat(valB) - parseFloat(valA);
                    }
                    // Handle date sorting if applicable
                    if (sortColumn.toLowerCase().includes('date')) {
                        const dateA = new Date(valA);
                        const dateB = new Date(valB);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; // Don't sort invalid dates
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    // Default to string comparison
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            filteredAndSortedData = tempArray;
            renderTableRows(filteredAndSortedData, Object.keys(currentTableData.length > 0 ? currentTableData[0] : {}));
            updateSortIcons(); // Update the visual sort indicators
        }

        // --- NEW: Function to render only the table body ---
        function renderTableRows(dataToRender, headers) {
            const tableBody = document.getElementById('data-table-body');
            tableBody.innerHTML = dataToRender.map(row => {
                // Determine the primary key for the row. Assuming 'nr' is always the primary key.
                // If not, you'll need a way to dynamically determine the PK for each table.
                const pk = row.nr || row[Object.keys(row)[0]]; // Fallback if 'nr' isn't present
                return `<tr class="hover:bg-gray-50" data-pk="${pk}">
                    ${headers.map(h => {
                        let val = row[h];
                        // Special formatting for dates
                        if (h.toLowerCase().includes('date') && val) {
                            try {
                                const dateObj = new Date(val);
                                // Check if the date is valid before formatting
                                val = isNaN(dateObj.getTime()) ? val : dateObj.toLocaleDateString();
                            } catch (e) {
                                // If parsing fails, keep original value
                                val = val;
                            }
                        }
                        return `<td class="px-4 py-2 whitespace-nowrap">${val === null || val === undefined ? '' : val}</td>`;
                    }).join('')}
                    <td class="px-4 py-2 flex justify-end space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-pk="${pk}"><i data-lucide="edit"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-pk="${pk}"><i data-lucide="trash-2"></i></button>
                    </td>
                </tr>`;
            }).join('');
            lucide.createIcons(); // Re-create icons for new rows
            addTableActionListeners(currentSchema, currentTableName); // Re-attach action listeners to new rows
        }

        // --- NEW: Function to update sort icons ---
        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => {
                const column = icon.closest('.sortable-header').dataset.column;
                icon.setAttribute('data-lucide', 'chevrons-up-down'); // Reset all to default icon
            });
            if (sortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${sortColumn}"] i`);
                if (currentSortIcon) {
                    currentSortIcon.setAttribute('data-lucide', sortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
                }
            }
            lucide.createIcons(); // Re-render icons after changing attributes
        }


        function addTableActionListeners(schema, tableName) {
            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation(); // Prevent row click from triggering
                const pk = e.currentTarget.dataset.pk;
                const item = currentTableData.find(d => String(d.nr || d[Object.keys(d)[0]]) == pk); // Find from raw data
                const headers = Object.keys(currentTableData.length > 0 ? currentTableData[0] : {});
                if (item) showItemModal(schema, tableName, item, headers);
            }));
            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async e => {
                e.stopPropagation(); // Prevent row click from triggering
                const pk = e.currentTarget.dataset.pk;
                if(confirm(`Are you sure you want to delete this item?`)){
                    const result = await apiFetch(`table/${schema}/${tableName}/${pk}`, { method: 'DELETE' });
                    if(result && result.success) {
                        masterCache[`${schema}.${tableName}`] = null; // Invalidate cache
                        renderTableManager(schema, tableName); // Reload table
                    } else {
                        alert('Failed to delete item: ' + (result ? result.error : 'Unknown error'));
                    }
                }
            }));
        }

        // --- MODAL LOGIC (mostly unchanged, minor fixes) ---
        async function showItemModal(schema, tableName, item = null, headers) {
            const isEditing = item !== null;
            const fkConfig = foreignKeyMap[tableName.toLowerCase()] || {};
            let formFieldsHTML = '';

            for (const header of headers) {
                // Skip 'nr' and 'attachment' as they are typically auto-generated or handled separately
                if (header === 'nr' || header === 'attachment' || header.endsWith('_ug')) continue;
                
                const value = item ? (item[header] === null ? '' : item[header]) : '';
                const inputType = header.toLowerCase().includes('date') ? 'date' : 'text';
                
                // Determine if field should be read-only based on common PK/ID patterns
                // Adjusted logic for read-only fields. For 'room_id' or 'author', they are foreign keys and should be selectable, not read-only.
                const isReadOnly = isEditing && (header.toLowerCase().endsWith('_id') || header.toLowerCase().endsWith('name')) && 
                                   !(header === 'room_id' || header === 'author' || header === 'category' || header === 'storage_id' || header === 'status_id' || header === 'project_id');


                if (fkConfig[header]) {
                    const ref = fkConfig[header];
                    const refData = await getTableData(ref.schema, ref.table);
                    if (refData && !refData.error) {
                        const valueColumn = ref.valueColumn;
                        const displayColumn = ref.displayColumn;
                        formFieldsHTML += `
                            <div>
                                <label class="capitalize block text-gray-700 text-sm font-bold mb-1">${header.replace(/_/g, ' ')}</label>
                                <select id="${header}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm">
                                    <option value="">-- Select --</option>
                                    ${refData.map(r => `<option value="${r[valueColumn]}" ${value == r[valueColumn] ? 'selected' : ''}>${r[displayColumn] || r[valueColumn]}</option>`).join('')}
                                </select>
                            </div>`;
                    } else {
                        formFieldsHTML += `
                            <div>
                                <label class="capitalize block text-gray-700 text-sm font-bold mb-1">${header.replace(/_/g, ' ')}</label>
                                <input type="text" id="${header}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm bg-red-100" value="${value}" readonly title="Could not load reference data.">
                            </div>`;
                    }
                } else if (header.toLowerCase().includes('date')) {
                    formFieldsHTML += `
                        <div>
                            <label class="capitalize block text-gray-700 text-sm font-bold mb-1">${header.replace(/_/g, ' ')}</label>
                            <input type="date" id="${header}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" value="${value ? String(value).split('T')[0] : ''}" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''}>
                        </div>`;
                } else if (header.toLowerCase().includes('notes') || header.toLowerCase().includes('description') || header.toLowerCase().includes('title')) {
                    formFieldsHTML += `
                        <div>
                            <label class="capitalize block text-gray-700 text-sm font-bold mb-1">${header.replace(/_/g, ' ')}</label>
                            <textarea id="${header}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm h-24" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''}>${value}</textarea>
                        </div>`;
                }
                else {
                    formFieldsHTML += `
                        <div>
                            <label class="capitalize block text-gray-700 text-sm font-bold mb-1">${header.replace(/_/g, ' ')}</label>
                            <input type="${inputType}" id="${header}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm" value="${value}" ${isReadOnly ? 'readonly class="bg-gray-100"' : ''}>
                        </div>`;
                }
            }
            
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl">
                <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">${isEditing ? 'Edit' : 'New'} ${tableName}</h2><button id="close-modal-btn">&times;</button></div>
                <form id="item-form" class="grid grid-cols-2 gap-4 overflow-y-auto max-h-[60vh] p-1">${formFieldsHTML}</form>
                <div class="pt-6 flex justify-end border-t mt-6"><button id="save-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create'}</button></div>
            </div></div>`;

            const { closeModal } = showModal(modalHTML);
            document.getElementById('save-item-btn').addEventListener('click', async () => {
                const form = document.getElementById('item-form');
                const formData = {};
                form.querySelectorAll('input, select, textarea').forEach(input => { // Include textarea
                    if (input.value) formData[input.id] = input.value;
                    else if (isEditing) formData[input.id] = null; // Send null for empty fields during edit
                });
                
                const method = isEditing ? 'PUT' : 'POST';
                const endpoint = isEditing ? `table/${schema}/${tableName}/${item.nr || item[Object.keys(item)[0]]}` : `table/${schema}/${tableName}`; // Use 'nr' or first key as PK
                const result = await apiFetch(endpoint, { method, body: formData });
                
                if (result && !result.error) {
                    masterCache[`${schema}.${tableName}`] = null; // Invalidate cache
                    closeModal();
                    renderTableManager(schema, tableName); // Reload the table to show changes
                } else { alert(`Failed to save: ${result ? result.error : 'Unknown error'}`); }
            });
        }
        
        function showUploadModal(schema, tableName, dbColumns) {
            let fileData = { data: [], meta: { fields: [] } };
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div id="upload-modal-content" class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl transform transition-all -translate-y-10 opacity-0"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Bulk Upload: ${tableName}</h2><button id="close-modal-btn">&times;</button></div><div id="upload-step-1"></div><div id="upload-step-2" class="hidden"></div><div id="upload-step-3" class="hidden"></div></div></div>`;
            const { closeModal } = showModal(modalHTML);
            
            const renderStep1 = () => {
                document.getElementById('upload-step-1').innerHTML = `
                    <h3 class="font-semibold text-lg mb-2">Step 1: Upload File</h3>
                    <p class="text-sm text-gray-600 mb-4">Select a CSV or Excel (.xls, .xlsx) file to upload. For best results, use the example template.</p>
                    <input type="file" id="file-input" accept=".csv, .xlsx, .xls" class="mb-4 w-full border p-2 rounded-lg">
                    <button id="download-template-btn" class="text-sm text-blue-600 hover:underline flex items-center">
                        <i data-lucide="download" class="w-4 h-4 mr-2"></i>Download Template
                    </button>
                    <div class="mt-4 flex justify-end"><button id="next-step-1" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg" disabled>Next</button></div>`;

                // --- NEW: Event Listener for Download Template Button ---
                document.getElementById('download-template-btn').onclick = async () => {
                    let templateHeaders = [];
                    // Try to fetch headers from the API by getting one row
                    const tempResult = await apiFetch(`table/${currentSchema}/${currentTableName}?limit=1`);
                    if (tempResult && !tempResult.error && tempResult.length > 0) {
                        templateHeaders = Object.keys(tempResult[0]);
                    } else {
                        // Fallback: If table is empty or API fails, use provided dbColumns.
                        // This assumes `dbColumns` passed to `showUploadModal` is a reliable list of expected columns.
                        console.warn('Could not dynamically fetch headers for template, using provided dbColumns.');
                        templateHeaders = dbColumns; 
                    }

                    // Filter out internal/auto-generated columns like 'nr', 'attachment', '_ug'
                    const filteredHeaders = templateHeaders.filter(h => h !== 'nr' && h !== 'attachment' && !h.endsWith('_ug'));
                    
                    const csvContent = filteredHeaders.join(','); // Create CSV header row
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    link.setAttribute("href", url);
                    link.setAttribute("download", `${currentTableName}_template.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };
                // --- END NEW ---

                const fileInput = document.getElementById('file-input');
                const nextBtn = document.getElementById('next-step-1');

                fileInput.onchange = (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        const processData = (results) => { fileData = results; nextBtn.disabled = false; };
                        if (file.name.endsWith('.csv')) {
                            reader.onload = (e) => Papa.parse(e.target.result, { header: true, skipEmptyLines: true, complete: processData });
                            reader.readAsText(file);
                        } else {
                            reader.onload = (e) => {
                                const data = new Uint8Array(e.target.result);
                                const workbook = XLSX.read(data, {type: 'array'});
                                // Ensure header: 1 for XLSX to correctly parse headers
                                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                                const headers = jsonData[0];
                                const dataRows = jsonData.slice(1).map(row => headers.reduce((obj, h, i) => ({ ...obj, [h]: row[i] }), {}));
                                processData({ data: dataRows, meta: { fields: headers } });
                            };
                            reader.readAsArrayBuffer(file);
                        }
                    }
                };
                nextBtn.onclick = () => renderStep2();
            };

            const renderStep2 = () => {
                document.getElementById('upload-step-1').classList.add('hidden');
                document.getElementById('upload-step-2').classList.remove('hidden');
                const fileColumns = fileData.meta.fields;
                
                document.getElementById('upload-step-2').innerHTML = `<h3 class="font-semibold text-lg mb-2">Step 2: Map Columns</h3><p class="text-sm text-gray-600 mb-4">Match columns from your file (left) to database fields (right).</p><div class="grid grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto p-2 border rounded-lg">
                    ${fileColumns.map(col => `<div class="grid grid-cols-2 items-center gap-2"><label class="font-mono text-sm p-2 bg-gray-100 rounded-md truncate" title="${col}">${col}</label><select class="column-map p-2 border rounded-md" data-file-col="${col}"><option value="">-- Ignore --</option>${dbColumns.filter(c => c !== 'nr' && c !== 'attachment' && !c.endsWith('_ug')).map(dbCol => `<option value="${dbCol}" ${dbCol.toLowerCase() === col.toLowerCase().replace(/ /g,'_') ? 'selected' : ''}>${dbCol}</option>`).join('')}</select></div>`).join('')}
                    </div><div class="mt-4 flex justify-between"><button id="back-step-2" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg">Back</button><button id="next-step-2" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Next</button></div>`;
                
                document.getElementById('back-step-2').onclick = () => { document.getElementById('upload-step-2').classList.add('hidden'); document.getElementById('upload-step-1').classList.remove('hidden'); };
                document.getElementById('next-step-2').onclick = () => renderStep3();
            };

            const renderStep3 = () => {
                document.getElementById('upload-step-2').classList.add('hidden');
                document.getElementById('upload-step-3').classList.remove('hidden');
                
                const mapping = {};
                document.querySelectorAll('.column-map').forEach(select => { if(select.value) mapping[select.dataset.fileCol] = select.value; });

                const transformedData = fileData.data.map(row => {
                    const newRow = {};
                    for (const [fileCol, dbCol] of Object.entries(mapping)) {
                        newRow[dbCol] = row[fileCol];
                    }
                    return newRow;
                });
                
                const headers = Object.keys(transformedData[0]);
                document.getElementById('upload-step-3').innerHTML = `<h3 class="font-semibold text-lg mb-2">Step 3: Review and Import</h3><p class="text-sm text-gray-600 mb-4">Review the data below. If correct, click 'Import' to add ${transformedData.length} records to the ${tableName} table.</p><div class="max-h-[40vh] overflow-auto border rounded-lg"><table class="min-w-full text-xs"><thead class="bg-gray-100 sticky top-0"><tr>${headers.map(h => `<th class="p-2 text-left">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${transformedData.slice(0, 10).map(row => `<tr>${headers.map(h => `<td class="p-2">${row[h] === null || row[h] === undefined ? '' : row[h]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
                    ${transformedData.length > 10 ? `<p class="text-center text-xs text-gray-500 mt-1">... and ${transformedData.length - 10} more rows.</p>` : ''}
                    <div id="upload-status" class="mt-4"></div><div class="mt-4 flex justify-between"><button id="back-step-3" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg">Back</button><button id="import-btn" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg flex items-center">Import</button></div>`;

                document.getElementById('back-step-3').onclick = () => { document.getElementById('upload-step-3').classList.add('hidden'); document.getElementById('upload-step-2').classList.remove('hidden'); };
                document.getElementById('import-btn').onclick = async () => {
                    document.getElementById('upload-status').innerHTML = `<p class="text-blue-600">Uploading... please wait.</p>`;
                    const result = await apiFetch(`table/${schema}/${tableName}/batch_upload`, { method: 'POST', body: transformedData });
                    if(result && result.success) {
                        document.getElementById('upload-status').innerHTML = `<p class="text-green-600 font-semibold">Success! ${result.inserted_rows} records imported.</p>`;
                        masterCache[`${schema}.${tableName}`] = null; // Invalidate cache
                        setTimeout(() => { closeModal(); renderTableManager(schema, tableName); }, 2000);
                    } else { document.getElementById('upload-status').innerHTML = `<p class="text-red-600">Error: ${result ? result.error : 'Upload failed.'}</p>`; }
                };
            };
            
            renderStep1();
        }

        // --- UTILS & INITIALIZATION ---
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }
        function initializeLabPage() { renderDashboard(); }

    </script>
</body>
</html>
