<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage (Lager) - TIFI LIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { z-index: 50; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .item-card { transition: all 0.2s ease-in-out; }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .sample-list-item:hover { background-color: #f1f5f9; }
        .sample-list-item.selected { background-color: #eef2ff; border-left-width: 4px; border-color: #4f46e5;}
        .box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); gap: 0.5rem; }
        .box-grid-cell {
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }
        .box-grid-cell.occupied { color: white; }
        .box-grid-cell.empty { background-color: #e5e7eb; color: #4b5563; }
        .box-grid-cell:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .box-grid-cell.highlight { box-shadow: 0 0 0 4px #fbbf24; z-index: 10;}
    </style>
</head>
<body>
    <div id="main-app">
        <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-white w-64 p-4 flex flex-col">
            <div class="text-gray-800 text-2xl font-bold mb-8 flex items-center shrink-0"><i data-lucide="flask-conical" class="mr-2 text-blue-600"></i><span>TIFI LIMS</span></div>
            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span>Dashboard</span></a>
                <a href="projects.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="folder-kanban" class="w-5 h-5 mr-3"></i><span>Projects</span></a>
                <a href="samples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="beaker" class="w-5 h-5 mr-3"></i><span>Samples</span></a>
                <a href="sampling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="map-pin" class="w-5 h-5 mr-3"></i><span>Sampling</span></a>
                <a href="experiments.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="flask-round" class="w-5 h-5 mr-3"></i><span>Experiments</span></a>
                <a href="protocols.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="book-text" class="w-5 h-5 mr-3"></i><span>Protocols</span></a>
                <a href="storage.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="archive" class="w-5 h-5 mr-3"></i><span>Storage</span></a>
                <a href="storagesamples.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="boxes" class="w-5 h-5 mr-3"></i><span>Storage Samples</span></a>
                <a href="storagebox.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="box" class="w-5 h-5 mr-3"></i><span>Storage Box</span></a>
                <a href="laboratory.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="microscope" class="w-5 h-5 mr-3"></i><span>Laboratory</span></a>
                <a href="labeling.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="Printer" class="w-5 h-5 mr-3"></i><span>Labeling</span></a>
                <a href="workflow.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="workflow" class="w-5 h-5 mr-3"></i><span>Workflow</span></a>
                <a href="reporting.html" class="sidebar-item flex items-center p-2 rounded-md"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i><span>Reporting</span></a>
            </nav>
            <div class="mt-auto shrink-0">
                <div id="user-profile" class="p-2 mb-2 border-t"></div>
                <button id="logout-button" class="sidebar-item w-full flex items-center p-2 rounded-md text-left"><i data-lucide="log-out" class="w-5 h-5 mr-3"></i><span>Logout</span></button>
            </div>
        </div>
        
        <div id="main-content" class="ml-64 p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Storage Explorer</h1>
                <div class="flex items-center space-x-2">
                    <a href="storage.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg flex items-center shadow-sm hover:shadow-md transition-all"><i data-lucide="filter" class="w-5 h-5 mr-2"></i><span>Switch to Filter View</span></a>
                    <button id="new-storage-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow hover:shadow-lg transition-all"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Storage Unit</button>
                </div>
            </div>

            <nav id="breadcrumb" class="flex items-center space-x-2 text-sm text-gray-500 mb-6"></nav>

            <div id="explorer-container" class="card p-6">
                </div>
        </div>
        <div id="modal-container"></div>
    </div>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            localStorage.setItem('redirectUrl', window.location.href);
            window.location.href = './login.html';
        }
        
        const API_BASE_URL = '/mymglab/api'; // const API_BASE_URL = `http://${window.location.hostname}:5200/api`;
        let storageCache = { rooms: [], storageUnits: [] };
        let allItemsCache = [];

        const storableItemTables = [
            { schema: 'Lab', table: 'Fish', idColumn: 'sample_id', pk: 'sample_id' }, { schema: 'Lab', table: 'Tissue', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'Water', idColumn: 'sample_id', pk: 'sample_id' }, { schema: 'Lab', table: 'Sediments', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'DNA', idColumn: 'sample_id', pk: 'sample_id' }, { schema: 'Lab', table: 'RNA', idColumn: 'sample_id', pk: 'sample_id' },
            { schema: 'Lab', table: 'Library', idColumn: 'Library_id', pk: 'nr' }, { schema: 'Lab', table: 'PCR', idColumn: 'nr', pk: 'nr' },
            { schema: 'Lims', table: 'Reagents', idColumn: 'Reagent_Name', pk: 'nr' }
        ];

        const typeColorMap = {
            'Fish': 'bg-blue-500', 'Tissue': 'bg-green-500', 'DNA': 'bg-purple-500',
            'RNA': 'bg-pink-500', 'Water': 'bg-cyan-500', 'Sediments': 'bg-yellow-500',
            'Library': 'bg-indigo-500', 'PCR': 'bg-red-500', 'Reagents': 'bg-gray-500', 'default': 'bg-gray-400'
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); localStorage.removeItem('redirectUrl'); window.location.href = './login.html'; });
            initializeStoragePage();
        });

        async function apiFetch(endpoint, options = {}) {
            try {
                if (!(options.body instanceof FormData)) {
                    options.headers = { 'Content-Type': 'application/json', ...options.headers };
                    if(options.body) options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { const err = await response.json().catch(()=>({error: 'Server error'})); throw new Error(err.error); }
                return response.status === 204 ? { success: true } : response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        function updateBreadcrumb(path) {
            const breadcrumbEl = document.getElementById('breadcrumb');
            let html = `<a href="#" class="hover:text-blue-600" onclick="renderRooms()">Rooms</a>`;
            if (path.room) html += `<i data-lucide="chevron-right" class="w-4 h-4"></i><a href="#" class="hover:text-blue-600" onclick="renderFreezers('${path.room.room_id}')">${path.room.description}</a>`;
            if (path.freezer) html += `<i data-lucide="chevron-right" class="w-4 h-4"></i><a href="#" class="hover:text-blue-600" onclick="renderBoxes('${path.room.room_id}', '${path.freezer}')">${path.freezer}</a>`;
            if (path.box) html += `<i data-lucide="chevron-right" class="w-4 h-4"></i><span class="font-semibold text-gray-700">${path.box.Box}</span>`;
            breadcrumbEl.innerHTML = html;
            lucide.createIcons();
        }

        function renderRooms() {
            const container = document.getElementById('explorer-container');
            container.innerHTML = `<h2 class="text-2xl font-bold mb-4">Select a Room</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                ${storageCache.rooms.map(room => `<div class="item-card card p-6 text-center cursor-pointer" onclick="renderFreezers('${room.room_id}')"><i data-lucide="building-2" class="mx-auto h-12 w-12 text-gray-500"></i><p class="mt-2 font-semibold">${room.description}</p><p class="text-sm text-gray-500">${room.room_id}</p></div>`).join('')}</div>`;
            lucide.createIcons();
            updateBreadcrumb({});
            document.getElementById('item-details-panel').innerHTML = '';
        }
        
        function renderFreezers(roomId) {
            const room = storageCache.rooms.find(r => r.room_id === roomId);
            const freezers = [...new Set(storageCache.storageUnits.filter(s => s.room_id === roomId).map(s => s.Freezer))];
            const container = document.getElementById('explorer-container');
            container.innerHTML = `<h2 class="text-2xl font-bold mb-4">Select a Unit in ${room.description}</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                ${freezers.map(freezer => `<div class="item-card card p-6 text-center cursor-pointer" onclick="renderBoxes('${roomId}', '${freezer}')"><i data-lucide="snowflake" class="mx-auto h-12 w-12 text-blue-500"></i><p class="mt-2 font-semibold">${freezer}</p></div>`).join('')}</div>`;
            lucide.createIcons();
            updateBreadcrumb({ room });
            document.getElementById('item-details-panel').innerHTML = '';
        }

        function renderBoxes(roomId, freezerId) {
            const room = storageCache.rooms.find(r => r.room_id === roomId);
            const boxes = storageCache.storageUnits.filter(s => s.room_id === roomId && s.Freezer === freezerId);
            const container = document.getElementById('explorer-container');
            container.innerHTML = `<h2 class="text-2xl font-bold mb-4">Select a Box in ${freezerId}</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                ${boxes.map(box => `<div class="item-card card p-6 text-center cursor-pointer" onclick="renderBoxContents('${box.storage_id}')"><i data-lucide="archive" class="mx-auto h-12 w-12 text-green-600"></i><p class="mt-2 font-semibold">${box.Box}</p><p class="text-sm text-gray-500">${box.storage_id}</p></div>`).join('')}</div>`;
            lucide.createIcons();
            updateBreadcrumb({ room, freezer: freezerId });
            document.getElementById('item-details-panel').innerHTML = '';
        }

        function renderBoxContents(storageId) {
            const box = storageCache.storageUnits.find(s => s.storage_id === storageId);
            const room = storageCache.rooms.find(r => r.room_id === box.room_id);
            const itemsInBox = allItemsCache.filter(s => s.storage_id === storageId);
            const container = document.getElementById('explorer-container');

            const gridCells = Array.from({length: 100 }, (_, i) => i + 1);
            
            container.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2">
                    <h2 class="text-xl font-bold mb-2">Box Layout: ${box.Box}</h2>
                    <div id="box-grid" class="box-grid">${gridCells.map(pos => {
                        const item = itemsInBox.find(i => parseInt(i.storage_position) === pos);
                        const colorClass = item ? (typeColorMap[item.type] || typeColorMap['default']) : 'empty';
                        return `<div class="box-grid-cell ${colorClass} font-semibold" id="pos-${pos}" onclick="showItemDetailsPanel('${item ? item.id : ''}', '${item ? item.type : ''}')">
                            <span class="text-lg font-black">${pos}</span>
                            <span class="truncate w-full text-center">${item ? item.id : ''}</span>
                        </div>`;
                    }).join('')}</div>
                </div>
                <div class="lg:col-span-1">
                     <div id="item-details-panel" class="card p-6 sticky top-8">
                        <div class="text-center text-gray-500"><i data-lucide="mouse-pointer-square" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an item to see details</p></div>
                     </div>
                </div>
            </div>`;
            updateBreadcrumb({ room, freezer: box.Freezer, box });
            lucide.createIcons();
        }

        function showItemDetailsPanel(itemId, itemType) {
            const panel = document.getElementById('item-details-panel');
            if (!itemId) { 
                panel.innerHTML = `<div class="card p-6 text-center text-gray-500"><i data-lucide="mouse-pointer-square" class="mx-auto h-12 w-12"></i><p class="mt-2">Empty position selected.</p></div>`;
                lucide.createIcons();
                return; 
            }
            
            const item = allItemsCache.find(i => i.id === itemId && i.type === itemType);
            if (!item) { panel.innerHTML = `<p class="text-red-500 p-6">Error: Item details not found.</p>`; return; }
            
            panel.innerHTML = `<div class="card p-6 sticky top-8"><h3 class="text-xl font-bold mb-2">${item.id}</h3><div class="text-left text-sm space-y-2 mb-4">
                <div><strong>Type:</strong> ${item.type}</div>
                <div><strong>Stored in:</strong> ${item.storage_id} / Pos: ${item.storage_position || 'N/A'}</div>
            </div><div class="space-y-2">
                <button onclick="unassignItem('${item.pk}', '${item.table}', '${item.storage_id}')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center">
                    <i data-lucide="unlink-2" class="w-4 h-4 mr-2"></i>Remove From Position
                </button>
            </div></div>`;
            lucide.createIcons();
        }

        async function unassignItem(pkValue, sourceTable, currentStorageId) {
            if (!confirm(`Are you sure you want to remove this item from its storage position?`)) return;
            const itemConfig = storableItemTables.find(t => t.table === sourceTable);
            const payload = { storage_id: null, storage_position: null };
            const result = await apiFetch(`table/${itemConfig.schema}/${sourceTable}/${pkValue}`, { method: 'PUT', body: payload });
            if (result && !result.error) {
                await initializeStoragePage(false);
                renderBoxContents(currentStorageId);
                document.getElementById('item-details-panel').innerHTML = '';
            } else { alert('Failed to unassign item.'); }
        }

        async function showNewStorageModal() {
            const rooms = storageCache.rooms;
            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center"><div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-lg"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">New Storage Box</h2><button id="close-modal-btn">&times;</button></div><form id="new-storage-form" class="space-y-4"><div class="grid grid-cols-2 gap-4"><div><label>Storage ID *</label><input type="text" id="storage_id" required class="w-full mt-1 p-2 border rounded"></div><div><label>Room *</label><select id="room_id" required class="w-full mt-1 p-2 border rounded">${rooms.map(r=>`<option value="${r.room_id}">${r.description}</option>`).join('')}</select></div><div><label>Freezer/Unit *</label><input type="text" id="Freezer" required class="w-full mt-1 p-2 border rounded"></div><div><label>Box Name *</label><input type="text" id="Box" required class="w-full mt-1 p-2 border rounded"></div></div><div class="pt-4 flex justify-end"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Create Box</button></div></form></div></div>`;
            const { closeModal } = showModal(modalHTML);
            document.getElementById('new-storage-form').onsubmit = async (e) => {
                e.preventDefault();
                const formData = {
                    storage_id: e.target.storage_id.value, room_id: e.target.room_id.value,
                    Freezer: e.target.Freezer.value, Box: e.target.Box.value,
                };
                const result = await apiFetch('table/Lab/Storage', { method: 'POST', body: JSON.stringify(formData), headers: {'Content-Type': 'application/json'} });
                if(result && !result.error) { closeModal(); initializeStoragePage(); } 
                else { alert('Failed to create storage: ' + (result ? result.error : 'Unknown error')); }
            };
        }

        async function initializeStoragePage(setupEventListeners = true) {
            const container = document.getElementById('explorer-container');
            container.innerHTML = `<div class="text-center p-8"><i data-lucide="loader" class="mx-auto h-12 w-12 animate-spin text-gray-500"></i><p class="mt-2 text-gray-600">Loading all inventory data...</p></div>`;
            lucide.createIcons();

            const promises = [
                apiFetch('table/Reference/Room'),
                apiFetch('table/Lab/Storage'),
                ...storableItemTables.map(itemType => 
                    apiFetch(`table/${itemType.schema}/${itemType.table}`).then(response => {
                        if (response.error || !Array.isArray(response)) {
                            console.error(`Failed to load ${itemType.table} data`); return [];
                        }
                        return response.map(item => ({...item, type: itemType.table, table: itemType.table, id: item[itemType.idColumn], pk: item[itemType.pk]}));
                    })
                )
            ];

            const [roomData, storageData, ...allItemArrays] = await Promise.all(promises);
            
            storageCache.rooms = (roomData && !roomData.error) ? roomData : [];
            storageCache.storageUnits = (storageData && !storageData.error) ? storageData : [];
            allItemsCache = allItemArrays.flat();
            
            renderRooms();
            if(setupEventListeners) {
                document.getElementById('new-storage-btn').addEventListener('click', showNewStorageModal);
            }
        }
    </script>
</body>
</html>
