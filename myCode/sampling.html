        <div id="main-content" class="ml-64 p-8">

                    <button id="bulk-update-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="edit" class="w-5 h-5 mr-2"></i>Bulk Update</button>
                    <button id="bulk-import-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Bulk Import</button>
                    <button id="new-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow"><i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Sampling Event</button>

            <div id="page-container">
                </div>

<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
    
    const API_BASE_URL = '/mymglab/api';
    let currentViewCache = [];
    let referenceDataCache = {};
    const currentTableName = 'Sampling';
    let parsedUploadData = [];
    let currentSortColumn = 'sampling_date';
    let currentSortDirection = 'desc';

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        const user = JSON.parse(sessionStorage.getItem('user'));
        if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
        document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
        initializePage();
    });

    async function apiFetch(endpoint, options = {}) {
        try {
            const isFormData = options.body instanceof FormData;
            if (!isFormData && options.body) {
                options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                options.body = JSON.stringify(options.body);
            }
            const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
            if (!response.ok) { 
                const errText = await response.text();
                try { 
                    const errJson = JSON.parse(errText); 
                    throw new Error(errJson.error || `Server Error: ${response.status}`);
                } catch { 
                    throw new Error(errText || `Server Error: ${response.status}`);
                }
            }
            if (response.status === 204 || response.headers.get('content-length') === '0') return {};
            return await response.json();
        } catch (error) { 
            console.error("API Error:", error); 
            return { error: error.message }; 
        }
    }

    async function getReferenceData(tableName, schema='Reference') {
        const cacheKey = `${schema}.${tableName}`;
        if (referenceDataCache[cacheKey]) return referenceDataCache[cacheKey];
        const data = await apiFetch(`table/${schema}/${tableName}`);
        if(data && !data.error) referenceDataCache[cacheKey] = data;
        return data;
    }

    function showModal(content) {
        const container = document.getElementById('modal-container');
        container.innerHTML = content;
        const modal = container.querySelector('.modal-overlay');
        const modalContent = container.querySelector('.modal-content');
        setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
        const closeModal = () => {
            modalContent.classList.add('opacity-0', '-translate-y-10');
            setTimeout(() => { container.innerHTML = ''; parsedUploadData = []; }, 300);
        };
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
        return { closeModal };
    }

    async function loadView() {
        const container = document.getElementById('page-container');
        container.innerHTML = `
            <div class="mb-4"><input type="text" id="search-input" placeholder="Search by Sampling ID or Place..." class="w-full p-2 border rounded-md shadow-sm"></div>
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                <div class="lg:col-span-3">
                    <div class="card p-4">
                        <div class="overflow-y-auto h-[70vh]">
                            <div id="table-content"><p class="p-4 text-gray-500">Loading sampling events...</p></div>
                        </div>
                    </div>
                </div>
                <div id="details-container" class="lg:col-span-2">
                    <div class="card p-6 h-full flex items-center justify-center text-gray-500">
                        <div class="text-center"><i data-lucide="map" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an event to view details</p></div>
                    </div>
                </div>
            </div>`;
        lucide.createIcons();
        document.getElementById('search-input').addEventListener('input', renderTable);
        await renderTable();
    }

    async function renderTable() {
        const tableContainer = document.getElementById('table-content');
        if(currentViewCache.length === 0) {
            const result = await apiFetch(`table/Lab/${currentTableName}`);
            if (result.error || !Array.isArray(result)) {
                tableContainer.innerHTML = `<p class="p-4 text-red-500">Error loading data: ${result.error}</p>`;
                return;
            }
            currentViewCache = result;
        }
        
        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
        let filteredData = currentViewCache.filter(row => 
            (row.Sampling_id && row.Sampling_id.toLowerCase().includes(searchTerm)) ||
            (row.place && row.place.toLowerCase().includes(searchTerm))
        );

        if (currentSortColumn) {
            filteredData.sort((a, b) => {
                const valA = a[currentSortColumn];
                const valB = b[currentSortColumn];

                let comparison = 0;
                if (valA && valB && (currentSortColumn.toLowerCase().includes('date'))) {
                    comparison = new Date(valA) - new Date(valB);
                } else if (typeof valA === 'number' && typeof valB === 'number') {
                    comparison = valA - valB;
                } else {
                    const stringA = String(valA || '').toLowerCase();
                    const stringB = String(valB || '').toLowerCase();
                    comparison = stringA.localeCompare(stringB, undefined, { sensitivity: 'base' });
                }
                return currentSortDirection === 'asc' ? comparison : -comparison;
            });
        }

        if (filteredData.length === 0) {
            tableContainer.innerHTML = `<p class="p-4 text-gray-500">No sampling events found.</p>`;
            document.getElementById('details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="map" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an event to view details</p></div></div>`;
            lucide.createIcons();
            return;
        }

        const summaryHeaders = ['Sampling_id', 'Region', 'country', 'sampling_date', 'Ecosytem'];
        const tableHtml = `<table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0"><tr>
                ${summaryHeaders.map(h => {
                    const isCurrentSort = h === currentSortColumn;
                    let sortIcon = '<i data-lucide="arrow-up-down" class="sort-icon text-gray-400"></i>';
                    if (isCurrentSort) {
                        sortIcon = currentSortDirection === 'asc' ? '<i data-lucide="arrow-up" class="sort-icon"></i>' : '<i data-lucide="arrow-down" class="sort-icon"></i>';
                    }
                    return `<th class="px-4 py-2 text-left font-medium text-gray-500 uppercase sortable-header" data-column="${h}">
                        <div class="flex items-center">
                            <span>${h.replace(/_/g, ' ')}</span>
                            ${sortIcon}
                        </div>
                    </th>`;
                }).join('')}
                <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
            </tr></thead>
            <tbody class="divide-y divide-gray-200">${filteredData.map(row => `
                <tr class="table-row hover:bg-gray-50 cursor-pointer" data-pk="${row.Sampling_id}">
                    ${summaryHeaders.map(h => {
                        let cellValue = row[h] || '';
                        if (h.toLowerCase().includes('date') && cellValue) {
                            try { cellValue = new Date(cellValue).toLocaleDateString(); } catch (e) {}
                        }
                        return `<td class="px-4 py-3 whitespace-nowrap">${cellValue}</td>`;
                    }).join('')}
                    <td class="px-4 py-3 flex space-x-2">
                        <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-pk="${row.Sampling_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-pk="${row.Sampling_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('')}
            </tbody></table>`;
        
        tableContainer.innerHTML = tableHtml;
        lucide.createIcons();
        addActionListeners();
        addSortListeners();
    }
    
    function addSortListeners() {
        document.querySelectorAll('.sortable-header').forEach(header => {
            header.addEventListener('click', (e) => {
                const column = e.currentTarget.dataset.column;
                if (currentSortColumn === column) {
                    currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortColumn = column;
                    currentSortDirection = 'asc';
                }
                renderTable();
            });
        });
    }

    async function renderDetails(primaryKey) {
        const container = document.getElementById('details-container');
        const item = currentViewCache.find(i => i.Sampling_id == primaryKey);

        if (!item) { container.innerHTML = `<p class="p-4 text-red-500">Could not find details.</p>`; return; }

        let detailsHtml = '<dl class="space-y-2 text-sm">';
        for (const [key, value] of Object.entries(item)) {
            if (value !== null && value !== '' && key !== 'nr' && key !== 'Attachment') {
                const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let formattedValue = value;
                if (key.toLowerCase().includes('date') && !isNaN(Date.parse(value))) {
                    formattedValue = new Date(value).toLocaleDateString();
                }
                detailsHtml += `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${formattedKey}</dt><dd class="text-gray-900">${formattedValue}</dd></div>`;
            }
        }
        detailsHtml += '</dl>';

        const allSamples = await getReferenceData('Samples', 'Lab');
        const associatedSamples = allSamples.filter(s => s.Sampling_id === item.Sampling_id);

        container.innerHTML = `<div class="card p-6 h-[80vh] flex flex-col">
            <div class="mb-4">
                <h2 class="text-xl font-bold text-gray-800">${item.Sampling_id}</h2>
                <p class="text-sm text-gray-500">Event recorded on ${new Date(item.sampling_date).toLocaleDateString()}</p>
            </div>
            <div class="flex-grow overflow-y-auto pr-2">
                ${detailsHtml}
                <h3 class="text-lg font-bold mt-4 mb-2">Associated Samples (${associatedSamples.length})</h3>
                <div class="space-y-1 text-sm">
                    ${associatedSamples.length > 0 ? associatedSamples.map(s => `<div class="p-2 bg-gray-50 rounded-md">${s.sample_id} <span class="text-gray-500">(${s.sample_type})</span></div>`).join('') : '<p class="text-gray-500">No samples linked to this event.</p>'}
                </div>
            </div>
            <div class="mt-4 pt-4 border-t">
                <button onclick="manageAttachment('${item.Sampling_id}')" class="w-full bg-indigo-100 text-indigo-700 font-bold py-2 px-4 rounded-lg flex items-center justify-center hover:bg-indigo-200">
                    <i data-lucide="paperclip" class="w-4 h-4 mr-2"></i>Manage Attachment
                </button>
            </div>
        </div>`;
        lucide.createIcons();
    }

    function addActionListeners() {
        document.querySelectorAll('.table-row').forEach(row => {
            row.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                document.querySelectorAll('.table-row').forEach(r => r.classList.remove('table-row-selected'));
                row.classList.add('table-row-selected');
                renderDetails(row.dataset.pk);
            });
        });

        document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const pk = e.currentTarget.dataset.pk;
            const itemToEdit = currentViewCache.find(i => i.Sampling_id == pk);
            if (itemToEdit) showNewItemModal(itemToEdit);
        }));

        document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const pk = e.currentTarget.dataset.pk;
            if (confirm(`Are you sure you want to delete this sampling event?`)) {
                const result = await apiFetch(`table/Lab/${currentTableName}/${pk}`, { method: 'DELETE' });
                if (!result.error) {
                    currentViewCache = [];
                    loadView();
                }
                else alert('Failed to delete item: ' + (result.error || 'Unknown error'));
            }
        }));
    }

    async function showNewItemModal(itemToEdit = null) {
        const isEditing = itemToEdit !== null;
        
        const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl transform transition-all -translate-y-10 opacity-0">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">${isEditing ? `Edit Sampling Event: ${itemToEdit.Sampling_id}` : `New Sampling Event`}</h2>
                    <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">&times;</button>
                </div>
                <form id="item-form" class="space-y-4">
                    <div id="dynamic-fields-container" class="max-h-[60vh] overflow-y-auto p-4 rounded-md bg-gray-50 border"></div>
                </form>
                <div class="pt-6 flex justify-end border-t mt-6">
                    <button id="save-item-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create Entry'}</button>
                </div>
            </div>
        </div>`;
        const { closeModal } = showModal(modalHTML);
        
        await renderFormFields(itemToEdit);

        document.getElementById('save-item-btn').onclick = async () => {
            const form = document.getElementById('item-form');
            if (!form.reportValidity()) return;
            
            const formData = new FormData(form);
            const pk = isEditing ? itemToEdit.Sampling_id : null;
            const endpoint = isEditing ? `table/Lab/${currentTableName}/${pk}` : `table/Lab/${currentTableName}`;
            const method = isEditing ? 'PUT' : 'POST';
            
            const result = await apiFetch(endpoint, { method, body: formData });

            if(result && !result.error) {
                closeModal();
                currentViewCache = [];
                loadView();
            } else {
                alert('Failed to save item: ' + (result ? result.error : 'Unknown error'));
            }
        };
    }

    async function renderFormFields(dataToPreload = null) {
        const container = document.getElementById('dynamic-fields-container');
        container.innerHTML = `<p class="text-center text-gray-500 p-4">Loading form fields...</p>`;
        
        const schemaResult = await apiFetch(`table/Lab/${currentTableName}?limit=1`);
        if (schemaResult.error || (Array.isArray(schemaResult) && schemaResult.length === 0)) {
            container.innerHTML = `<p class="text-red-500 p-4">Could not load form schema. Table may be empty.</p>`; 
            return;
        }

        const columns = Object.keys(schemaResult[0]);
        const locations = await getReferenceData('Location');
        
        let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-4">';
        const ignoredCols = ['nr', 'Attachment'];

        for (const col of columns) {
            if (ignoredCols.includes(col)) continue;
            
            const value = dataToPreload ? (dataToPreload[col] || '') : '';
            const formattedLabel = col.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            let field = '';

            if (col.toLowerCase().includes('date')) {
                field = `<input type="date" name="${col}" value="${value ? String(value).split('T')[0] : ''}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm">`;
            } else if (col === 'place') {
                field = `<select name="${col}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm"><option value="">-- Select --</option>${(locations || []).map(loc => `<option value="${loc.place}" ${value == loc.place ? 'selected' : ''}>${loc.place}</option>`).join('')}</select>`;
            } else if (typeof schemaResult[0][col] === 'number') {
                field = `<input type="number" step="any" name="${col}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm">`;
            } else {
                field = `<input type="text" name="${col}" value="${value}" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm">`;
            }
            fieldsHtml += `<div><label class="font-medium text-sm text-gray-700">${formattedLabel}</label>${field}</div>`;
        }
        fieldsHtml += '</div>';
        fieldsHtml += `<div class="mt-4"><label class="font-medium text-sm text-gray-700">Attachment</label><input type="file" name="Attachment" class="w-full mt-1 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"></div>`;
        container.innerHTML = fieldsHtml;
    }

    async function generateAndDownloadTemplate(isUpdate) {
        const schemaResult = await apiFetch(`table/Lab/${currentTableName}?limit=1`);
        if (schemaResult.error || (Array.isArray(schemaResult) && schemaResult.length === 0)) {
            alert('Could not fetch table schema to generate template. The table may be empty.');
            return;
        }
        
        const ignored = ['nr', 'Attachment'];
        let headers = Object.keys(schemaResult[0]).filter(key => !ignored.includes(key));
        
        // For updates, the Primary Key is essential and should be first.
        if (isUpdate) {
            headers = headers.filter(h => h !== 'Sampling_id');
            headers.unshift('Sampling_id'); 
        }

        const csvContent = headers.join(',');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `${currentTableName}_${isUpdate ? 'update' : 'import'}_template.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function handleFileSelect(event, isUpdate) {
        const file = event.target.files[0];
        if (!file) return;

        const modalContent = event.target.closest('.modal-content');
        const previewContainer = modalContent.querySelector('#preview-container');
        const actionButton = modalContent.querySelector('button[id$="-data-btn"]');

        previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
        if (actionButton) actionButton.disabled = true;

        const onParseComplete = (results) => {
            if (results.errors && results.errors.length > 0) {
                previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                return;
            }
            if (!results.data || results.data.length === 0) {
                 previewContainer.innerHTML = `<p class="text-red-500 p-4">No data found in the file.</p>`;
                 return;
            }
            if (isUpdate && !results.data[0].hasOwnProperty('Sampling_id')) {
                 previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: Update file must contain a 'Sampling_id' column.</p>`;
                 return;
            }
            
            displayPreview(results.data, isUpdate, previewContainer, actionButton);
        };

        if (file.name.endsWith('.csv')) {
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
        } else { 
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    onParseComplete({ data: jsonData, errors: [] });
                } catch (err) {
                    onParseComplete({ data: [], errors: [{ message: err.message }] });
                }
            };
            reader.onerror = () => {
                onParseComplete({ data: [], errors: [{ message: 'Could not read the file.' }] });
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function displayPreview(data, isUpdate, previewContainer, actionButton) {
        parsedUploadData = data;
        const headers = Object.keys(data[0]);
        const previewHtml = `
            <p class="text-sm font-medium p-2">Found ${parsedUploadData.length} records. Showing preview:</p>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100"><tr>${headers.map(h => `<th class="px-2 py-1 text-left font-medium text-gray-600">${h}</th>`).join('')}</tr></thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    ${parsedUploadData.slice(0, 5).map(row => `<tr>${headers.map(h => `<td class="px-2 py-1 whitespace-nowrap truncate max-w-[100px]">${row[h] || ''}</td>`).join('')}</tr>`).join('')}
                </tbody>
            </table>`;
        previewContainer.innerHTML = previewHtml;
        if (actionButton) actionButton.disabled = false;
    }

    // Bulk Import (Create New)
    async function showBulkUploadModal() {
        const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Bulk Import for <span class="text-blue-600">${currentTableName}</span></h2><button id="close-modal-btn">&times;</button></div><div class="grid md:grid-cols-2 gap-6"><div><h3 class="font-semibold text-lg mb-2">1. Get Template</h3><p class="text-sm text-gray-600 mb-3">Download the template for creating new records.</p><button id="download-template-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow-sm"><i data-lucide="download" class="w-4 h-4 mr-2"></i>Download Template</button></div><div><h3 class="font-semibold text-lg mb-2">2. Upload File</h3><p class="text-sm text-gray-600 mb-3">Select a .csv or .xlsx file.</p><input type="file" id="import-file-input" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"></div></div><div class="mt-6"><h3 class="font-semibold text-lg mb-2">3. Preview Data</h3><div id="preview-container" class="border rounded-lg p-2 bg-gray-50 h-64 overflow-auto text-xs"><p class="text-gray-500 text-center p-4">Select a file for preview.</p></div></div><div class="pt-6 flex justify-end border-t mt-6"><button id="upload-data-btn" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg flex items-center" disabled><i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Upload to Database</button></div></div></div>`;
        showModal(modalHTML);
        lucide.createIcons();
        document.getElementById('download-template-btn').addEventListener('click', () => generateAndDownloadTemplate(false));
        document.getElementById('import-file-input').addEventListener('change', (e) => handleFileSelect(e, false));
        document.getElementById('upload-data-btn').addEventListener('click', async () => {
             if (parsedUploadData.length === 0) { alert('No data to upload.'); return; }
            const uploadBtn = document.getElementById('upload-data-btn');
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5 mr-2"></i>Uploading...';
            lucide.createIcons();
            const result = await apiFetch(`table/Lab/${currentTableName}/batch_upload`, { method: 'POST', body: parsedUploadData });
            if (!result.error) {
                alert(`Successfully inserted ${result.inserted_rows || '0'} records.`);
                document.querySelector('#modal-container #close-modal-btn').click();
                currentViewCache = [];
                loadView();
            } else {
                alert(`Upload failed: ${result.error}`);
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5 mr-2"></i>Upload to Database';
                lucide.createIcons();
            }
        });
    }
    
    // Bulk Update (Modify Existing)
    async function showBulkUpdateModal() {
        const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Bulk Update <span class="text-orange-600">${currentTableName}</span></h2><button id="close-modal-btn">&times;</button></div><div class="grid md:grid-cols-2 gap-6"><div><h3 class="font-semibold text-lg mb-2">1. Get Template</h3><p class="text-sm text-gray-600 mb-3">Download template with <strong>Sampling_id</strong> to match records.</p><button id="download-template-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow-sm"><i data-lucide="download" class="w-4 h-4 mr-2"></i>Download Update Template</button></div><div><h3 class="font-semibold text-lg mb-2">2. Upload File</h3><p class="text-sm text-gray-600 mb-3">Upload the file with your changes.</p><input type="file" id="update-file-input" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100"></div></div><div class="mt-6"><h3 class="font-semibold text-lg mb-2">3. Preview Changes</h3><div id="preview-container" class="border rounded-lg p-2 bg-gray-50 h-64 overflow-auto text-xs"><p class="text-gray-500 text-center p-4">Select a file for preview.</p></div></div><div id="bulk-update-progress" class="hidden mt-4"><h3 class="font-semibold text-lg mb-2">4. Update Progress</h3><div id="progress-log" class="w-full bg-gray-800 text-white font-mono text-xs rounded-md p-4 h-40 overflow-y-auto"></div></div><div class="pt-6 flex justify-end border-t mt-6"><button id="update-data-btn" class="bg-orange-600 hover:bg-orange-700 text-white py-2 px-4 rounded-lg flex items-center" disabled><i data-lucide="edit" class="w-5 h-5 mr-2"></i>Run Updates</button></div></div></div>`;
        const { closeModal } = showModal(modalHTML);
        lucide.createIcons();
        document.getElementById('download-template-btn').addEventListener('click', () => generateAndDownloadTemplate(true));
        document.getElementById('update-file-input').addEventListener('change', (e) => handleFileSelect(e, true));
        document.getElementById('update-data-btn').addEventListener('click', () => handleBulkUpdate(closeModal));
    }

    async function handleBulkUpdate(closeModal) {
        if (parsedUploadData.length === 0) { alert('No valid data to update.'); return; }
        
        const updateBtn = document.getElementById('update-data-btn');
        updateBtn.disabled = true;
        document.getElementById('bulk-update-progress').style.display = 'block';
        const logContainer = document.getElementById('progress-log');
        logContainer.innerHTML = '';
        
        let successCount = 0;
        let failCount = 0;
        const failedRecords = [];

        const logMessage = (msg, color = 'text-gray-300') => {
            logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        logMessage(`Starting bulk update for ${parsedUploadData.length} records...`);

        for (const row of parsedUploadData) {
            const pk = row.Sampling_id;
            if (!pk) {
                logMessage(`Skipping row with missing Sampling_id.`, 'text-yellow-400');
                failCount++;
                continue;
            }

            const payload = { ...row };
            delete payload.Sampling_id; // Primary key goes in URL, not body

            logMessage(`Updating ${pk}...`);
            const result = await apiFetch(`table/Lab/${currentTableName}/${pk}`, { method: 'PUT', body: payload });
            
            if (!result.error) {
                successCount++;
                logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
            } else {
                failCount++;
                failedRecords.push(pk);
                logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
            }
        }

        logMessage('------------------------------------', 'text-blue-400');
        logMessage(`Bulk update complete.`, 'text-blue-400 font-bold');
        logMessage(`Successful: ${successCount}`, 'text-green-400');
        logMessage(`Failed: ${failCount}`, 'text-red-400');
        if (failedRecords.length > 0) {
             logMessage(`Failed IDs: ${failedRecords.join(', ')}`);
        }

        currentViewCache = [];
        await loadView();
        
        updateBtn.innerHTML = '<i data-lucide="x" class="w-5 h-5 mr-2"></i>Close';
        updateBtn.onclick = closeModal;
        updateBtn.disabled = false;
        lucide.createIcons();
    }


    function initializePage() {
        loadView();
        document.getElementById('new-item-btn').addEventListener('click', () => showNewItemModal());
        document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkUploadModal());
        document.getElementById('bulk-update-btn').addEventListener('click', () => showBulkUpdateModal());
    }
</script>
