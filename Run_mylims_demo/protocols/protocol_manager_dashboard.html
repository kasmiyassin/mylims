<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Run - LIMS/ELN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    
    <style>
        /* Protocols.io Design System */
        :root { --pio-primary: #1e70bf; --pio-light-blue: #e8f0f8; --pio-bg-light: #f8f9fa; --pio-border: #d3dce0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--pio-bg-light); }
        .navbar-dark .navbar-brand { color: #fff !important; font-weight: 600; }
        .navbar-dark .nav-link { color: rgba(255, 255, 255, 0.75); }
        .app-page { display: block; }
        
        .run-step-content { background-color: #fff; border-radius: 0.5rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); border-left: 5px solid #198754; }
        .run-sidebar { position: sticky; top: 20px; background-color: #fff; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
        .run-step-list .list-group-item { cursor: pointer; border: 0; padding: 0.75rem 1.25rem; border-radius: 0.375rem !important; font-weight: 500; }
        .run-step-list .list-group-item.active { background-color: #198754; color: #fff; font-weight: 600; }
        .run-step-list .list-group-item:hover { background-color: #e9f0ff; }
        .timer-widget { background-color: #f0fff0; border: 1px solid #198754; border-radius: 0.375rem; padding: 1.5rem; }
        .timer-display { font-size: 3rem; font-weight: 600; font-family: monospace; color: #198754; }
        .run-step-description > ul.run-checklist > li { list-style-type: none !important; padding: 0.75rem 1rem; margin-bottom: 0.5rem; border: 1px solid #adb5bd; border-radius: 0.375rem; display: flex; align-items: center; font-size: 1.1rem; background-color: #fff; }
        .run-step-description > ul.run-checklist > li:has(input:checked) { background-color: #e6ffed; border-color: #198754; text-decoration: line-through; color: #6c757d; }
        .run-step-description > ul.run-checklist > li > p { margin-bottom: 0; margin-left: 0.75rem; }
        .run-step-description > ul.run-checklist > li > input[type="checkbox"] { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar and Modals (Common UI structure) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="protocol_manager_dashboard.html"><i class="bi bi-robot"></i> LIMS / ELN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="protocol_manager_dashboard.html"><i class="bi bi-journal-text"></i> Protocols</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-beaker"></i> Experiments</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-seam"></i> Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-calendar-check"></i> Booking</a></li>
                </ul>
                <div class="d-flex">
                    <!-- Dynamic user name display -->
                    <span class="navbar-text me-3" id="user-welcome">Welcome...</span>
                    <button class="btn btn-outline-light btn-sm" type="button" onclick="App.apiCall('/logout', 'POST').then(() => window.location.href='login.html');">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Modals (Shared for all pages) -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modal-title">Confirmation</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body" id="modal-body">Are you sure?</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" id="btn-modal-confirm">Confirm</button></div></div></div></div>


    <!-- MAIN CONTENT AREA -->
    <main class="container-fluid my-4">

        <!-- 4. RUN PROTOCOL PAGE -->
        <section class="app-page">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="h4 text-dark mb-1" id="run-protocol-title">Loading Protocol...</h1>
                    <p class="text-muted mb-0 small">Experiment ID: <strong id="run-linked-experiment-id">N/A</strong></p> 
                    <p class="text-muted mb-0 small" id="run-protocol-subtitle"></p>
                </div>
                <button class="btn btn-outline-danger btn-sm" id="btn-exit-run">
                    <i class="bi bi-x-circle"></i> Exit Run
                </button>
            </div>
            
            <div class="progress mb-4" style="height: 10px;">
                <div id="run-progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="row g-4">
                <!-- Left/Main Column: Current Step -->
                <div class="col-lg-8">
                    <div class="run-step-content bg-white rounded-3 shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center">
                             <h2 class="h5 text-dark" id="run-step-title">Loading Step...</h2>
                             <span class="badge bg-secondary" id="run-step-duration-badge"></span>
                        </div>
                        <hr>
                        <!-- Components Display Area -->
                        <div id="run-step-components-view" class="mb-3 step-components-view"> 
                           <!-- JS Renders components here -->
                        </div>
                        
                        <!-- Description/Checklist Area -->
                        <div id="run-step-description" class="run-step-description markdown-content"> 
                            <!-- JS renders markdown checklists here -->
                        </div>
                        
                        <!-- Timer Widget Container -->
                        <div id="run-step-timer-container" class="mt-4">
                            <!-- JS will build timer widget here if needed -->
                        </div>
                        
                        <hr>
                        <div class="small">
                            <strong><i class="bi bi-beaker"></i> Step Reagents (Informational):</strong>
                            <p id="run-step-reagents" class="text-muted mb-0">N/A</p>
                        </div>
                    </div>
                    <!-- Navigation -->
                    <div class="d-flex justify-content-between mt-3">
                        <button class="btn btn-secondary btn-sm" id="btn-run-prev"><i class="bi bi-arrow-left"></i> Previous Step</button>
                        <button class="btn btn-primary btn-sm" id="btn-run-next">Next Step <i class="bi bi-arrow-right"></i></button>
                        <button class="btn btn-success btn-sm" id="btn-run-finish" style="display: none;">Finish Run <i class="bi bi-check-all"></i></button>
                    </div>
                </div>
                
                <!-- Right/Sidebar: Step List & Notes -->
                <div class="col-lg-4">
                    <div class="run-sidebar">
                        <h5 class="mb-3 small fw-bold">PROTOCOL STEPS</h5>
                        <ul class="list-group run-step-list mb-4" id="run-step-list">
                            <li class="list-group-item text-muted">Loading steps...</li>
                        </ul>
                        <h5 class="mb-3 small fw-bold">RUN NOTES 📝</h5>
                        <textarea id="run-notes" class="form-control" rows="5" placeholder="Add run-specific notes, deviations, or observations..."></textarea>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Core Application Logic -->
    <script src="common_scripts.js"></script>
    <script>
        let runState = { protocol: null, currentStep: 0, timerSeconds: 0, stepChecklist: {}, linkedExperimentId: null, runStartTime: null }; 

        document.addEventListener('DOMContentLoaded', async () => {
            App.initBootstrapComponents();

            const runProtocolTitle = document.getElementById('run-protocol-title');
            const runLinkedExperimentIdEl = document.getElementById('run-linked-experiment-id');
            const btnRunPrev = document.getElementById('btn-run-prev');
            const btnRunNext = document.getElementById('btn-run-next');
            const btnRunFinish = document.getElementById('btn-run-finish');
            const btnExitRun = document.getElementById('btn-exit-run');
            const runStepList = document.getElementById('run-step-list');
            const runNotes = document.getElementById('run-notes');
            const userWelcomeEl = document.getElementById('user-welcome');

            // Function to fetch and set the current user's name
            async function loadCurrentUser() {
                 try {
                     const response = await fetch('/mylims_demo/api/login', { method: 'GET' });
                     const data = await response.json();
                     if (data && data.user && data.user.full_name) {
                         App.currentUser = { person_id: data.user.person_id, full_name: data.user.full_name };
                         userWelcomeEl.textContent = `Welcome, ${data.user.full_name} 👩‍🔬`;
                     } else {
                         App.currentUser = { person_id: null, full_name: 'Guest User' };
                         userWelcomeEl.textContent = `Welcome, Guest User 🧐`;
                     }
                 } catch (e) {
                     App.currentUser = { person_id: null, full_name: 'Guest User' };
                     userWelcomeEl.textContent = `Welcome, Guest User 🧐`;
                 }
            }
            await loadCurrentUser();

            // --- Handlers for Run Page ---
            const startProtocolRun = async (protocolId, experimentId) => {
                 const protocol = await App.apiCall(`/eln/protocols/${protocolId}`);
                 if (!protocol || !protocol.steps || protocol.steps.length === 0) {
                     App.showConfirmationModal("Error", "Protocol not found or has no steps.", () => window.location.href = 'protocol_manager_dashboard.html', "OK");
                     return;
                 }
                 
                 runState.protocol = protocol; 
                 runState.currentStep = 0;
                 runState.stepChecklist = {}; 
                 runState.linkedExperimentId = experimentId; 
                 runState.runStartTime = new Date(); 
                 
                 runProtocolTitle.textContent = `Running: ${protocol.title || 'Untitled Protocol'}`;
                 runLinkedExperimentIdEl.textContent = experimentId; 
                 runNotes.value = ''; 
                 
                 renderRunStepList();
                 renderRunStep(0);
             };
            
            // Re-implement simplified version of renderRunStep/List for local use
            const renderRunStepList = () => {
                const runStepList = document.getElementById('run-step-list');
                 runStepList.innerHTML = '';
                 runState.protocol.steps.forEach((step, index) => {
                     const isCompleted = runState.stepChecklist[index] === 'done';
                     const isActive = index === runState.currentStep;
                     const item = document.createElement('li');
                     item.className = `list-group-item d-flex justify-content-between align-items-center ${isActive ? 'active' : ''}`;
                     item.dataset.stepIndex = index;
                     item.textContent = `Step ${step.step_number || index + 1}: ${step.title || 'Untitled'}`;
                     if(isCompleted) {
                          const icon = document.createElement('i');
                          icon.className = 'bi bi-check-circle-fill ms-2';
                          item.appendChild(icon);
                     }
                     runStepList.appendChild(item);
                 });
            };
            const renderRunStep = (stepIndex) => {
                 if (stepIndex < 0 || !runState.protocol || stepIndex >= runState.protocol.steps.length) return;
                 
                 const previousStepIndex = runState.currentStep;
                 const prevStep = runState.protocol.steps[previousStepIndex];
                 if (App.currentTimerInterval) App.stopRunTimer();
                 if (prevStep && prevStep.run_start_time && !prevStep.run_end_time) { prevStep.run_end_time = new Date(); } 

                 runState.currentStep = stepIndex;
                 const step = runState.protocol.steps[stepIndex];

                 if (!step.run_start_time) { step.run_start_time = new Date(); } 

                 const runStepTitle = document.getElementById('run-step-title');
                 const runStepDurationBadge = document.getElementById('run-step-duration-badge');
                 const runStepComponentsView = document.getElementById('run-step-components-view');
                 const runStepDescription = document.getElementById('run-step-description');
                 const runStepTimerContainer = document.getElementById('run-step-timer-container');
                 const runStepReagents = document.getElementById('run-step-reagents');
                 
                 runStepTitle.textContent = `Step ${step.step_number || stepIndex + 1}: ${step.title || 'Untitled Step'}`;
                 runStepDurationBadge.textContent = step.estimated_time_minutes ? `Est. ${step.estimated_time_minutes} min` : 'No estimate';

                 runStepComponentsView.innerHTML = (step.components || []).map(comp => {
                      let details = ''; let icon = 'bi-box';
                      switch(comp.type){ 
                          case 'Centrifuge': icon='bi-arrow-repeat'; details = `Speed: ${App.formatComponentValue(comp.speed)}, Time: ${App.formatComponentValue(comp.time)}, Temp: ${App.formatComponentValue(comp.temp)}`; break;
                          case 'Shake': icon='bi-phone-vibrate'; details = `Speed: ${App.formatComponentValue(comp.speed)}, Time: ${App.formatComponentValue(comp.time)}`; break;
                          case 'Incubate': icon='bi-thermometer-half'; details = `Temp: ${App.formatComponentValue(comp.temp)}, Time: ${App.formatComponentValue(comp.time)}`; break;
                          case 'Cool': icon='bi-snow'; details = `Temp: ${App.formatComponentValue(comp.temp)}, Time: ${App.formatComponentValue(comp.time)}`; break;
                          case 'Reagent': icon='bi-beaker'; details = `Name: ${App.formatComponentValue(comp.name)}, Qty: ${App.formatComponentValue(comp.quantity)}, Conc: ${App.formatComponentValue(comp.concentration)}`; break;
                          case 'Equipment': icon='bi-wrench'; details = `Name: ${App.formatComponentValue(comp.name)}`; break;
                          default: details = 'Custom Component'; 
                      }
                      return `<p class="small"><i class="${icon} me-1"></i><strong>${comp.type}:</strong> ${details}</p>`;
                 }).join('');

                 let descriptionHtml = App.mdConverter.makeHtml(step.description || '');
                 descriptionHtml = descriptionHtml.replace(/<li>\s*\[ \]\s*/g, '<li class="run-checklist-item"><input type="checkbox"> <p>');
                 descriptionHtml = descriptionHtml.replace(/<li>\s*\[x\]\s*/gi, '<li class="run-checklist-item"><input type="checkbox" checked> <p>');
                 descriptionHtml = descriptionHtml.replace(/<\/li>/g, '</p></li>'); 
                 if (descriptionHtml.includes('run-checklist-item')) { descriptionHtml = descriptionHtml.replace(/<ul>/, '<ul class="run-checklist">'); }
                 runStepDescription.innerHTML = descriptionHtml;
                 runStepReagents.textContent = step.reagents || 'N/A';

                 runStepTimerContainer.innerHTML = ''; 
                 if (step.timer) {
                     const seconds = App.parseTimerString(step.timer);
                     if (seconds > 0) {
                         runStepTimerContainer.innerHTML = `<div class="timer-widget text-center"><h5 class="mb-3 small fw-bold">STEP TIMER: ${step.timer}</h5><div class="timer-display mb-3" id="timer-display-${stepIndex}">${App.formatTime(seconds)}</div><div class="btn-group btn-group-sm"><button class="btn btn-success btn-timer-start" data-seconds="${seconds}"><i class="bi bi-play-fill"></i> Start</button><button class="btn btn-warning btn-timer-pause" disabled><i class="bi bi-pause-fill"></i> Pause</button><button class="btn btn-danger btn-timer-reset"><i class="bi bi-stop-fill"></i> Reset</button></div></div>`;
                     }
                 }

                 const totalSteps = runState.protocol.steps.length;
                 btnRunPrev.style.visibility = stepIndex === 0 ? 'hidden' : 'visible';
                 btnRunNext.style.display = stepIndex === totalSteps - 1 ? 'none' : 'inline-block';
                 btnRunFinish.style.display = stepIndex === totalSteps - 1 ? 'inline-block' : 'none';

                 const runProgressBar = document.getElementById('run-progress-bar');
                 const progress = ((stepIndex + 1) / totalSteps) * 100;
                 runProgressBar.style.width = `${progress}%`;
                 runProgressBar.setAttribute('aria-valuenow', progress);

                 renderRunStepList();
            };
            
            // Navigation Handlers
            btnRunPrev.addEventListener('click', () => { renderRunStep(runState.currentStep - 1); });
            btnRunNext.addEventListener('click', () => { runState.stepChecklist[runState.currentStep] = 'done'; renderRunStep(runState.currentStep + 1); });
            btnRunFinish.addEventListener('click', async () => {
                 runState.stepChecklist[runState.currentStep] = 'done';
                 const lastStep = runState.protocol.steps[runState.currentStep];
                 if (lastStep && lastStep.run_start_time && !lastStep.run_end_time) { lastStep.run_end_time = new Date(); }
                 
                 App.showConfirmationModal('Finish Run', 'Save execution records to the database?', async () => {
                     const protocolId = runState.protocol.protocol_id;
                     const runPayload = {
                         protocol_id: protocolId, experiment_id: runState.linkedExperimentId,
                         experiment_date: new Date().toISOString().split('T')[0],
                         executed_by_person_id: App.currentUser.person_id,
                         run_notes: runNotes.value,
                         steps: runState.protocol.steps.map((step, index) => ({
                             step_id: step.step_id || step.client_id, step_number: step.step_number || index + 1,
                             status: runState.stepChecklist[index] || 'skipped',
                             start_time: step.run_start_time ? step.run_start_time.toISOString() : null,
                             end_time: step.run_end_time ? step.run_end_time.toISOString() : null,
                             notes: runNotes.value 
                         }))
                     };
                     
                     try {
                         await App.apiCall('/eln/runs', 'POST', runPayload);
                         App.showConfirmationModal('Run Saved!', `Successfully logged run data.`, () => { window.location.href = `protocol_manager_view.html#view=${protocolId}`; }, "OK");
                     } catch (e) {
                         App.showConfirmationModal('Save Failed', `Could not save run data. Error: ${e.message}`, () => {}, "OK");
                     }
                 }, "Save & Finish");
             });
            btnExitRun.addEventListener('click', () => { 
                  if (App.currentTimerInterval) App.stopRunTimer();
                  App.showConfirmationModal('Exit Run?', 'Progress will not be saved.', () => { window.location.href = `protocol_manager_view.html#view=${runState.protocol?.protocol_id}`; }, "Exit Run");
             });
            runStepList.addEventListener('click', (e) => {
                 const listItem = e.target.closest('li');
                 if(listItem && listItem.dataset.stepIndex !== undefined) { renderRunStep(parseInt(listItem.dataset.stepIndex, 10)); }
             });

            // Initialization
            const hash = window.location.hash.substring(1);
            const match = hash.match(/^run=(.+)&exp=(.+)$/);
            if (match) {
                await startProtocolRun(match[1], match[2]);
            } else {
                 runProtocolTitle.textContent = 'Error: Missing Run Parameters.';
                 document.getElementById('run-step-list').innerHTML = '<li class="list-group-item text-danger">Invalid URL: Missing Protocol ID or Experiment ID.</li>';
                 btnRunNext.style.display = 'none';
                 btnRunPrev.style.display = 'none';
                 btnRunFinish.style.display = 'none';
            }
        });
    </script>
</body>
</html>
