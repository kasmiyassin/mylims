<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocols Dashboard - LIMS/ELN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Protocols.io Design System */
        :root { --pio-primary: #1e70bf; --pio-light-blue: #e8f0f8; --pio-bg-light: #f8f9fa; --pio-border: #d3dce0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--pio-bg-light); }
        .navbar-dark .navbar-brand { color: #fff !important; font-weight: 600; }
        .navbar-dark .nav-link { color: rgba(255, 255, 255, 0.75); }
        .navbar-dark .nav-link.active, .navbar-dark .nav-link:hover { color: #fff; }
        .app-page { display: block; }

        /* Card and Tag Styling */
        .protocol-card { transition: all 0.2s ease-in-out; border: 1px solid var(--pio-border); background-color: #fff; border-radius: 0.5rem; }
        .protocol-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08); border-color: var(--pio-primary); }
        .protocol-card .card-footer { background-color: #fcfcfc; border-top: 1px solid #e9ecef; }
        .tag { background-color: var(--pio-light-blue) !important; color: var(--pio-primary) !important; font-weight: 500; padding: 0.15em 0.5em; font-size: 0.75rem; border-radius: 12px; }

        /* List View Specifics */
        .protocol-list-view .protocol-card { flex-direction: row; }
        .protocol-list-view .protocol-card .card-body { flex: 1; border-right: 1px solid var(--pio-border); }
        .protocol-list-view .protocol-card .card-footer { flex-basis: 180px; border-top: 0; display: flex; align-items: center; justify-content: flex-end; }
        .protocol-list-view .col-lg-4 { max-width: 100%; }

        /* Search & Filter Styling */
        .filter-select { border-radius: 0.25rem !important; }
        .search-input { border-radius: 0.25rem 0 0 0.25rem !important; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar (Consistent across all pages) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="protocol_manager_dashboard.html"><i class="bi bi-robot"></i> LIMS / ELN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="protocol_manager_dashboard.html"><i class="bi bi-journal-text"></i> Protocols</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-beaker"></i> Experiments</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-seam"></i> Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-calendar-check"></i> Booking</a></li>
                </ul>
                <div class="d-flex">
                    <!-- Dynamic user name display -->
                    <span class="navbar-text me-3" id="user-welcome">Welcome...</span>
                    <button class="btn btn-outline-light btn-sm" type="button" onclick="App.apiCall('/logout', 'POST').then(() => window.location.href='login.html');">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Shared Modals (Minimal version - complete structure provided in other files) -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modal-title">Confirmation</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body" id="modal-body">Are you sure?</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" id="btn-modal-confirm">Confirm</button></div></div></div></div>
    <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="shareModalLabel">Share Protocol 📤</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Invite people 📧</label><div class="input-group"><input type="email" class="form-control" placeholder="Enter email address..."><select class="form-select" style="max-width: 120px;"><option value="view">Viewer 👁️</option><option value="edit">Editor ✏️</option></select><button class="btn btn-outline-primary" type="button">Invite</button></div></div><hr><div class="mb-3"><label class="form-label">Get shareable link 🔗</label><div class="input-group"><input type="text" class="form-control" id="share-link-input" value="https://example.com/share/..." readonly><button class="btn btn-outline-secondary btn-copy-link" type="button" title="Copy link" onclick="App.handleClipboardCopy(event);"><i class="bi bi-clipboard"></i></button></div></div></div></div></div></div>

    <!-- MAIN CONTENT AREA -->
    <main class="container-fluid my-4">

        <!-- 1. PROTOCOLS DASHBOARD PAGE -->
        <section class="app-page">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 text-dark">Protocols Library</h1>
                <a href="protocol_manager_editor.html" class="btn btn-primary shadow-sm" id="btn-goto-create">
                    <i class="bi bi-plus-circle-fill"></i> Create New Protocol
                </a>
            </div>

            <!-- Search and Filter Bar -->
            <div class="card mb-4 shadow-sm border-0">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-lg-5">
                            <label for="search-protocols" class="form-label small text-muted fw-bold">SEARCH</label>
                            <div class="input-group">
                                <input type="text" class="form-control search-input" id="search-protocols" placeholder="Search by title, tag, or content...">
                                <span class="input-group-text bg-white border-start-0 border-end-0"><i class="bi bi-search"></i></span>
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-4">
                            <label for="filter-category" class="form-label small text-muted fw-bold">CATEGORY</label>
                            <select id="filter-category" class="form-select filter-select">
                                <option value="" selected>All Categories</option>
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4">
                            <label for="filter-status" class="form-label small text-muted fw-bold">STATUS</label>
                            <select id="filter-status" class="form-select filter-select">
                                <option value="" selected>All Statuses</option>
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4">
                            <label for="sort-protocols" class="form-label small text-muted fw-bold">SORT BY</label>
                            <select id="sort-protocols" class="form-select filter-select">
                                <option value="updated_at,desc" selected>Recently Updated</option>
                                <option value="title,asc">Title (A-Z)</option>
                                <option value="created_at,desc">Created Date</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- View Toggle -->
            <div class="d-flex justify-content-end mb-3">
                <div class="btn-group" role="group" aria-label="View toggle">
                    <button type="button" class="btn btn-outline-secondary active" id="btn-grid-view" title="Grid View"><i class="bi bi-grid-3x3-gap-fill"></i></button>
                    <button type="button" class="btn btn-outline-secondary" id="btn-list-view" title="List View"><i class="bi bi-list-ul"></i></button>
                </div>
            </div>

            <!-- Protocol List (Card View) -->
            <div class="row" id="protocol-list-container">
                <!-- Protocols will be dynamically inserted here by JS via API call -->
            </div>
            <div id="no-protocols-message" class="text-center text-muted p-5" style="display: none;">
                <p class="h5">No protocols found.</p>
                <p>Try adjusting your search filters or create a new protocol.</p>
            </div>
        </section>

    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Core Application Logic -->
    <script src="common_scripts.js"></script>

    <script>
        let isListView = false;
        
        document.addEventListener('DOMContentLoaded', async () => {
            App.initBootstrapComponents();
            const protocolListContainer = document.getElementById('protocol-list-container');
            const noProtocolsMessage = document.getElementById('no-protocols-message');
            const searchInput = document.getElementById('search-protocols');
            const categoryFilter = document.getElementById('filter-category');
            const statusFilter = document.getElementById('filter-status');
            const sortSelect = document.getElementById('sort-protocols');
            const btnGridView = document.getElementById('btn-grid-view');
            const btnListView = document.getElementById('btn-list-view');
            const userWelcomeEl = document.getElementById('user-welcome');
            
            // Function to fetch and set the current user's name
            async function loadCurrentUser() {
                 try {
                     const response = await fetch('/mylims_demo/api/login', { method: 'GET' }); // Assuming Flask has a status/check endpoint
                     const data = await response.json();
                     if (data && data.user && data.user.full_name) {
                         App.currentUser = { person_id: data.user.person_id, full_name: data.user.full_name };
                         userWelcomeEl.textContent = `Welcome, ${data.user.full_name} 👩‍🔬`;
                     } else {
                         // Fallback if session is invalid, redirect to login (Uncomment if needed)
                         // window.location.href = 'login.html'; 
                         App.currentUser = { person_id: 'guest', full_name: 'Guest User' };
                         userWelcomeEl.textContent = `Welcome, Guest User 🧐`;
                     }
                 } catch (e) {
                     App.currentUser = { person_id: 'guest', full_name: 'Guest User' };
                     userWelcomeEl.textContent = `Welcome, Guest User 🧐`;
                 }
            }
            await loadCurrentUser(); // Load user details immediately

            async function renderDashboard() {
                const searchTerm = searchInput.value;
                const category = categoryFilter.value;
                const status = statusFilter.value;
                const [orderBy, orderDir] = sortSelect.value.split(',');
                const params = new URLSearchParams();
                if (searchTerm) params.append('filter_title', searchTerm); 
                if (category) params.append('filter_category_id', category); 
                if (status) params.append('filter_status_id', status);
                if (orderBy) params.append('order_by', orderBy);
                if (orderDir) params.append('order_direction', orderDir);
                
                protocolListContainer.innerHTML = '<div class="col-12 text-center text-muted p-5"><div class="spinner-border spinner-border-sm" role="status"></div> Loading protocols...</div>'; 
                noProtocolsMessage.style.display = 'none';

                try {
                    const protocols = await App.apiCall(`/eln/protocols?${params.toString()}`);
                    
                    protocolListContainer.innerHTML = ''; 
                    if (!protocols || !Array.isArray(protocols) || protocols.length === 0) {
                        noProtocolsMessage.style.display = 'block';
                    } else {
                        noProtocolsMessage.style.display = 'none';
                        protocols.forEach(p => {
                            const tagsString = typeof p.tags === 'string' ? p.tags : (p.tags?.join(', ') || ''); 
                            protocolListContainer.insertAdjacentHTML('beforeend', App.createProtocolCardHtml(p, tagsString));
                        });
                        if(isListView) {
                            protocolListContainer.classList.add('protocol-list-view');
                        } else {
                            protocolListContainer.classList.remove('protocol-list-view');
                        }
                    }
                } catch (error) {
                    protocolListContainer.innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load protocols. Check server logs and Flask connection.</div></div>';
                    console.error("Failed to render dashboard:", error);
                }
            }

            async function loadReferenceData() {
                 try {
                      const statuses = await App.apiCall('/table/reference/status'); 
                      const categories = await App.apiCall('/table/reference/category'); 
                      
                      App.populateSelect(statusFilter, statuses, 'status_id', 'status_id'); 
                      App.populateSelect(categoryFilter, categories, 'category_id', 'category_id'); 

                 } catch (error) { 
                      console.error("Failed to load reference data:", error);
                 }
            }

            [searchInput, categoryFilter, statusFilter, sortSelect].forEach(el => {
                el.addEventListener('input', renderDashboard); 
                el.addEventListener('change', renderDashboard); 
            });
            btnGridView.addEventListener('click', () => { 
                isListView = false;
                protocolListContainer.classList.remove('protocol-list-view'); 
                btnGridView.classList.add('active'); 
                btnListView.classList.remove('active'); 
                renderDashboard();
            });
            btnListView.addEventListener('click', () => { 
                 isListView = true;
                 protocolListContainer.classList.add('protocol-list-view'); 
                 btnListView.classList.add('active'); 
                 btnGridView.classList.remove('active'); 
                 renderDashboard();
            });

            protocolListContainer.addEventListener('click', async (e) => {
                const btn = e.target.closest('button');
                if (!btn || btn.classList.contains('btn-view') || btn.classList.contains('btn-edit')) return;
                const id = btn.dataset.id;
                
                if (btn.classList.contains('btn-duplicate')) {
                    App.showConfirmationModal('Fork Protocol?', `Forking creates a new draft copy. Proceed?`, async () => {
                         try {
                             const originalProtocol = await App.apiCall(`/eln/protocols/${id}`); 
                             const forkData = { 
                                ...originalProtocol, 
                                title: `Copy of ${originalProtocol.title}`, 
                                status_id: 'draft', 
                                version: 1, 
                                parent_protocol_id: id, 
                                // Dynamic author for the fork
                                author_person_id: App.currentUser.person_id 
                             };
                             delete forkData.protocol_id; delete forkData.created_at; delete forkData.updated_at; delete forkData.current_version_id; delete forkData.protocol_search_vector; 
                             const stepsToCopy = originalProtocol.steps || [];
                             delete forkData.steps; 
                             const newProtocol = await App.apiCall('/eln/protocols', 'POST', forkData); 
                             if (stepsToCopy.length > 0 && newProtocol.protocol_id) {
                                 for (const step of stepsToCopy) {
                                     const newStepData = {...step, protocol_id: newProtocol.protocol_id};
                                     delete newStepData.step_id; delete newStepData.created_at; delete newStepData.updated_at; delete newStepData.step_search_vector;
                                     await App.apiCall(`/eln/protocols/${newProtocol.protocol_id}/steps`, 'POST', newStepData);
                                 }
                             }
                             renderDashboard(); 
                         } catch (error) { 
                              App.showConfirmationModal("Fork Failed", `Could not create a copy: ${error.message}`, ()=>{}, "OK");
                         }
                    }, "Fork");
                }
                if (btn.classList.contains('btn-share')) { 
                      document.getElementById('share-link-input').value = `${window.location.origin}${window.location.pathname.replace('dashboard.html', 'view.html')}#view=${id}`; 
                      new bootstrap.Modal(document.getElementById('shareModal')).show(); 
                 }
                if (btn.classList.contains('btn-delete')) {
                    let titleToDelete = `protocol ${id}`;
                    try { const proto = await App.apiCall(`/eln/protocols/${id}`); if (proto && proto.title) titleToDelete = proto.title; } catch(err) { /* Ignore error */ }
                    
                    App.showConfirmationModal('Delete Protocol? 🗑️', `Delete "${titleToDelete}"? This action cannot be undone.`, async () => {
                        try {
                            await App.apiCall(`/eln/protocols/${id}`, 'DELETE'); 
                            renderDashboard(); 
                        } catch (error) { console.error("Failed to delete protocol:", error); }
                    }, "Delete");
                }
            });

            await loadReferenceData();
            await renderDashboard();
        });
    </script>
</body>
</html>
