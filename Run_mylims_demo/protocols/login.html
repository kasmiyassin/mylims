<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMS/ELN Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { max-width: 400px; width: 90%; padding: 2rem; background: #fff; border-radius: 0.75rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border-top: 5px solid #1e70bf; }
        .login-container h2 { color: #1e70bf; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-container text-center">
        <h2 class="mb-4"><i class="bi bi-robot me-2"></i>LIMS / ELN</h2>
        <p class="text-muted small">Access Protocol Management System</p>
        <form id="login-form">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="User ID" required>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 shadow-sm" id="btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
            <div id="login-message" class="mt-3 small text-danger" style="display: none;"></div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('login-message');
            const btn = document.getElementById('btn-login');

            messageEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';

            try {
                const response = await fetch('/mylims_demo/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = 'protocol_manager_dashboard.html'; 
                } else {
                    messageEl.textContent = data.error || 'Login failed. Check credentials.';
                    messageEl.style.display = 'block';
                }
            } catch (error) {
                messageEl.textContent = 'Network error. Could not connect to server.';
                messageEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
            }
        });
    </script>
</body>
</html>
