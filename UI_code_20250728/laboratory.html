        function addFilterAndSortListeners() {
            console.log("Adding filter and sort listeners.");
            document.querySelectorAll('.sortable-header').forEach(header => {
                header.removeEventListener('click', handleSortClick);
                header.addEventListener('click', handleSortClick);
            });
            document.querySelectorAll('.filter-input').forEach(input => {
                input.removeEventListener('input', handleFilterInput);
                input.addEventListener('input', handleFilterInput);
            });
            updateSortIcons(); 
        }

        function handleSortClick(e) {
            const column = e.currentTarget.dataset.column;
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            applyFiltersAndSort();
        }

        function handleFilterInput(e) {
            const column = e.target.dataset.column;
            columnFilters[column] = e.target.value.toLowerCase();
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            let tempArray = [...currentTableData]; 
            for (const column in columnFilters) {
                const filterText = columnFilters[column];
                if (filterText) {
                    tempArray = tempArray.filter(row => 
                        String(row[column] || '').toLowerCase().includes(filterText)
                    );
                }
            }
            if (sortColumn) {
                tempArray.sort((a, b) => {
                    const valA = String(a[sortColumn] || '').toLowerCase();
                    const valB = String(b[sortColumn] || '').toLowerCase();
                    const colSchema = currentTableSchema.find(c => c.column_name === sortColumn);

                    if (colSchema && ['date', 'timestamp with time zone', 'timestamp without time zone'].includes(colSchema.data_type)) { 
                        const dateA = new Date(a[sortColumn]), dateB = new Date(b[sortColumn]);
                        if (isNaN(dateA.getTime()) || isNaN(dateB.getTime())) return 0; 
                        return sortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }
            renderTable(tempArray, currentTableSchema);
            updateSortIcons(); 
        }

        function updateSortIcons() {
            document.querySelectorAll('.sortable-header i').forEach(icon => icon.setAttribute('data-lucide', 'chevrons-up-down'));
            if (sortColumn) {
                const currentSortIcon = document.querySelector(`.sortable-header[data-column="${sortColumn}"] i`);
                if (currentSortIcon) currentSortIcon.setAttribute('data-lucide', sortDirection === 'asc' ? 'chevron-up' : 'chevron-down');
            }
            lucide.createIcons(); 
        }

        async function renderRecordDetails(pkValues) {
            console.log("Rendering record details for PKs:", pkValues);
            const container = document.getElementById('record-details-container');
            container.innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="loader-2" class="animate-spin mx-auto h-12 w-12 text-blue-600"></i><p class="mt-2">Loading record details...</p></div></div>`;
            lucide.createIcons();

            const record = currentTableData.find(r => {
                return Object.keys(pkValues).every(key => {
                    const colSchema = currentTableSchema.find(s => s.column_name === key);
                    if (colSchema && colSchema.data_type === 'date') {
                        return formatDateForInput(r[key]) === pkValues[key];
                    }
                    return String(r[key]) === String(pkValues[key]);
                });
            });

            if (!record) { 
                console.error("Record not found in currentTableData for PKs:", pkValues);
                container.innerHTML = `<div class="card p-6 text-red-500">Error: Record details not found.</div>`; 
                return; 
            }

            const renderDetailRow = (label, value, isLink = false, linkTarget = '') => {
                if (value === null || value === undefined || String(value).trim() === '' || value === 'N/A') {
                    return '';
                }
                let displayValue = value;
                if (typeof value === 'object' && value !== null) {
                    displayValue = `<pre class="bg-gray-100 p-2 rounded-md text-xs overflow-auto max-h-24">${JSON.stringify(value, null, 2)}</pre>`;
                } else if (isLink) {
                    displayValue = `<a href="${linkTarget}" class="text-blue-600 hover:underline" target="_blank">${value}</a>`;
                } else if (label.includes('Attachment File') && value) {
                    // Assuming value for attachment is base64 encoded string from backend
                    displayValue = `<span class="text-gray-500">Binary data present (${(atob(value).length / 1024).toFixed(2)} KB)</span>`;
                } else if (label.includes('Date') && typeof value === 'string') {
                    try { displayValue = new Date(value).toLocaleDateString('en-CA'); } catch (e) { /* keep original */ }
                } else if (label.includes('Timestamp') && typeof value === 'string') {
                    try { displayValue = new Date(value).toLocaleString(); } catch (e) { /* keep original */ }
                }
                return `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${label}</dt><dd class="text-gray-900 break-all">${displayValue}</dd></div>`;
            };

            let detailsHtml = `<div class="space-y-3 text-sm">`;
            detailsHtml += `
                <div class="accordion-item">
                    <button class="accordion-header active" data-accordion="core-info">
                        <span class="flex items-center"><i data-lucide="info" class="w-5 h-5 mr-2"></i> Record Details</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 transform transition-transform duration-300"></i>
                    </button>
                    <div class="accordion-content open">
                        <dl class="space-y-2 py-2">
                            ${Object.keys(record).map(key => {
                                // Exclude binary/hash/search_vector/geometry columns from direct display in details panel
                                if (key.includes('attachment') && key !== 'attachment_link') return '';
                                if (key.includes('password_hash')) return '';
                                if (key.includes('search_vector')) return '';
                                if (key.includes('geom')) return '';

                                return renderDetailRow(formatColumnName(key), record[key]);
                            }).join('')}
                        </dl>
                    </div>
                </div>
            `;
            container.innerHTML = `<div class="card p-6 h-full flex flex-col"><div class="flex justify-between items-start mb-4"><div><h2 class="text-2xl font-bold text-gray-800">Selected Record</h2><p class="text-sm text-gray-500">${Object.values(pkValues).join(' / ')}</p></div></div><div class="flex-grow overflow-y-auto pr-2">${detailsHtml}</div></div>`;
            lucide.createIcons(); 
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    header.classList.toggle('active');
                    content.classList.toggle('open');
                    lucide.createIcons();
                });
            });
        }

        // --- MODAL LOGIC ---
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            // Explicitly set opacity and transform for better rendering consistency
            setTimeout(() => {
                modalContent.style.opacity = '1';
                modalContent.style.transform = 'translateY(0)';
            }, 10);
            const closeModal = () => {
                modalContent.style.opacity = '0';
                modalContent.style.transform = 'translateY(-2.5rem)'; /* Revert to initial transform */
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }

        async function showCreateEditModal(record = null, targetTable = null) {
            console.log("Showing create/edit modal. Record:", record, "Target Table:", targetTable);
            const isEditing = record !== null && !targetTable; // If targetTable is provided, it's always a 'create' for that table
            const finalTargetTableName = targetTable || currentTableName; 
            const [schemaName, tableName] = finalTargetTableName.split('.');

            const targetTableSchema = await getTableSchema(schemaName, tableName);
            if (!targetTableSchema || targetTableSchema.error) {
                showToast('Error fetching schema for form: ' + (targetTableSchema ? targetTableSchema.error : 'Unknown error'), "error");
                return;
            }
            
            const pkColumnsForTargetTable = await getPrimaryKeysForTable(schemaName, tableName);

            // Fetch all common reference data for dropdowns in modals
            const [
                persons, statuses, projects, samplesTypes, samplingEvents, cruises, species, units, 
                externalContacts, suppliers, inventoryItems, publicationTypes, workflows, 
                workflowSteps, equipment, primers, taxon, genes, rooms, customers, vessels, regions, ecosystems,
                referenceDatabases, analysisPipelines
            ] = await Promise.all([ 
                getReferenceData('personal', 'reference'), 
                getReferenceData('status', 'reference'),
                getReferenceData('projects', 'lims'),
                getReferenceData('samples_type', 'reference'),
                apiFetch('table/lab/sampling?order_by=sampling_date&order_direction=desc&limit=100'), // Limited for performance
                getReferenceData('cruises', 'lims'),
                getReferenceData('species', 'reference'),
                getReferenceData('units', 'reference'),
                getReferenceData('external_contacts', 'lims'),
                getReferenceData('suppliers', 'lims'),
                getReferenceData('inventory_items', 'lims'),
                getReferenceData('publication_type', 'lims'),
                getReferenceData('workflows', 'lims'),
                getReferenceData('workflow_steps', 'lims'),
                getReferenceData('equipment', 'lims'),
                getReferenceData('primers', 'lims'),
                getReferenceData('taxon', 'reference'),
                getReferenceData('gene', 'reference'),
                getReferenceData('room', 'reference'),
                getReferenceData('customers', 'lims'),
                getReferenceData('vessel', 'reference'),
                getReferenceData('region', 'reference'),
                getReferenceData('ecosystem', 'reference'),
                getReferenceData('reference_databases', 'bioinformatics'),
                getReferenceData('analysis_pipelines', 'bioinformatics')
            ]);


            let formFieldsHtml = '';
            targetTableSchema.forEach(col => {
                const isAutoGenerated = col.column_default && col.column_default.includes('nextval');
                
                // Determine if a field should be hidden (auto-generated on creation)
                const isHiddenField = (!isEditing && isAutoGenerated);
                // Determine if a field should be read-only (primary key when editing, but not auto-generated)
                let isReadOnlyField = (isEditing && pkColumnsForTargetTable.includes(col.column_name) && !isAutoGenerated);
                
                // Allow specific date PKs to be editable as they are part of form input (e.g., experiment_date, sampling_date)
                if (isReadOnlyField && col.data_type === 'date') {
                    isReadOnlyField = false; 
                }

                if (col.column_name.includes('password_hash') || col.column_name.includes('search_vector')) {
                    return; // Always exclude these
                }

                let value = record ? (record[col.column_name] || '') : (col.column_default ? col.column_default.replace(/::[a-z_]+/g, '').replace(/'/g, '') : '');
                // If pre-filled data (from `record` param) is available, use it instead of default/existing value
                if (record && record[col.column_name] !== undefined) {
                    value = record[col.column_name];
                }

                let inputType = 'text'; 
                let extraAttrs = '';
                let label = formatColumnName(col.column_name);
                let optionsHtml = '';

                if (isHiddenField) {
                    // Hidden input for auto-generated fields, no label or display
                    formFieldsHtml += `<input type="hidden" name="${col.column_name}" value="${value}">`;
                    return;
                }

                if (isReadOnlyField) {
                    extraAttrs += ' readonly'; // Mark as read-only for editing PKs
                    // For display consistency, convert date/datetime values to readable format if read-only
                    if (col.data_type === 'date') value = formatDateForInput(value);
                    if (col.data_type === 'timestamp with time zone' || col.data_type === 'timestamp without time zone') value = formatDateTimeForInput(value);
                }

                if (col.column_name === 'attachment') {
                    formFieldsHtml += `
                        <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                            <label class="block text-gray-700 text-sm font-bold mb-1">${label} (File)</label>
                            <input type="file" name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>
                            ${record && record.attachment ? `<p class="text-xs text-gray-500 mt-1">Existing attachment present. Uploading new file will replace it.</p>` : ''}
                        </div>
                    `;
                    return;
                } else if (col.column_name === 'attachment_link') {
                    inputType = 'url';
                }

                switch (col.data_type) {
                    case 'integer':
                    case 'numeric':
                    case 'bigint':
                        inputType = 'text'; // Keep as text to allow flexible input (e.g., with commas/periods)
                        break;
                    case 'date':
                        inputType = 'date';
                        if (value) value = formatDateForInput(value);
                        break;
                    case 'timestamp with time zone':
                    case 'timestamp without time zone':
                        inputType = 'datetime-local';
                        if (value) value = formatDateTimeForInput(value);
                        break;
                    case 'boolean':
                        inputType = 'checkbox';
                        extraAttrs += value ? ' checked' : '';
                        value = ''; // Checkboxes don't use the 'value' attribute this way
                        break;
                    case 'text':
                    case 'character varying':
                        if (col.column_name.includes('notes') || col.column_name.includes('description') || col.column_name.includes('aim') || col.column_name.includes('method') || col.column_name.includes('sop_protocol') || col.column_name.includes('body') || col.column_name.includes('title')) {
                            formFieldsHtml += `
                                <div class="md:col-span-2 ${isReadOnlyField ? 'opacity-70' : ''}">
                                    <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                    <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value}</textarea>
                                </div>
                            `;
                            return;
                        }
                        break;
                    case 'jsonb':
                        formFieldsHtml += `
                            <div class="md:col-span-2 ${isReadOnlyField ? 'opacity-70' : ''}">
                                <label class="block text-gray-700 text-sm font-bold mb-1">${label} (JSON)</label>
                                <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value ? JSON.stringify(value, null, 2) : ''}</textarea>
                            </div>
                        `;
                        return;
                    case 'USER-DEFINED': // For geometry type from PostGIS
                        if (col.column_name.includes('geom')) {
                             formFieldsHtml += `
                                <div class="md:col-span-2 ${isReadOnlyField ? 'opacity-70' : ''}">
                                    <label class="block text-gray-700 text-sm font-bold mb-1">${label} (WKT/GeoJSON)</label>
                                    <textarea name="${col.column_name}" class="w-full mt-1 p-2 border rounded h-24" ${isReadOnlyField ? 'readonly' : ''}>${value ? (value.wkt || JSON.stringify(value)) : ''}</textarea>
                                    <p class="text-xs text-gray-500 mt-1">Enter as WKT (e.g., POINT(lon lat)) or GeoJSON string.</p>
                                </div>
                            `;
                            return;
                        }
                        break;
                }

                // Handle dropdowns for foreign keys
                if (col.column_name.endsWith('_id') || col.column_name.endsWith('_nr')) { // Check for _id or _nr for FKs
                    let refData = [];
                    let valueKey = col.column_name;
                    let displayKey = col.column_name; 

                    // Define which reference data to use for each FK
                    if (col.column_name.includes('person_id') && persons) { refData = persons; displayKey = 'full_name'; }
                    else if (col.column_name.includes('status_id') && statuses) { refData = statuses; displayKey = 'status_id'; }
                    else if (col.column_name.includes('project_id') && projects) { refData = projects; displayKey = 'title'; }
                    else if (col.column_name.includes('sample_type_id') && samplesTypes) { refData = samplesTypes; displayKey = 'sample_type_abrv'; }
                    else if (col.column_name.includes('sampling_id') && samplingEvents) { 
                         refData = samplingEvents; 
                         displayKey = 'sampling_id'; 
                         optionsHtml = `<option value="">-- Select ${label} --</option>`;
                         optionsHtml += refData.map(item => `<option value="${item.sampling_id}" ${value == item.sampling_id ? 'selected' : ''}>${item.sampling_id} (${item.location_name || 'N/A'})</option>`).join('');
                         // Add sampling_date as a hidden field if sampling_id is selected and it's a composite PK
                         // This is crucial for tables that use (sampling_id, sampling_date) as a composite PK/FK
                         const samplingIdValue = record ? record.sampling_id : null;
                         const matchingSamplingEvent = samplingEvents.find(s => s.sampling_id === samplingIdValue);
                         if (matchingSamplingEvent && matchingSamplingEvent.sampling_date) {
                             formFieldsHtml += `<input type="hidden" name="sampling_date_from_sampling_id" value="${formatDateForInput(matchingSamplingEvent.sampling_date)}">`;
                         }
                         formFieldsHtml += `
                             <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                                 <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                 <select name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>${optionsHtml}</select>
                             </div>
                         `;
                         return; // Handled
                    } else if (col.column_name.includes('cruise_id') && cruises) {
                         refData = cruises; displayKey = 'cruise_id';
                    } else if (col.column_name.includes('species_id') && species) {
                         refData = species; displayKey = 'en_name';
                    } else if (col.column_name.includes('unit_id') && units) {
                         refData = units; displayKey = 'unit_abbreviation';
                    } else if (col.column_name.includes('gene_id') && genes) {
                         refData = genes; displayKey = 'gene_id';
                    } else if (col.column_name.includes('workflow_id') && workflows) {
                         refData = workflows; displayKey = 'workflow_name';
                    } else if (col.column_name.includes('step_id') && workflowSteps) {
                         refData = workflowSteps; displayKey = 'step_name'; 
                    } else if (col.column_name.includes('equipment_id') && equipment) {
                         refData = equipment; displayKey = 'equipment_name';
                    } else if (col.column_name.includes('supplier_id') && suppliers) {
                         refData = suppliers; displayKey = 'supplier_name';
                    } else if (col.column_name.includes('item_id') && inventoryItems) {
                         refData = inventoryItems; displayKey = 'item_name';
                    } else if (col.column_name.includes('publication_type_id') && publicationTypes) {
                         refData = publicationTypes; displayKey = 'publication_type_id';
                    } else if (col.column_name.includes('db_id') && referenceDatabases) {
                         refData = referenceDatabases; displayKey = 'db_name';
                    } else if (col.column_name.includes('pipeline_id') && analysisPipelines) {
                         refData = analysisPipelines; displayKey = 'pipeline_name';
                    } else if (col.column_name.includes('room_id') && rooms) {
                         refData = rooms; displayKey = 'room_id';
                    } else if (col.column_name.includes('customer_id') && customers) {
                         refData = customers; displayKey = 'customer_name'; valueKey = 'customer_id';
                    } else if (col.column_name.includes('vessel_id') && vessels) {
                         refData = vessels; displayKey = 'vessel_name';
                    } else if (col.column_name.includes('region_id') && regions) {
                         refData = regions; displayKey = 'region_abrv';
                    } else if (col.column_name.includes('ecosystem_id') && ecosystems) {
                         refData = ecosystems; displayKey = 'ecosystem_abrv';
                    }
                    
                    if (refData.length > 0) {
                        optionsHtml = `<option value="">-- Select ${label} --</option>`;
                        optionsHtml += refData.map(item => `<option value="${item[valueKey]}" ${value == item[valueKey] ? 'selected' : ''}>${item[displayKey] || item[valueKey]}</option>`).join('');
                        formFieldsHtml += `
                            <div class="${isReadOnlyField ? 'opacity-70' : ''}">
                                <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                                <select name="${col.column_name}" class="w-full mt-1 p-2 border rounded" ${isReadOnlyField ? 'disabled' : ''}>${optionsHtml}</select>
                            </div>
                        `;
                        return;
                    }
                }

                // Default input field for remaining columns
                formFieldsHtml += `
                    <div class="${isHiddenField ? 'hidden' : ''} ${isReadOnlyField ? 'opacity-70' : ''}">
                        <label class="block text-gray-700 text-sm font-bold mb-1">${label}</label>
                        <input type="${inputType}" name="${col.column_name}" ${col.is_nullable === 'NO' && !col.column_default && !isEditing && !isHiddenField ? 'required' : ''} class="w-full mt-1 p-2 border rounded" value="${value}" ${extraAttrs} ${isReadOnlyField ? 'readonly' : ''}>
                    </div>
                `;
            });

            // Special fields for linking tables (e.g., project_ids for experiments, linked_person_ids for projects)
            if (finalTargetTableName === 'lab.experiments') {
                const linkedProjects = record && record.experiment_id && record.experiment_date ? (await apiFetch(`table/lab/experiments_projects?filter_experiment_id=${record.experiment_id}&filter_experiment_date=${formatDateForInput(record.experiment_date)}`)).map(lp => lp.project_id).join(';') : '';
                const linkedSamples = record && record.experiment_id && record.experiment_date ? (await apiFetch(`table/lab/experiments_samples?filter_experiment_id=${record.experiment_id}&filter_experiment_date=${formatDateForInput(record.experiment_date)}`)).map(ls => ls.sample_id).join(';') : '';

                formFieldsHtml += `
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Linked Project IDs (semicolon-separated)</label>
                        <input type="text" name="project_ids" class="w-full mt-1 p-2 border rounded" placeholder="e.g., Project1;Project2;ProjectN" value="${linkedProjects}">
                        <p class="text-xs text-gray-500 mt-1">Enter existing Project IDs separated by semicolons (e.g., P001;P002). These will be linked in 'experiments_projects'.</p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Linked Sample IDs (semicolon-separated)</label>
                        <input type="text" name="sample_ids" class="w-full mt-1 p-2 border rounded" placeholder="e.g., S001;S002;S00N" value="${linkedSamples}">
                        <p class="text-xs text-gray-500 mt-1">Enter existing Sample IDs separated by semicolons (e.g., S001;S002). These will be linked in 'experiments_samples'.</p>
                    </div>
                `;
            } else if (finalTargetTableName === 'lims.projects') {
                const linkedPersons = record && record.project_id ? (await apiFetch(`table/lims/project_persons?filter_project_id=${record.project_id}`)).map(pp => pp.person_id).join(';') : '';
                formFieldsHtml += `
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Linked Person IDs (semicolon-separated)</label>
                        <input type="text" name="linked_person_ids" class="w-full mt-1 p-2 border rounded" placeholder="e.g., P001;P002;P00N" value="${linkedPersons}">
                        <p class="text-xs text-gray-500 mt-1">Enter existing Person IDs separated by semicolons (e.g., P001;P002). These will be linked in 'lims.project_persons'.</p>
                    </div>
                `;
            }

            const modalTitle = isEditing ? `Edit ${formatColumnName(tableName)} Record` : `Create New ${formatColumnName(tableName)} Record`;
            const submitButtonText = isEditing ? 'Save Changes' : 'Create Record';

            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-4xl max-h-[90vh] overflow-y-auto transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">${modalTitle}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <form id="record-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${formFieldsHtml}
                            </div>
                            <div class="pt-4 flex justify-end">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                                    ${submitButtonText}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('record-form').onsubmit = async (e) => {
                e.preventDefault();
                
                const formElement = e.target;
                const attachmentInput = formElement.querySelector('input[name="attachment"]');
                const hasFileSelected = attachmentInput && attachmentInput.files && attachmentInput.files.length > 0;
                
                let body;
                if (hasFileSelected) {
                    console.log("File detected. Using FormData for submission.");
                    body = new FormData(formElement);
                } else {
                    console.log("No file selected. Using JSON for submission.");
                    body = {};
                    const formData = new FormData(formElement);
                    formData.forEach((value, key) => {
                        const colSchema = targetTableSchema.find(s => s.column_name === key);
                        if (colSchema && (colSchema.data_type === 'integer' || colSchema.data_type === 'numeric' || colSchema.data_type === 'bigint')) {
                            body[key] = value === '' ? null : Number(value.replace(',', '.')); // Handle comma as decimal separator
                        } else if (colSchema && colSchema.data_type === 'boolean') {
                            body[key] = formElement.querySelector(`[name="${key}"]`).checked; 
                        } else if (colSchema && colSchema.data_type === 'jsonb') {
                            try {
                                body[key] = value === '' ? null : JSON.parse(value);
                            } catch (jsonError) {
                                showToast(`Invalid JSON for ${formatColumnName(key)}: ${jsonError.message}`, "error");
                                throw new Error(`Invalid JSON for ${formatColumnName(key)}`);
                            }
                        } else if (colSchema && colSchema.data_type.startsWith('geometry')) {
                             try {
                                 if (value.toUpperCase().startsWith('POINT(') && value.toUpperCase().endsWith(')')) {
                                     body[key] = value; 
                                 } else if (value.trim().startsWith('{') && value.trim().endsWith('}')) {
                                     body[key] = JSON.parse(value);
                                 } else {
                                     body[key] = null; 
                                     showToast(`Invalid geometry format for ${formatColumnName(key)}. Please use WKT (e.g., POINT(lon lat)) or GeoJSON.`, "error");
                                     throw new Error("Invalid geometry format.");
                                 }
                             } catch (geomError) {
                                 body[key] = null;
                                 showToast(`Error parsing geometry for ${formatColumnName(key)}: ${geomError.message}`, "error");
                                 throw new Error(`Error parsing geometry for ${formatColumnName(key)}`);
                             }
                         } else if (key === 'sampling_date_from_sampling_id') {
                            // This is a helper field, not a direct column, so don't include in body for backend
                            return;
                         }
                        else {
                            body[key] = value === '' ? null : value;
                        }
                    });

                    // For composite PKs involving a date, ensure the date component is present if it's not auto-generated
                    // and might have been selected via an ID (e.g., sampling_id)
                    const datePkColumn = pkColumnsForTargetTable.find(pk => pk.includes('date'));
                    if (!isEditing && datePkColumn && !body[datePkColumn]) {
                        const associatedDate = formElement.querySelector('[name="sampling_date_from_sampling_id"]');
                        if (associatedDate && associatedDate.value) {
                            body[datePkColumn] = associatedDate.value;
                        }
                    }
                }

                // Handle special linking fields for experiments and projects
                let linkedProjectIds = null;
                let linkedSampleIds = null;
                let linkedPersonIds = null;

                if (finalTargetTableName === 'lab.experiments') {
                    const projectsField = formElement.querySelector('[name="project_ids"]');
                    if (projectsField) {
                        linkedProjectIds = projectsField.value.split(';').map(id => id.trim()).filter(id => id !== '');
                        if (hasFileSelected) body.delete('project_ids'); else delete body.project_ids;
                    }
                    const samplesField = formElement.querySelector('[name="sample_ids"]');
                    if (samplesField) {
                        linkedSampleIds = samplesField.value.split(';').map(id => id.trim()).filter(id => id !== '');
                        if (hasFileSelected) body.delete('sample_ids'); else delete body.sample_ids;
                    }
                } else if (finalTargetTableName === 'lims.projects') {
                    const personsField = formElement.querySelector('[name="linked_person_ids"]');
                    if (personsField) {
                        linkedPersonIds = personsField.value.split(';').map(id => id.trim()).filter(id => id !== '');
                        if (hasFileSelected) body.delete('linked_person_ids'); else delete body.linked_person_ids;
                    }
                }


                const method = isEditing ? 'PUT' : 'POST';
                
                let endpoint = `table/${schemaName}/${tableName}`;
                let recordForDetailsUpdate = record; // Use current record for refreshing details after update/create

                if (isEditing) {
                    const pkValuesForApi = {};
                    const originalPkValues = getPkValues(record); // Get PKs from the original record
                    for (const key in originalPkValues) {
                        const colSchema = targetTableSchema.find(s => s.column_name === key);
                        if (colSchema && colSchema.data_type === 'date') {
                            pkValuesForApi[key] = formatDateForInput(originalPkValues[key]);
                        } else {
                            pkValuesForApi[key] = originalPkValues[key];
                        }
                    }
                    const pkQueryString = new URLSearchParams(pkValuesForApi).toString();
                    endpoint += `?${pkQueryString}`;
                    console.log("Edit endpoint with PKs:", endpoint);
                }
                
                console.log(`Submitting form: Method=${method}, Endpoint=${endpoint}, Body:`, body);
                const result = await apiFetch(endpoint, { method, body });
                if (result && !result.error) { 
                    console.log("API call successful:", result);
                    showToast(`${isEditing ? 'Updated' : 'Created'} record successfully!`, "success");
                    
                    // Handle linking for experiments
                    if (finalTargetTableName === 'lab.experiments' && result.experiment_id && result.experiment_date) {
                        const experimentId = result.experiment_id;
                        const experimentDate = formatDateForInput(result.experiment_date);
                        
                        // Handle project linking
                        if (linkedProjectIds !== null) {
                            const existingProjectLinks = await apiFetch(`table/lab/experiments_projects?filter_experiment_id=${experimentId}&filter_experiment_date=${experimentDate}`);
                            const existingLinkedProjectIds = existingProjectLinks && !existingProjectLinks.error ? existingProjectLinks.map(lp => lp.project_id) : [];

                            const projectsToAdd = linkedProjectIds.filter(id => !existingLinkedProjectIds.includes(id));
                            for (const projectId of projectsToAdd) {
                                try {
                                    await apiFetch(`table/lab/experiments_projects`, {
                                        method: 'POST',
                                        body: { experiment_id: experimentId, experiment_date: experimentDate, project_id: projectId, link_date: new Date().toISOString().split('T')[0] }
                                    });
                                    console.log(`Linked project ${projectId} to experiment ${experimentId}`);
                                } catch (linkError) {
                                    console.error(`Failed to link project ${projectId}:`, linkError);
                                }
                            }

                            const projectsToRemove = existingLinkedProjectIds.filter(id => !linkedProjectIds.includes(id));
                            for (const projectId of projectsToRemove) {
                                try {
                                    await apiFetch(`table/lab/experiments_projects?experiment_id=${experimentId}&experiment_date=${experimentDate}&project_id=${projectId}`, {
                                        method: 'DELETE'
                                    });
                                    console.log(`Unlinked project ${projectId} from experiment ${experimentId}`);
                                } catch (unlinkError) {
                                    console.error(`Failed to unlink project ${projectId}:`, unlinkError);
                                }
                            }
                        }

                        // Handle sample linking
                        if (linkedSampleIds !== null) {
                            const existingSampleLinks = await apiFetch(`table/lab/experiments_samples?filter_experiment_id=${experimentId}&filter_experiment_date=${experimentDate}`);
                            const existingLinkedSampleIds = existingSampleLinks && !existingSampleLinks.error ? existingSampleLinks.map(ls => ls.sample_id) : [];

                            const samplesToAdd = linkedSampleIds.filter(id => !existingLinkedSampleIds.includes(id));
                            for (const sampleId of samplesToAdd) {
                                try {
                                    await apiFetch(`table/lab/experiments_samples`, {
                                        method: 'POST',
                                        body: { experiment_id: experimentId, experiment_date: experimentDate, sample_id: sampleId }
                                    });
                                    console.log(`Linked sample ${sampleId} to experiment ${experimentId}`);
                                } catch (linkError) {
                                    console.error(`Failed to link sample ${sampleId}:`, linkError);
                                }
                            }

                            const samplesToRemove = existingLinkedSampleIds.filter(id => !linkedSampleIds.includes(id));
                            for (const sampleId of samplesToRemove) {
                                try {
                                    await apiFetch(`table/lab/experiments_samples?experiment_id=${experimentId}&experiment_date=${experimentDate}&sample_id=${sampleId}`, {
                                        method: 'DELETE'
                                    });
                                    console.log(`Unlinked sample ${sampleId} from experiment ${experimentId}`);
                                } catch (unlinkError) {
                                    console.error(`Failed to unlink sample ${sampleId}:`, unlinkError);
                                }
                            }
                        }
                    } else if (finalTargetTableName === 'lims.projects' && result.project_id) {
                        const projectId = result.project_id;
                        if (linkedPersonIds !== null) {
                            const existingPersonLinks = await apiFetch(`table/lims/project_persons?filter_project_id=${projectId}`);
                            const existingLinkedPersonIds = existingPersonLinks && !existingPersonLinks.error ? existingPersonLinks.map(pp => pp.person_id) : [];

                            const personsToAdd = linkedPersonIds.filter(id => !existingLinkedPersonIds.includes(id));
                            for (const personId of personsToAdd) {
                                try {
                                    await apiFetch(`table/lims/project_persons`, {
                                        method: 'POST',
                                        body: { project_id: projectId, person_id: personId, link_date: new Date().toISOString().split('T')[0] }
                                    });
                                    console.log(`Linked person ${personId} to project ${projectId}`);
                                } catch (linkError) {
                                    console.error(`Failed to link person ${personId}:`, linkError);
                                }
                            }

                            const personsToRemove = existingLinkedPersonIds.filter(id => !linkedPersonIds.includes(id));
                            for (const personId of personsToRemove) {
                                try {
                                    await apiFetch(`table/lims/project_persons?project_id=${projectId}&person_id=${personId}`, {
                                        method: 'DELETE'
                                    });
                                    console.log(`Unlinked person ${personId} from project ${projectId}`);
                                } catch (unlinkError) {
                                    console.error(`Failed to unlink person ${personId}:`, unlinkError);
                                }
                            }
                        }
                    }

                    closeModal(); 
                    loadAndRenderTable(currentTableName); 
                    // After successful creation/update, try to re-select the record and show its details
                    const newOrUpdatedPkValues = {};
                    if (result.sample_id && result.sampling_date) { // For lab.samples
                        newOrUpdatedPkValues.sample_id = result.sample_id;
                        newOrUpdatedPkValues.sampling_date = formatDateForInput(result.sampling_date);
                    } else if (result.experiment_id && result.experiment_date) { // For lab.experiments
                        newOrUpdatedPkValues.experiment_id = result.experiment_id;
                        newOrUpdatedPkValues.experiment_date = formatDateForInput(result.experiment_date);
                    } else if (result.project_id) { // For lims.projects
                        newOrUpdatedPkValues.project_id = result.project_id;
                    } else if (Object.keys(pkColumnsForTargetTable).length > 0 && result) { // Generic PK reconstruction
                        pkColumnsForTargetTable.forEach(pkCol => {
                            if (result[pkCol] !== undefined) {
                                const colSchema = targetTableSchema.find(s => s.column_name === pkCol);
                                if (colSchema && colSchema.data_type === 'date') {
                                    newOrUpdatedPkValues[pkCol] = formatDateForInput(result[pkCol]);
                                } else {
                                    newOrUpdatedPkValues[pkCol] = result[pkCol];
                                }
                            }
                        });
                    }

                    if (Object.keys(newOrUpdatedPkValues).length > 0) {
                        setTimeout(() => {
                            const row = document.querySelector(`.dynamic-table-row[data-pk-values='${JSON.stringify(newOrUpdatedPkValues)}']`);
                            if (row) { 
                                document.querySelectorAll('.dynamic-table-row').forEach(r => r.classList.remove('table-row-selected'));
                                row.classList.add('table-row-selected'); 
                                renderRecordDetails(newOrUpdatedPkValues); 
                            }
                        }, 100);
                    }

                } else {
                    console.error("API call failed:", result);
                    showToast(`Failed to ${isEditing ? 'save' : 'create'} record: ` + (result ? result.error : 'Unknown error'), "error");
                }
            };
        }

        async function showBulkUploadModal() {
            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">Bulk CSV Upload for ${formatColumnName(currentTableName.split('.')[1])}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <p class="text-gray-700 mb-4">Upload a CSV file. The first row should contain column headers matching your database table.</p>
                        ${currentTableName === 'lims.projects' ? '<p class="text-gray-700 mb-4">For projects, you can include a "linked_person_ids" column with semicolon-separated Person IDs (e.g., P001;P002). These will be linked automatically.</p>' : ''}
                        ${currentTableName === 'lab.experiments' ? '<p class="text-gray-700 mb-4">For experiments, you can include "project_ids" and "sample_ids" columns with semicolon-separated IDs. These will be linked automatically.</p>' : ''}
                        <input type="file" id="csv-file-input" accept=".csv" class="w-full p-2 border rounded mb-4">
                        <div class="flex justify-between space-x-2">
                            <button id="download-csv-template-btn-modal" class="w-1/2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="download" class="w-5 h-5 mr-2"></i>Download Template
                            </button>
                            <button id="upload-csv-btn" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="upload" class="w-5 h-5 mr-2"></i>Upload CSV
                            </button>
                        </div>
                        <div id="upload-status" class="mt-4 text-center text-sm"></div>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('download-csv-template-btn-modal').addEventListener('click', () => downloadCsvTemplate(currentTableName));

            document.getElementById('upload-csv-btn').addEventListener('click', () => {
                const fileInput = document.getElementById('csv-file-input');
                const statusDiv = document.getElementById('upload-status');
                const file = fileInput.files[0];

                if (!file) {
                    showToast("Please select a CSV file.", "error");
                    return;
                }

                statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Processing CSV...</p>`;
                lucide.createIcons();

                PapaParse.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        if (results.errors.length) {
                            showToast(`CSV parsing errors: ${results.errors.map(e => e.message).join(', ')}`, "error");
                            return;
                        }
                        if (!results.data.length) {
                            showToast("No data found in CSV.", "error");
                            return;
                        }

                        let recordsToUpload = results.data.map(row => {
                            const newRow = {};
                            for (const key in row) {
                                newRow[key] = row[key] === '' ? null : row[key];
                            }
                            return newRow;
                        });

                        const [schemaName, tableName] = currentTableName.split('.');
                        
                        statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Uploading ${recordsToUpload.length} records...</p>`;
                        lucide.createIcons();

                        if (tableName === 'projects' || tableName === 'experiments') {
                            const successfulRecords = [];
                            for (const record of recordsToUpload) {
                                let linkedIds = {};
                                if (tableName === 'projects') {
                                    linkedIds.persons = record.linked_person_ids ? record.linked_person_ids.split(';').map(id => id.trim()).filter(id => id !== '') : [];
                                    delete record.linked_person_ids;
                                } else if (tableName === 'experiments') {
                                    linkedIds.projects = record.project_ids ? record.project_ids.split(';').map(id => id.trim()).filter(id => id !== '') : [];
                                    linkedIds.samples = record.sample_ids ? record.sample_ids.split(';').map(id => id.trim()).filter(id => id !== '') : [];
                                    delete record.project_ids;
                                    delete record.sample_ids;
                                }

                                const result = await apiFetch(`table/${schemaName}/${tableName}`, {
                                    method: 'POST',
                                    body: record
                                });

                                if (result && !result.error) {
                                    successfulRecords.push(result);
                                    if (tableName === 'projects' && result.project_id) {
                                        for (const personId of linkedIds.persons) {
                                            try {
                                                await apiFetch(`table/lims/project_persons`, {
                                                    method: 'POST',
                                                    body: { project_id: result.project_id, person_id: personId, link_date: new Date().toISOString().split('T')[0] }
                                                });
                                            } catch (linkError) {
                                                console.error(`Failed to link person ${personId} to new project ${result.project_id} during bulk upload:`, linkError);
                                            }
                                        }
                                    } else if (tableName === 'experiments' && result.experiment_id && result.experiment_date) {
                                        for (const projectId of linkedIds.projects) {
                                            try {
                                                await apiFetch(`table/lab/experiments_projects`, {
                                                    method: 'POST',
                                                    body: { experiment_id: result.experiment_id, experiment_date: formatDateForInput(result.experiment_date), project_id: projectId, link_date: new Date().toISOString().split('T')[0] }
                                                });
                                            } catch (linkError) {
                                                console.error(`Failed to link project ${projectId} to new experiment ${result.experiment_id} during bulk upload:`, linkError);
                                            }
                                        }
                                        for (const sampleId of linkedIds.samples) {
                                            try {
                                                await apiFetch(`table/lab/experiments_samples`, {
                                                    method: 'POST',
                                                    body: { experiment_id: result.experiment_id, experiment_date: formatDateForInput(result.experiment_date), sample_id: sampleId }
                                                });
                                            } catch (linkError) {
                                                console.error(`Failed to link sample ${sampleId} to new experiment ${result.experiment_id} during bulk upload:`, linkError);
                                            }
                                        }
                                    }
                                } else {
                                    console.error(`Failed to upload record:`, record, result);
                                }
                            }
                            if (successfulRecords.length > 0) {
                                statusDiv.innerHTML = `<p class="text-green-600">Successfully uploaded ${successfulRecords.length} records!</p>`;
                                loadAndRenderTable(currentTableName);
                                setTimeout(closeModal, 2000);
                            } else {
                                statusDiv.innerHTML = `<p class="text-red-500">Bulk upload failed: No records successfully uploaded.</p>`;
                            }

                        } else {
                            // Standard bulk upload for other tables
                            const result = await apiFetch(`table/${schemaName}/${tableName}/batch_upload`, {
                                method: 'POST',
                                body: recordsToUpload
                            });

                            if (result && result.success) {
                                statusDiv.innerHTML = `<p class="text-green-600">Successfully uploaded ${result.inserted_rows} records!</p>`;
                                loadAndRenderTable(currentTableName);
                                setTimeout(closeModal, 2000);
                            } else {
                                showToast(`Bulk upload failed: ${result ? result.error : 'Unknown error'}`, "error");
                            }
                        }
                        lucide.createIcons();
                    }
                });
            });
        }

        async function downloadCsvTemplate(fullTableName) {
            console.log("downloadCsvTemplate called for:", fullTableName);
            if (!fullTableName) {
                showToast("Please select a table to download its template.", "error"); 
                return;
            }

            const [schemaName, tableName] = fullTableName.split('.');
            const schema = await getTableSchema(schemaName, tableName);

            if (!schema || schema.error) {
                console.error("Failed to fetch table schema for template:", schema ? schema.error : 'Unknown error');
                showToast('Failed to fetch table schema for template: ' + (schema ? schema.error : 'Unknown error'), "error"); 
                return;
            }

            let headers = schema.filter(col => 
                !col.column_name.includes('attachment') && 
                !col.column_name.includes('password_hash') && 
                !col.column_name.includes('search_vector') &&
                !col.column_name.includes('geom') && // Exclude PostGIS geometry columns
                !(col.column_default && col.column_default.includes('nextval')) && // Exclude auto-generated default values
                !col.column_name.includes('created_at') && // Exclude audit columns
                !col.column_name.includes('last_modified_at') // Exclude audit columns
            ).map(col => col.column_name);

            // Add back primary key columns if they were filtered out by the above logic
            // For template, usually you want all columns for user to fill
            const pkCols = await getPrimaryKeysForTable(schemaName, tableName);
            pkCols.forEach(pkCol => {
                const pkColSchema = schema.find(c => c.column_name === pkCol);
                // Only prepend if it's a primary key not auto-generated
                if (pkColSchema && !(pkColSchema.column_default && pkColSchema.column_default.includes('nextval'))) {
                    if (!headers.includes(pkCol)) {
                        headers.unshift(pkCol);
                    }
                }
            });

            // Add special linking fields for templates
            if (fullTableName === 'lims.projects') {
                if (!headers.includes('linked_person_ids')) headers.push('linked_person_ids');
            } else if (fullTableName === 'lab.experiments') {
                if (!headers.includes('project_ids')) headers.push('project_ids');
                if (!headers.includes('sample_ids')) headers.push('sample_ids');
            }
            
            console.log("CSV Template Headers:", headers);
            const csv = unparseCSV([headers], { header: false }); 
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${tableName}_template.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            console.log("CSV template download initiated.");
            showToast("Template downloaded successfully!", "success");
        }

        async function showBulkModifyModal() {
            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">Bulk Modify for ${formatColumnName(currentTableName.split('.')[1])}</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                        </div>
                        <p class="text-gray-700 mb-4">Upload a CSV or JSON file containing records to update. Each record must include all primary key column(s) for identification, and any fields you wish to modify.</p>
                        <input type="file" id="bulk-modify-file-input" accept=".csv,.json" class="w-full p-2 border rounded mb-4">
                        <div class="flex justify-between space-x-2">
                            <button id="download-bulk-modify-template-btn-modal" class="w-1/2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="download" class="w-5 h-5 mr-2"></i>Download Template
                            </button>
                            <button id="perform-bulk-modify-btn" class="w-1/2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow hover:shadow-lg transition-all">
                                <i data-lucide="file-edit" class="w-5 h-5 mr-2"></i>Perform Bulk Modify
                            </button>
                        </div>
                        <div id="modify-status" class="mt-4 text-center text-sm"></div>
                    </div>
                </div>
            `;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('download-bulk-modify-template-btn-modal').addEventListener('click', () => downloadBulkModifyTemplate(currentTableName));


            document.getElementById('perform-bulk-modify-btn').addEventListener('click', () => {
                const fileInput = document.getElementById('bulk-modify-file-input');
                const statusDiv = document.getElementById('modify-status');
                const file = fileInput.files[0];

                if (!file) {
                    showToast("Please select a file (CSV or JSON).", "error");
                    return;
                }

                statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Processing file...</p>`;
                lucide.createIcons();

                const reader = new FileReader();
                reader.onload = async (e) => {
                    let recordsToModify = [];
                    try {
                        if (file.type === 'application/json') {
                            recordsToModify = JSON.parse(e.target.result);
                            if (!Array.isArray(recordsToModify)) {
                                throw new Error("JSON file must contain an array of objects.");
                            }
                        } else if (file.type === 'text/csv') {
                            const parseResult = PapaParse.parse(e.target.result, { header: true, skipEmptyLines: true });
                            if (parseResult.errors.length) {
                                throw new Error(`CSV parsing errors: ${parseResult.errors.map(err => err.message).join(', ')}`);
                            }
                            recordsToModify = parseResult.data;
                        } else {
                            throw new Error("Unsupported file type. Please upload a CSV or JSON file.");
                        }

                        if (!recordsToModify.length) {
                            showToast("No records found in the file.", "error");
                            return;
                        }

                        const recordsToModifyCleaned = recordsToModify.map(row => {
                            const newRow = {};
                            for (const key in row) {
                                newRow[key] = row[key] === '' ? null : row[key];
                            }
                            return newRow;
                        });

                        statusDiv.innerHTML = `<p class="text-blue-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Performing bulk update on ${recordsToModifyCleaned.length} records...</p>`;
                        lucide.createIcons();

                        const [schemaName, tableName] = currentTableName.split('.');
                        const result = await apiFetch(`table/${schemaName}/${tableName}/batch_update`, {
                            method: 'PUT',
                            body: recordsToModifyCleaned
                        });

                        if (result && result.success) {
                            showToast(`Successfully updated ${result.updated_rows} records!`, "success");
                            loadAndRenderTable(currentTableName);
                            setTimeout(closeModal, 2000);
                        } else {
                            showToast(`Bulk modify failed: ${result ? result.error : 'Unknown error'}`, "error");
                        }
                        lucide.createIcons();

                    } catch (error) {
                        console.error("Bulk modify file processing error:", error);
                        statusDiv.innerHTML = `<p class="text-red-500">Error processing file: ${error.message}</p>`;
                        lucide.createIcons();
                    }
                };
                reader.readAsText(file);
            });
        }

        async function downloadBulkModifyTemplate(fullTableName) {
            console.log("downloadBulkModifyTemplate called.");
            console.log("Attempting to download Bulk Modify template for:", fullTableName);
            const [schemaName, tableName] = fullTableName.split('.');
            const schema = await getTableSchema(schemaName, tableName);
            const pkColumns = await getPrimaryKeysForTable(schemaName, tableName);

            if (!schema || schema.error) {
                showToast('Failed to fetch table schema for template: ' + (schema ? schema.error : 'Unknown error'), "error");
                return;
            }

            let headers = pkColumns;
            
            const commonEditableColumns = schema.filter(col => 
                !pkColumns.includes(col.column_name) && 
                !col.column_name.includes('attachment') && 
                !col.column_name.includes('password_hash') && 
                !col.column_name.includes('search_vector') &&
                !col.column_name.includes('geom') && 
                !col.column_name.includes('created_at') &&
                !(col.column_default && col.column_default.includes('nextval'))
            ).map(col => col.column_name);

            headers = [...new Set([...headers, ...commonEditableColumns])];

            console.log("Bulk Modify Template Headers:", headers);
            const csv = PapaParse.unparse([headers], { header: false });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${tableName}_bulk_modify_template.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            console.log("Bulk modify template download initiated.");
            showToast("Bulk modify template downloaded successfully!", "success");
        }

        async function populateDynamicTableSelect() {
            const select = document.getElementById('dynamic-table-select');
            const allTableNames = await apiFetch('table_names_for_forms');
            
            select.innerHTML = '<option value="">-- Select a table or view --</option>';

            if (allTableNames && !allTableNames.error) {
                // Sort tables alphabetically by schema, then by table name
                allTableNames.sort((a, b) => {
                    const [schemaA, tableA] = a.split('.');
                    const [schemaB, tableB] = b.split('.');
                    if (schemaA !== schemaB) {
                        return schemaA.localeCompare(schemaB);
                    }
                    return tableA.localeCompare(tableB);
                });

                allTableNames.forEach(table => {
                    select.innerHTML += `<option value="${table}">${table}</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Error loading tables</option>';
                showToast("Failed to load table list. Please check backend connection.", "error");
            }
        }

        async function loadAndRenderTable(fullTableName) {
            console.log(`loadAndRenderTable: Attempting to load data for ${fullTableName}`);
            currentTableName = fullTableName;
            const [schemaName, tableName] = fullTableName.split('.');
            
            sortColumn = null;
            sortDirection = 'asc';
            columnFilters = {};
            document.querySelectorAll('.filter-input').forEach(input => input.value = '');

            const tableBody = document.getElementById('dynamic-table-body');
            tableBody.innerHTML = `<tr><td colspan="100%" class="text-center p-4 text-gray-500"><i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i>Loading data...</td></tr>`;
            lucide.createIcons();

            const [data, schema, pkInfo] = await Promise.all([
                apiFetch(`table/${schemaName}/${tableName}`),
                getTableSchema(schemaName, tableName),
                getPrimaryKeysForTable(schemaName, tableName)
            ]);

            if (data && !data.error && schema && !schema.error && pkInfo && !pkInfo.error) {
                console.log(`Successfully loaded data for ${fullTableName}. Data count: ${data.length}`);
                currentTableData = data;
                currentTableSchema = schema;
                pkMappingCache[`pk.${fullTableName}`] = pkInfo; // Update PK cache
                applyFiltersAndSort();
                // Update button states after successful load
                updateMainActionButtons(schema.length > 0 ? schema[0].table_type : null);
            } else {
                console.error(`Failed to load data for ${fullTableName}. Data error: ${data ? data.error : 'N/A'}, Schema error: ${schema ? schema.error : 'N/A'}`);
                tableBody.innerHTML = `<tr><td colspan="100%" class="text-center p-4 text-red-500">Error loading data for ${fullTableName}: ${data ? data.error : schema ? schema.error : 'Unknown error'}</td></tr>`;
                // Disable buttons if loading fails
                updateMainActionButtons(null);
            }
        }
