    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html'; // Corrected to relative path
        
        const API_BASE_URL = '/api'; // Corrected API_BASE_URL for your app.py
        let masterCache = {}; // Cache for all fetched table data

            lucide.createIcons();

            if(user) {

                if (user.full_name) userName = user.full_name;
                else if (user.person_id) userName = user.person_id;
                else if (user.customer_name) userName = user.customer_name;
                else if (user.contact_id) userName = user.contact_id;

            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; }); // Corrected to relative path
            initializeReportingPage();
        });

        // --- API & DATA HANDLING ---
        /**
         * Generic API fetch wrapper with error handling.
         * @param {string} endpoint - API endpoint URL.
         * @param {object} options - Fetch options.
         * @returns {Promise<object>} JSON response or error object.
         */
        async function apiFetch(endpoint, options = {}) {
            try {
                // Set Content-Type header to application/json for JSON bodies
                const isJson = !(options.body instanceof FormData);
                if (isJson && options.body) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }

                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                
                if (!response.ok) { 
                    const errText = await response.text();
                    try { 
                        const errJson = JSON.parse(errText); 
                        throw new Error(errJson.error || `API request failed with status ${response.status}`); 
                    }
                    catch { 
                        throw new Error(errText || `API request failed with status ${response.status}`); 
                    }
                }
                // Handle 204 No Content responses explicitly
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { 
                console.error("API Error:", error); 
                return { error: error.message }; 
            }
        }

        /**
         * Fetches table data and caches it.
         * @param {string} schema - Database schema name.
         * @param {string} tableName - Table name.
         * @param {object} filters - Optional filters to apply to the API call.
         * @returns {Promise<Array|object>} Cached data or fetched data.
         */
        async function getTableData(schema, tableName, filters = {}) {
            const filterQueryString = Object.keys(filters)
                .filter(key => filters[key] !== 'all' && filters[key] !== null && filters[key] !== '')
                .map(key => `${key}=${encodeURIComponent(filters[key])}`)
                .join('&');
            
            const endpoint = `table/${schema}/${tableName}${filterQueryString ? '?' + filterQueryString : ''}`;
            const cacheKey = endpoint; // Use the full endpoint as cache key for filtered data

            if (masterCache[cacheKey]) return masterCache[cacheKey];
            
            const data = await apiFetch(endpoint);
            if (data && !data.error) masterCache[cacheKey] = data;
            else console.error(`Failed to fetch ${schema}.${tableName} with filters ${JSON.stringify(filters)}:`, data.error);
            return data;
        }

                { schema: 'lab', table: 'tissue' },

                { schema: 'reference', table: 'status' },
                { schema: 'reference', table: 'species' },
                { schema: 'reference', table: 'region' }, 
                { schema: 'reference', table: 'category' },
                { schema: 'reference', table: 'room' },
                { schema: 'reference', table: 'samples_type' }, 
                { schema: 'reference', table: 'vessel' }, 
                { schema: 'reference', table: 'ecosystem' }, 
                { schema: 'reference', table: 'taxon' }, 
                { schema: 'reference', table: 'gene' }, 

                // Fetch views as well
                { schema: 'lab', table: 'sample_full_details_view' }, 
                { schema: 'lims', table: 'project_comprehensive_summary_view' }, 
                { schema: 'lab', table: 'storage_occupancy_view' }, 
                { schema: 'lims', table: 'reagent_status_view' },

            await Promise.all(tablesToFetch.map(t => getTableData(t.schema, t.table)));

        // --- UI & TABS ---
        /**
         * Switches between report preview and history tabs.
         * @param {string} tabName - 'preview' or 'history'.
         */
        function switchTab(tabName) {
            const isPreview = tabName === 'preview';
            document.getElementById('tab-preview').classList.toggle('active', isPreview);
            document.getElementById('tab-history').classList.toggle('active', !isPreview);
            document.getElementById('preview-content').classList.toggle('hidden', !isPreview);
            document.getElementById('history-content').classList.toggle('hidden', isPreview);
            if (tabName === 'history') {
                renderReportHistory(); // Ensure history is up-to-date when tab is opened
            }
        }

            const reportRenderers = {

                'project-financial-summary': renderProjectSelector,

                'inventory-report': renderStorageSelector,

            if (reportRenderers[reportType]) {

            } else {

                        <button id="generate-preview-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center" disabled>

        /**
         * Renders a generic selector (dropdown) with a generate button.
         * @param {string} label - Label for the selector.
         * @param {string} id - ID for the select element.
         * @param {Array<object>} options - Array of {value, text} for select options.
         * @param {string} generateFnName - Name of the function to call on button click.
         * @param {boolean} includeAllOption - Whether to include an "All" option.
         */
        function renderSelector(label, id, options, generateFnName, includeAllOption = false) {
            const container = document.getElementById('report-inputs-container');
            let optionsHtml = includeAllOption ? `<option value="all">-- All ${label}s --</option>` : '<option value="">-- Select --</option>';
            optionsHtml += options.map(o => `<option value="${o.value}">${o.text}</option>`).join('');

            container.innerHTML = `
                <div>
                    <label for="${id}" class="block text-sm font-medium text-gray-700">2. Select ${label}</label>
                    <select id="${id}" class="w-full mt-1 p-2 border rounded-md">${optionsHtml}</select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="start-date-filter" class="block text-sm font-medium text-gray-700">Start Date:</label>
                        <input type="date" id="start-date-filter" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <div>
                        <label for="end-date-filter" class="block text-sm font-medium text-gray-700">End Date:</label>
                        <input type="date" id="end-date-filter" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                </div>
                <div class="pt-4 flex justify-end">
                    <button id="generate-preview-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center">
                        <i data-lucide="play" class="w-5 h-5 mr-2"></i>Generate Preview
                    </button>
                </div>`;
            lucide.createIcons();
            document.getElementById('generate-preview-btn').addEventListener('click', window[generateFnName]);
        }

        // --- HTML & CHART RENDERING HELPERS ---
        /**
         * Renders a generic HTML table.
         * @param {string} containerId - ID of the div to render the table into.
         * @param {Array<string>} headers - Array of column headers.
         * @param {Array<Array<any>>} bodyRows - 2D array of table row data.
         */
        function renderHtmlTable(containerId, headers, bodyRows) {
            const container = document.getElementById(containerId);
            if (!container) return; // Ensure container exists
            let table = `<table class="min-w-full text-sm">`;
            if (headers && headers.length > 0) {
                table += `<thead class="bg-gray-100"><tr>${headers.map(h => `<th class="p-2 text-left font-medium">${h}</th>`).join('')}</tr></thead>`;
            }
            table += `<tbody class="divide-y">${bodyRows.map(row => `<tr>${row.map(cell => `<td class="p-2">${cell === null || cell === undefined || cell === '' ? 'N/A' : cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
            container.innerHTML = table;
        }

        /**
         * Renders a generic object's details as a definition list (key-value pairs).
         * @param {object} obj - The object to display.
         * @param {Array<string>} [keysToDisplay=Object.keys(obj)] - Optional array of specific keys to display.
         * @returns {string} HTML string for the details.
         */
        function renderObjectDetails(obj, keysToDisplay = Object.keys(obj)) {
            let html = '<dl class="space-y-2 text-sm">';
            for (const key of keysToDisplay) {
                const value = obj[key];
                // Skip internal/unwanted keys
                if (['nr', 'attachment', 'password_hash', 'search_vector'].includes(key) || key.endsWith('_jsonb')) continue;

                const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let formattedValue = value;

                if ((key.toLowerCase().includes('date') || key.toLowerCase().includes('timestamp')) && value) {
                    try {
                        const dateObj = new Date(value);
                        formattedValue = isNaN(dateObj.getTime()) ? 'N/A' : dateObj.toLocaleString();
                    } catch (e) {
                        formattedValue = 'N/A';
                    }
                } else if (value === null || value === '') {
                    formattedValue = 'N/A';
                }

                html += `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${formattedKey}</dt><dd class="text-gray-900">${formattedValue}</dd></div>`;
            }
            html += '</dl>';
            return html;
        }

        /**
         * Renders a Pie Chart using Chart.js.
         * @param {string} canvasId - ID of the canvas element.
         * @param {string} label - Dataset label.
         * @param {Array<string>} labels - X-axis labels.
         * @param {Array<number>} data - Data values.
         */
        function renderPieChart(canvasId, label, labels, data) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            // Destroy existing chart instance to prevent redraw issues
            if (Chart.getChart(canvasId)) {
                Chart.getChart(canvasId).destroy();
            }
            new Chart(ctx, { 
                type: 'pie', 
                data: { 
                    labels, 
                    datasets: [{ 
                        label, 
                        data, 
                        backgroundColor: ['#3b82f6', '#10b981', '#ef4444', '#f97316', '#8b5cf6', '#06b6d4', '#6b7280', '#ec4899', '#a855f7', '#facc15'] 
                    }] 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: label
                        }
                    }
                }
            });
        }

        /**
         * Renders a Bar Chart using Chart.js.
         * @param {string} canvasId - ID of the canvas element.
         * @param {string} label - Dataset label.
         * @param {Array<string>} labels - X-axis labels.
         * @param {Array<number>} data - Data values.
         * @param {string} yLabel - Label for the Y-axis.
         */
        function renderBarChart(canvasId, label, labels, data, yLabel) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            // Destroy existing chart instance to prevent redraw issues
            if (Chart.getChart(canvasId)) {
                Chart.getChart(canvasId).destroy();
            }
            new Chart(ctx, { 
                type: 'bar', 
                data: { 
                    labels, 
                    datasets: [{ 
                        label, 
                        data, 
                        backgroundColor: '#3b82f6' 
                    }] 
                }, 
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false // Hide legend for single dataset bar chart
                        },
                        title: {
                            display: true,
                            text: label
                        }
                    },
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            title: { display: true, text: yLabel } 
                        },
                        x: {
                            title: { display: true, text: 'Category' }
                        }
                    } 
                } 
            });
        }
        
        /**
         * Formats a date string to a locale-specific date string.
         * @param {string} dateString - The date string to format.
         * @returns {string} Formatted date string or 'N/A'.
         */
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return isNaN(date.getTime()) ? 'N/A' : date.toLocaleDateString();
            } catch (e) {
                return 'N/A';
            }
        }

        /**
         * Formats a date string to a locale-specific date and time string.
         * @param {string} dateString - The date string to format.
         * @returns {string} Formatted date and time string or 'N/A'.
         */
        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return isNaN(date.getTime()) ? 'N/A' : date.toLocaleString();
            } catch (e) {
                return 'N/A';
            }
        }

        // --- PDF & HISTORY ---
        /**
         * Generates a PDF report from specified HTML elements and Chart.js canvases.
         * @param {...object} elementsToExport - Objects with { id: string, title: string } for elements to include in PDF.
         */
        async function generatePDF(...elementsToExport) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4'); // 'p' for portrait, 'mm' for millimeters, 'a4' for A4 size
            let yPos = 20; // Starting Y position for content

            for (const item of elementsToExport) {
                const element = document.getElementById(item.id);
                if (!element) {
                    console.warn(`Element with ID ${item.id} not found for PDF export.`);
                    continue;
                }

                // Add a title for the section if provided
                if (yPos + 10 > doc.internal.pageSize.height - 10) { // Check if new page is needed for title
                    doc.addPage();
                    yPos = 20;
                }
                doc.setFontSize(16);
                doc.text(item.title, 14, yPos);
                yPos += 10; // Space after title

                if (element.tagName === 'CANVAS') {
                    // Export Chart.js canvas as image
                    const imgData = element.toDataURL('image/png');
                    const imgWidth = 180; // Width for image in PDF (approx. A4 width - margins)
                    const imgHeight = (element.height * imgWidth) / element.width; // Maintain aspect ratio

                    if (yPos + imgHeight > doc.internal.pageSize.height - 20) { // Check if new page is needed
                        doc.addPage();
                        yPos = 20;
                    }
                    doc.addImage(imgData, 'PNG', 14, yPos, imgWidth, imgHeight);
                    yPos += imgHeight + 10; // Space after image
                } else {
                    // Export HTML table using jspdf-autotable
                    // Ensure the table element itself is selected, not just its container
                    const tableElement = element.querySelector('table');
                    if (tableElement) {
                        doc.autoTable({ 
                            html: tableElement, 
                            startY: yPos, 
                            theme: 'grid',
                            didDrawPage: function (data) {
                                // Footer for page numbers
                                doc.setFontSize(10);
                                doc.text("Page " + doc.internal.getNumberOfPages(), data.settings.margin.left, doc.internal.pageSize.height - 10);
                            },
                            margin: { top: yPos } // Start table at current yPos
                        });
                        yPos = doc.autoTable.previous.finalY + 10; // Update yPos after table
                    } else {
                        // For generic HTML content (like renderObjectDetails output)
                        // Use html2canvas for general HTML content
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = element.innerHTML; // Clone content to avoid modifying original DOM
                        document.body.appendChild(tempDiv); // Append to body for html2canvas to render

                        const canvas = await html2canvas(tempDiv, { scale: 2, useCORS: true, logging: false });
                        const imgData = canvas.toDataURL('image/png');
                        const imgWidth = 180;
                        const imgHeight = (canvas.height * imgWidth) / canvas.width;

                        if (yPos + imgHeight > doc.internal.pageSize.height - 20) {
                            doc.addPage();
                            yPos = 20;
                        }
                        doc.addImage(imgData, 'PNG', 14, yPos, imgWidth, imgHeight);
                        yPos += imgHeight + 10;
                        document.body.removeChild(tempDiv); // Clean up
                    }
                }
            }
            doc.save('report.pdf');
        }

        /**
         * Saves generated report metadata to local storage for history.
         * @param {string} title - Title of the report.
         * @param {string} type - Type of report (e.g., 'project-summary').
         * @param {object} params - Parameters used to generate the report.
         */
        function saveReportToHistory(title, type, params) {
            let history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            const newReport = { title, type, params, date: new Date().toISOString() };
            history.unshift(newReport); // Add to the beginning
            history = history.slice(0, 10); // Keep only the last 10 reports
            localStorage.setItem('reportHistory', JSON.stringify(history));
            renderReportHistory(); // Update history display
        }

        /**
         * Renders the list of recently generated reports from local storage.
         */
        function renderReportHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            const container = document.getElementById('recent-reports-list');
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 mt-8"><i data-lucide="history" class="mx-auto h-12 w-12"></i><p class="mt-2">No reports generated yet.</p></div>`;
                lucide.createIcons();
                return;
            }
            container.innerHTML = history.map(h => `
                <div class="p-3 rounded-md hover:bg-gray-100 flex justify-between items-center">
                    <div>
                        <p class="font-semibold">${h.title}</p>
                        <p class="text-xs text-gray-500">${new Date(h.date).toLocaleString()}</p>
                    </div>
                    <button class="rerun-btn bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-1 px-2 rounded" data-report='${JSON.stringify(h)}'>Re-run</button>
                </div>
            `).join('');
            lucide.createIcons(); // Re-create icons for history items
            document.querySelectorAll('.rerun-btn').forEach(btn => btn.addEventListener('click', async (e) => {
                const report = JSON.parse(e.target.dataset.report);
                // Set the report type dropdown
                document.getElementById('report-type').value = report.type;
                // Trigger the selection handler to render inputs
                handleReportSelection();
                // Wait for inputs to render, then set their values and generate report
                // This requires a small delay or a more sophisticated event listener for dynamic inputs
                await new Promise(resolve => setTimeout(resolve, 50)); // Small delay
                for (const paramKey in report.params) {
                    // Convert camelCase to kebab-case for IDs if necessary, or keep as is if direct match
                    const inputElement = document.getElementById(paramKey.replace(/([A-Z])/g, '-$1').toLowerCase()); 
                    if (inputElement) {
                        inputElement.value = report.params[paramKey];
                    }
                }
                // Manually trigger generation based on report type
                const generateButton = document.getElementById('generate-preview-btn');
                if (generateButton) {
                    generateButton.click();
                } else {
                    console.warn('Generate button not found for re-run. Manual trigger needed.');
                }
            }));
        }

        // --- INITIALIZATION ---
        /**
         * Initializes the reporting page: sets up event listeners and pre-fetches data.
         */
        function initializeReportingPage() {
            document.getElementById('report-type').addEventListener('change', handleReportSelection);
            document.getElementById('tab-preview').addEventListener('click', () => switchTab('preview'));
            document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
            
            // Pre-fetch all necessary data when the page loads
            fetchAllData().then(() => {
                console.log("All necessary data pre-cached for reporting.");
                renderReportHistory(); // Render history after data is loaded
                // If a report type is pre-selected (e.g., from URL param), trigger its rendering
                // handleReportSelection(); 
            }).catch(error => {
                console.error("Failed to pre-cache all data:", error);
                // Display a user-friendly error message on the page
                document.getElementById('preview-content').innerHTML = `<div class="text-red-500 text-center mt-8"><i data-lucide="alert-triangle" class="mx-auto h-12 w-12"></i><p class="mt-2">Failed to load all data for reports. Please check console for errors.</p></div>`;
                lucide.createIcons();
            });
        }
