    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html'; 
        
        const API_BASE_URL = '/mylims/api'; 
        let masterCache = {}; 
        
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) {
                let userName = 'User';
                if (user.full_name) userName = user.full_name;
                else if (user.person_id) userName = user.person_id;
                else if (user.customer_name) userName = user.customer_name;
                else if (user.contact_id) userName = user.contact_id;
                document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${userName}</p>`;
            }
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializeReportingPage();
        });

        // --- API & DATA HANDLING ---
        
        async function apiFetch(endpoint, options = {}) {
            try {
                const isJson = !(options.body instanceof FormData);
                if (isJson && options.body) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }

                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                
                if (!response.ok) { 
                    const errText = await response.text();
                    try { 
                        const errJson = JSON.parse(errText); 
                        throw new Error(errJson.error || `API request failed with status ${response.status}`); 
                    }
                    catch { 
                        throw new Error(errText || `API request failed with status ${response.status}`); 
                    }
                }
                if (response.status === 204 || response.headers.get('content-length') === '0') return { success: true };
                return response.json();
            } catch (error) { 
                console.error("API Error:", error); 
                return { error: error.message }; 
            }
        }

        async function getTableData(schema, tableName, filters = {}) {
            const filterQueryString = Object.keys(filters)
                .filter(key => filters[key] !== 'all' && filters[key] !== null && filters[key] !== '')
                .map(key => {
                    // Map date filters to Flask's GE/LE format
                    if (key.startsWith('filter_start_date')) return `filter_start_date_ge=${encodeURIComponent(filters[key])}`;
                    if (key.startsWith('filter_end_date')) return `filter_end_date_le=${encodeURIComponent(filters[key])}`;
                    if (key.startsWith('filter_reception_date')) return `filter_reception_date_ge=${encodeURIComponent(filters[key])}`;
                    if (key.startsWith('filter_action_timestamp')) return `filter_action_timestamp_ge=${encodeURIComponent(filters[key])}`;
                    if (key.startsWith('filter_sampling_date')) return `filter_sampling_date_ge=${encodeURIComponent(filters[key])}`;
                    if (key.startsWith('filter_experiment_date')) return `filter_experiment_date_ge=${encodeURIComponent(filters[key])}`;
                    
                    return `${key}=${encodeURIComponent(filters[key])}`;
                })
                .join('&');
            
            const endpoint = `table/${schema}/${tableName}${filterQueryString ? '?' + filterQueryString : ''}`;
            const cacheKey = endpoint; 

            if (masterCache[cacheKey] && !filterQueryString) return masterCache[cacheKey];
            
            const data = await apiFetch(endpoint);
            if (data && !data.error && !filterQueryString) masterCache[cacheKey] = data;
            else if (data && data.error) console.error(`Failed to fetch ${schema}.${tableName} with filters:`, data.error);

            return data;
        }

        async function fetchAllData() {
            document.getElementById('preview-content').innerHTML = `
                <div class="text-center text-gray-500 mt-8">

                    <p class="mt-2">Loading all necessary data for reports...</p>
                </div>`;
            lucide.createIcons();

            // Pre-cache primary reference tables needed for ALL selectors
            const tablesToFetch = [
                { schema: 'lims', table: 'projects' }, 
                { schema: 'reference', table: 'personal' }, 
                { schema: 'reference', table: 'status' },
                { schema: 'reference', table: 'samples_type' }, 
                { schema: 'reference', table: 'category' },
                { schema: 'reference', table: 'region' },
                { schema: 'lab', table: 'storage' }, 
                { schema: 'lab', table: 'sampling' }, 
                { schema: 'lab', table: 'experiments' },
                { schema: 'reference', table: 'taxon' },
                { schema: 'audit', table: 'log' }, 
                // Views used by reporting
                { schema: 'lab', table: 'global_lims_view' }, 
                { schema: 'lims', table: 'project_comprehensive_summary_view' }, 
                { schema: 'lab', table: 'experiment_progress_overview_view' }, 
                { schema: 'lims', table: 'reagent_status_view' }, 
                { schema: 'lab', table: 'storage_occupancy_view' }, 
            ];
            await Promise.all(tablesToFetch.map(t => getTableData(t.schema, t.table)));
        }

        // --- UI & TABS ---
        
        function switchTab(tabName) {
            const isPreview = tabName === 'preview';
            document.getElementById('tab-preview').classList.toggle('active', isPreview);
            document.getElementById('tab-history').classList.toggle('active', !isPreview);
            document.getElementById('preview-content').classList.toggle('hidden', !isPreview);
            document.getElementById('history-content').classList.toggle('hidden', isPreview);
            if (tabName === 'history') {
                renderReportHistory();
            }
        }

        // --- DYNAMIC INPUT RENDERING ---
        
        function handleReportSelection() {
            const reportType = document.getElementById('report-type').value;
            const container = document.getElementById('report-inputs-container');
            container.innerHTML = ''; 

            const reportRenderers = {
                'project-summary': renderProjectSelector,
                'project-financial-summary': renderProjectSelector, 
                'sample-lifecycle': renderSampleLifecycleInputs,
                'inventory-report': renderStorageSelector,
                'reagent-expiry': renderReagentExpiryInputs,
                'qc-summary': renderExperimentSelector,
                'experiment-progress': renderExperimentProgressInputs,
                'species-distribution': renderSpeciesDistributionInputs,
                'sampling-location-overview': renderSamplingLocationInputs,
                'full-audit-log': renderAuditLogInputs 
            };
            
            if (reportRenderers[reportType]) {
                reportRenderers[reportType]();
            } else {
                container.innerHTML = `
                    <div class="pt-4 flex justify-end">
                        <button id="generate-preview-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center" disabled>
                            <i data-lucide="play" class="w-5 h-5 mr-2"></i>Select a report type
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderSelector(label, id, options, generateFnName, includeAllOption = false, dateLabel = "Date:") {
            const container = document.getElementById('report-inputs-container');
            let optionsHtml = includeAllOption ? `<option value="all">-- All ${label}s --</option>` : '<option value="">-- Select --</option>';
            optionsHtml += options.map(o => `<option value="${o.value}">${o.text}</option>`).join('');

            container.innerHTML = `
                <div>
                    <label for="${id}" class="block text-sm font-medium text-gray-700">2. Select ${label}</label>
                    <select id="${id}" class="w-full mt-1 p-2 border rounded-md">${optionsHtml}</select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="start-date-filter" class="block text-sm font-medium text-gray-700">Start ${dateLabel}</label>
                        <input type="date" id="start-date-filter" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <div>
                        <label for="end-date-filter" class="block text-sm font-medium text-gray-700">End ${dateLabel}</label>
                        <input type="date" id="end-date-filter" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                </div>
                <div class="pt-4 flex justify-end">
                    <button id="generate-preview-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center">
                        <i data-lucide="play" class="w-5 h-5 mr-2"></i>Generate Preview
                    </button>
                </div>`;
            lucide.createIcons();
            document.getElementById('generate-preview-btn').addEventListener('click', window[generateFnName]);
        }

                <div class="w-full h-96"><canvas id="species-chart"></canvas></div>
                <h4 class="report-section-title">Detailed Species List</h4>
                <div id="species-table"></div>
            `;
            renderPreview('Species Distribution', html, () => generatePDF(
                { id: 'species-chart', title: 'Species Count Distribution' },
                { id: 'species-table', title: 'Detailed Species List' }
            ));

            renderBarChart('species-chart', 'Number of Samples', speciesData.map(s => s.species_en_name), speciesData.map(s => s.count), 'Number of Samples');
            renderHtmlTable('species-table', speciesHeaders, speciesRows);
            saveReportToHistory('Species Distribution', 'species-distribution', { projectFilter, locationFilter, startDate, endDate });
        }


        async function generateSamplingLocationOverviewPreview() {
            const projectFilter = document.getElementById('sampling-loc-project-filter').value;
            const yearFilter = document.getElementById('sampling-loc-year-filter').value;
            const startDate = document.getElementById('start-date-filter').value;
            const endDate = document.getElementById('end-date-filter').value;

            const filters = {};
            if (projectFilter !== 'all') filters.filter_project_id = projectFilter;
            if (yearFilter !== 'all') filters.filter_sampling_date_year = yearFilter; 
            if (startDate) filters.filter_sampling_date_ge = startDate;
            if (endDate) filters.filter_sampling_date_le = endDate;


            let samplingEvents = await getTableData('lab', 'sampling', filters); 
            if (samplingEvents.error || samplingEvents.length === 0) {
                renderPreview('Sampling Location Overview', `<p class="text-red-500">${samplingEvents.error || 'No sampling data found for criteria.'}</p>`, () => {});
                return;
            }

            const locationCounts = samplingEvents.reduce((acc, event) => { 
                acc[event.location_name] = (acc[event.location_name] || 0) + 1; 
                return acc; 
            }, {});

            const locationData = Object.entries(locationCounts).map(([location_name, count]) => ({
                location_name: location_name,
                count: count,
            })).sort((a,b) => b.count - a.count);

            const locationHeaders = ['Location Name', 'Sampling Events'];
            const locationRows = locationData.map(loc => [loc.location_name, loc.count]);

            let html = `
                <h4 class="report-section-title">Sampling Events by Location</h4>
                <div class="w-full h-96"><canvas id="location-chart"></canvas></div>
                <h4 class="report-section-title">Detailed Location List</h4>
                <div id="location-table"></div>
            `;
            renderPreview('Sampling Location Overview', html, () => generatePDF(
                { id: 'location-chart', title: 'Sampling Events by Location' },
                { id: 'location-table', title: 'Detailed Location List' }
            ));

            renderBarChart('location-chart', 'Number of Sampling Events', locationData.map(loc => loc.location_name), locationData.map(loc => loc.count), 'Number of Events');
            renderHtmlTable('location-table', locationHeaders, locationRows);
            saveReportToHistory('Sampling Location Overview', 'sampling-location-overview', { projectFilter, yearFilter, startDate, endDate });
        }


        async function generateFullAuditLogPreview() {
            const tableFilter = document.getElementById('audit-table-filter').value;
            const userFilter = document.getElementById('audit-user-filter').value;
            const actionFilter = document.getElementById('audit-action-filter').value;
            const startDate = document.getElementById('start-date-filter').value;
            const endDate = document.getElementById('end-date-filter').value;

            const filters = {};
            // Flask uses only table_name for filtering (the part after the dot)
            if (tableFilter !== 'all') filters.filter_table_name = tableFilter.split('.')[1]; 
            if (userFilter !== 'all') filters.filter_user_name = userFilter; 
            if (actionFilter !== 'all') filters.filter_action = actionFilter;
            if (startDate) filters.filter_action_timestamp_ge = startDate;
            if (endDate) filters.filter_action_timestamp_le = endDate;


            let auditLog = await getTableData('audit', 'log', filters); 
            if (auditLog.error || auditLog.length === 0) {
                renderPreview('Full System Audit Log', `<p class="text-red-500">${auditLog.error || 'No audit log entries found for criteria.'}</p>`, () => {});
                return;
            }

            auditLog.sort((a,b) => new Date(b.action_timestamp) - new Date(a.action_timestamp)); // Sort by most recent

            const auditHeaders = ['Timestamp', 'User ID', 'Table', 'Action', 'Original Data', 'New Data'];
            const auditRows = auditLog.map(log => [
                formatDateTime(log.action_timestamp),
                log.user_name || 'N/A', 
                `${log.schema_name}.${log.table_name}`,
                log.action,
                log.original_data ? JSON.stringify(log.original_data, null, 2).substring(0, 50) + '...' : 'N/A',
                log.new_data ? JSON.stringify(log.new_data, null, 2).substring(0, 50) + '...' : 'N/A',
            ]);

            let html = `
                <h4 class="report-section-title">System Audit Log Entries (${auditLog.length})</h4>
                <div id="audit-log-table"></div>
            `;
            renderPreview('Full System Audit Log', html, () => generatePDF(
                { id: 'audit-log-table', title: 'Full System Audit Log' }
            ));

            renderHtmlTable('audit-log-table', auditHeaders, auditRows);
            saveReportToHistory('Full System Audit Log', 'full-audit-log', { tableFilter, userFilter, actionFilter, startDate, endDate });
        }


        // --- HTML & CHART RENDERING HELPERS ---
        
        function renderHtmlTable(containerId, headers, bodyRows) {
            const container = document.getElementById(containerId);
            if (!container) return; 
            let table = `<table class="min-w-full text-sm">`;
            if (headers && headers.length > 0) {
                table += `<thead class="bg-gray-100"><tr>${headers.map(h => `<th class="p-2 text-left font-medium">${h}</th>`).join('')}</tr></thead>`;
            }
            table += `<tbody class="divide-y">${bodyRows.map(row => `<tr>${row.map(cell => `<td class="p-2">${cell === null || cell === undefined || cell === '' ? 'N/A' : cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
            container.innerHTML = table;
        }

        function renderObjectDetails(obj, keysToDisplay = Object.keys(obj)) {
            let html = '<dl class="space-y-2 text-sm">';
            for (const key of keysToDisplay) {
                const value = obj[key];
                if (['nr', 'attachment', 'password_hash', 'search_vector'].includes(key) || key.endsWith('_jsonb')) continue;

                const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let formattedValue = value;

                if ((key.toLowerCase().includes('date') || key.toLowerCase().includes('timestamp')) && value) {
                    try {
                        const dateObj = new Date(value);
                        formattedValue = isNaN(dateObj.getTime()) ? 'N/A' : dateObj.toLocaleString();
                    } catch (e) {
                        formattedValue = 'N/A';
                    }
                } else if (value === null || value === '') {
                    formattedValue = 'N/A';
                }

                html += `<div class="grid grid-cols-2 gap-2 py-1 border-b border-gray-100"><dt class="font-medium text-gray-500">${formattedKey}</dt><dd class="text-gray-900">${formattedValue}</dd></div>`;
            }
            html += '</dl>';
            return html;
        }

        function renderPieChart(canvasId, label, labels, data) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (Chart.getChart(canvasId)) {
                Chart.getChart(canvasId).destroy();
            }
            new Chart(ctx, { 
                type: 'pie', 
                data: { 
                    labels, 
                    datasets: [{ 
                        label, 
                        data, 
                        backgroundColor: ['#3b82f6', '#10b981', '#ef4444', '#f97316', '#8b5cf6', '#06b6d4', '#6b7280', '#ec4899', '#a855f7', '#facc15'] 
                    }] 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: label }
                    }
                }
            });
        }

        function renderBarChart(canvasId, label, labels, data, yLabel) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (Chart.getChart(canvasId)) {
                Chart.getChart(canvasId).destroy();
            }
            new Chart(ctx, { 
                type: 'bar', 
                data: { 
                    labels, 
                    datasets: [{ 
                        label, 
                        data, 
                        backgroundColor: '#3b82f6' 
                    }] 
                }, 
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: label }
                    },
                    scales: { 
                        y: { beginAtZero: true, title: { display: true, text: yLabel } },
                        x: { title: { display: true, text: 'Category' } }
                    } 
                } 
            });
        }
        
        async function generatePDF(...elementsToExport) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            let yPos = 20;

            for (const item of elementsToExport) {
                const element = document.getElementById(item.id);
                if (!element) continue;

                if (yPos + 10 > doc.internal.pageSize.height - 10) {
                    doc.addPage();
                    yPos = 20;
                }
                doc.setFontSize(16);
                doc.text(item.title, 14, yPos);
                yPos += 10;

                if (element.tagName === 'CANVAS') {
                    const imgData = element.toDataURL('image/png');
                    const imgWidth = 180;
                    const imgHeight = (element.height * imgWidth) / element.width;

                    if (yPos + imgHeight > doc.internal.pageSize.height - 20) {
                        doc.addPage();
                        yPos = 20;
                    }
                    doc.addImage(imgData, 'PNG', 14, yPos, imgWidth, imgHeight);
                    yPos += imgHeight + 10;
                } else {
                    const tableElement = element.querySelector('table');
                    if (tableElement) {
                        doc.autoTable({ 
                            html: tableElement, 
                            startY: yPos, 
                            theme: 'grid',
                            didDrawPage: (data) => { doc.setFontSize(10); doc.text("Page " + doc.internal.getNumberOfPages(), data.settings.margin.left, doc.internal.pageSize.height - 10); },
                            margin: { top: yPos }
                        });
                        yPos = doc.autoTable.previous.finalY + 10;
                    } else {
                         const tempDiv = document.createElement('div');
                         tempDiv.innerHTML = element.innerHTML;
                         document.body.appendChild(tempDiv);
                         const canvas = await html2canvas(tempDiv, { scale: 2, useCORS: true, logging: false });
                         const imgData = canvas.toDataURL('image/png');
                         const imgWidth = 180;
                         const imgHeight = (canvas.height * imgWidth) / canvas.width;
 
                         if (yPos + imgHeight > doc.internal.pageSize.height - 20) {
                             doc.addPage();
                             yPos = 20;
                         }
                         doc.addImage(imgData, 'PNG', 14, yPos, imgWidth, imgHeight);
                         yPos += imgHeight + 10;
                         document.body.removeChild(tempDiv);
                    }
                }
            }
            doc.save('report.pdf');
        }

        function saveReportToHistory(title, type, params) {
            let history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            const newReport = { title, type, params, date: new Date().toISOString() };
            history.unshift(newReport);
            history = history.slice(0, 10);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            renderReportHistory();
        }

        function renderReportHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            const container = document.getElementById('recent-reports-list');
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 mt-8"><i data-lucide="history" class="mx-auto h-12 w-12"></i><p class="mt-2">No reports generated yet.</p></div>`;
                lucide.createIcons();
                return;
            }
            container.innerHTML = history.map(h => `
                <div class="p-3 rounded-md hover:bg-gray-100 flex justify-between items-center">
                    <div>
                        <p class="font-semibold">${h.title}</p>
                        <p class="text-xs text-gray-500">${new Date(h.date).toLocaleString()}</p>
                    </div>
                    <button class="rerun-btn bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-1 px-2 rounded" data-report='${JSON.stringify(h)}'>Re-run</button>
                </div>
            `).join('');
            lucide.createIcons();
            document.querySelectorAll('.rerun-btn').forEach(btn => btn.addEventListener('click', async (e) => {
                const report = JSON.parse(e.target.dataset.report);
                document.getElementById('report-type').value = report.type;
                handleReportSelection();
                await new Promise(resolve => setTimeout(resolve, 50));
                for (const paramKey in report.params) {
                    const inputElement = document.getElementById(paramKey.replace(/([A-Z])/g, '-$1').toLowerCase());
                    if (inputElement) {
                        inputElement.value = report.params[paramKey];
                    }
                }
                const generateButton = document.getElementById('generate-preview-btn');
                if (generateButton) {
                    generateButton.click();
                } else {
                    console.warn('Generate button not found for re-run.');
                }
            }));
        }

        function initializeReportingPage() {
            document.getElementById('report-type').addEventListener('change', handleReportSelection);
            document.getElementById('tab-preview').addEventListener('click', () => switchTab('preview'));
            document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
            
            fetchAllData().then(() => {
                console.log("All necessary data pre-cached for reporting.");
                renderReportHistory();
                handleReportSelection();
            }).catch(error => {
                document.getElementById('preview-content').innerHTML = `<div class="text-red-500 text-center mt-8"><i data-lucide="alert-triangle" class="mx-auto h-12 w-12"></i><p class="mt-2">Failed to load all data for reports. Please check console for errors.</p></div>`;
                lucide.createIcons();
            });
        }
    </script>
