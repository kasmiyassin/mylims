        // --- API & UTILITIES ---
        async function apiFetch(endpoint, options = {}) {
            try {
                const fullEndpoint = endpoint.startsWith(API_BASE_URL) ? endpoint : `${API_BASE_URL}/${endpoint}`;
                if (!(options.body instanceof FormData)) {
                    options.headers = { 'Content-Type': 'application/json', ...options.headers };
                    if(options.body) options.body = JSON.stringify(options.body);
                }
                const response = await fetch(fullEndpoint, options);
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({error: `Server error or HTTP ${response.status}`}));
                    throw new Error(errorBody.error || `HTTP error! Status: ${response.status}`);
                }
                return response.status === 204 ? { success: true } : response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const data = await apiFetch(`table/${schema}/${tableName}`);
            return data && !data.error ? data : [];
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            const closeBtn = container.querySelector('#close-modal-btn');
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            return { closeModal };
        }

                        location_name: 'N/A', // Will be fetched in details modal
                        sampling_ecosystem: 'N/A', // Will be fetched in details modal

        // Helper to get workflow step info robustly
        function getWorkflowStepInfo(sample, allWorkflows, allWorkflowSteps, allStatuses) {
            const workflowDefinition = allWorkflows.find(wf => wf.workflow_id === sample.workflow_id); // Corrected to workflow_id
            if (!workflowDefinition) {
                return { currentStep: null, nextStep: null, workflowName: 'N/A', workflowDescription: 'No workflow definition found', stepsForThisWorkflow: [] };
            }

            const stepsForThisWorkflow = allWorkflowSteps
                .filter(step => step.workflow_id === sample.workflow_id) // Corrected to workflow_id
                .sort((a, b) => a.step_number - b.step_number); // Corrected to step_number

            if (stepsForThisWorkflow.length === 0) {
                return { currentStep: null, nextStep: null, workflowName: workflowDefinition.workflow_name, workflowDescription: workflowDefinition.description, stepsForThisWorkflow: [] }; // Corrected to workflow_name, description
            }

            const currentStatusId = sample.sample_status_id; // Corrected to sample_status_id
            let currentStep = null;
            let nextStep = null;

            // Find current step based on status
            const currentStepIndex = stepsForThisWorkflow.findIndex(step => step.workflow_status_id === currentStatusId); // Corrected to workflow_status_id
            
            if (currentStepIndex !== -1) {
                currentStep = stepsForThisWorkflow[currentStepIndex];
                if (currentStepIndex + 1 < stepsForThisWorkflow.length) {
                    nextStep = stepsForThisWorkflow[currentStepIndex + 1];
                }
            } else {
                // If current status doesn't exactly match a defined step status,
                // try to find the next logical step by sequence.
                const currentStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(currentStatusId);
                let foundNextLogicalStep = false;
                for (let i = 0; i < stepsForThisWorkflow.length; i++) {
                    const step = stepsForThisWorkflow[i];
                    const stepStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(step.workflow_status_id); // Corrected to workflow_status_id
                    if (stepStatusGlobalIndex !== -1 && stepStatusGlobalIndex > currentStatusGlobalIndex) {
                        nextStep = step; // This is the first step in sequence after current status
                        foundNextLogicalStep = true;
                        break;
                    }
                }
                // If no direct current step found, and we found a next logical step,
                // the "current" might be the step just before the "next logical".
                if (foundNextLogicalStep && stepsForThisWorkflow.indexOf(nextStep) > 0) {
                     currentStep = stepsForThisWorkflow[stepsForThisWorkflow.indexOf(nextStep) - 1];
                } else if (currentStatusGlobalIndex > WORKFLOW_STATUS_SEQUENCE.indexOf(stepsForThisWorkflow[stepsForThisWorkflow.length - 1]?.workflow_status_id)) { // Corrected to workflow_status_id
                    // If current status is beyond all defined steps, assume last step is current.
                    currentStep = stepsForThisWorkflow[stepsForThisWorkflow.length - 1];
                }
            }

            return {
                currentStep: currentStep,
                nextStep: nextStep,
                workflowName: workflowDefinition.workflow_name, // Corrected to workflow_name
                workflowDescription: workflowDefinition.description, // Corrected to description
                stepsForThisWorkflow: stepsForThisWorkflow
            };
        }

        function renderKanbanBoard(samples) {
            const container = document.getElementById('kanban-board-container');
            // Dynamically create columns based on the predefined WORKFLOW_STATUS_SEQUENCE
            container.innerHTML = WORKFLOW_STATUS_SEQUENCE.map(statusId => {
                const samplesInColumn = samples.filter(s => s.sample_status_id === statusId); // Corrected to sample_status_id
                const statusDescription = allStatuses.find(s => s.status_id === statusId)?.description || statusId; // Displays description or ID if no description
                return `
                <div class="kanban-column" data-status-id="${statusId}">
                    <div class="kanban-column-header">
                        <h2 class="font-bold text-lg text-gray-700 flex justify-between items-center">
                            <span>${statusDescription}</span>
                            <span class="text-base font-bold text-white bg-gray-500 rounded-full px-2.5 py-1">${samplesInColumn.length}</span>
                        </h2>
                    </div>
                    <div class="kanban-cards-container space-y-3 pr-2">
                        ${samplesInColumn.map(sample => {
                            const colorClass = sampleTypeColors[sample.sample_type] || sampleTypeColors.default;
                            
                            // Get info for drag/drop logic
                            const workflowInfo = getWorkflowStepInfo(sample, allWorkflows, allWorkflowSteps, allStatuses);
                            const nextStep = workflowInfo.nextStep;
                            
                            // Get next step's status description for the button title
                            const nextStepStatusDescription = nextStep 
                                ? (allStatuses.find(s => s.status_id === nextStep.workflow_status_id)?.description || nextStep.workflow_status_id) // Corrected to workflow_status_id, description
                                : 'N/A';
                            
                            const canProceed = nextStep !== null; // True if there's a defined next step in the workflow

                            return `
                            <div class="kanban-card p-3 border-l-${colorClass}" draggable="true" data-sample-id="${sample.sample_id}" data-current-status="${sample.sample_status_id}" data-workflow-id="${sample.workflow_id}">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="font-semibold text-gray-900">${sample.sample_id}</p>
                                        <p class="text-sm text-gray-600">${sample.species_en_name || sample.sample_type}</p>
                                        <p class="text-xs text-gray-500 mt-1">Project: ${sample.project_id || 'N/A'}</p>
                                        </div>
                                    ${canProceed ? `<button class="proceed-btn text-gray-400 hover:text-blue-600" data-next-step-id="${nextStep.workflow_status_id}" title="Proceed to ${nextStepStatusDescription}">
                                        <i data-lucide="arrow-right-circle" class="w-5 h-5"></i>
                                    </button>` : ''}
                                </div>
                                <p class="text-xs text-gray-400 mt-2">${timeSince(sample.time_modification)} in this stage</p>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons(); // Create icons for new content
            addKanbanEventListeners();
        }

        function addKanbanEventListeners() {
            let draggedCard = null;

            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedCard = e.target;
                    draggedCard.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', e.target.dataset.sampleId);

                    const sampleId = e.target.dataset.sampleId;
                    const sample = masterSampleList.find(s => s.sample_id === sampleId);
                    
                    // Crucial: Only allow drag if workflow is assigned
                    if (!sample || sample.workflow_id === null || sample.workflow_id === undefined) {
                        e.preventDefault(); // Do not allow drag if no workflow
                        alert("This sample has no assigned workflow. Please assign one from its details modal first.");
                        draggedCard.classList.remove('dragging');
                        draggedCard = null;
                        return;
                    }

                    // Determine the VALID next step for this specific sample's workflow
                    const sampleWorkflowSteps = allWorkflowSteps
                        .filter(step => step.workflow_id === sample.workflow_id) // Corrected to workflow_id
                        .sort((a, b) => a.step_number - b.step_number); // Corrected to step_number
                    
                    const currentStepIndex = sampleWorkflowSteps.findIndex(step => step.workflow_status_id === sample.sample_status_id); // Corrected to workflow_status_id, sample_status_id
                    const nextWorkflowStep = (currentStepIndex !== -1 && currentStepIndex + 1 < sampleWorkflowSteps.length)
                        ? sampleWorkflowSteps[currentStepIndex + 1]
                        : null;

                    document.querySelectorAll('.kanban-column').forEach(col => {
                        col.classList.remove('drag-valid', 'drag-invalid'); // Clear previous states
                        // Ensure nextWorkflowStep and its Workflow_Status_id are defined before using
                        if (nextWorkflowStep && nextWorkflowStep.workflow_status_id && col.dataset.statusId === nextWorkflowStep.workflow_status_id) { // Corrected to workflow_status_id
                            col.classList.add('drag-valid');
                        } else {
                            col.classList.add('drag-invalid');
                        }
                    });
                });

                card.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                    draggedCard = null;
                    document.querySelectorAll('.kanban-column').forEach(col => {
                        col.classList.remove('drag-valid', 'drag-invalid');
                    });
                });
            });

            document.querySelectorAll('.kanban-column').forEach(column => {
                column.addEventListener('dragover', (e) => {
                    e.preventDefault(); // Necessary to allow a drop
                    if (column.classList.contains('drag-valid')) {
                        e.dataTransfer.dropEffect = 'move';
                    } else {
                        e.dataTransfer.dropEffect = 'none'; // Indicate cannot drop
                    }
                });

                column.addEventListener('dragleave', (e) => {
                    // No specific action needed for styling with current setup
                });

                column.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetColumn = e.currentTarget;
                    if (targetColumn.classList.contains('drag-valid')) {
                        const sampleId = e.dataTransfer.getData('text/plain');
                        const newStatusId = targetColumn.dataset.statusId;
                        openWorkflowActionModal(sampleId, newStatusId);
                    } else {
                        alert('Invalid drop: This is not the next step in the workflow for this sample.');
                    }
                });
            });

            document.querySelectorAll('.proceed-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent card click event
                    const sampleId = e.target.closest('.kanban-card').dataset.sampleId;
                    const nextStepId = e.target.dataset.nextStepId; // Use data-next-step-id
                    
                    // Crucial: Only allow action if workflow is assigned
                    const sample = masterSampleList.find(s => s.sample_id === sampleId);
                     if (!sample || sample.workflow_id === null || sample.workflow_id === undefined) {
                        alert("This sample has no assigned workflow. Please assign one from its details modal first.");
                        return;
                    }

                    // Robust check for nextStepId before opening modal
                    if (nextStepId) {
                        openWorkflowActionModal(sampleId, nextStepId);
                    } else {
                        alert('No defined next step for this sample in its workflow.');
                        console.error('Proceed button clicked but nextStepId is undefined for sample:', sampleId);
                    }
                });
            });

            // Handle card clicks for details modal
            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    // Only open details if not clicking the proceed button
                    if (!e.target.closest('.proceed-btn')) {
                        showSampleDetailsModal(card.dataset.sampleId);
                    }
                });
            });
        }

        // --- Workflow Action Modal ---
        async function openWorkflowActionModal(sampleId, targetStatusId) {
            const sample = masterSampleList.find(s => s.sample_id === sampleId);
            if (!sample) { alert('Sample not found!'); return; }

            // Find the workflow step definition that corresponds to this targetStatusId
            const workflowDefinition = allWorkflows.find(wf => wf.workflow_id === sample.workflow_id); // Corrected to workflow_id
            const targetWorkflowStep = allWorkflowSteps.find(step => 
                step.workflow_id === sample.workflow_id && step.workflow_status_id === targetStatusId // Corrected to workflow_id, workflow_status_id
            );

            // IMPORTANT: Robustly check targetWorkflowStep and its Workflow_Status_id
            if (!targetWorkflowStep || !targetWorkflowStep.workflow_status_id) { // Corrected to workflow_status_id
                alert(`Error: Cannot find valid workflow step definition for target status "${targetStatusId}" in workflow "${workflowDefinition?.workflow_name || sample.workflow_id}". This indicates an issue in your workflow step definitions (Workflow_Status_id might be missing or mismatched).`); // Corrected to workflow_name
                console.error(`Workflow step issue: targetStatusId=${targetStatusId}, workflowId=${sample.workflow_id}, targetWorkflowStep=`, targetWorkflowStep);
                return;
            }

            const actionInfo = STATUS_ACTION_FORMS[targetStatusId];
            let formFieldsHtml = '';
            let formTitle = `Log: ${allStatuses.find(s => s.status_id === targetStatusId)?.description || targetStatusId}`; // Corrected to description
            let submitButtonText = 'Save & Advance';
            let actionTable = '';

            if (actionInfo) {
                actionTable = actionInfo.table;
                formFieldsHtml = (await Promise.all(actionInfo.fields.map(async field => {
                    let inputHtml = '';
                    let optionsHtml = '';
                    const fieldId = `action-form-${field.name}`; // Unique ID for form fields
                    const defaultValue = field.default !== undefined ? field.default : '';

                    if (field.type === 'select_personal') {
                        optionsHtml = allPersons.map(p => `<option value="${p.person_id}">${p['Full Name']}</option>`).join(''); // Corrected to Full Name
                        inputHtml = `<select id="${fieldId}" name="${field.name}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}><option value="">-- Select --</option>${optionsHtml}</select>`;
                    } else if (field.type === 'select_genes') {
                        optionsHtml = allGenes.map(g => `<option value="${g.gene_id}">${g.gene_id}</option>`).join(''); // Corrected to gene_id
                        inputHtml = `<select id="${fieldId}" name="${field.name}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}><option value="">-- Select --</option>${optionsHtml}</select>`;
                    } else if (field.type === 'select_status') { // New type for status dropdown
                        optionsHtml = allStatuses.map(s => `<option value="${s.status_id}" ${defaultValue === s.status_id ? 'selected' : ''}>${s.description}</option>`).join('');
                        inputHtml = `<select id="${fieldId}" name="${field.name}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}>${optionsHtml}</select>`;
                    }
                    else if (field.type === 'date') {
                        inputHtml = `<input type="date" id="${fieldId}" name="${field.name}" value="${defaultValue}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}>`;
                    } else if (field.type === 'textarea') {
                         inputHtml = `<textarea id="${fieldId}" name="${field.name}" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}>${defaultValue}</textarea>`;
                    } else if (field.type === 'number') {
                        inputHtml = `<input type="number" step="any" id="${fieldId}" name="${field.name}" value="${defaultValue}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}>`;
                    }
                    else {
                        inputHtml = `<input type="${field.type}" id="${fieldId}" name="${field.name}" value="${defaultValue}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" ${field.required ? 'required' : ''}>`;
                    }
                    return `
                        <div>
                            <label for="${fieldId}" class="block text-sm font-medium text-gray-700">${field.label || field.name.replace(/_/g, ' ')}</label>
                            ${inputHtml}
                        </div>
                    `;
                }))).join('');
            } else {
                formFieldsHtml = `<p class="text-gray-600">No specific data entry form defined for this step. Only the sample's workflow status will be updated.</p>`;
                submitButtonText = 'Update Status Only';
            }

            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="modal-content bg-white rounded-lg shadow-2xl p-6 w-full max-w-lg">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b">
                        <h2 class="text-2xl font-bold text-gray-800">${formTitle}</h2>
                        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
                    </div>
                    <form id="workflow-action-form" class="space-y-4">
                        <p>For Sample: <strong class="text-blue-600">${sampleId}</strong></p>
                        ${actionInfo ? `<p class="text-sm text-gray-600">This action will create a record in <strong class="text-blue-500">${actionInfo.table}</strong>.</p>` : ''}
                        <input type="hidden" name="sample_id" value="${sampleId}">
                        <input type="hidden" name="Experiment_id" value="${sample.Experiment_id || ''}"> <!-- Pass Experiment_id -->
                        <input type="hidden" name="Parentsample_id" value="${sample.Parentsample_id || ''}"> <!-- Pass Parentsample_id -->
                        <input type="hidden" name="project_id" value="${sample.project_id || ''}"> <!-- Pass project_id -->
                        <input type="hidden" name="storage_id" value="${sample.storage_id || ''}"> <!-- Pass storage_id -->
                        <input type="hidden" name="storage_position" value="${sample.storage_position || ''}"> <!-- Pass storage_position -->
                        <input type="hidden" name="sample_type" value="${sample.sample_type || ''}"> <!-- Pass sample_type -->

                        ${formFieldsHtml}
                        <div class="pt-4 flex justify-end">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${submitButtonText}</button>
                        </div>
                    </form>
                </div>
            </div>`;
            const { closeModal } = showModal(modalHTML);
            lucide.createIcons(); // Ensure new icons in modal are created
            
            document.getElementById('workflow-action-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // Special handling for JSONB fields
                if (data.stomach_contents_jsonb) {
                    try {
                        data.stomach_contents_jsonb = JSON.parse(data.stomach_contents_jsonb);
                    } catch (jsonError) {
                        alert('Invalid JSON in Stomach Contents field. Please correct it.');
                        return;
                    }
                }

                if (!e.target.reportValidity()) return; // Client-side validation

                let actionLogResult = { success: true }; // Assume success if no form/table action
                if (actionInfo) { // Only attempt to log action if actionInfo is defined
                    actionLogResult = await apiFetch(`table/${actionInfo.table}`, { method: 'POST', body: data });
                }
                
                if (actionLogResult && !actionLogResult.error) {
                    const updateSampleStatusResult = await updateSampleWorkflowStatus(sampleId, targetStatusId);

                    if (updateSampleStatusResult.success) {
                        alert('Action logged and workflow updated successfully!');
                        closeModal();
                        initializeWorkflowPage(); // Reload all data to reflect the change
                    } else {
                        alert(`Error updating sample workflow status: ${updateSampleStatusResult.error}. You might need to manually correct the status.`);
                    }
                } else {
                    alert(`Error logging action in ${actionInfo?.table || 'N/A'}: ${actionLogResult.error}`);
                }
            });
        }

        async function updateSampleWorkflowStatus(sampleId, newStatusId) {
            const payload = {
                sample_status_id: newStatusId, // Corrected to sample_status_id
                time_modification: new Date().toISOString() // Corrected to time_modification
            };
            try {
                const result = await apiFetch(`table/Lab/samples/${sampleId}`, { method: 'PUT', body: payload }); // Corrected to Lab/samples
                if (result && !result.error) {
                    return { success: true, sample_id: sampleId };
                } else {
                    throw new Error(result.error || 'Unknown server error');
                }
            } catch (error) {
                console.error(`Failed to update status for ${sampleId}: ${error.message}`);
                return { success: false, sample_id: sampleId, error: error.message };
            }
        }

        // --- FILTERING ---
        function applyFilters() {
            const projectId = document.getElementById('filter-project').value;
            const sampleType = document.getElementById('filter-type').value;
            const searchTerm = document.getElementById('filter-search').value.toLowerCase();
            const filterWorkflowAssigned = document.getElementById('filter-workflow-assigned').checked; // New filter

            let filteredSamples = masterSampleList;

            // Apply "Only show samples with workflow" filter first
            if (filterWorkflowAssigned) {
                filteredSamples = filteredSamples.filter(s => s.workflow_id !== null && s.workflow_id !== undefined);
            }

            // Apply other filters
            if (projectId) {
                filteredSamples = filteredSamples.filter(s => s.project_id === projectId);
            }
            if (sampleType) {
                filteredSamples = filteredSamples.filter(s => s.sample_type === sampleType);
            }
            if (searchTerm) {
                filteredSamples = filteredSamples.filter(s => 
                    s.sample_id.toLowerCase().includes(searchTerm) ||
                    (s.project_title && s.project_title.toLowerCase().includes(searchTerm)) ||
                    (s.External_Name && s.External_Name.toLowerCase().includes(searchTerm)) // Search External_Name
                );
            }
            
            renderKanbanBoard(filteredSamples);
        }

        // --- Time Utility ---
        function timeSince(dateString) {
            if (!dateString) return 'N/A';
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            const interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days";
            if (interval * 24 > 1) return Math.floor(interval * 24) + " hours";
            if (interval * 24 * 60 > 1) return Math.floor(interval * 24 * 60) + " minutes";
            return "Just now";
        }

        // --- Sample Details Modal ---
        // These are helper functions for the sample details modal.
        function isStepCompleted(step, currentSampleStatusId) {
            const currentStatusIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(currentSampleStatusId);
            const stepStatusIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(step.workflow_status_id); // Corrected to workflow_status_id
            
            return stepStatusIndex !== -1 && currentStatusIndex !== -1 && stepStatusIndex <= currentStatusIndex;
        }

        // IMPORTANT: This getSampleWorkflowHistory function is kept *as is* from your last provided code.
        // It fetches detailed historical events for the timeline in the modal.
        async function getSampleWorkflowHistory(sampleId, stepsForThisWorkflow) {
            const historyEvents = [];

            const sampleDetails = masterSampleList.find(s => s.sample_id === sampleId);

            // Add initial reception/sampling date if available
            if (sampleDetails && sampleDetails.Reception_date) { // Corrected to Reception_date
                historyEvents.push({
                    status_id: 'Received',
                    step_name: 'Sample Received',
                    date: new Date(sampleDetails.Reception_date), // Corrected to Reception_date
                    type: 'Reception'
                });
            } else if (sampleDetails && sampleDetails.sampling_date) {
                 historyEvents.push({
                    status_id: 'Received', // Use 'Received' status for sampling event on timeline
                    step_name: 'Sample Taken',
                    date: new Date(sampleDetails.sampling_date),
                    type: 'Sampling'
                });
            }


            // Fetch historical data for each relevant action table
            for (const statusId in STATUS_ACTION_FORMS) {
                const mapping = STATUS_ACTION_FORMS[statusId];
                try {
                    // Fetch records for specific sample ID
                    const records = await apiFetch(`table/${mapping.table}?filter_sample_id=${sampleId}`); // Added filter_ prefix
                    if (records && !records.error && Array.isArray(records)) {
                        records.forEach(record => {
                            // Determine the date field dynamically for each table
                            let dateField = 'date'; // Common default
                            if (mapping.table === 'Lab.Dissections') dateField = 'dissection_date';
                            else if (mapping.table === 'Lab.Extraction') dateField = 'date';
                            else if (mapping.table === 'Lab.Nanodrop') dateField = 'date';
                            else if (mapping.table === 'Lab.Qubit') dateField = 'date';
                            else if (mapping.table === 'Lab.Tapestation') dateField = 'date';
                            else if (mapping.table === 'Lab.PCR') dateField = 'date';
                            else if (mapping.table === 'Lab.qPCR') dateField = 'date';
                            else if (mapping.table === 'Lab.Library') dateField = 'date';
                            else if (mapping.table === 'Lab.Sequencing') dateField = 'date';
                            else if (mapping.table === 'Lab.bioinformatics') dateField = 'date';

                            const eventDate = record[dateField] ? new Date(record[dateField]) : null;
                            if (eventDate && !isNaN(eventDate)) {
                                historyEvents.push({
                                    status_id: statusId,
                                    step_name: allStatuses.find(s => s.status_id === statusId)?.description || statusId, // Corrected to description
                                    date: eventDate,
                                    type: mapping.table.split('.')[1], // e.g., 'Extraction', 'Qubit'
                                    record_data: record // Store full record for potential detail display
                                });
                            }
                        });
                    }
                } catch (error) {
                    console.warn(`Failed to fetch history for ${mapping.table} for sample ${sampleId}:`, error);
                }
            }

            // Sort all events by date
            historyEvents.sort((a, b) => a.date.getTime() - b.date.getTime());

            return historyEvents;
        }

                                    <i data-lucide="edit-2" class="w-5 h-5"></i>
                                </button>
                                <button class="delete-step-btn text-red-500 hover:text-red-700" data-step-id="${step.step_id}" title="Delete Step">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('workflow-steps-list').innerHTML = stepListHtml || '<p class="text-gray-600">No steps defined for this workflow. Click "New Step" to add one.</p>';
                lucide.createIcons();
                addStepEventListeners();
            };

            const addStepEventListeners = () => {
                document.querySelectorAll('.edit-step-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const stepId = e.currentTarget.dataset.stepId;
                        const stepToEdit = stepsForThisWorkflow.find(s => s.step_id === stepId);
                        if (stepToEdit) showWorkflowStepFormModal(workflowId, stepToEdit, () => showWorkflowStepsModal(workflowId));
                    });
                });
                document.querySelectorAll('.delete-step-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const stepId = e.currentTarget.dataset.stepId;
                        if (confirm(`Are you sure you want to delete step "${stepId}"?`)) {
                            const result = await apiFetch(`table/Lims/workflow_steps/${stepId}`, { method: 'DELETE' });
                            if (result.success) {
                                alert('Step deleted successfully.');
                                initializeWorkflowPage(); // Re-init main page
                                showWorkflowStepsModal(workflowId); // Re-open steps modal
                            } else {
                                alert('Failed to delete step: ' + (result.error || 'Unknown error'));
                            }
                        }
                    });
                });
                // Drag and drop for reordering steps (optional, requires backend reordering logic)
                const sortableList = document.getElementById('workflow-steps-list');
                let draggedItem = null;

                sortableList.addEventListener('dragstart', (e) => {
                    draggedItem = e.target.closest('.draggable-item');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedItem.dataset.stepId);
                    setTimeout(() => draggedItem.classList.add('dragging'), 0);
                });

                sortableList.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(sortableList, e.clientY);
                    const currentDraggable = document.querySelector('.draggable-item.dragging');
                    if (afterElement == null) {
                        sortableList.appendChild(currentDraggable);
                    } else {
                        sortableList.insertBefore(currentDraggable, afterElement);
                    }
                });

                sortableList.addEventListener('dragend', async () => {
                    draggedItem.classList.remove('dragging');
                    // Reorder steps array based on new DOM order
                    const newOrder = Array.from(sortableList.children).map((item, index) => ({
                        step_id: item.dataset.stepId,
                        step_number: index + 1 // Assign new step numbers based on order
                    }));

                    // Update stepsForThisWorkflow locally
                    stepsForThisWorkflow = newOrder.map(reorderedStep => {
                        const originalStep = allWorkflowSteps.find(s => s.step_id === reorderedStep.step_id);
                        return { ...originalStep, step_number: reorderedStep.step_number };
                    }).sort((a, b) => a.step_number - b.step_number); // Re-sort to maintain internal consistency

                    // Update allWorkflowSteps global cache
                    allWorkflowSteps = allWorkflowSteps.map(s => {
                        const reordered = newOrder.find(item => item.step_id === s.step_id);
                        return reordered ? { ...s, step_number: reordered.step_number } : s;
                    });

                    // Send updates to backend (this would require a batch update endpoint for workflow_steps)
                    for (const step of newOrder) {
                        await apiFetch(`table/Lims/workflow_steps/${step.step_id}`, {
                            method: 'PUT',
                            body: { step_number: step.step_number }
                        });
                    }
                    alert('Workflow steps reordered and updated.');
                    initializeWorkflowPage(); // Re-initialize main page to reflect potential order changes
                    renderStepsList(); // Re-render steps list in modal
                });
            };

            const getDragAfterElement = (container, y) => {
                const draggableElements = [...container.querySelectorAll('.draggable-item:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: -Infinity }).element;
            };

            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="modal-content bg-white rounded-lg shadow-2xl p-6 w-full max-w-2xl">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b">
                        <h2 class="text-2xl font-bold text-gray-800">Steps for Workflow: ${workflow.workflow_name} (${workflow.workflow_id})</h2>
                        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
                    </div>
                    <div class="max-h-[70vh] overflow-y-auto pr-4">
                        <div class="flex justify-end mb-4">
                            <button id="new-step-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center">
                                <i data-lucide="plus" class="w-5 h-5 mr-2"></i>New Step
                            </button>
                        </div>
                        <div id="workflow-steps-list" class="sortable-list space-y-2">
                            <!-- Steps will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>`;
            const { closeModal } = showModal(modalHTML);
            lucide.createIcons();
            
            document.getElementById('new-step-btn').addEventListener('click', () => showWorkflowStepFormModal(workflowId, null, () => showWorkflowStepsModal(workflowId)));
            renderStepsList();
        }

        async function showWorkflowStepFormModal(workflowId, stepToEdit = null, parentRefreshCallback = null) {
            const isEditing = stepToEdit !== null;
            const title = isEditing ? `Edit Step: ${stepToEdit.step_name}` : 'Create New Step';
            
            const stepNumberDefault = isEditing ? stepToEdit.step_number : (allWorkflowSteps.filter(s => s.workflow_id === workflowId).length + 1);
            const stepNameDefault = isEditing ? stepToEdit.step_name : '';
            const sopIdDefault = isEditing ? stepToEdit.sop_id : '';
            const workflowStatusIdDefault = isEditing ? stepToEdit.workflow_status_id : '';
            const descriptionDefault = isEditing ? stepToEdit.description : '';
            const targetTableNameDefault = isEditing ? stepToEdit.target_table_name : '';


            const modalHTML = `<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="modal-content bg-white rounded-lg shadow-2xl p-6 w-full max-w-md">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b">
                        <h2 class="text-2xl font-bold text-gray-800">${title}</h2>
                        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
                    </div>
                    <form id="workflow-step-form" class="space-y-4">
                        <input type="hidden" name="workflow_id" value="${workflowId}">
                        ${isEditing ? `<input type="hidden" name="step_id" value="${stepToEdit.step_id}">` : ''}
                        <div>
                            <label for="step_number" class="block text-sm font-medium text-gray-700">Step Number</label>
                            <input type="number" id="step_number" name="step_number" value="${stepNumberDefault}" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="step_name" class="block text-sm font-medium text-gray-700">Step Name</label>
                            <input type="text" id="step_name" name="step_name" value="${stepNameDefault}" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="sop_id" class="block text-sm font-medium text-gray-700">Associated SOP</label>
                            <select id="sop_id" name="sop_id" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                                <option value="">-- No SOP --</option>
                                ${allSOPs.map(sop => `<option value="${sop.sop_id}" ${sop.sop_id === sopIdDefault ? 'selected' : ''}>${sop.Title}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label for="workflow_status_id" class="block text-sm font-medium text-gray-700">Maps to Status</label>
                            <select id="workflow_status_id" name="workflow_status_id" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                                ${allStatuses.map(status => `<option value="${status.status_id}" ${status.status_id === workflowStatusIdDefault ? 'selected' : ''}>${status.description}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label for="target_table_name" class="block text-sm font-medium text-gray-700">Target Table (for logging data)</label>
                            <select id="target_table_name" name="target_table_name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                                <option value="">-- No Target Table --</option>
                                ${allTables.map(table => `<option value="${table}" ${table === targetTableNameDefault ? 'selected' : ''}>${table}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="description" name="description" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">${descriptionDefault}</textarea>
                        </div>
                        <div class="pt-4 flex justify-end">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Save Changes' : 'Create Step'}</button>
                        </div>
                    </form>
                </div>
            </div>`;
            const { closeModal } = showModal(modalHTML);

            document.getElementById('workflow-step-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!e.target.reportValidity()) return;

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // Ensure step_number is an integer
                data.step_number = parseInt(data.step_number);

                const method = isEditing ? 'PUT' : 'POST';
                const endpoint = isEditing ? `table/Lims/workflow_steps/${data.step_id}` : 'table/Lims/workflow_steps';
                const result = await apiFetch(endpoint, { method, body: data });

                if (result.success) {
                    alert(`Step ${isEditing ? 'updated' : 'created'} successfully!`);
                    closeModal();
                    if (parentRefreshCallback) parentRefreshCallback();
                    initializeWorkflowPage(); // Re-init main page to reflect potential changes
                } else {
                    alert('Failed to save step: ' + (result.error || 'Unknown error'));
                }
            });
        }
    </script>
</body>
</html>
