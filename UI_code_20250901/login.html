<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TIFI MG LIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles for the body */
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f3f4f6; /* Tailwind's bg-gray-100 */
        }

        /* Flex container to center content on the screen */
        .flex-center-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Ensures it takes at least the full viewport height */
        }

        /* Styling for the login card container */
        .login-card {
            width: 100%;
            max-width: 28rem; /* Tailwind's max-w-md */
            padding: 2rem; /* Tailwind's p-8 */
            margin: 0 1rem; /* Responsive horizontal centering (mx-auto on larger screens) */
            background-color: #ffffff; /* Tailwind's bg-white */
            border-radius: 0.5rem; /* Tailwind's rounded-lg */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* Tailwind's shadow-md */
            text-align: center;
        }

        /* Spacing utilities (mimicking Tailwind's space-y classes) */
        .space-y-8 > *:not(:first-child) {
            margin-top: 2rem;
        }
        .space-y-6 > *:not(:first-child) {
            margin-top: 1.5rem;
        }

        /* Logo image and placeholder styling */
        .logo-container {
            width: 6rem; /* Tailwind's w-24 */
            height: 6rem; /* Tailwind's h-24 */
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 1rem; /* Tailwind's mb-4 */
            object-fit: contain; /* Ensures logo scales properly within its bounds */
        }
        .logo-placeholder {
            width: 6rem;
            height: 6rem;
            background-color: #e5e7eb; /* Tailwind's bg-gray-200 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px; /* Tailwind's rounded-full */
            color: #6b7280; /* Tailwind's text-gray-500 */
            font-size: 1rem; /* Adjust font size for placeholder text */
        }

        /* Header and paragraph text styling */
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; } /* Tailwind's text-3xl */
        .font-bold { font-weight: 700; } /* Tailwind's font-bold */
        .text-gray-900 { color: #111827; } /* Tailwind's text-gray-900 */
        .mt-2 { margin-top: 0.5rem; } /* Tailwind's mt-2 */
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; } /* Tailwind's text-sm */
        .text-gray-600 { color: #4b5563; } /* Tailwind's text-gray-600 */

        /* Form input group styling for stacked inputs with rounded corners */
        .form-input-group {
            border-radius: 0.375rem; /* Tailwind's rounded-md */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* Tailwind's shadow-sm */
            /* Negative margin to make inputs overlap and only round outer corners */
            margin-top: -1px; 
        }
        .form-input {
            position: relative;
            display: block;
            width: 100%;
            padding: 0.625rem 0.75rem; /* Equivalent to Tailwind's py-2.5 px-3 */
            color: #1f2937; /* Tailwind's text-gray-900 */
            border: 1px solid #d1d5db; /* Tailwind's border border-gray-300 */
            appearance: none; /* Reset default browser styles */
            outline: none; /* Remove default focus outline */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-input::placeholder {
            color: #9ca3af; /* Tailwind's placeholder-gray-500 */
        }
        .form-input:focus {
            z-index: 1; /* Ensures focus border is on top when inputs are stacked */
            border-color: #3b82f6; /* Tailwind's focus:border-blue-500 */
            box-shadow: 0 0 0 1px #3b82f6, 0 0 0 3px rgba(59, 130, 246, 0.5); /* Tailwind's focus:ring-blue-500 */
        }
        /* Specific border-radius for top and bottom inputs in the stack */
        #username { border-top-left-radius: 0.375rem; border-top-right-radius: 0.375rem; border-bottom: none; }
        #password { border-bottom-left-radius: 0.375rem; border-bottom-right-radius: 0.375rem; }
        
        /* Error message styling */
        .error-message {
            padding: 0.75rem; /* Tailwind's p-3 */
            font-size: 0.875rem; /* Tailwind's text-sm */
            color: #b91c1c; /* Tailwind's text-red-700 */
            background-color: #fee2e2; /* Tailwind's bg-red-100 */
            border-radius: 0.5rem; /* Tailwind's rounded-lg */
            text-align: left; /* Align error text to the left */
        }

        /* Login button styling */
        .login-button {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0.625rem 1rem; /* Equivalent to Tailwind's py-2.5 px-4 */
            border: 1px solid transparent; /* Tailwind's border border-transparent */
            font-size: 0.875rem; /* Tailwind's text-sm */
            font-weight: 500; /* Tailwind's font-medium */
            border-radius: 0.375rem; /* Tailwind's rounded-md */
            color: #ffffff; /* Tailwind's text-white */
            background-color: #2563eb; /* Tailwind's bg-blue-600 */
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .login-button:hover {
            background-color: #1d4ed8; /* Tailwind's hover:bg-blue-700 */
        }
        .login-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5), 0 0 0 6px rgba(59, 130, 246, 0.2); /* Tailwind's focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 */
        }
    </style>
</head>
<body class="flex-center-screen">
    <div class="login-card">
        <div class="text-center">
            <img src="./photo/logo.png" alt="TIFI MG Logo" class="logo-container" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="logo-placeholder" style="display:none;">Logo</div>
            <h1 class="text-3xl font-bold text-gray-900">TIFI MG LIMS</h1>
            <p class="mt-2 text-sm text-gray-600">Please log in to your account.</p>
        </div>
        <form id="login-form" class="mt-8 space-y-6">
            <div id="login-error" class="error-message hidden"></div>
            <div class="form-input-group">
                <div>
                    <input id="username" name="username" type="text" autocomplete="username" required 
                           class="form-input" placeholder="Person ID or Email" value="TIFI">
                </div>
                <div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required 
                           class="form-input" placeholder="Password" value="password">
                </div>
            </div>
            <div>
                <button type="submit" class="login-button">
                    Sign in
                </button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Base URL for API calls. This is set to match your Apache proxy setup for /mylims/api.
            const API_BASE_URL = '/mylims/api'; 

            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');

            /**
             * Checks if a user is already logged in and redirects them.
             */
            const checkLoginStatus = () => {
                if (sessionStorage.getItem('isLoggedIn') === 'true') {
                    const userType = sessionStorage.getItem('user_type');
                    const redirectUrl = localStorage.getItem('redirectUrl');
                    localStorage.removeItem('redirectUrl');
                    
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else if (userType === 'customer') {
                        window.location.href = './mypage.html';
                    } else {
                        window.location.href = './dashboard.html';
                    }
                }
            };

            checkLoginStatus();

            /**
             * Handles the login form submission.
             */
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                loginError.classList.add('hidden'); 

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    loginError.textContent = 'Please enter both Username/ID and Password.';
                    loginError.classList.remove('hidden');
                    return; 
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    const result = await response.json(); 

                    if (response.ok && result.success) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('user', JSON.stringify(result.user));
                        sessionStorage.setItem('user_type', result.user_type);
                        
                        const redirectUrl = localStorage.getItem('redirectUrl');
                        if (redirectUrl) {
                            localStorage.removeItem('redirectUrl'); 
                            window.location.href = redirectUrl; 
                        } else if (result.user_type === 'customer') {
                            window.location.href = './mypage.html';
                        } else {
                            window.location.href = './dashboard.html';
                        }
                    } else {
                        loginError.textContent = result.error || 'Login failed. Please check your credentials.';
                        loginError.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error("Network or server error during login:", error);
                    loginError.textContent = 'Could not connect to the server. Please check your network connection, Apache proxy, or the backend server status.';
                    loginError.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
