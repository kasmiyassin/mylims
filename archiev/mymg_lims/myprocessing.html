<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { z-index: 50; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }

        /* Kanban Board Specific Styles */
        .kanban-board { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; min-height: 65vh; }
        .kanban-column { min-width: 320px; max-width: 320px; background-color: #f1f5f9; border-radius: 0.75rem; display: flex; flex-direction: column; transition: background-color 0.2s ease-in-out; }
        .kanban-column-header { padding: 1rem; }
        .kanban-cards-container { padding: 0 1rem 1rem 1rem; flex-grow: 1; overflow-y: auto; }
        .kanban-card { background-color: white; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); transition: all 0.2s ease; cursor: grab; border-left-width: 4px; }
        .kanban-card:hover { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transform: translateY(-2px); }
        .kanban-card.dragging { opacity: 0.5; cursor: grabbing; transform: scale(1.05); }
        .kanban-column.drag-valid { background-color: #dcfce7; } /* Light Green */
        .kanban-column.drag-invalid { background-color: #fee2e2; } /* Light Red */

        /* Sample Type Color Coding (Border Left) */
        .border-l-Water { border-left-color: #3b82f6; } /* blue-500 */
        .border-l-DNA { border-left-color: #ef4444; }    /* red-500 */
        .border-l-RNA { border-left-color: #ec4899; }    /* pink-500 */
        .border-l-Sediment { border-left-color: #f59e0b; } /* amber-500 */
        .border-l-Tissue { border-left-color: #14b8a6; }  /* teal-500 */
        .border-l-Library { border-left-color: #d946ef; } /* fuchsia-500 */
        .border-l-Fish { border-left-color: #6b7280; }    /* gray-500 */
        .border-l-Sampling { border-left-color: #22c55e; } /* green-500 */
        .border-l-default { border-left-color: #94a3b8; } /* slate-400 */

        /* Workflow Step Management (Drag & Drop) */
        .sortable-list .draggable-item {
            cursor: grab;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sortable-list .draggable-item.dragging {
            opacity: 0.5;
            border: 1px dashed #4f46e5;
        }
        .sortable-list .draggable-item .handle {
            cursor: grab;
            margin-right: 0.75rem;
            color: #64748b;
        }

        /* Timeline styles for sample details modal */
        .timeline-container { position: relative; padding-left: 15px; }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 19px; /* Adjust to align with dot centers */
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e2e8f0; /* gray-200 */
            z-index: 0;
        }
        .timeline-item { position: relative; padding-left: 25px; margin-bottom: 20px; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 10px; /* Adjust to align with line */
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1; /* gray-300 */
            border: 2px solid white;
            z-index: 1;
        }
        .timeline-item.completed::before { background-color: #22c55e; /* green-500 */ }
        .timeline-item.current::before { background-color: #3b82f6; /* blue-500 */ }
        .timeline-item.no-date::before { background-color: #f59e0b; /* amber-500 - for steps without a specific record */ }
    </style>
</head>

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializeWorkflowPage();
            document.getElementById('manage-workflows-btn').addEventListener('click', showManageWorkflowsModal);
        });

        // --- API & UTILITIES ---
        async function apiFetch(endpoint, options = {}) {
            try {
                const fullEndpoint = endpoint.startsWith(API_BASE_URL) ? endpoint : `${API_BASE_URL}/${endpoint}`;
                if (!(options.body instanceof FormData)) {
                    options.headers = { 'Content-Type': 'application/json', ...options.headers };
                    if(options.body) options.body = JSON.stringify(options.body);
                }
                const response = await fetch(fullEndpoint, options);
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({error: `Server error or HTTP ${response.status}`}));
                    throw new Error(errorBody.error || `HTTP error! Status: ${response.status}`);
                }
                return response.status === 204 ? { success: true } : response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const data = await apiFetch(`table/${schema}/${tableName}`);
            return data && !data.error ? data : [];
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            const closeBtn = container.querySelector('#close-modal-btn');
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            return { closeModal };
        }

        // --- WORKFLOW PAGE LOGIC ---
        async function initializeWorkflowPage() {
            // Fetch all necessary data: samples and workflow definitions
            const [samplesResult, workflows, workflowSteps, statuses, sops, persons, genes, tables] = await Promise.all([
                apiFetch('table/Lab/Samples_tracking'), // This view should contain all necessary sample details including workflow_id
                getReferenceData('Workflows', 'Lims'),
                getReferenceData('Workflow_steps', 'Lims'),
                getReferenceData('Status', 'Reference'),
                getReferenceData('SOP', 'Lims'),
                getReferenceData('Personal', 'Reference'), // For Person dropdown
                getReferenceData('Genes', 'Reference'), // For Genes dropdown
                apiFetch('table_names_for_forms').catch(e => { console.warn("Could not fetch table names for forms, using fallback."); return []; }) // Fetch all table names
            ]);

            if (samplesResult && !samplesResult.error) {
                masterSampleList = samplesResult; // Store all samples regardless of workflow assignment initially
            } else {
                document.getElementById('kanban-board-container').innerHTML = `<p class="text-red-500 text-center w-full">Error loading samples: ${samplesResult.error || 'Unknown'}</p>`;
                return;
            }

            allWorkflows = workflows;
            allWorkflowSteps = workflowSteps;
            allStatuses = statuses;
            allSOPs = sops;
            allPersons = persons;
            allGenes = genes;
            allTables = tables; // Store the list of tables

            const projects = [...new Set(masterSampleList.map(s => s.project_id).filter(Boolean))].sort();
            const sampleTypes = [...new Set(masterSampleList.map(s => s.sample_type).filter(Boolean))].sort();
            
            const projectFilter = document.getElementById('filter-project');
            projectFilter.innerHTML = '<option value="">All Projects</option>';
            projects.forEach(p => projectFilter.innerHTML += `<option value="${p}">${p}</option>`);

            const typeFilter = document.getElementById('filter-type');
            typeFilter.innerHTML = '<option value="">All Sample Types</option>';
            sampleTypes.forEach(t => typeFilter.innerHTML += `<option value="${t}">${t}</option>`);

            // Add event listeners for filter checkboxes
            document.getElementById('filter-workflow-assigned').addEventListener('change', applyFilters); // NEW LISTENER FOR FILTER
            document.getElementById('filter-project').addEventListener('input', applyFilters);
            document.getElementById('filter-type').addEventListener('input', applyFilters);
            document.getElementById('filter-search').addEventListener('input', applyFilters);

            // Check for URL parameter for specific sample_id (e.g., from samples.html)
            const urlParams = new URLSearchParams(window.location.search);
            const sampleIdFromUrl = urlParams.get('sample_id');

            applyFilters(); // Initial render

            if (sampleIdFromUrl) {
                // If a sample_id is provided in the URL, try to select and show its details
                const sampleCard = document.querySelector(`.kanban-card[data-sample-id="${sampleIdFromUrl}"]`);
                if (sampleCard) {
                    // Slight delay to allow board to render before clicking
                    setTimeout(() => {
                        sampleCard.click();
                    }, 500); 
                } else {
                    // If not found in the initial filtered list, re-apply filters without "only assigned"
                    // to ensure the sample can be found if it exists but is currently hidden
                    document.getElementById('filter-workflow-assigned').checked = false;
                    applyFilters();
                    setTimeout(() => {
                        const foundCard = document.querySelector(`.kanban-card[data-sample-id="${sampleIdFromUrl}"]`);
                        if (foundCard) foundCard.click();
                        else alert(`Sample ${sampleIdFromUrl} not found in any workflow.`);
                    }, 700);
                }
            }
        }

        // Helper to get workflow step info robustly
        function getWorkflowStepInfo(sample, allWorkflows, allWorkflowSteps, allStatuses) {
            const workflowDefinition = allWorkflows.find(wf => wf.Workflow_id === sample.workflow_id);
            if (!workflowDefinition) {
                return { currentStep: null, nextStep: null, workflowName: 'N/A', workflowDescription: 'No workflow definition found', stepsForThisWorkflow: [] };
            }

            const stepsForThisWorkflow = allWorkflowSteps
                .filter(step => step.Workflow_id === sample.workflow_id)
                .sort((a, b) => a.Step_number - b.Step_number);

            if (stepsForThisWorkflow.length === 0) {
                return { currentStep: null, nextStep: null, workflowName: workflowDefinition.Workflow_name, workflowDescription: workflowDefinition.decscription, stepsForThisWorkflow: [] };
            }

            const currentStatusId = sample.current_workflow_status;
            let currentStep = null;
            let nextStep = null;

            // Find current step based on status
            const currentStepIndex = stepsForThisWorkflow.findIndex(step => step.Workflow_Status_id === currentStatusId);
            
            if (currentStepIndex !== -1) {
                currentStep = stepsForThisWorkflow[currentStepIndex];
                if (currentStepIndex + 1 < stepsForThisWorkflow.length) {
                    nextStep = stepsForThisWorkflow[currentStepIndex + 1];
                }
            } else {
                // If current status doesn't exactly match a defined step status,
                // try to find the next logical step by sequence.
                const currentStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(currentStatusId);
                let foundNextLogicalStep = false;
                for (let i = 0; i < stepsForThisWorkflow.length; i++) {
                    const step = stepsForThisWorkflow[i];
                    const stepStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(step.Workflow_Status_id);
                    if (stepStatusGlobalIndex !== -1 && stepStatusGlobalIndex > currentStatusGlobalIndex) {
                        nextStep = step; // This is the first step in sequence after current status
                        foundNextLogicalStep = true;
                        break;
                    }
                }
                // If no direct current step found, and we found a next logical step,
                // the "current" might be the step just before the "next logical".
                if (foundNextLogicalStep && stepsForThisWorkflow.indexOf(nextStep) > 0) {
                     currentStep = stepsForThisWorkflow[stepsForThisWorkflow.indexOf(nextStep) - 1];
                } else if (currentStatusGlobalIndex > WORKFLOW_STATUS_SEQUENCE.indexOf(stepsForThisWorkflow[stepsForThisWorkflow.length - 1]?.Workflow_Status_id)) {
                    // If current status is beyond all defined steps, assume last step is current.
                    currentStep = stepsForThisWorkflow[stepsForThisWorkflow.length - 1];
                }
            }

            return {
                currentStep: currentStep,
                nextStep: nextStep,
                workflowName: workflowDefinition.Workflow_name,
                workflowDescription: workflowDefinition.decscription,
                stepsForThisWorkflow: stepsForThisWorkflow
            };
        }

        async function updateSampleWorkflowStatus(sampleId, newStatusId) {
            const payload = {
                workflow_status_id: newStatusId,
                last_status_update: new Date().toISOString()
            };
            try {
                const result = await apiFetch(`table/Lab/Samples/${sampleId}`, { method: 'PUT', body: payload });
                if (result && !result.error) {
                    return { success: true, sample_id: sampleId };
                } else {
                    throw new Error(result.error || 'Unknown server error');
                }
            } catch (error) {
                console.error(`Failed to update status for ${sampleId}: ${error.message}`);
                return { success: false, sample_id: sampleId, error: error.message };
            }
        }

        // --- Time Utility ---
        function timeSince(dateString) {
            if (!dateString) return 'N/A';
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            const interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days";
            if (interval * 24 > 1) return Math.floor(interval * 24) + " hours";
            if (interval * 24 * 60 > 1) return Math.floor(interval * 24 * 60) + " minutes";
            return "Just now";
        }

        // IMPORTANT: This getSampleWorkflowHistory function is kept *as is* from your last provided code.
        // It fetches detailed historical events for the timeline in the modal.
        async function getSampleWorkflowHistory(sampleId, stepsForThisWorkflow) {
            const historyEvents = [];

            const sampleDetails = masterSampleList.find(s => s.sample_id === sampleId);

            // Add initial reception/sampling date if available
            if (sampleDetails && sampleDetails.Recieption_date) {
                historyEvents.push({
                    status_id: 'Received',
                    step_name: 'Sample Received',
                    date: new Date(sampleDetails.Recieption_date),
                    type: 'Reception'
                });
            } else if (sampleDetails && sampleDetails.sampling_date) {
                 historyEvents.push({
                    status_id: 'Received', // Use 'Received' status for sampling event on timeline
                    step_name: 'Sample Taken',
                    date: new Date(sampleDetails.sampling_date),
                    type: 'Sampling'
                });
            }


            // Fetch historical data for each relevant action table
            for (const statusId in STATUS_ACTION_FORMS) {
                const mapping = STATUS_ACTION_FORMS[statusId];
                try {
                    // Fetch records for specific sample ID
                    const records = await apiFetch(`table/${mapping.table}?sample_id=${sampleId}`);
                    if (records && !records.error && Array.isArray(records)) {
                        records.forEach(record => {
                            const eventDate = record[mapping.date_field] ? new Date(record[mapping.date_field]) : null;
                            if (eventDate && !isNaN(eventDate)) {
                                historyEvents.push({
                                    status_id: statusId,
                                    step_name: allStatuses.find(s => s.status_id === statusId)?.Description || statusId,
                                    date: eventDate,
                                    type: mapping.table.split('.')[1], // e.g., 'Extraction', 'Qubit'
                                    record_data: record // Store full record for potential detail display
                                });
                            }
                        });
                    }
                } catch (error) {
                    console.warn(`Failed to fetch history for ${mapping.table} for sample ${sampleId}:`, error);
                }
            }

            // Sort all events by date
            historyEvents.sort((a, b) => a.date.getTime() - b.date.getTime());

            return historyEvents;
        }

                            <div><strong>Current Status:</strong><span class="font-bold ml-2 text-blue-600">${allStatuses.find(s => s.status_id === sample.current_workflow_status)?.Description || sample.current_workflow_status}</span></div>
                            <div><strong>Species:</strong><span class="font-medium ml-2">${sample.species_en_name || sample.species_scientific_name || 'N/A'}</span></div>
                            <div><strong>Project:</strong><span class="font-medium ml-2">${sample.project_id || 'N/A'} (${sample.project_title || 'N/A'})</span></div>
                            <div><strong>Sampling Date:</strong><span class="font-medium ml-2">${sample.sampling_date ? new Date(sample.sampling_date).toLocaleDateString() : 'N/A'}</span></div>
                            <div><strong>Region:</strong><span class="font-medium ml-2">${sample.location_name || 'N/A'}</span></div>
                            <div><strong>Ecosystem:</strong><span class="font-medium ml-2">${sample.sampling_ecosystem || 'N/A'}</span></div>
                            <div><strong>Experiment:</strong><span class="font-medium ml-2">${sample.exp_nr || 'N/A'} (${sample.exp_title || 'N/A'})</span></div>
                            <div><strong>Sampler:</strong><span class="font-medium ml-2">${sample.Sampler || 'N/A'}</span></div>
                            <div><strong>Receiver:</strong><span class="font-medium ml-2">${sample.Reciever || 'N/A'}</span></div>
                            <div><strong>Last Status Update:</strong><span class="font-medium ml-2">${sample.last_status_update ? new Date(sample.last_status_update).toLocaleString() : 'N/A'}</span></div>
                            <div><strong>Storage Location:</strong><span class="font-medium ml-2">${sample.storage_id || 'N/A'}</span></div>
                            ${sample.Notes ? `<div><strong>Notes:</strong><span class="font-medium ml-2">${sample.Notes}</span></div>` : ''}
                            ${sample.attachment ? `<div><strong>Attachment:</strong><a href="#" onclick="alert('Download/view attachment not yet implemented via API'); return false;" class="text-blue-500 hover:underline ml-2">View Attachment</a></div>` : ''}
                        </div>

                        <h3 class="font-bold text-lg mb-3">Assigned Workflow: ${workflowName || 'Not Assigned'}</h3>
                        ${!sample.workflow_id ? `
                            <div class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md">
                                <p class="text-yellow-800 text-sm mb-2">This sample is not assigned to a workflow. Assign one to track its progress.</p>
                                <select id="assign-workflow-select" class="w-full p-2 border rounded-md">
                                    <option value="">-- Select Workflow --</option>
                                    ${allWorkflows.map(wf => `<option value="${wf.Workflow_id}">${wf.Workflow_name}</option>`).join('')}
                                </select>
                                <button id="assign-workflow-btn" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-1.5 px-3 rounded-lg">Assign Workflow</button>
                            </div>
                        ` : ''}

                        <h3 class="font-bold text-lg mb-3">Workflow History Timeline</h3>
                        ${workflowTimelineHtml}
                        
                        <div class="pt-4 flex justify-end border-t mt-4">
                            <a href="samples.html?sample_id=${sampleId}&table=${sample.source_table}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-semibold py-2 px-3 rounded-lg flex items-center">
                                <i data-lucide="external-link" class="w-4 h-4 mr-2"></i>View Full Sample Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>`;
            showModal(modalHTML);
            lucide.createIcons();

            if (!sample.workflow_id) {
                document.getElementById('assign-workflow-btn').addEventListener('click', async () => {
                    const select = document.getElementById('assign-workflow-select');
                    const selectedWorkflowId = parseInt(select.value);
                    if (isNaN(selectedWorkflowId)) {
                        alert('Please select a valid workflow.');
                        return;
                    }
                    const initialStatus = allWorkflowSteps.find(step => step.Workflow_id === selectedWorkflowId && step.Step_number === 1)?.Workflow_Status_id || 'Received';

                    const payload = {
                        workflow_id: selectedWorkflowId,
                        workflow_status_id: initialStatus,
                        last_status_update: new Date().toISOString()
                    };
                    const result = await apiFetch(`table/Lab/Samples/${sampleId}`, { method: 'PUT', body: payload });
                    if (result.success) {
                        alert('Workflow assigned successfully! Sample status set to initial step.');
                        // Re-initialize and re-display for data freshness
                        initializeWorkflowPage(); 
                        // Close and re-open modal to show updated status/workflow info
                        showModal(modalHTML); // This clears modal.
                        showSampleDetailsModal(sampleId); // Re-opens with fresh data.
                    } else {
                        alert('Failed to assign workflow: ' + (result.error || 'Unknown error'));
                    }
                });
            }
        }
    </script>
</body>
</html>
