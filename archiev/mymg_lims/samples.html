    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api';
        let currentViewCache = [];
        let referenceDataCache = {};
        let currentTableName = 'Samples';
        let parsedUploadData = [];
        let currentSortColumn = null;
        let currentSortDirection = 'asc';
    
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const user = JSON.parse(sessionStorage.getItem('user'));
            if(user) document.getElementById('user-profile').innerHTML = `<p class="font-semibold text-sm text-gray-800">${user.person}</p>`;
            document.getElementById('logout-button').addEventListener('click', () => { sessionStorage.clear(); window.location.href = './login.html'; });
            initializePage();
        });
    
        // --- API & UTILITIES ---
        async function apiFetch(endpoint, options = {}) {
            try {
                if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
                    options.headers = { ...options.headers, 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(options.body);
                }
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                if (!response.ok) { 
                    const err = await response.json().catch(()=>({error: `Server Error: ${response.status}`})); 
                    throw new Error(err.error); 
                }
                return response.status === 204 ? { success: true } : await response.json();
            } catch (error) { 
                console.error("API Error:", error); 
                return { error: error.message }; 
            }
        }
    
        async function getReferenceData(tableName, schema='Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (referenceDataCache[cacheKey]) return referenceDataCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) referenceDataCache[cacheKey] = data;
            return data;
        }
    
        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => { container.innerHTML = ''; parsedUploadData = []; }, 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            container.querySelector('#close-modal-btn').addEventListener('click', closeModal);
            return { closeModal };
        }
    
        // --- DYNAMIC VIEW LOADER ---
        async function loadView(tableName) {
            currentTableName = tableName;
            currentViewCache = [];
            currentSortColumn = null;
            currentSortDirection = 'asc';
            
            document.querySelectorAll('.sub-nav-link').forEach(link => link.classList.toggle('active', link.dataset.table === tableName));
            
            const isMasterView = tableName === 'Samples';
            document.getElementById('new-sample-btn').disabled = isMasterView;
            document.getElementById('bulk-import-btn').disabled = isMasterView;
            document.getElementById('bulk-update-btn').disabled = isMasterView;
            document.getElementById('workflow-update-btn').style.display = isMasterView ? 'flex' : 'none';
    
            if(isMasterView) {
                document.getElementById('new-sample-btn').title = "Select a specific sample type to add a new entry.";
                document.getElementById('bulk-import-btn').title = "Select a specific sample type for bulk import.";
                document.getElementById('bulk-update-btn').title = "Select a specific sample type for bulk update.";
            } else {
                document.getElementById('new-sample-btn').title = "";
                document.getElementById('bulk-import-btn').title = "";
                document.getElementById('bulk-update-btn').title = "";
            }
    
            const container = document.getElementById('page-container');
            container.innerHTML = `
                <div class="mb-4 flex items-center space-x-4">
                    <input type="text" id="search-input" placeholder="Search this table..." class="w-full p-2 border rounded-md shadow-sm">
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                    <div class="lg:col-span-3">
                        <div class="card p-4">
                            <div id="table-scroll-container" class="overflow-y-auto h-[65vh]">
                                <div id="table-content"><p class="p-4 text-gray-500">Loading data for ${tableName}...</p></div>
                            </div>
                        </div>
                    </div>
                    <div id="details-container" class="lg:col-span-2">
                        <div class="card p-6 h-full flex items-center justify-center text-gray-500">
                            <div class="text-center"><i data-lucide="mouse-pointer-square" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an item to view details</p></div>
                        </div>
                    </div>
                </div>`;
            lucide.createIcons();
            document.getElementById('search-input').addEventListener('input', renderTableForType);
            await renderTableForType();
        }
    
        async function renderTableForType() {
            const tableContainer = document.getElementById('table-content');
            if(currentViewCache.length === 0) {
                const result = await apiFetch(`table/Lab/${currentTableName}`);
                if (result.error || !Array.isArray(result)) {
                    tableContainer.innerHTML = `<p class="p-4 text-red-500">Error loading data: ${result.error || 'Invalid response'}</p>`;
                    return;
                }
                currentViewCache = result;
            }
            
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
            let filteredData = currentViewCache.filter(row => 
                Object.values(row).some(val => val && val.toString().toLowerCase().includes(searchTerm))
            );
    
            if (currentSortColumn) {
                filteredData.sort((a, b) => {
                    const valA = a[currentSortColumn] || '';
                    const valB = b[currentSortColumn] || '';
    
                    if (currentSortColumn.includes('date')) {
                        const dateA = new Date(valA);
                        const dateB = new Date(valB);
                        if (isNaN(dateA.getTime()) && isNaN(dateB.getTime())) return 0;
                        if (isNaN(dateA.getTime())) return currentSortDirection === 'asc' ? 1 : -1;
                        if (isNaN(dateB.getTime())) return currentSortDirection === 'asc' ? -1 : 1;
                        return currentSortDirection === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
                    }
    
                    if (typeof valA === 'number' && typeof valB === 'number') return currentSortDirection === 'asc' ? valA - valB : valB - valA;
                    const stringA = String(valA).toLowerCase();
                    const stringB = String(valB).toLowerCase();
                    if (stringA < stringB) return currentSortDirection === 'asc' ? -1 : 1;
                    if (stringA > stringB) return currentSortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }
    
            if (filteredData.length === 0) {
                tableContainer.innerHTML = `<p class="p-4 text-gray-500">No entries found.</p>`;
                document.getElementById('details-container').innerHTML = `<div class="card p-6 h-full flex items-center justify-center text-gray-500"><div class="text-center"><i data-lucide="mouse-pointer-square" class="mx-auto h-12 w-12"></i><p class="mt-2">Select an item to view details</p></div></div>`;
                lucide.createIcons();
                return;
            }
    
            const allHeaders = Object.keys(currentViewCache[0] || {});
            let preferredHeaders = ['sample_id', 'Region', 'sampling_date', 'Species', 'ParentSample_id'];
            if(currentTableName === 'Samples') {
                preferredHeaders.push('workflow_status_id', 'source_table', 'modified_by');
            }
            const summaryHeaders = preferredHeaders.filter(h => allHeaders.includes(h));
            
            const tableHtml = `<table class="min-w-full text-sm">
                <thead class="bg-gray-50 sticky top-0"><tr>
                    ${summaryHeaders.map(h => {
                        const isCurrentSort = h === currentSortColumn;
                        const sortIcon = isCurrentSort 
                            ? (currentSortDirection === 'asc' ? '<i data-lucide="arrow-up-down" class="sort-icon rotate-180"></i>' : '<i data-lucide="arrow-up-down" class="sort-icon"></i>')
                            : '<i data-lucide="arrow-up-down" class="sort-icon text-gray-400"></i>';
                        return `<th class="px-4 py-2 text-left font-medium text-gray-500 uppercase sortable-header" data-column="${h}">
                                    <div class="flex items-center"><span>${h.replace(/_/g, ' ')}</span>${sortIcon}</div></th>`;
                    }).join('')}
                    <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
                </tr></thead>
                <tbody class="divide-y divide-gray-200">
                    ${filteredData.map(row => `<tr class="table-row hover:bg-gray-50 cursor-pointer" data-sample-id="${row.sample_id}">
                        ${summaryHeaders.map(h => {
                            if (h === 'workflow_status_id' && currentTableName === 'Samples') {
                                return `<td class="px-4 py-3 whitespace-nowrap">
                                    <div class="workflow-status-cell p-1 rounded hover:bg-gray-200" 
                                         data-sample-id="${row.sample_id}" 
                                         data-current-value="${row[h] || ''}">
                                         ${row[h] || ''}
                                    </div>
                                </td>`;
                            }
                            return `<td class="px-4 py-3 whitespace-nowrap">${row[h] || ''}</td>`;
                        }).join('')}
                        <td class="px-4 py-3 flex space-x-2">
                            <button class="edit-btn p-1 text-gray-500 hover:text-blue-600" data-sample-id="${row.sample_id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button class="delete-btn p-1 text-gray-500 hover:text-red-600" data-sample-id="${row.sample_id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            
            tableContainer.innerHTML = tableHtml;
            lucide.createIcons();
            addActionListeners();
            addSortListeners();
            addWorkflowStatusEditorListeners();
        }
    
        // --- IN-LINE AND BATCH WORKFLOW UPDATE ---
    
        function addWorkflowStatusEditorListeners() {
            document.querySelectorAll('.workflow-status-cell').forEach(cell => {
                cell.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const originalCell = e.currentTarget;
                    if (originalCell.querySelector('select')) return;
    
                    const sampleId = originalCell.dataset.sampleId;
                    const currentValue = originalCell.dataset.currentValue;
    
                    const scrollContainer = document.getElementById('table-scroll-container');
                    if (scrollContainer) scrollContainer.style.overflowY = 'visible';
                    
                    const statuses = await getReferenceData('Status');
                    if (!statuses || statuses.error) {
                        alert('Could not load statuses.');
                        if (scrollContainer) scrollContainer.style.overflowY = 'auto';
                        return;
                    }
    
                    const selectOptions = statuses.map(s => 
                        `<option value="${s.status_id}" ${s.status_id == currentValue ? 'selected' : ''}>
                            ${s.description || s.status_id}
                        </option>`
                    ).join('');
    
                    originalCell.innerHTML = `<select class="w-full p-1 border rounded-md" data-sample-id="${sampleId}">${selectOptions}</select>`;
                    
                    const selectElement = originalCell.querySelector('select');
                    selectElement.focus();
    
                    const revertUI = () => {
                        if (scrollContainer) scrollContainer.style.overflowY = 'auto';
                        renderTableForType();
                    };
    
                    selectElement.addEventListener('change', async (evt) => {
                        const newStatusId = evt.target.value;
                        await updateSingleSampleStatus(sampleId, newStatusId, true);
                    });
    
                    selectElement.addEventListener('blur', revertUI);
                });
            });
        }
        
       async function updateSingleSampleStatus(sampleId, newStatusId, reloadViewOnSuccess = false) {
             const user = JSON.parse(sessionStorage.getItem('user')) || {};
             const payload = {
                workflow_status_id: newStatusId,
                last_status_update: new Date().toISOString(),
                modified_by: user.person
            };
            try {
                const result = await apiFetch(`table/Lab/Samples/${sampleId}`, { method: 'PUT', body: payload });
                if (result && !result.error) {
                    if (reloadViewOnSuccess) {
                        currentViewCache = []; 
                        loadView(currentTableName);
                    }
                    return { success: true, sample_id: sampleId };
                } else {
                   throw new Error(result.error || 'Unknown server error');
                }
            } catch (error) {
                const errorMessage = error.message;
                console.error(`Failed to update status for ${sampleId}: ${errorMessage}`);
                if (reloadViewOnSuccess) {
                    alert(`Failed to update status for ${sampleId}: ${errorMessage}`);
                    renderTableForType();
                }
                return { success: false, sample_id: sampleId, error: errorMessage };
            }
        }
    
    
        async function showWorkflowUpdateModal() {
            const modalHTML = `
                <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="modal-content bg-white rounded-lg shadow-2xl p-8 w-full max-w-2xl transform transition-all -translate-y-10 opacity-0">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-2xl font-bold">Batch Update Workflow Status</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">&times;</button>
                        </div>
                        <div>
                            <div class="mb-4">
                                <h3 class="font-semibold text-lg mb-2">1. Get Template</h3>
                                <p class="text-sm text-gray-600 mb-3">Download a template with 'sample_id' and 'workflow_status_id'.</p>
                                <button id="download-workflow-template-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center shadow-sm">
                                    <i data-lucide="download" class="w-4 h-4 mr-2"></i>Download Template
                                </button>
                            </div>
                            <div class="mb-6">
                                <h3 class="font-semibold text-lg mb-2">2. Upload Your File</h3>
                                <p class="text-sm text-gray-600 mb-3">Upload the completed .csv or .xlsx file.</p>
                                <input type="file" id="workflow-file-input" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            </div>
                             <div id="preview-container" class="border rounded-lg p-2 bg-gray-50 min-h-[100px] text-xs mb-6">
                                 <p class="text-gray-500 text-center p-4">Select a file to preview.</p>
                             </div>
                            <div id="batch-update-progress" class="hidden">
                                <h3 class="font-semibold text-lg mb-2">3. Update Progress</h3>
                                <div id="progress-log" class="w-full bg-gray-800 text-white font-mono text-xs rounded-md p-4 h-48 overflow-y-auto"></div>
                            </div>
                        </div>
                        <div class="pt-6 flex justify-end border-t mt-6">
                            <button id="start-batch-update-btn" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg flex items-center" disabled>
                                <i data-lucide="play" class="w-5 h-5 mr-2"></i>Start Batch Update
                            </button>
                        </div>
                    </div>
                </div>`;
            const { closeModal } = showModal(modalHTML);
            lucide.createIcons();
    
            document.getElementById('download-workflow-template-btn').addEventListener('click', () => {
                const csvContent = "sample_id,workflow_status_id";
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(blob));
                link.setAttribute("download", "workflow_update_template.csv");
                link.click();
            });
            document.getElementById('workflow-file-input').addEventListener('change', (e) => handleFileSelect(e, true));
            document.getElementById('start-batch-update-btn').addEventListener('click', () => runBatchWorkflowUpdate(closeModal));
        }
    
        async function runBatchWorkflowUpdate(closeModal) {
            if (parsedUploadData.length === 0) { alert('No data to update.'); return; }
            document.getElementById('start-batch-update-btn').disabled = true;
            document.getElementById('batch-update-progress').style.display = 'block';
            const logContainer = document.getElementById('progress-log');
            
            let successCount = 0;
            let failCount = 0;
            const failedSamples = [];
            
            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };
    
            logMessage(`Starting batch update for ${parsedUploadData.length} samples...`);
    
            for (const row of parsedUploadData) {
                if (!row.sample_id || !row.workflow_status_id) {
                    logMessage(`Skipping invalid row: ${JSON.stringify(row)}`, 'text-yellow-400');
                    continue;
                }
                logMessage(`Updating ${row.sample_id} to status ${row.workflow_status_id}...`);
                const result = await updateSingleSampleStatus(row.sample_id, row.workflow_status_id, false);
                if (result.success) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedSamples.push(`${row.sample_id}`);
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }
    
            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Batch update complete.`, 'text-blue-400 font-bold');

            const container = document.getElementById('dynamic-fields-container');
            container.innerHTML = `<p class="text-center text-gray-500 p-4">Loading form fields...</p>`;
            let columns = [];
            const schemaResult = await apiFetch(`table/Lab/${tableName}?limit=1`);
            if (schemaResult && !schemaResult.error && schemaResult.length > 0) {
                columns = Object.keys(schemaResult[0]);

                const checkEmpty = await apiFetch(`table/Lab/${tableName}`);
                if (checkEmpty.error || checkEmpty.length === 0) {
                    container.innerHTML = `<p class="text-yellow-600 p-4 bg-yellow-50 rounded-md">The table '${tableName}' is empty or could not be read. Cannot generate form. Please use Bulk Import.</p>`;
                    return;
                }
                columns = Object.keys(checkEmpty[0]);
            }
            
            const [locations, species, storage, allSamples, experiments] = await Promise.all([
                getReferenceData('Location'), getReferenceData('Species'), getReferenceData('Storage', 'Lab'),
                getReferenceData('Samples', 'Lab'), getReferenceData('Experiments', 'Lab'),
            ]);
            
            let fieldsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">';
            const ignoredCols = ['nr', 'sample_id', 'sample_type', 'attachment', 'source_table', 'last_status_update', 'workflow_status_id', 'created_by', 'modified_by'];
    
            for (const col of columns) {
                if (ignoredCols.includes(col)) continue;
                const value = dataToPreload ? (dataToPreload[col] || '') : '';
                const formattedLabel = col.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let field = '';
                if (col.toLowerCase().includes('date')) field = `<input type="date" name="${col}" value="${value ? String(value).split('T')[0] : ''}" class="w-full mt-1 p-2 border rounded-md">`;
                else if (col === 'Region') field = `<select name="${col}" class="w-full mt-1 p-2 border rounded-md"><option value="">-- Select --</option>${(locations || []).map(loc => `<option value="${loc.Region}" ${value == loc.Region ? 'selected' : ''}>${loc.Region}</option>`).join('')}</select>`;
                else if (col === 'Species') field = `<select name="${col}" class="w-full mt-1 p-2 border rounded-md"><option value="">-- Select --</option>${(species || []).map(sp => `<option value="${sp.Species}" ${value == sp.Species ? 'selected' : ''}>${sp.Species} (${sp.En_name})</option>`).join('')}</select>`;
                else if (col === 'storage_id') field = `<select name="${col}" class="w-full mt-1 p-2 border rounded-md"><option value="">-- Select --</option>${(storage || []).map(st => `<option value="${st.storage_id}" ${value == st.storage_id ? 'selected' : ''}>${st.storage_id} (${st.Box || 'N/A'})</option>`).join('')}</select>`;
                else if (col.includes('ParentSample_id')) field = `<select name="${col}" class="w-full mt-1 p-2 border rounded-md"><option value="">-- No Parent --</option>${(allSamples || []).map(p => `<option value="${p.sample_id}" ${value == p.sample_id ? 'selected' : ''}>${p.sample_id}</option>`).join('')}</select>`;
                else if (col === 'Experiment_Nr') field = `<select name="${col}" class="w-full mt-1 p-2 border rounded-md"><option value="">-- Select --</option>${(experiments || []).map(e => `<option value="${e.Experiment_Nr}" ${value == e.Experiment_Nr ? 'selected' : ''}>${e.Experiment_Nr} - ${e.Experiment_title}</option>`).join('')}</select>`;
                else if (col === 'Notes') field = `<textarea name="${col}" class="w-full mt-1 p-2 border rounded-md h-24">${value}</textarea>`;
                else field = `<input type="text" name="${col}" value="${value}" class="w-full mt-1 p-2 border rounded-md">`;
                fieldsHtml += `<div><label class="font-medium text-sm text-gray-700">${formattedLabel}</label>${field}</div>`;
            }
            fieldsHtml += '</div>';
            container.innerHTML = fieldsHtml;
        }

        async function generateAndDownloadTemplate(isUpdateTemplate) {
            let schemaResult = await apiFetch(`table/Lab/${currentTableName}?limit=1`);
            if (schemaResult.error || !Array.isArray(schemaResult)) {
                alert('Could not fetch table schema to generate template.');
                return;
            }
             if (schemaResult.length === 0) {
                const checkEmpty = await apiFetch(`table/Lab/${currentTableName}`);
                if (checkEmpty.error || (Array.isArray(checkEmpty) && checkEmpty.length === 0)) {
                   alert('Could not fetch table schema. The table might be empty.');
                   return;
                }
                if(Array.isArray(checkEmpty) && checkEmpty.length > 0) {
                   schemaResult = checkEmpty;
                } else {
                    const infoResult = await apiFetch(`table/Lab/${currentTableName}/info`);
                    if(infoResult && !infoResult.error) {
                        schemaResult = [infoResult.columns.reduce((acc, col) => ({...acc, [col.name]: ''}), {})];
                    } else {
                        alert('Could not determine table structure for empty table.');
                        return;
                    }
                }
            }
    
            let headers = Object.keys(schemaResult[0]).filter(key => !['nr', 'attachment', 'sample_type', 'workflow_status_id', 'last_status_update', 'source_table', 'created_by', 'modified_by'].includes(key));
            
            if (isUpdateTemplate) {
                headers = headers.filter(key => key !== 'sample_id');
                headers.unshift('sample_id');
            } else {
                headers = headers.filter(key => key !== 'sample_id');
            }
    
            const csvContent = headers.join(',');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `${currentTableName}_${isUpdateTemplate ? 'update' : 'import'}_template.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function handleFileSelect(event, isUpdate = false) {
            const file = event.target.files[0];
            if (!file) return;
    
            const modalContent = event.target.closest('.modal-content');
            const previewContainer = modalContent.querySelector('#preview-container');
            const actionButton = modalContent.querySelector('button[id$="-data-btn"], button[id$="-update-btn"]');
    
            previewContainer.innerHTML = '<p class="text-gray-500 text-center p-4">Parsing file...</p>';
            if (actionButton) actionButton.disabled = true;
    
            const onParseComplete = (results) => {
                if (results.errors && results.errors.length > 0) {
                    previewContainer.innerHTML = `<p class="text-red-500 p-4">Error parsing file: ${results.errors[0].message}</p>`;
                    return;
                }
                
                if (isUpdate && (!results.data || results.data.length === 0 || !results.data[0].hasOwnProperty('sample_id'))) {
                     previewContainer.innerHTML = `<p class="text-red-500 p-4">Error: The update file must contain data and have a 'sample_id' column.</p>`;
                     return;
                }
                
                displayPreview(results.data, isUpdate, previewContainer, actionButton);
            };
    
            if (file.name.endsWith('.csv')) {
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: onParseComplete });
            } else { 
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        onParseComplete({ data: jsonData, errors: [] });
                    } catch (err) {
                        onParseComplete({ data: [], errors: [{ message: err.message }] });
                    }
                };
                reader.onerror = () => {
                    onParseComplete({ data: [], errors: [{ message: 'Could not read the file. It may be corrupted or in use.' }] });
                };
                reader.readAsArrayBuffer(file);
            }
        }
    
        function displayPreview(data, isUpdate = false, previewContainer, actionButton) {
            if (!data || data.length === 0) {
                previewContainer.innerHTML = '<p class="text-red-500 text-center p-4">No data found in file.</p>';
                return;
            }
            
            const user = JSON.parse(sessionStorage.getItem('user')) || {};
            if(isUpdate) {
                parsedUploadData = data.filter(row => row.sample_id).map(row => ({...row, modified_by: user.person}));
            } else {
                parsedUploadData = data.map(row => ({ ...row, sample_type: currentTableName, created_by: user.person }));
            }
    
            if(parsedUploadData.length === 0) {
                previewContainer.innerHTML = `<p class="text-red-500 text-center p-4">No valid rows found. For updates, ensure 'sample_id' is present.</p>`;
                return;
            }
    
            const headers = Object.keys(data[0]);
            const previewHtml = `
                <p class="text-sm font-medium p-2">Found ${parsedUploadData.length} valid records. Showing preview:</p>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100"><tr>${headers.map(h => `<th class="px-2 py-1 text-left font-medium text-gray-600">${h}</th>`).join('')}</tr></thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${parsedUploadData.slice(0, 5).map(row => `<tr>${headers.map(h => `<td class="px-2 py-1 whitespace-nowrap truncate max-w-[100px]">${row[h] || ''}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                </table>`;
            previewContainer.innerHTML = previewHtml;
            if (actionButton) actionButton.disabled = false;
        }

        async function handleBulkUpdate(closeModal) {
            if (parsedUploadData.length === 0) { alert('No valid data to update.'); return; }
            
            const updateBtn = document.getElementById('update-data-btn');
            updateBtn.disabled = true;
            document.getElementById('bulk-update-progress').style.display = 'block';
            const logContainer = document.getElementById('progress-log');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let failCount = 0;
            const failedSamples = [];
            const user = JSON.parse(sessionStorage.getItem('user')) || {};
    
            const logMessage = (msg, color = 'text-gray-300') => {
                logContainer.innerHTML += `<div><span class="text-gray-500">${new Date().toLocaleTimeString()}:</span> <span class="${color}">${msg}</span></div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            };
    
            logMessage(`Starting bulk update for ${parsedUploadData.length} records in ${currentTableName}...`);
    
            for (const row of parsedUploadData) {
                const sampleId = row.sample_id;
                if (!sampleId) {
                    logMessage(`Skipping row with missing sample_id: ${JSON.stringify(row)}`, 'text-yellow-400');
                    failCount++;
                    continue;
                }
    
                const payload = { ...row };
                delete payload.sample_id;
                payload.modified_by = user.person;
    
                logMessage(`Updating ${sampleId}...`);
                const result = await apiFetch(`table/Lab/${currentTableName}/${sampleId}`, { method: 'PUT', body: payload });
                
                // Use robust check `!result.error` instead of `result.success`
                if (!result.error) {
                    successCount++;
                    logMessage(`&nbsp;&nbsp;> OK`, 'text-green-400');
                } else {
                    failCount++;
                    failedSamples.push(`${sampleId}`);
                    logMessage(`&nbsp;&nbsp;> FAILED: ${result.error}`, 'text-red-400');
                }
            }
    
            logMessage('------------------------------------', 'text-blue-400');
            logMessage(`Bulk update complete.`, 'text-blue-400 font-bold');
            logMessage(`Successful: ${successCount}`, 'text-green-400');
            logMessage(`Failed: ${failCount}`, 'text-red-400');
            if(failedSamples.length > 0) {
                 logMessage(`Failed IDs: ${failedSamples.join(', ')}`);
            }
    
            currentViewCache = [];
            await loadView(currentTableName);
            
            updateBtn.innerHTML = '<i data-lucide="x" class="w-5 h-5 mr-2"></i>Close';
            updateBtn.onclick = closeModal;
            updateBtn.disabled = false;
            lucide.createIcons();
        }
    
        // --- INITIALIZATION ---
        function initializePage() {
            const menu = document.getElementById('sub-nav-menu');
            menu.querySelectorAll('.sub-nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadView(e.currentTarget.dataset.table);
                });
            });
            menu.querySelector('.sub-nav-link[data-table="Samples"]').click();
            document.getElementById('new-sample-btn').addEventListener('click', () => showNewSampleModal());
            document.getElementById('bulk-import-btn').addEventListener('click', () => showBulkUploadModal());
            document.getElementById('workflow-update-btn').addEventListener('click', () => showWorkflowUpdateModal());
            document.getElementById('bulk-update-btn').addEventListener('click', () => showBulkUpdateModal());
        }
    </script>
</body>
</html>
