<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { border-right: 1px solid #e2e8f0; }
        .sidebar-item { color: #475569; }
        .sidebar-item.active, .sidebar-item.active i { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #1e293b; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .modal-overlay { z-index: 50; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }

        /* Kanban Board Specific Styles */
        .kanban-board { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; min-height: 65vh; }
        .kanban-column { min-width: 320px; max-width: 320px; background-color: #f1f5f9; border-radius: 0.75rem; display: flex; flex-direction: column; transition: background-color 0.2s ease-in-out; }
        .kanban-column-header { padding: 1rem; }
        .kanban-cards-container { padding: 0 1rem 1rem 1rem; flex-grow: 1; overflow-y: auto; }
        .kanban-card { background-color: white; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); transition: all 0.2s ease; cursor: grab; border-left-width: 4px; }
        .kanban-card:hover { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transform: translateY(-2px); }
        .kanban-card.dragging { opacity: 0.5; cursor: grabbing; transform: scale(1.05); }
        .kanban-column.drag-valid { background-color: #dcfce7; } /* Light Green */
        .kanban-column.drag-invalid { background-color: #fee2e2; } /* Light Red */

        /* Sample Type Color Coding (Border Left) */
        .border-l-DNA { border-left-color: #ef4444; }    /* red-500 */
        .border-l-RNA { border-left-color: #ec4899; }    /* pink-500 */
        .border-l-Library { border-left-color: #d946ef; } /* fuchsia-500 */
        .border-l-Sequencing { border-left-color: #8b5cf6; } /* violet-500 */
        .border-l-Fish { border-left-color: #6b7280; }    /* gray-500 */
        .border-l-Tissue { border-left-color: #14b8a6; }  /* teal-500 */
        .border-l-Water { border-left-color: #3b82f6; } /* blue-500 */
        .border-l-Sediments { border-left-color: #f59e0b; } /* amber-500 */
        .border-l-Extraction { border-left-color: #fbbf24; } /* amber-400 */
        .border-l-Qubit { border-left-color: #a78bfa; } /* violet-400 */
        .border-l-Nanodrop { border-left-color: #f472b6; } /* pink-400 */
        .border-l-Tapestation { border-left-color: #60a5fa; } /* blue-400 */
        .border-l-PCR { border-left-color: #f87171; } /* red-400 */
        .border-l-qPCR { border-left-color: #34d399; } /* emerald-400 */
        .border-l-Gelelectrophoresis { border-left-color: #eab308; } /* yellow-500 */
        .border-l-Bioinformatics { border-left-color: #06b6d4; } /* cyan-500 */
        .border-l-Dissection { border-left-color: #78716c; } /* stone-600 */
        .border-l-default { border-left-color: #94a3b8; } /* slate-400 */


        /* Workflow Step Management (Drag & Drop) */
        .sortable-list .draggable-item {
            cursor: grab;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sortable-list .draggable-item.dragging {
            opacity: 0.5;
            border: 1px dashed #4f46e5;
        }
        .sortable-list .draggable-item .handle {
            cursor: grab;
            margin-right: 0.75rem;
            color: #64748b;
        }

        /* Timeline styles for sample details modal */
        .timeline-container { position: relative; padding-left: 15px; }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 19px; /* Adjust to align with dot centers */
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e2e8f0; /* gray-200 */
            z-index: 0;
        }
        .timeline-item { position: relative; padding-left: 25px; margin-bottom: 20px; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 10px; /* Adjust to align with line */
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1; /* gray-300 */
            border: 2px solid white;
            z-index: 1;
        }
        .timeline-item.completed::before { background-color: #22c55e; /* green-500 */ }
        .timeline-item.current::before { background-color: #3b82f6; /* blue-500 */ }
        .timeline-item.no-date::before { background-color: #f59e0b; /* amber-500 - for steps without a specific record */ }
    </style>
</head>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = './login.html';
        
        const API_BASE_URL = '/mymglab/api';
        let masterSampleList = []; // Stores all samples with enriched workflow info (before filters)
        let allWorkflows = []; // Stores Lims.Workflows definitions
        let allWorkflowSteps = []; // Stores Lims.Workflow_steps for all workflows
        let allStatuses = []; // Stores Reference.Status for status descriptions
        let allSOPs = []; // Stores Lims.SOPs for SOP titles
        let allPersons = []; // Stores Reference.Personal for person dropdowns
        let allPrimers = []; // Stores Lims.Primers for gene/primer dropdowns
        let allTables = []; // Stores list of all tables for workflow step target table dropdown

        // Define a mapping for standard statuses to their visual sequence for Kanban columns
        // This order is crucial for how columns appear and how drag-and-drop validation works.
        // These are the *status_id* values from Reference.Status
        const WORKFLOW_STATUS_SEQUENCE = [
            'Received',
            'Dissection', 
            'Extracted',
            'Nanodrop QC',
            'Qubit QC',
            'Tapestation QC',
            'PCR Done',
            'qPCR Done',
            'Gelelectrophoresis', // Added Gel Electrophoresis
            'Library Prep',
            'Sequencing Done',
            'Bioinformatics Done',
            'Completed' // A final state, samples reaching this might be removed from active board.
        ];
        
        // Color mapping for Kanban cards based on sample_type
        const sampleTypeColors = {
            'DNA': 'border-l-red-500', 'RNA': 'border-l-pink-500', 'Library': 'border-l-fuchsia-500', 
            'Sequencing': 'border-l-violet-500', 'Fish': 'border-l-gray-500', 'Tissue': 'border-l-teal-500', 
            'Water': 'border-l-blue-500', 'Sediments': 'border-l-amber-500', 'Extraction': 'border-l-amber-400', 
            'Qubit': 'border-l-violet-400', 'Nanodrop': 'border-l-pink-400', 'Tapestation': 'border-l-blue-400', 
            'PCR': 'border-l-red-400', 'qPCR': 'border-l-emerald-400', 'Gelelectrophoresis': 'border-l-yellow-500',
            'Bioinformatics': 'border-l-cyan-500', 'Dissection': 'border-l-stone-600', 'default': 'border-l-slate-400'
        };

        // This map defines what data to collect when a sample is moved to a new status/step
        // The 'table' property should exactly match the "target_table_name" in Lims.Workflow_steps
        // The 'fields' define the form inputs needed for that specific action.
        // 'type': 'select_personal' or 'select_primers' will trigger dynamic dropdowns.
        const STATUS_ACTION_FORMS = {
            'Dissection': {
                table: 'Lab.dissections',
                fields: [
                    { name: 'person_id', label: 'Person', type: 'select_personal', required: true },
                    { name: 'dissection_date', label: 'Date', type: 'date', required: true, default: new Date().toISOString().split('T')[0] },
                    { name: 'gonad_weight_g', label: 'Gonad Weight (g)', type: 'number' },
                    { name: 'liver_weight_g', label: 'Liver Weight (g)', type: 'number' },
                    { name: 'stomach_contents_jsonb', label: 'Stomach Contents (JSON)', type: 'jsonb', placeholder: '[{"item": "shrimp", "quantity": 10}]' },

                    { name: 'person_id', label: 'Person', type: 'select_personal', required: true },
                    { name: 'kit', label: 'Kit', type: 'text' },
                    { name: 'elution_volume_ul', label: 'Elution Volume (µL)', type: 'number' },
                    { name: 'yield_qubit_ng_ul', label: 'Yield Qubit (ng/µL)', type: 'number' },

                    { name: 'nanodrop_concentration', label: 'Concentration (ng/µL)', type: 'number', required: true },
                    { name: 'concentration_unit_id', label: 'Unit', type: 'select_units', default: 'ng_ul' },
                    { name: 'a260', label: 'A260', type: 'number' },

                ]
            },

                table: 'Bioinformatics.analysis_runs', // Correct schema and table name
                fields: [
                    { name: 'run_id', label: 'Analysis Run ID', type: 'text', required: true }, // Manual entry for new run_id
                    { name: 'pipeline_id', label: 'Pipeline', type: 'select_analysis_pipelines', required: true },

                    { name: 'person_id', label: 'Person', type: 'select_personal', required: true },
                    { name: 'parameters_jsonb', label: 'Parameters (JSON)', type: 'jsonb', placeholder: '{"key": "value"}' },

                    { name: 'clustering_threshold', label: 'Clustering Threshold', type: 'number' },
                    { name: 'final_output_path', label: 'Final Output Path', type: 'text' },

        // --- API & UTILITIES ---
        async function apiFetch(endpoint, options = {}) {
            try {
                const fullEndpoint = endpoint.startsWith(API_BASE_URL) ? endpoint : `${API_BASE_URL}/${endpoint}`;
                if (!(options.body instanceof FormData)) {
                    options.headers = { 'Content-Type': 'application/json', ...options.headers };
                    if(options.body) options.body = JSON.stringify(options.body);
                }
                const response = await fetch(fullEndpoint, options);
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({error: `Server error or HTTP ${response.status}`}));
                    throw new Error(errorBody.error || `HTTP error! Status: ${response.status}`);
                }
                return response.status === 204 ? { success: true } : response.json();
            } catch (error) { console.error("API Error:", error); return { error: error.message }; }
        }

        async function getReferenceData(tableName, schema='Reference') {
            const cacheKey = `${schema}.${tableName}`;
            if (masterCache[cacheKey]) return masterCache[cacheKey];
            const data = await apiFetch(`table/${schema}/${tableName}`);
            if(data && !data.error) masterCache[cacheKey] = data;
            return data;
        }

        function showModal(content) {
            const container = document.getElementById('modal-container');
            container.innerHTML = content;
            const modal = container.querySelector('.modal-overlay');
            const modalContent = container.querySelector('.modal-content');
            setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
            const closeModal = () => {
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => container.innerHTML = '', 300);
            };
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            const closeBtn = container.querySelector('#close-modal-btn');
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            return { closeModal };
        }

        // Helper to get workflow step info robustly
        function getWorkflowStepInfo(sample) {
            const workflowDefinition = allWorkflows.find(wf => wf.workflow_id === sample.workflow_id); 
            if (!workflowDefinition) {
                return { currentStep: null, nextStep: null, workflowName: 'N/A', workflowDescription: 'No workflow definition found', stepsForThisWorkflow: [] };
            }

            const stepsForThisWorkflow = allWorkflowSteps
                .filter(step => step.workflow_id === sample.workflow_id) 
                .sort((a, b) => a.step_number - b.step_number); 

            if (stepsForThisWorkflow.length === 0) {
                return { currentStep: null, nextStep: null, workflowName: workflowDefinition.workflow_name, workflowDescription: workflowDefinition.notes, stepsForThisWorkflow: [] }; 
            }

            const currentStatusId = sample.sample_status_id; 
            let currentStep = null;
            let nextStep = null;

            // Find current step based on status
            const currentStepIndex = stepsForThisWorkflow.findIndex(step => step.workflow_status_id === currentStatusId); 
            
            if (currentStepIndex !== -1) {
                currentStep = stepsForThisWorkflow[currentStepIndex];
                if (currentStepIndex + 1 < stepsForThisWorkflow.length) {
                    nextStep = stepsForThisWorkflow[currentStepIndex + 1];
                }
            } else {
                // If current status doesn't exactly match a defined step status,
                // try to find the next logical step by sequence.
                const currentStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(currentStatusId);
                let foundNextLogicalStep = false;
                for (let i = 0; i < stepsForThisWorkflow.length; i++) {
                    const step = stepsForThisWorkflow[i];
                    const stepStatusGlobalIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(step.workflow_status_id); 
                    if (stepStatusGlobalIndex !== -1 && stepStatusGlobalIndex > currentStatusGlobalIndex) {
                        nextStep = step; 
                        foundNextLogicalStep = true;
                        break;
                    }
                }
                if (foundNextLogicalStep && stepsForThisWorkflow.indexOf(nextStep) > 0) {
                     currentStep = stepsForThisWorkflow[stepsForThisWorkflow.indexOf(nextStep) - 1];
                } else if (currentStatusGlobalIndex > WORKFLOW_STATUS_SEQUENCE.indexOf(stepsForThisWorkflow[stepsForThisWorkflow.length - 1]?.workflow_status_id)) { 
                    currentStep = stepsForThisWorkflow[stepsForThisWorkflow.length - 1];
                }
            }

            return {
                currentStep: currentStep,
                nextStep: nextStep,
                workflowName: workflowDefinition.workflow_name, 
                workflowDescription: workflowDefinition.notes, 
                stepsForThisWorkflow: stepsForThisWorkflow
            };
        }

        function addKanbanEventListeners() {
            let draggedCard = null;

            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedCard = e.target;
                    draggedCard.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', `${e.target.dataset.sampleId}|${e.target.dataset.samplingDate}`);

                    const sampleId = e.target.dataset.sampleId;
                    const sample = masterSampleList.find(s => s.sample_id === sampleId);
                    
                    if (!sample || sample.workflow_id === null || sample.workflow_id === undefined) {
                        e.preventDefault(); 
                        alert("This sample has no assigned workflow. Please assign one from its details modal first.");
                        draggedCard.classList.remove('dragging');
                        draggedCard = null;
                        return;
                    }

                    const sampleWorkflowSteps = allWorkflowSteps
                        .filter(step => step.workflow_id === sample.workflow_id) 
                        .sort((a, b) => a.step_number - b.step_number); 
                    
                    const currentStepIndex = sampleWorkflowSteps.findIndex(step => step.workflow_status_id === sample.sample_status_id); 
                    const nextWorkflowStep = (currentStepIndex !== -1 && currentStepIndex + 1 < sampleWorkflowSteps.length)
                        ? sampleWorkflowSteps[currentStepIndex + 1]
                        : null;

                    document.querySelectorAll('.kanban-column').forEach(col => {
                        col.classList.remove('drag-valid', 'drag-invalid'); 
                        if (nextWorkflowStep && nextWorkflowStep.workflow_status_id && col.dataset.statusId === nextWorkflowStep.workflow_status_id) { 
                            col.classList.add('drag-valid');
                        } else {
                            col.classList.add('drag-invalid');
                        }
                    });
                });

                card.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                    draggedCard = null;
                    document.querySelectorAll('.kanban-column').forEach(col => {
                        col.classList.remove('drag-valid', 'drag-invalid');
                    });
                });
            });

            document.querySelectorAll('.kanban-column').forEach(column => {
                column.addEventListener('dragover', (e) => {
                    e.preventDefault(); 
                    if (column.classList.contains('drag-valid')) {
                        e.dataTransfer.dropEffect = 'move';
                    } else {
                        e.dataTransfer.dropEffect = 'none'; 
                    }
                });

                column.addEventListener('dragleave', (e) => {});

                column.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetColumn = e.currentTarget;
                    if (targetColumn.classList.contains('drag-valid')) {
                        const [sampleId, samplingDate] = e.dataTransfer.getData('text/plain').split('|');
                        const newStatusId = targetColumn.dataset.statusId;
                        openWorkflowActionModal(sampleId, samplingDate, newStatusId);
                    } else {
                        alert('Invalid drop: This is not the next step in the workflow for this sample.');
                    }
                });
            });

            document.querySelectorAll('.proceed-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    const card = e.target.closest('.kanban-card');
                    const sampleId = card.dataset.sampleId;
                    const samplingDate = card.dataset.samplingDate;
                    const nextStepId = e.target.dataset.nextStepId; 
                    
                    const sample = masterSampleList.find(s => s.sample_id === sampleId);
                     if (!sample || sample.workflow_id === null || sample.workflow_id === undefined) {
                        alert("This sample has no assigned workflow. Please assign one from its details modal first.");
                        return;
                    }

                    if (nextStepId) {
                        openWorkflowActionModal(sampleId, samplingDate, nextStepId);
                    } else {
                        alert('No defined next step for this sample in its workflow.');
                        console.error('Proceed button clicked but nextStepId is undefined for sample:', sampleId);
                    }
                });
            });

            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.proceed-btn')) {
                        showSampleDetailsModal(card.dataset.sampleId, card.dataset.samplingDate);
                    }
                });
            });
        }

            );

            if (!targetWorkflowStep || !targetWorkflowStep.workflow_status_id) {

            const { closeModal } = showModal(modalHTML);
            lucide.createIcons(); 
            
            document.getElementById('workflow-action-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = {};
                for (const [key, value] of formData.entries()) {
                    if (key.endsWith('_jsonb')) {
                        try {
                            data[key] = value ? JSON.parse(value) : null;
                        } catch (e) {
                            alert(`Invalid JSON for ${key.replace(/_/g, ' ')}. Please correct it.`);
                            return;
                        }
                    } else {
                        data[key] = value === '' ? null : value;
                    }
                }

                if (!e.target.reportValidity()) return; 

                let actionLogResult = { success: true }; 
                if (actionInfo) { 
                    actionLogResult = await apiFetch(`table/${actionSchema}/${actionTable}`, { method: 'POST', body: data });
                }
                
                if (actionLogResult && !actionLogResult.error) {
                    const updateSampleStatusResult = await updateSampleWorkflowStatus(sampleId, samplingDate, targetStatusId);

                    if (updateSampleStatusResult.success) {
                        alert('Action logged and workflow updated successfully!');
                        closeModal();
                        initializeWorkflowPage(); 
                    } else {
                        alert(`Error updating sample workflow status: ${updateSampleStatusResult.error}. You might need to manually correct the status.`);
                    }
                } else {
                    alert(`Error logging action in ${actionSchema}.${actionTable}: ${actionLogResult.error}`);
                }
            });
        }

        async function updateSampleWorkflowStatus(sampleId, samplingDate, newStatusId) {
             const user = JSON.parse(sessionStorage.getItem('user')) || {};
             const payload = {
                sample_status_id: newStatusId, 
                time_modification: new Date().toISOString(),
                modified_by: user.person_id 
            };
            try {
                // For partitioned table, sampling_date must be passed as query parameter for PUT
                const result = await apiFetch(`table/Lab/samples/${sampleId}?sampling_date=${samplingDate}`, { method: 'PUT', body: payload }); 
                if (result && !result.error) {
                    return { success: true, sample_id: sampleId };
                } else {
                    throw new Error(result.error || 'Unknown server error');
                }
            } catch (error) {
                console.error(`Failed to update status for ${sampleId}: ${error.message}`);
                return { success: false, sample_id: sampleId, error: error.message };
            }
        }

        // --- FILTERING ---
        function applyFilters() {
            const workflowId = document.getElementById('filter-workflow').value;
            const projectId = document.getElementById('filter-project').value;
            const sampleType = document.getElementById('filter-type').value;
            const searchTerm = document.getElementById('filter-search').value.toLowerCase();
            const filterWorkflowAssigned = document.getElementById('filter-workflow-assigned').checked; 

            let filteredSamples = masterSampleList;

            // Apply "Only show samples with workflow" filter first
            if (filterWorkflowAssigned) {
                filteredSamples = filteredSamples.filter(s => s.workflow_id !== null && s.workflow_id !== undefined);
            }

            // Apply other filters
            if (workflowId && workflowId !== 'all') {
                if (workflowId === 'no_workflow') {
                    filteredSamples = filteredSamples.filter(s => s.workflow_id == null || s.workflow_id === '');
                } else {
                    filteredSamples = filteredSamples.filter(s => s.workflow_id === workflowId);
                }
            }
            
            if (projectId && projectId !== 'all') {
                filteredSamples = filteredSamples.filter(s => s.project_id === projectId);
            }
            if (sampleType && sampleType !== 'all') {
                filteredSamples = filteredSamples.filter(s => s.sample_type_id === sampleType);
            }
            if (searchTerm) {
                filteredSamples = filteredSamples.filter(s => 
                    s.sample_id.toLowerCase().includes(searchTerm) ||
                    (s.project_title && s.project_title.toLowerCase().includes(searchTerm)) ||
                    (s.external_name && s.external_name.toLowerCase().includes(searchTerm)) 
                );
            }
            
            renderKanbanBoard(filteredSamples);
        }

        // --- Time Utility ---
        function timeSince(dateString) {
            if (!dateString) return 'N/A';
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            const interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days";
            if (interval * 24 > 1) return Math.floor(interval * 24) + " hours";
            if (interval * 24 * 60 > 1) return Math.floor(interval * 24 * 60) + " minutes";
            return "Just now";
        }

        // --- Sample Details Modal ---
        function isStepCompleted(step, currentSampleStatusId) {
            const currentStatusIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(currentSampleStatusId);
            const stepStatusIndex = WORKFLOW_STATUS_SEQUENCE.indexOf(step.workflow_status_id); 
            
            return stepStatusIndex !== -1 && currentStatusIndex !== -1 && stepStatusIndex <= currentStatusIndex;
        }

        function isStepCurrent(step, currentSampleStatusId) {
            return step.workflow_status_id === currentSampleStatusId; 
        }

        async function getSampleWorkflowHistory(sampleId, samplingDate, stepsForThisWorkflow) {
            const historyEvents = [];

            const sampleDetails = masterSampleList.find(s => s.sample_id === sampleId);

            // Add initial reception/sampling date if available
            if (sampleDetails && sampleDetails.reception_date) { 
                historyEvents.push({
                    status_id: 'Received',
                    step_name: 'Sample Received',
                    date: new Date(sampleDetails.reception_date), 
                    type: 'Reception'
                });
            } else if (sampleDetails && sampleDetails.sampling_date) {
                 historyEvents.push({
                    status_id: 'Received', 
                    step_name: 'Sample Taken',
                    date: new Date(sampleDetails.sampling_date),
                    type: 'Sampling'
                });
            }

            // Fetch historical data for each relevant action table
            for (const statusId in STATUS_ACTION_FORMS) {
                const mapping = STATUS_ACTION_FORMS[statusId];
                try {
                    // Fetch records for specific sample ID and sampling date (for partitioned tables)
                    let endpoint = `table/${mapping.table}?filter_sample_id=${sampleId}`;
                    if (mapping.table.includes('samples') || mapping.table.includes('sampling')) { // If the target table is also partitioned
                        endpoint += `&filter_sampling_date=${samplingDate}`;
                    }
                    const records = await apiFetch(endpoint);

                    if (records && !records.error && Array.isArray(records)) {
                        records.forEach(record => {
                            // Determine the date field dynamically for each table
                            let dateField = 'date'; 
                            if (mapping.table.includes('dissections')) dateField = 'dissection_date';
                            else if (mapping.table.includes('extraction')) dateField = 'extraction_date';
                            else if (mapping.table.includes('nanodrop')) dateField = 'measurement_date';
                            else if (mapping.table.includes('qubit')) dateField = 'measurement_date';
                            else if (mapping.table.includes('tapestation')) dateField = 'measurement_date';
                            else if (mapping.table.includes('pcr')) dateField = 'pcr_date';
                            else if (mapping.table.includes('qpcr')) dateField = 'qpcr_date';
                            else if (mapping.table.includes('gelelectrophoresis')) dateField = 'run_date';
                            else if (mapping.table.includes('library')) dateField = 'prep_date';
                            else if (mapping.table.includes('sequencing')) dateField = 'sequencing_date';
                            else if (mapping.table.includes('analysis_runs')) dateField = 'run_date';

                            const eventDate = record[dateField] ? new Date(record[dateField]) : null;
                            if (eventDate && !isNaN(eventDate)) {
                                historyEvents.push({
                                    status_id: statusId,
                                    step_name: allStatuses.find(s => s.status_id === statusId)?.status_id || statusId, 
                                    date: eventDate,
                                    type: mapping.table.split('.')[1], 
                                    record_data: record 
                                });
                            }
                        });
                    }
                } catch (error) {
                    console.warn(`Failed to fetch history for ${mapping.table} for sample ${sampleId}:`, error);
                }
            }

            historyEvents.sort((a, b) => a.date.getTime() - b.date.getTime());

            return historyEvents;
        }
